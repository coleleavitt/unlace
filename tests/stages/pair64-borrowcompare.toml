[script]
commands = [
    'lo fu add64',
    'decompile',
    'print C',
    'lo fu lt64',
    'decompile',
    'print C',
    'lo fu ltu64',
    'decompile',
    'print C',
    'lo fu lt_const',
    'decompile',
    'print C',
    'lo fu pick',
    'decompile',
    'print C',
    'option pairparam off',
    'lo fu lt64',
    'decompile',
    'print C',
    'parse line extern int ltu64(unsigned long long a,unsigned long long b);',
    'lo fu ltu64',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PAIR64 #1: a long long sum takes two long long parameters'
count = 1
literal = 'int8 add64(int8 a0,int8 a1)'

[[match]]
name = 'PAIR64 #2: the signed borrow chain folds to one compare'
count = 1
literal = 'bool lt64(int8 a0,int8 a1)'

[[match]]
name = 'PAIR64 #3: the signed and the unsigned compare'
count = 2
literal = 'return a0 < a1;'

[[match]]
name = 'PAIR64 #4: the unsigned borrow out folds to one unsigned compare'
count = 1
literal = 'bool ltu64(uint8 a0,uint8 a1)'

[[match]]
name = 'PAIR64 #5: a compare with a constant whose high word is 0'
count = 1
literal = 'return a0 < 100000;'

[[match]]
name = 'PAIR64 #6: a borrow compare that guards a branch'
count = 1
literal = 'if (a1 < a0)'

[[match]]
name = 'PAIR64 #7: pairparam off keeps two int parameters and the borrow chain'
count = 1
literal = 'SBORROW4'

[[match]]
name = 'PAIR64 #8: with a declared prototype the unsigned compare folds whatever pairparam says'
count = 1
literal = 'return (uint4)(a < b);'

[[match]]
name = 'PAIR64 #9: no CONCAT44 is left'
count = 0
literal = 'CONCAT44'
