# Synthetic C shape: value=0; if (!out) return -1;
# rc=read_word(a,b,c,&amp;value); if (!rc) { *out=65535; if (!value) *out=255; }

[image]
arch = 'ARM:LE:32:v7'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'conditional_word' },
    { space = 'ram', offset = '0x2000', name = 'read_word' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '10482de900c0a0e3004053e208b08de20cd04de210c00be50b00000a10304be2f60300eb000050e30500001a10301be5ff2f0fe3002084e5000053e3ff30a0030030840508d04be21088bde80000e0e3fbffffea'

[[image.bytes]]
space = 'ram'
offset = '0x2000'
hex = '1eff2fe1'

# Three passes, as in stack-address-argument.xml: upstream's scoring,
# stackaddrargtrial, and the default, where passthrough keeps the forwarded
# registers out of the inactive chain.

[script]
commands = [
    'option passthrough off',
    'load function conditional_word',
    'decompile',
    'print C',
    'option stackaddrargtrial on',
    'load function conditional_word',
    'decompile',
    'print C',
    'option stackaddrargtrial off',
    'option passthrough on',
    'load function conditional_word',
    'decompile',
    'print C',
]

[[match]]
name = "STACK WORD #1: upstream's scoring loses the pointer"
count = 1
literal = 'read_word()'

[[match]]
name = 'STACK WORD #2: enabled, and the default, retain all four arguments'
count = 2
literal = 'read_word(a0,a1,a2,v'

[[match]]
name = 'STACK WORD #3: enabled, and the default, preserve the output-dependent condition'
count = 2
literal = '!v2[0]'
