name: Tests

# Parity and integration gates run on every event. The workspace suite runs
# for forks, main, manual dispatch, or an internal PR carrying full-ci.

on:
  pull_request:
    # `labeled` is here so the `full-ci` escape hatch works by labelling alone.
    # Without it the hatch is a lie: the default set is opened/synchronize/
    # reopened, and re-running a finished run REPLAYS ITS ORIGINAL PAYLOAD -- so
    # a label added afterwards is invisible to the `if:` and you would have to
    # push a commit to be believed. The cost is one extra run per label added to
    # a PR, which is rare here; `unlabeled` is deliberately NOT included, so
    # removing a label does not re-run anything.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a PR supersedes that PR's in-flight run. Each commit on main gets a
# group of its own (its sha): GitHub keeps one pending run per group and cancels the
# one waiting behind it when another queues, so a shared main group left most landed
# commits untested while one long run held the group. In a called
# workflow `github.workflow` is the CALLER's name, which keeps the nightly's call
# out of the push runs' group: sharing it, a push landing while the nightly's run
# waited would cancel that pending run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    # Naming bash explicitly is what enables `-o pipefail`; the implicit default
    # (`bash -e`) does not set it, which would let a failing command inside a
    # pipeline report success.
    shell: bash

env:
  UNLACE_SLA_CACHE: ${{ github.workspace }}/.sla-cache
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A CI build is always from scratch, so incremental state is dead weight in the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  # Seconds-long checks in their own job, so a formatting or tooling slip fails in about a
  # minute instead of after the gates job's build.
  tidy:
    name: tidy (rustfmt, Python tooling, test layout)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: rustfmt (edition 2024 style, rustfmt.toml)
        run: cargo fmt --all --check

      # The test-layout and module-layering checks plus the scripts/tests unit tests.
      - name: Python tooling unit tests
        run: |
          python3 scripts/check_test_layout.py
          python3 scripts/check_layers.py
          python3 scripts/check_determinism.py
          PYTHONPATH=$PWD python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: actionlint (workflows, with shellcheck on their scripts)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  clippy:
    name: clippy
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) with clippy
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only these three crates are clean. The rest of the workspace has about 2000 warn-level
      # findings and about 490 `disallowed_types` errors (HashMap/HashSet, clippy.toml),
      # mostly in unlace-decomp, so a workspace-wide clippy would fail until those are fixed.
      # One invocation: a crate an earlier `--no-deps` run checked only as a dependency
      # is fresh to a later run, which then passes without linting it.
      - name: Lint the CLI and the base and numeric libraries (-D warnings)
        run: cargo clippy --release -p unlace-cli -p unlace-base -p unlace-num --no-deps -- -D warnings

  gates:
    name: parity gates
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # integrations/web/build.sh generates /dev-viz from git history; nothing else
          # needs it, and the full history costs about 30 s.
          fetch-depth: ${{ vars.UNLACE_WEB == 'true' && '0' || '1' }}

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The browser front-end (integrations/web, unlace-wasm) is opt-in: its steps run only
      # when the repository variable UNLACE_WEB is `true`.
      - name: Add the wasm32-wasip1 target (web)
        if: vars.UNLACE_WEB == 'true'
        run: rustup target add wasm32-wasip1

      # Same cache action and workspace the release/pages workflows use.
      # Only main writes the caches: PR runs read them, and their own entries would only
      # crowd main's out of the repository's cache quota.
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binaries
        run: cargo build --release -p unlace-console -p unlace-harness -p unlace-slacomp -p unlace-cli

      # The engine compiles each .slaspec it needs into the .sla cache (UNLACE_SLA_CACHE,
      # crates/unlace-slacomp/src/slacache.rs) on first use. Restoring the cache only saves
      # that compile time; a miss is correct, just slower.
      - name: Restore the .sla cache
        id: sla
        uses: actions/cache/restore@v4
        with:
          path: .sla-cache
          key: sla-v2-${{ runner.os }}-${{ hashFiles('specs/**/*.slaspec', 'specs/**/*.sinc', 'Cargo.lock', 'crates/unlace-slacomp/**', 'crates/unlace-sleigh/**', 'crates/unlace-base/**', 'crates/unlace-num/**') }}

      # tests/datatests vs docs/baseline.json and tests/stages (every assertion must pass),
      # run in-process through the harness's datatest runner (crates/unlace-harness/tests/parity.rs).
      # The workspace suite runs the same two tests; this job carries them on every PR.
      - name: parity -- datatest and stage corpora vs their baselines
        run: cargo test --release -p unlace-harness --test parity

      # Each corpus file's wall time and outcome, slowest first (parity.rs writes it).
      - name: Upload the parity times
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-times
          path: target/parity-times.toml
          if-no-files-found: warn

      # One record per assertion of the datatest and stage corpora (file, name, baseline key,
      # status, class). parity.rs writes it on every full run, before the gate asserts.
      - name: Upload the parity ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-ledger
          path: target/parity-ledger.toml
          if-no-files-found: warn

      - name: Save the .sla cache
        if: always() && steps.sla.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .sla-cache
          key: ${{ steps.sla.outputs.cache-primary-key }}

      - name: spec anchors and phase-folder ownership (tools/check_spec.py)
        run: python3 tools/check_spec.py

      # The RE-friction loop's regression corpus (docs/re-pipeline.md). Every gap the loop
      # closes leaves the acceptance probe that proved the fix in tests/cli/; running them
      # here is what stops a closed need from silently re-opening. Needs no dataset -- every
      # case targets an in-repo fixture -- and an empty corpus passes.
      - name: tests/cli probes
        run: PYTHONPATH=$PWD python3 -m scripts.repipe.clitests

      - name: unlace catalog --check
        run: ./target/release/unlace catalog --check

      # Same input, same output: a small fixed corpus decompiled twice in fresh processes
      # (a new std hash seed each time) and under --jobs 1 vs --jobs 4 must match byte for
      # byte (scripts/check_determinism.py; the static half runs in the tidy job).
      - name: determinism -- repeated and pooled runs are byte-identical
        run: python3 scripts/check_determinism.py --run ./target/release/unlace

      # Shared-counter drift and ElementId collisions. Both are shapes that every
      # other gate passes cleanly: a stale hard-coded settable count only fails
      # whichever cargo test happens to assert it, and a duplicate ElementId fails
      # nothing at all -- three separate ones (4110, 4122, 4132) reached main before
      # this step existed, the last created by two concurrent builders in one round
      # each grepping for "the next free id" and getting the same answer. Two options
      # sharing an id compare EQUAL (ElementId's PartialEq is an id comparison), so
      # the first code that dispatches on one takes the wrong branch silently.
      - name: shared counters and ElementId uniqueness
        run: PYTHONPATH=$PWD python3 -m scripts.repipe.counters --check

      # `catalog --check` above proves options.md documents the same option SET;
      # this proves it is the generator's exact bytes. That is the assertion in
      # unlace-decomp/tests/options_md_fresh.rs, which lives in the workspace suite
      # -- skipped on an internal PR. Forgetting to regenerate options.md after
      # touching option metadata is a routine miss (AGENTS.md calls it out), so
      # the cheap job carries it rather than deferring it to the push to main.
      # Free: it reuses the release binary this job already built.
      - name: docs/options.md is the generator's bytes
        run: |
          ./target/release/unlace catalog --markdown > /tmp/options.generated.md
          if ! diff -u docs/options.md /tmp/options.generated.md; then
            echo "::error file=docs/options.md::stale -- regenerate with 'target/release/unlace catalog --markdown > docs/options.md'"
            exit 1
          fi

      # The ghidra-mode differential harness (docs/ghidra-integration.md §11):
      # drives the full decompile-process wire protocol in-process against real
      # vendored ELFs, with the mock-Java end answered from unlace's own analysis,
      # and pins the GUI-path quality numbers (placeholder rate, register/Unique
      # leaks, ghidra-vs-CLI diff ratio, query traffic). Lives in the workspace
      # suite too, but that job is skipped on internal PRs -- and a regression in
      # the GUI path is exactly what these pins exist to catch pre-merge. Cheap:
      # release profile over the deps the binaries step already built (~2 min
      # compile, seconds of runtime). `--include-ignored` picks up the heavier
      # sort/grep breadth test that the dev-profile workspace run skips.
      - name: ghidra-sim differential harness (unlace-ghidra, release)
        run: |
          cargo test -p unlace-ghidra --release -- --include-ignored --nocapture

      # Node 22: the web suites below are written for (and only run on) a
      # current Node; the runner's default Node is not pinned. The suites that
      # drive headless Chrome (decompile-browser, -collab-browser, -collab-page,
      # -collab-rtc) are not run in CI, which is too costly for them; run them
      # locally (integrations/web/README.md -> Tests).
      - uses: actions/setup-node@v4
        if: vars.UNLACE_WEB == 'true'
        with:
          node-version: 22

      # The study view's pure modules need no build; run them before the
      # wasm build so a renderer or session regression answers in seconds.
      - name: Test the /decompile page's modules
        if: vars.UNLACE_WEB == 'true'
        run: |
          node integrations/web/test/cdp-client-startup.mjs
          node integrations/web/test/decompile-render.mjs
          node integrations/web/test/decompile-wrap.mjs
          node integrations/web/test/decompile-session.mjs
          node integrations/web/test/decompile-bytes.mjs
          node integrations/web/test/decompile-learn.mjs
          node integrations/web/test/decompile-groups.mjs
          node integrations/web/test/decompile-strings.mjs
          node integrations/web/test/decompile-data.mjs
          node integrations/web/test/decompile-base64.mjs
          node integrations/web/test/decompile-collab.mjs
          node integrations/web/test/decompile-collab-cases.mjs
          node integrations/web/test/decompile-collab-sync.mjs
          node integrations/web/test/decompile-collab-fuzz.mjs

      - name: Assemble and test the browser Worker boundary
        if: vars.UNLACE_WEB == 'true'
        run: |
          bash integrations/web/build.sh
          node integrations/web/test/worker.mjs
          node integrations/web/test/worker-errors.mjs
          node integrations/web/test/dev-viz.mjs
          node integrations/web/test/decompile-worker.mjs
          node integrations/web/test/decompile-replay.mjs

  # The workspace suite, under cargo-nextest: one job builds every test binary into an
  # archive, three run a third of the tests each from it. Coverage (cargo-llvm-cov) and
  # the slow tests the `ci` profile leaves out run on the Coverage workflow's schedule:
  # instrumented, this suite took 45-105 min, against 30 min without.
  #
  # Runs on: every push to main, manual dispatch, any PR from a FORK, and any PR
  # carrying the `full-ci` label. It is skipped only for a PR from a branch in this
  # repo -- the automated agent PRs, which gate on the parity job. The `push:
  # branches: [main]` trigger is the safety net: the suite always runs on the merge
  # commit. To demand it BEFORE merging a particular internal PR, add the `full-ci`
  # label: that is itself a trigger (see `types:` above).
  rust-test-build:
    name: workspace suite (build)
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.fork
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    # Full debug information across the test executables can fill the runner disk.
    # Keep backtrace line numbers and the workspace's debug/overflow checks.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # cache-on-failure: one failing build step must not throw away the dependency build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-test-nextest
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: taiki-e/install-action@cargo-nextest

      - name: Test layout
        run: python3 scripts/check_test_layout.py

      - name: Build and archive the workspace tests
        run: |
          df -h .
          cargo nextest archive --workspace \
            ${{ vars.UNLACE_WEB == 'true' && ' ' || '--exclude unlace-wasm' }} \
            --archive-file nextest-archive.tar.zst
          ls -la nextest-archive.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Doc tests
        run: |
          cargo test --doc --workspace \
            ${{ vars.UNLACE_WEB == 'true' && ' ' || '--exclude unlace-wasm' }}

      - name: Workspace build disk usage
        if: always()
        run: |
          df -h .
          if [ -d target ]; then
            du -sh target
          fi

  rust-test:
    name: cargo workspace suite (${{ matrix.partition }}/3)
    needs: rust-test-build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    # The archive's binaries run from outside the checkout, so they cannot find the
    # repository root (fixtures, tests/datatests) or the specs from their own path.
    env:
      UNLACE_ROOT: ${{ github.workspace }}
      UNLACE_SPECS: ${{ github.workspace }}/specs
      SLEIGHHOME: ${{ github.workspace }}/specs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: taiki-e/install-action@cargo-nextest

      # The engine compiles each .slaspec it needs into the .sla cache (UNLACE_SLA_CACHE,
      # crates/unlace-slacomp/src/slacache.rs) on first use. Restoring the cache only saves
      # that compile time; a miss is correct, just slower.
      - name: Restore the .sla cache
        id: sla
        uses: actions/cache/restore@v4
        with:
          path: .sla-cache
          key: sla-v2-${{ runner.os }}-${{ hashFiles('specs/**/*.slaspec', 'specs/**/*.sinc', 'Cargo.lock', 'crates/unlace-slacomp/**', 'crates/unlace-sleigh/**', 'crates/unlace-base/**', 'crates/unlace-num/**') }}

      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive

      # --extract-to . puts the binaries in target, the path the build job
      # compiled into every test that names a binary with env!("CARGO_BIN_EXE_...").
      - name: cargo nextest run (partition ${{ matrix.partition }}/3)
        run: |
          cargo nextest run --archive-file nextest-archive.tar.zst \
            --workspace-remap . --extract-to . --profile ci --partition count:${{ matrix.partition }}/3

      # The inputs a failing round trip compiled and decompiled (scratch C, shared
      # objects, projects), for reproducing a failure that only the runner's
      # compilers or load show.
      - name: Upload the test scratch files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-scratch-${{ matrix.partition }}
          path: target/tmp
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
