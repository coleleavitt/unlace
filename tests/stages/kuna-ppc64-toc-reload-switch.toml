offset = '0x2000'
readonly = true
hex = '''
7c0802a6f8010010f821ff813861007048000075e84100288121007028090003
418100503d42000079291764394ae0407d2a4aaa7d2952147d2903a64e800420
000000100000001800000020000000283860000b480000203860001648000018
38600021480000103860002c480000083860ffff38210080e80100107c0803a6
