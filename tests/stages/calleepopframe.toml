# A fixed-frame caller that re-reserves what a __stdcall import popped keeps
# its frame offsets, and a C runtime import is __cdecl.
#
# Issue: GH upstream #1029. MinGW's GetSpecialFolder(path, folder)
# writes every call's arguments with `mov [esp+k]` and lowers ESP again after
# each advapi32 call (`call [RegOpenKeyExA]; sub esp,0x14`). 0x401000 is the
# same shape: memset(path) through a `jmp [msvcrt!memset]` thunk, then
# RegOpenKeyExA(HKCU, ..., &key), RegQueryValueExA(key, folder, 0, 0, path,
# &size) and RegCloseKey(key) on both paths.
#
# Stage / sub-stage: P6 stack-pointer-flow (`StackSolver::build`'s guessed
# equation for an unknown extrapop, `p6_variables/unlace_calleepopframe.rs`),
# with the C runtime import declared `__cdecl` at the analysis commit
# (`loader/pe_iat.rs (c_runtime_import_names)`).
#
# The fixture `calleepopframe_pe_i386.exe` is assembled from
# `calleepopframe_pe_i386.asm` (see the fixtures README).
#
# With no push run the RegOpenKeyExA/RegQueryValueExA guesses would stay at
# 4, each `sub` would lower the solved ESP, the `folder` argument would become
# a local passed uninitialized and both RegCloseKey calls would take the size
# buffer instead of the key.  Instead: two parameters, the key RegOpenKeyExA
# filled is the one queried and closed, and `folder` is forwarded. memset
# keeps its argument; read as __stdcall it would pop 12 bytes and move the
# key slot as well.
# Every PE pass sets `option typelib off`: the test pins what call-site
# recovery finds, not the prototypes the Windows type library declares.

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/calleepopframe_pe_i386.exe',
    'option typelib off',
    'read symbols',
    'load addr 0x401000',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLEEPOPFRAME #1: the folder parameter is never dropped'
count = 0
literal = 'sub_401000(void *a0)'

[[match]]
name = 'CALLEEPOPFRAME #2: the size buffer is never closed'
count = 0
literal = 'RegCloseKey(v5);'

[[match]]
name = 'CALLEEPOPFRAME #3: both parameters are kept'
count = 1
literal = 'sub_401000(void *a0,unsigned int a1)'

[[match]]
name = 'CALLEEPOPFRAME #4: RegOpenKeyExA is handed the key slot'
count = 1
regex = 'RegOpenKeyExA\(0x80000001,"[^"]*",0,1,&v3\)'

[[match]]
name = 'CALLEEPOPFRAME #5: the key is queried with the forwarded folder'
count = 1
literal = 'RegQueryValueExA(v3,a1,0,0,v1,v4)'

[[match]]
name = 'CALLEEPOPFRAME #6: the key is closed on both paths'
count = 2
literal = 'RegCloseKey(v3);'

[[match]]
name = 'CALLEEPOPFRAME #7: memset keeps its arguments'
count = 1
literal = 'memset(a0,0,0x104);'
