[package]
autotests = false
name = "unlace-cli"
description = "unlace Rust port: the user-facing `unlace` CLI (decompile / test / catalog / specs)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
unlace-decomp.workspace = true
unlace-base.workspace = true
unlace-console.workspace = true
unlace-analysis.workspace = true
unlace-sleigh.workspace = true
unlace-slacomp.workspace = true
unlace-num.workspace = true
# `unlace lumina`: the Lumina protocol, its sqlite server store and TLS.
unlace-lumina.workspace = true
# `sbom` inflates cargo-auditable dependency lists.
flate2.workspace = true
unlace-project.workspace = true
# `unlace idb` and IDA databases in place of a binary.
unlace-idb.workspace = true
# FID and FLIRT construction also read archive members.
object = { workspace = true, features = ["archive"] }
memchr.workspace = true
regex.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std", "display"] }
sha2 = "0.11"
tempfile = "3.27"
unlace-decomp-dylib = { workspace = true, optional = true }

[features]
# Carry the compiled SLEIGH tree inside the binary (build.rs reads `specs/` and compiles each
# language through the `.sla` cache). Release builds enable it.
embed-specs = []
# Dev only: link the engine as one Rust dylib (crates/unlace-decomp-dylib). Off by default.
dynamic_linking = ["dep:unlace-decomp-dylib", "unlace-console/dynamic_linking"]

[dev-dependencies]
unlace-testkit.workspace = true
unlace-stagefile.workspace = true
flirt-sig.workspace = true
object.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
unlace-slacomp.workspace = true

[lints]
workspace = true

# The command line as a library, so the `unlace` embedding crate reuses its code paths.
[lib]
name = "unlace_cli"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "unlace"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "decompile_all_cli"
path = "tests/decompile_all_cli/main.rs"

[[test]]
name = "catalog_cli"
path = "tests/catalog_cli.rs"

[[test]]
name = "docs_cli"
path = "tests/docs_cli.rs"

[[test]]
name = "process_helpers"
path = "tests/process_helpers.rs"

[[test]]
name = "single_binary_cli"
path = "tests/single_binary_cli.rs"

[[test]]
name = "ppc32_pic_session"
path = "tests/ppc32_pic_session.rs"
