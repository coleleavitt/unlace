[script]
commands = [
    'option callresultuse on',
    'lo fu ret',
    'decompile',
    'print C',
    'lo fu branch',
    'decompile',
    'print C',
    'lo fu chain',
    'decompile',
    'print C',
    'lo fu tail',
    'decompile',
    'print C',
    'lo fu dead',
    'decompile',
    'print C',
    'lo fu fresh',
    'decompile',
    'print C',
    'lo fu tovoid',
    'decompile',
    'print C',
    'lo fu unknown',
    'decompile',
    'print C',
    'option callresultuse all',
    'lo fu ret',
    'decompile',
    'print C',
    'lo fu branch',
    'decompile',
    'print C',
    'lo fu dead',
    'decompile',
    'print C',
    'option callresultuse off',
    'lo fu branch',
    'decompile',
    'print C',
    'lo fu chain',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLRESULTUSE #1: on, a result handed to a callee whose body reads x0 is its argument, in chain and tail'
count = 2
literal = 'g2(sub_2000())'

[[match]]
name = 'CALLRESULTUSE #2: on, a result handed back or branched on and handed back keeps the strict reading (ret, branch, chain, tail, dead; branch and chain again under off)'
count = 7
regex = '^void (ret|branch|chain|tail|dead)\(void\)'

[[match]]
name = 'CALLRESULTUSE #3: on, a rewritten x0 is the constant, not the result'
count = 1
literal = 'g2(5)'

[[match]]
name = 'CALLRESULTUSE #4: on, a callee whose body never reads x0 takes nothing (tovoid)'
count = 1
regex = '^  b\(\);'

[[match]]
name = 'CALLRESULTUSE #5: on, between two callees nothing is known of, no hand-off (unknown)'
count = 1
regex = '^  sub_2100\(\);'

[[match]]
name = 'CALLRESULTUSE #6: all, the untouched result at the ret is returned'
count = 1
literal = 'return sub_2000();'

[[match]]
name = 'CALLRESULTUSE #7: all, the branched-on and the stored-past results are returned (branch, dead)'
count = 2
regex = '^  return v1;'

[[match]]
name = 'CALLRESULTUSE #8: all, ret, branch and dead return'
count = 3
regex = '^(unsigned long|int8|long) (ret|branch|dead)\(void\)'

[[match]]
name = 'CALLRESULTUSE #9: off, the branched-on result is dropped, as under on'
count = 2
regex = 'if \(!?sub_2000\(\)\)'

[[match]]
name = 'CALLRESULTUSE #10: off, the hand-off to the next call is lost'
count = 1
regex = '^  g2\(\);'
