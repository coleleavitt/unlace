[[match]]
name = 'FCVTROUND control: table_lerp keeps its declared prototype'
count = 1
literal = 'float4 table_lerp(float4 x,float4 *t)'

[[match]]
name = 'FCVTROUND #1: no float to int conversion of x is a plain truncation'
count = 0
regex = '\(u?int4\)x\b'

[[match]]
name = 'FCVTROUND #2: fcvtms rounds down (floor_i, ufloor)'
count = 2
regex = '^\s*return \(int4\)FLOAT_FLOOR\(x\);$'

[[match]]
name = 'FCVTROUND #3: fcvtps rounds up (ceil_i, SIMD-scalar ceil_simd)'
count = 2
regex = '^\s*return \(int4\)FLOAT_CEIL\(x\);$'

[[match]]
name = 'FCVTROUND #4: table_lerp computes both the floor and the ceil of x'
count = 2
regex = '^\s*\w+ = \(uint4\)\(int4\)FLOAT_(FLOOR|CEIL)\(x\);$'

[[match]]
name = 'FCVTROUND #5: the lo != hi branch survives'
count = 1
regex = '^\s*if \(\w+ != \w+\)$'

[[match]]
name = 'FCVTROUND #6: the interpolation weight 1.0 - w survives'
count = 1
literal = '1.0f - '

[[match]]
name = 'FCVTROUND #7: fcvtas rounds ties away from zero'
count = 1
regex = '^\s*return \(int4\)FLOAT_ROUND\(x\);$'

[[match]]
name = 'FCVTROUND #8: fcvtns rounds ties to even'
count = 1
regex = '^\s*return \(int4\)FLOAT_ROUNDEVEN\(x\);$'

[[match]]
name = 'FCVTROUND #9: fcvtms of a double into a 64-bit register'
count = 1
regex = '^\s*return \(int8\)FLOAT_FLOOR\(x\);$'

[[match]]
name = 'FCVTROUND #10: fcvtpu of a double into a 64-bit register'
count = 1
regex = '^\s*return \(int8\)FLOAT_CEIL\(x\);$'

[[match]]
name = 'FCVTROUND #11: frintm, frintp and frinta stay floats'
count = 3
regex = '^\s*return FLOAT_(FLOOR|CEIL|ROUND)\(x\);$'

[[match]]
name = 'FCVTROUND #12: frintn, frintx and frinti are the typed rounding user ops'
count = 3
regex = '^\s*return FLOAT_(ROUNDEVEN|RINT|NEARBYINT)\(x\);$'

[[match]]
name = 'FCVTROUND #13: frintz truncates toward zero and stays a double'
count = 1
regex = '^\s*return FLOAT_TRUNC\(x\);$'

[[match]]
name = 'FCVTROUND #14: floor(x) != ceil(x) is not folded'
count = 1
regex = '^\s*return FLOAT_FLOOR\(x\) != FLOAT_CEIL\(x\);$'

[[match]]
name = 'FCVTROUND #15: vector fcvtms floors every lane'
count = 2
regex = 'CONCAT44\(\(int4\)FLOAT_FLOOR\(.*\),\(int4\)FLOAT_FLOOR\('

[[match]]
name = 'FCVTROUND #16: half-precision fcvtms floors'
count = 1
regex = '^\s*return \(int4\)FLOAT_FLOOR\(a0\);$'

[[match]]
name = 'FCVTROUND #17: no rounded value is reinterpreted as integer bits'
count = 0
regex = 'from = v\d+ \}'

[[match]]
name = 'FCVTROUND #18: frint32z of a 2S vector zeroes the upper half of the register'
count = 1
regex = '^\s*return 0;$'

[[match]]
name = 'FCVTROUND #19: frint64x rounds in the current mode through a 64-bit integer'
count = 1
regex = '^\s*return .*\(float4\)\(int8\)FLOAT_RINT\(x\)'

[[match]]
name = 'FCVTROUND #20: frint64x zeroes the register bits above its single'
count = 0
regex = 'CONCAT44\(\w'
