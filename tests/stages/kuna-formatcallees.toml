# Format-string typing for format functions no table declares
# (`option formatcallees on|off`, default on; program prep, the load-time
# `formatstring static` resolver).
#
# The fixture (fmtcallees.c beside it, gcc -O2, stripped) has a logger that
# forwards its varargs to vfprintf, a scanf-like parser that forwards to
# vsscanf, a variadic `report` that reaches vfprintf through a va_list
# helper, and a non-variadic `note(const char *)` that calls the logger.
# Nothing names them, so only their bodies say they take a format.
#
# Pass 1 (`option formatcallees off`) reproduces the gap: the logger's
# `%f` argument, passed in xmm0, is missing, and `%d` arguments keep the
# widths the caller computed. Pass 2 is the shipped default: each call is
# typed from its literal format, the double appears, and `note("50% done")`
# is left alone, because `note` does not test AL at its entry the way a
# System V variadic function does.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/fmtcallees_x86_64',
    'option listing on',
    'option formatcallees off',
    'read symbols',
    'load function main',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/fmtcallees_x86_64',
    'option listing on',
    'read symbols',
    'load function main',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "FORMATCALLEES #1: off, the logger's double argument is missing"
count = 1
literal = '"args=%d first=%s d=%f\n",argc,argv[1]);'

[[match]]
name = "FORMATCALLEES #2: on, the logger's double argument is passed"
count = 1
literal = '"args=%d first=%s d=%f\n",argc,argv[1],(float8)argc * '

[[match]]
name = 'FORMATCALLEES #3: the scanf-like parser takes the two int pointers either way'
count = 2
regex = '"%d:%d",&v\d+,&v\d+\)'

[[match]]
name = 'FORMATCALLEES #4: the non-variadic note keeps its one argument'
count = 2
literal = '("50% done");'

[[match]]
name = 'FORMATCALLEES #5: on, the %c argument is the char it is, not a widened int'
count = 1
regex = 'c=%c\\n",v\d+,v\d+,\*argv\[1\]\);'
