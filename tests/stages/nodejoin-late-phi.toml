# unlace #1180: rejoining split conditions left an exit phi with three inputs
# after its CFG lost one predecessor, then calc_nz_mask indexed a third edge.
# P8 conditional joining must discover and repair every exit phi even when
# stack analysis has rewritten an earlier phi into arithmetic in place.
# This is an unconditional correctness fix with no P0 option.
#
# Independently assembled 16-bit probe (nasm -f bin, org 0x1000):
#   push es; jnz join; call helper; mul bx; jbe finish
#   join: mov dl,[es:bx]; jcxz finish
#   repeat: loop repeat
#   finish: mov ax,[cs:0xba72]; ret
#   helper: ret
# The call, stack change, shared finish and loop exercise the reported failing
# path without bytes from Dazzle. Before the fix decompilation panics; the
# assertions require a complete body with its loop and final memory read.
#
# The segment op (see segmentize.xml) folds the final read to the
# global dat_ba72, and both returned words survive (asserts 3-4).

[image]
arch = 'x86:LE:16:Real Mode'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'late_phi' },
    { space = 'ram', offset = '0x1016', name = 'helper' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '067507e81000f7e37607268a17e302e2fe2ea172bac3c3'

[script]
commands = [
    'lo fu late_phi',
    'decompile',
    'print C',
]

[[match]]
name = 'nodejoin #1: shared exit emits a complete body'
count = 1
literal = 'late_phi('

[[match]]
name = 'nodejoin #2: the pipeline does not abort'
count = 0
regex = 'Skipping|LOSS-131'

[[match]]
name = 'nodejoin #3: the loop survives the shared-exit repair'
count = 1
literal = 'for (; v1; v1 = v1 + -1)'

[[match]]
name = 'nodejoin #4: the final read is the global and both returned words survive'
count = 1
regex = '^  return CONCAT22\(v2,dat_ba72\);$'
