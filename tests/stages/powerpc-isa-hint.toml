# Synthetic cmpdi r3,0; iseleq r3,r4,r5; blr. The generic target cannot
# decode isel. The hint explains a supported override without retrying.

[image]
arch = 'PowerPC:BE:64:default:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'select_value' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '2c2300007c64289e4e800020'

[script]
commands = [
    'lo fu select_value',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PPCISA #1: the bad-instruction halt gives the ISA hint'
count = 1
literal = 'isel encoding is not supported by PowerPC:BE:64:default'

[[match]]
name = 'PPCISA #2: the supported override is actionable'
count = 1
literal = '--target PowerPC:BE:64:A2ALT for AltiVec'

[[match]]
name = 'PPCISA #3: the selected decoder still halts'
count = 1
literal = 'halt_baddata'
