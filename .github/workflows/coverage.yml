name: Coverage

# The workspace suite under cargo-llvm-cov, every test included (also the slow ones
# the Tests workflow's nextest profile `ci` leaves out), then the lcov upload to
# Repowise. Kept off the push path: instrumented binaries ran the suite 4-9x slower,
# and a failing test used to skip the report entirely. Here the report is written and
# uploaded whether or not a test failed.
#
# The suite runs under cargo's own harness, not nextest: nextest starts a process per
# test, each instrumented process writes its own .profraw, and ~12k of them filled the
# runner's disk.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UNLACE_SLA_CACHE: ${{ github.workspace }}/.sla-cache
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  coverage:
    name: workspace suite with coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write   # lets the Repowise upload prove it comes from this repository
    steps:
      - uses: actions/checkout@v4

      # Instrumented test binaries and their .profraw files need more than the image's
      # free space; these preinstalled SDKs are unused here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - name: Install Rust (stable) with llvm-tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          cache-on-failure: true

      # The engine compiles each .slaspec it needs into the .sla cache (UNLACE_SLA_CACHE,
      # crates/unlace-slacomp/src/slacache.rs) on first use. Restoring the cache only saves
      # that compile time; a miss is correct, just slower.
      - name: Restore the .sla cache
        id: sla
        uses: actions/cache/restore@v4
        with:
          path: .sla-cache
          key: sla-v2-${{ runner.os }}-${{ hashFiles('specs/**/*.slaspec', 'specs/**/*.sinc', 'Cargo.lock', 'crates/unlace-slacomp/**', 'crates/unlace-sleigh/**', 'crates/unlace-base/**', 'crates/unlace-num/**') }}

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Workspace suite under coverage
        run: |
          cargo llvm-cov --no-report --workspace \
            ${{ vars.UNLACE_WEB == 'true' && ' ' || '--exclude unlace-wasm' }} --no-fail-fast

      - name: Write lcov.info
        if: always()
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Repowise
        if: always()
        continue-on-error: true
        env:
          REPORTS: "lcov.info"
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          shopt -s globstar nullglob
          files=()
          for pattern in $REPORTS; do for f in $pattern; do [ -f "$f" ] && files+=(-F "report=@$f"); done; done
          if [ ${#files[@]} -eq 0 ]; then echo "::warning::Repowise: no coverage report found at: $REPORTS"; exit 0; fi
          auth=()
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=repowise" | jq -r '.value // empty' || true)
            [ -n "$token" ] && auth=(-H "Authorization: Bearer $token")
          fi
          curl -sS --fail-with-body --max-time 60 "${auth[@]}" "${files[@]}" \
            -F "repository=$GITHUB_REPOSITORY" -F "head_sha=$HEAD_SHA" -F "pr_number=" \
            -F "event=$GITHUB_EVENT_NAME" -F "run_url=$RUN_URL" -F "workspace=$GITHUB_WORKSPACE" \
            https://api.repowise.dev/ci/coverage \
            || echo "::warning::Repowise: coverage upload failed; see the message above."

      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info
          retention-days: 14
          if-no-files-found: ignore
