# mulblob: a widened 64x64-&gt;128 multiply operand is a value, not a 16-byte
# aggregate.
#
# x86-64 `MUL r64` lowers (SLEIGH ia.sinc:4128) to
#     tmp:16 = zext(RAX) * zext(rm64); RDX = tmp(8); RAX = tmp(0)
# A 16-byte Varnode has no primitive data-type, so the type factory hands it
# the width fallback `undefined1[16]`, an array, and `Datatype::isPieceStructured`
# accepts arrays.  `RulePieceStructure` (C++ ruleaction.cc:7488) therefore
# rewrites each `INT_ZEXT` into a `PIECE` rooted at a partial-root Varnode, and
# P6 gives that root its own declaration: two 16-byte locals per multiply site
# whose entire content is the operand.  The signed sibling never had this -
# `IMUL` lowers through `sext`, and `INT_SEXT` is not in RulePieceStructure's
# op list - so unlace already prints `SUB168(SEXT816(x) * SEXT816(y),8)`.
#
# Source (gcc -O2, x86-64), both halves of the product used:
#
#     uint64_t widemul(uint64_t a, uint64_t b, uint64_t *hi) {
#         unsigned __int128 p = (unsigned __int128)a * (unsigned __int128)b;
#         *hi = (uint64_t)(p >> 64);
#         return (uint64_t)p;
#     }
#
# Body: endbr64 ; mov rax,rdi ; mov r8,rdx ; mul rsi ; mov [r8],rdx ; ret
#
# The multiply prints over the operands themselves and declares nothing
# (asserts #4/#5); no 16-byte blob local is ever declared or filled in
# halves before a SUB168 read (asserts #1-#3).
#
# Stage model: P3 "simplification-quiescence".

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'widemul' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'f30f1efa4889f84989d048f7e6498910c3'

[script]
commands = [
    'parse line extern uint8 widemul(uint8 a, uint8 b, uint8 *hi);',
    'lo fu widemul',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'MULBLOB #1: no 16-byte local is declared per operand'
count = 0
regex = 'char v[12] \[16\];'

[[match]]
name = 'MULBLOB #2: no blob is filled in halves before the product is read'
count = 0
literal = 'v1._8_8_ = 0;'

[[match]]
name = 'MULBLOB #3: the high half is never read out of a blob product'
count = 0
literal = 'SUB168(v1._0_16_ * v2._0_16_,8)'

[[match]]
name = 'MULBLOB #4: the pipeline prints the high half over the operands themselves'
count = 1
literal = '*hi = SUB168(ZEXT816(a) * ZEXT816(b),8);'

[[match]]
name = 'MULBLOB #5: the pipeline prints the low half the same way, with no blob left'
count = 1
literal = 'return SUB168(ZEXT816(a) * ZEXT816(b),0);'
