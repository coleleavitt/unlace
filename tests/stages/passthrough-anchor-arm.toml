[script]
commands = [
    'set context TMode 1 [ram,0x10000] [ram,0x100a3]',
    'set context TMode 1 [ram,0x30000] [ram,0x30001]',
    'set context TMode 1 [ram,0x30010] [ram,0x30011]',
    'option passthrough off',
    'lo fu s3g',
    'decompile',
    'print C',
    'lo fu tick',
    'decompile',
    'print C',
    'lo fu fin',
    'decompile',
    'print C',
    'option passthrough on',
    'lo fu s3g',
    'decompile',
    'print C',
    'lo fu tick',
    'decompile',
    'print C',
    'lo fu fin',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'passthrough-anchor-arm #1: the canary wipe is no argument of the call it reaches'
count = 2
literal = '__stack_chk_fail(); // no-return'

[[match]]
name = 'passthrough-anchor-arm #2: s3g gains no parameter from the canary wipe'
count = 2
literal = 'void s3g(void)'

[[match]]
name = 'passthrough-anchor-arm #3: the r3 the pop restores is no argument of the tail jump'
count = 2
literal = 'v1 = part(); // tail-call'

[[match]]
name = 'passthrough-anchor-arm #4: tick gains no parameter from the alignment slot'
count = 2
literal = 'unsigned int tick(void)'

[[match]]
name = 'passthrough-anchor-arm #5: floats kept across the call are no arguments of it'
count = 2
literal = 'v1 = (float4)dur(((unsigned int *)a0)[1]);'

[[match]]
name = 'passthrough-anchor-arm #6: fin keeps its one parameter'
count = 2
literal = 'bool fin(void *a0)'
