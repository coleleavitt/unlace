# `rust-process-exit.toml` preserves exit status and preceding stores while removing dead
# trap flow after a known Rust standard-library process exit. Different namespaces and a longer
# similarly named function retain their callers.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/rust-process-exit/linux-amd64',
    'read symbols',
    'option outlang c',
    'load function exit_choice',
    'decompile',
    'print C',
    'load function returning_names',
    'decompile',
    'print C',
    'option outlang rust',
    'load function exit_choice',
    'decompile',
    'print C',
    'load function returning_names',
    'decompile',
    'print C',
]

[[match]]
name = 'Rust process exit never falls into the dead trap'
count = 0
literal = 'invalidInstructionException'

[[match]]
name = 'Rust process exit keeps the ordinary returning arm'
count = 2
literal = 'return 0x1b;'

[[match]]
name = 'Rust process exit retains its conditional store'
count = 2
literal = '*a2 = 0x1f;'

[[match]]
name = 'Rust process exit keeps both exit codes and terminates'
count = 2
regex = '\bexit\(a1 != 0xb\); // no-return'

[[match]]
name = 'Rust process exit leaves the other namespace returning'
count = 2
literal = 'lookalike::process::exit(a0)'

[[match]]
name = 'Rust process exit leaves the longer function name returning'
count = 2
literal = 'exit_status(v1)'

[[match]]
name = 'Rust process exit keeps the store after returning helpers'
count = 2
literal = '*a1 = '
