# P9 Go condition rendering over authored UCOMISD/Jcc byte sequences.
# A positive float equality proves both of its operands are ordered.
# Ordered inequality, a third operand, a load and a conditional store
# keep their existing guards. The final C run pins the machine guard.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'ordered_eq_args' },
    { space = 'ram', offset = '0x100040', name = 'ordered_eq_constant' },
    { space = 'ram', offset = '0x100080', name = 'ordered_ne_args' },
    { space = 'ram', offset = '0x1000c0', name = 'unordered_other' },
    { space = 'ram', offset = '0x100100', name = 'ordered_eq_load' },
    { space = 'ram', offset = '0x100140', name = 'ordered_eq_with_store' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '660f2ec175087a06b807000000c3b809000000c3'

[[image.bytes]]
