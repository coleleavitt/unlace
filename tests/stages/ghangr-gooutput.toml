# angr 6afa0c79 TestGoTypeSpelling/TestGoCodegenHandlers: P9 output-language.
# outlang c retains the existing C surface; outlang go selects Go functions,
# exact-width types, conversions and statement forms. Both C passes must agree.
# The committed GCC fixture and source also drive compiled Go semantic checks.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/go-output/output-c',
    'read symbols',
    'option outlang c',
    'load function add',
    'decompile',
    'print C',
    'option outlang go',
    'print C',
    'load function read_at',
    'decompile',
    'print C',
    'load function from_word',
    'decompile',
    'print C',
    'load function bits',
    'decompile',
    'print C',
    'load function bottom',
    'decompile',
    'print C',
    'option crossjumprevert off',
    'option gotoreduce off',
    'load function fallthroughs',
    'decompile',
    'print C',
    'option outlang c',
    'load function add',
    'decompile',
    'print C',
]

[[match]]
name = 'C selection retains C return punctuation before and after Go'
count = 2
literal = 'return a + b;'

[[match]]
name = 'Go selection emits exact-width function parameters'
count = 1
literal = 'func add(a int64, b int64) int64 {'

[[match]]
name = 'Go pointer indexing retains byte scaling'
count = 1
regex = 'unsafe.Add\(unsafe.Pointer\(p\),i \* 4\)'

[[match]]
name = 'Go integer pointer conversion retains uintptr bridge'
count = 1
regex = 'unsafe.Pointer\(uintptr\(p\)\)'

[[match]]
name = 'Go float storage conversion preserves bits'
count = 1
regex = 'math.Float64frombits\(uint64\(a\)\)'

[[match]]
name = 'Go bottom-tested loop skips only its first condition'
count = 1
regex = 'for _unlace_first_[0-9]+ := true; _unlace_first_[0-9]+ \|\| \('

[[match]]
name = 'Go switch renders actual shared-case fallthrough'
count = 2
regex = '^ *fallthrough$'
