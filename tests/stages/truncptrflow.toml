# Stage P3, pointer flow on a truncated default data space
# (p3_dataflow/ruleaction_7.rs RulePtrFlow, and the entry stack register in
# p4_calls/coreaction_protos.rs ActionPrototypeTypes), always on.
#
# MIPS N32 addresses are 32 bits wide and its registers 64. The bytes are the
# GCC 7.3 N32 soft-float build of tests/fixtures/mips-n32-stack/stack.c, the
# same chunk tests/stages/n32-stack.xml decompiles on the Octeon N32
# target, here on the generic MIPS 64-32addr N32 language.
#
# sum_ten (0x100000, no declared prototype) adds its ten arguments; the
# ninth and tenth arrive on the stack:
#
#     ld v0,0(sp); ld v1,8(sp); daddu v0,v0,v1; daddu t3,v0,t3; ...
#
# pointer_ninth (0x100068) returns *p for a declared ninth argument p,
# read from the low word of its stack slot:
#
#     lw v0,4(sp); jr ra; ld v0,0(v0)
#
# The pass narrows each address to the stack's width and rebuilds sp as
# PIECE(upper, low) at entry, so both stack arguments are parameters and *p
# is a plain read; the stubbed-out rendering (sum_ten reading its stack
# arguments as fields of an sp struct, pointer_ninth loading through
# `(long long)*(int *)(v1 + 4)`) never appears.

[image]
arch = 'MIPS:BE:64:64-32addr:n32'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'sum_ten' },
    { space = 'ram', offset = '0x100068', name = 'pointer_ninth' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = ''

[script]
commands = [
    'parse line extern unsigned long long pointer_ninth(unsigned long long a,unsigned long long b,unsigned long long c,unsigned long long d,unsigned long long e,unsigned long long f,unsigned long long g,unsigned long long h,const unsigned long long *p);',
    'lo fu sum_ten',
    'decompile',
    'print C',
    'lo fu pointer_ninth',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'TRUNCPTRFLOW #1: sum_ten never reads its stack arguments as fields of sp'
count = 0
regex = 'return [a-z_0-9]+->field_0x0 \+ [a-z_0-9]+->field_0x8 \+'

[[match]]
name = 'TRUNCPTRFLOW #2: p is never loaded through a sign-extended stack word'
count = 0
regex = 'return \*\(uint8 \*\)\(int8\)\*\(int4 \*\)\([a-z_0-9]+ \+ 4\);'

[[match]]
name = 'TRUNCPTRFLOW #3: sp is never declared as a local'
count = 0
regex = '; // sp$'

[[match]]
name = 'TRUNCPTRFLOW #4: sum_ten gets all ten arguments'
count = 1
regex = '^int8 sum_ten\(int8 a0,int8 a1,int8 a2,int8 a3,int8 a4,int8 a5,int8 a6,int8 a7,int8 a8,int8 a9\)$'

[[match]]
name = 'TRUNCPTRFLOW #5: both stack arguments are added'
count = 1
literal = 'return a8 + a9 + a7 + a6 + a5 + a4 + a3 + a2 + a1 + a0;'

[[match]]
name = 'TRUNCPTRFLOW #6: the declared pointer argument is read directly'
count = 1
literal = 'return *p;'

[[match]]
name = 'TRUNCPTRFLOW #7: pointer_ninth decompiles'
count = 1
regex = '^uint8 pointer_ninth\('
