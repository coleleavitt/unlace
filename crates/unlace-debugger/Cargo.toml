[package]
name = "unlace-debugger"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Debugger backends for unlace (Linux ptrace, Windows DebugAPI, GDB stub)"

[dependencies]
unlace-session = { workspace = true }
unlace-ir.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc = { version = "0.2", optional = true }

[features]
default = []
# Real ptrace / debug-API backends — disabled by default so the crate
# can be built+tested on any host without privilege.
linux-ptrace = ["dep:libc"]
windows-debugapi = []
gdb-stub = []
