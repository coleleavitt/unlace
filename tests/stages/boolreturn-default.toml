# boolreturn (default on since issue #9): a function whose tests the compiler lowered to
# constant returns prints as one short-circuit return. One x86-64 image, four shapes seen on
# DecBench O2-noinline and in the stage corpus (gh558-compareform, cortus-aps3-constructors,
# sparc-zeropair and libcnames pin the option off to test their own features):
#   gh558    - cmp edi,8; jg: if (x <= 8) return 1; return 0;
#   sgnguard - movsbl; test; js: a signed guard on a sign-extended byte
#   eqret    - cmp esi,edi; jne: if (a == b) return 1; return 0;
#   ordered  - cmp edi,5; jg; setl: a guard, then a comparison tail
#   nested   - three guards at the function body's root (a BlockGraph, #759): the inner
#              if (!p[2]) return 1; return 0; folds as a truthy !x (#881), then joins the
#              if (!p[1]) around it; the leading guard still prints apart (issue #9)
# Stage: 09 emission (C syntax tree rewrite), option boolreturn at its default.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'gh558' },
    { space = 'ram', offset = '0x102000', name = 'sgnguard' },
    { space = 'ram', offset = '0x103000', name = 'eqret' },
    { space = 'ram', offset = '0x104000', name = 'ordered' },
    { space = 'ram', offset = '0x105000', name = 'nested' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '83ff087f06b801000000c331c0c3'

[[image.bytes]]
space = 'ram'
offset = '0x102000'
readonly = true
hex = '400fbec784c0780331c0c3b801000000c3'

[[image.bytes]]
space = 'ram'
offset = '0x103000'
readonly = true
hex = '39f77506b801000000c331c0c3'

[[image.bytes]]
space = 'ram'
offset = '0x104000'
readonly = true
hex = '83ff057f0831c039d60f9cc0c331c0c3'

[[image.bytes]]
space = 'ram'
offset = '0x105000'
readonly = true
hex = '833f007518837f0400750f837f08007506b801000000c331c0c331c0c331c0c3'

[script]
commands = [
    'parse line extern int4 gh558(int4 x);',
    'parse line extern int4 sgnguard(char c);',
    'parse line extern int4 eqret(uint4 a,uint4 b);',
    'parse line extern int4 ordered(int4 x,int4 y,int4 z);',
    'parse line extern int4 nested(int4 *p);',
    'lo fu gh558',
    'decompile',
    'print C',
    'lo fu sgnguard',
    'decompile',
    'print C',
    'lo fu eqret',
    'decompile',
    'print C',
    'lo fu ordered',
    'decompile',
    'print C',
    'lo fu nested',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'BOOLRETURN #1: gh558: if (x <= 8) return 1; return 0; is one return of the comparison'
count = 1
literal = "return (x <= 8);"

[[match]]
name = 'BOOLRETURN #2: sgnguard: the signed guard on a sign-extended byte is one return of the comparison'
count = 1
literal = "return ('\\0' > c);"

[[match]]
name = 'BOOLRETURN #3: eqret: if (a == b) return 1; return 0; is return (a == b)'
count = 1
literal = "return (a == b);"

[[match]]
name = 'BOOLRETURN #4: ordered: a guard, then a comparison tail, is one short-circuit return'
count = 1
literal = "return (x <= 5) && y < z;"

[[match]]
name = 'BOOLRETURN #5: no constant return 1 is left'
count = 0
literal = 'return 1;'

[[match]]
name = "BOOLRETURN #6: at most nested's leading guard keeps a return 0"
min = 0
max = 1
literal = 'return 0;'

[[match]]
name = 'BOOLRETURN #7: nested folds its inner guards into one return'
count = 1
literal = '(!p[1]) && (!p[2])'
