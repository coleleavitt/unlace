[[match]]
name = 'FLOATBITS #1: fabsf never prints integer on both sides'
count = 0
literal = 'uint4 fb_fabsf(uint4 a0)'

[[match]]
name = 'FLOATBITS #2: fabsf is float on both sides'
count = 3
literal = 'float4 fb_fabsf(float4 a0)'

[[match]]
name = 'FLOATBITS #3: the sign mask of a float prints as ABS'
count = 5
literal = 'return ABS(a0);'

[[match]]
name = 'FLOATBITS #4: the sign flip never prints integer on both sides'
count = 0
regex = 'int4 fb_negf\(u?int4 a0\)'

[[match]]
name = 'FLOATBITS #5: the sign flip is float on both sides'
count = 3
literal = 'float4 fb_negf(float4 a0)'

[[match]]
name = 'FLOATBITS #6: copysignf never prints integer on both sides'
count = 0
literal = 'uint4 fb_copysignf(uint4 a0,uint4 a1)'

[[match]]
name = 'FLOATBITS #7: copysignf is float on both sides'
count = 3
literal = 'float4 fb_copysignf(float4 a0,float4 a1)'

[[match]]
name = "FLOATBITS #8: the classifier's parameter is never an integer"
count = 0
literal = 'bool fb_isnanf(uint4 a0)'

[[match]]
name = 'FLOATBITS #9: a classifier answering in an integer register takes a float'
count = 3
literal = 'bool fb_isnanf(float4 a0)'

[[match]]
name = 'FLOATBITS #10: x86-64 and AArch64 fabs never print integer on both sides'
count = 0
literal = 'uint8 fb_fabs(uint8 a0)'

[[match]]
name = 'FLOATBITS #11: x86-64 and AArch64 fabs are double on both sides'
count = 2
literal = 'float8 fb_fabs(float8 a0)'

[[match]]
name = 'FLOATBITS #12: arithmetic on the bits keeps the integer'
count = 3
literal = 'int4 fb_bump(int4 a0)'

[[match]]
name = 'FLOATBITS #13: storing the bits keeps the integer'
count = 3
literal = 'void fb_store(uint4 a0,uint4 *a1)'

[[match]]
name = 'FLOATBITS #14: an integer parameter in the returned bits keeps both sides integer'
count = 3
literal = 'uint4 fb_mix(uint4 a0,uint4 a1)'

[[match]]
name = 'FLOATBITS #15: an == of the bits with zero keeps the integer (a float == also matches -0.0)'
count = 3
literal = 'bool fr_iszero(int4 a0)'

[[match]]
name = "FLOATBITS #16: an == of two inputs' bits keeps the integers (a float == fails for equal NaNs)"
count = 3
literal = 'bool fr_eqbits(int4 a0,int4 a1)'

[[match]]
name = 'FLOATBITS #17: a != of the bits with zero keeps the integer'
count = 3
literal = 'bool fr_ne0(int4 a0)'

[[match]]
name = 'FLOATBITS #18: an == with a NaN pattern keeps the integer (a float == with NaN is never true)'
count = 3
literal = 'bool fr_isqnan0(uint4 a0)'

[[match]]
name = 'FLOATBITS #19: an == with infinity is exact as a float comparison'
count = 3
literal = 'return ABS(a0) == INFINITY;'

[[match]]
name = 'FLOATBITS #20: an == with a normal number is exact as a float comparison'
count = 3
regex = 'return a0 == 1\.0f?;'

[[match]]
name = 'FLOATBITS #21: a NaN payload returned as the value keeps the integer'
count = 2
literal = 'uint4 fr_sel(uint4 a0,int4 a1)'

[[match]]
name = 'FLOATBITS #22: an erased-flash 0xffffffff returned as the value keeps the integer'
count = 2
literal = 'uint4 fr_unset(uint4 a0,int4 a1)'

[[match]]
name = 'FLOATBITS #23: the canonical NaN returned as the value is a float'
count = 2
literal = 'float4 fr_canon(float4 a0)'

[[match]]
name = 'FLOATBITS #24: the low word of a _Float128 in xmm0 keeps the integer'
count = 1
literal = 'bool fr_lowzero(int8 a0)'

[[match]]
name = 'FLOATBITS #25: two integer lanes masked in one 8-byte register keep the integer'
count = 1
literal = 'uint8 fr_andv(uint8 a0)'

[[match]]
name = 'FLOATBITS #26: an == with 0.1f keeps the integer (C reads the literal 0.1 as a double)'
count = 3
literal = 'bool fr_tenth(int4 a0)'

[[match]]
name = 'FLOATBITS #27: an == with FLT_MAX keeps the integer'
count = 3
literal = 'bool fr_fmax(int4 a0)'

[[match]]
name = 'FLOATBITS #28: an == with FLT_MIN keeps the integer'
count = 3
literal = 'bool fr_fmin(int4 a0)'

[[match]]
name = 'FLOATBITS #29: a != with 1.0000001f keeps the integer'
count = 3
literal = 'bool fr_onep(int4 a0)'

[[match]]
name = 'FLOATBITS #30: an == of the magnitude with 0.33333334f keeps the integer'
count = 3
literal = 'bool fr_third(uint4 a0)'

[[match]]
name = 'FLOATBITS #31: an == with a float a double literal spells exactly is a float comparison'
count = 3
regex = 'return a0 == 16777218\.0f?;'

[[match]]
name = 'FLOATBITS #32: a sign flip of the second float of a struct in xmm0 keeps the integer'
count = 1
literal = 'uint8 fr_negy(uint8 a0)'

[[match]]
name = "FLOATBITS #33: a sign flip of a _Float128's low word keeps the integer"
count = 1
literal = 'uint8 fr_lowflip(uint8 a0)'
