[script]
commands = [
    'parse line struct LifetimePair { int4 x; int4 y; };',
    'parse line struct LifetimeHandle { int4 *value; };',
    'parse line extern int4 stack_reuse(void);',
    'parse line extern int4 read_pair(LifetimePair *pair);',
    'parse line extern int4 read_handle(LifetimeHandle *handle);',
    'map addr r0x402000 int4 datum',
    'volatile r0x402018 16',
    'map addr r0x402008 LifetimePair *object_pair',
    'map addr r0x402010 LifetimeHandle *object_handle',
    'map addr r0x402018 LifetimePair *volatile_pair',
    'map addr r0x402020 LifetimeHandle *volatile_handle',
    'option stackviews off',
    'lo fu stack_reuse',
    'decompile',
    'print C',
    'option stackviews on',
    'lo fu stack_reuse',
    'decompile',
    'print C',
    'parse line extern int4 override_reuse(void);',
    'parse line extern int4 read_pair(void *pair);',
    'parse line extern int4 read_handle(void *handle);',
    'lo fu override_reuse',
    'decompile',
    'override prototype r0x401097 int4 read_pair(LifetimePair *pair);',
    'override prototype r0x4010ac int4 read_handle(LifetimeHandle *handle);',
    'decompile',
    'print C',
    'parse line extern int4 read_pair(LifetimePair *pair);',
    'parse line extern int4 read_handle(LifetimeHandle *handle);',
    'option stackviews off',
    'lo fu stack_reuse',
    'map addr s0xffffffffffffffe8 LifetimePair protected_pair',
    'decompile',
    'print C',
    'option stackviews on',
    'lo fu stack_reuse',
    'map addr s0xffffffffffffffe8 LifetimePair protected_pair',
    'decompile',
    'print C',
    'parse line extern int4 obj_global_reuse(void);',
    'parse line extern int4 obj_volatile_reuse(void);',
    'option stackviews off',
    'lo fu obj_global_reuse',
    'decompile',
    'print C',
    'lo fu obj_volatile_reuse',
    'decompile',
    'print C',
    'option stackviews on',
    'lo fu obj_global_reuse',
    'decompile',
    'print C',
    'lo fu obj_volatile_reuse',
    'decompile',
    'print C',
    'parse line extern int4 snapshot_read_integer(int4 *word);',
    'parse line extern int4 snapshot_read_handle(LifetimeHandle *handle);',
    'parse line extern uint8 cached_stack_word(uint8 input,void (*callback)(void *slot));',
    'lo fu cached_stack_word',
    'decompile',
    'print C',
    'parse line struct LifetimeQueue { int4 **begin; int4 **end; int4 **capacity; };',
    'parse line extern int4 publish_frame_word(LifetimeQueue *queue,int4 **source);',
    'parse line extern int4 snapshot_read_integer(void *word);',
    'parse line extern int4 snapshot_read_handle(void *handle);',
    'lo fu publish_frame_word',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'the bounded local policy never leaves a pointer assigned to the Pair object'
count = 0
regex = '^  v2\[0\] = &datum;$'

[[match]]
name = 'the Pair view reaches its helper under the bounded policy and under stackviews'
count = 3
regex = 'read_pair\(&v2.view_LifetimePair\)'

[[match]]
name = 'the pointer member is written under the bounded policy and under stackviews'
count = 3
regex = '^  v2.value_[0-9]+ = &datum;$'

[[match]]
name = 'the Handle view reaches its helper under the bounded policy and under stackviews'
count = 3
regex = 'read_handle\(&v2.view_LifetimeHandle\)'

[[match]]
name = 'stackviews off assigns a pointer to the locked struct'
count = 1
regex = '^  protected_pair = &datum;$'

[[match]]
name = 'stackviews on copies pointer bytes into the locked struct'
count = 1
literal = '__builtin_memcpy((uint1 *)&protected_pair,&(void *){ &datum },8)'

[[match]]
name = 'stackviews keeps the declared backing layout'
count = 2
regex = '^  LifetimePair protected_pair;'

[[match]]
name = 'stackviews binds ordinary global addresses to declared object views'
count = 1
regex = 'object_pair = &v[0-9]+\.view_LifetimePair;'

[[match]]
name = 'stackviews binds volatile global addresses to declared object views'
count = 1
regex = 'volatile_pair = &v[0-9]+\.view_LifetimePair;'

[[match]]
name = 'stackviews selects Handle views at both noncall uses'
count = 2
regex = '(object_handle|volatile_handle) = &v[0-9]+\.view_LifetimeHandle;'

[[match]]
name = 'cached frame words retain scalar declarations'
count = 1
regex = '^  uint8 v1;'

[[match]]
name = 'cached frame reads select a scalar member'
count = 1
regex = '^  v1 = v3\.view_uint8;$'

[[match]]
name = 'frame publications retain the declared queue pointer'
count = 1
regex = '^  int4 \*\*v1;'

[[match]]
name = 'frame publications store scalar pointer bits'
count = 1
regex = '^    \*v1 = \(int4 \*\)v4\.view_uint8;$'
