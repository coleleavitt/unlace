# Kuna `kernelcache` option (P1 code-data partition): load an iOS kernelcache
# straight from its IMG4 / IM4P container and pick one MH_FILESET entry.
#
# The fixtures are generated by gen_fileset.py next to them: a two-entry arm64
# kernel collection (com.apple.kernel + com.example.driver.Widget) sharing one
# DYLD_CHAINED_PTR_64_KERNEL_CACHE fixup table and one LINKEDIT, wrapped as
# IMG4(IM4P(LZFSE)) and as a bare IM4P(complzss).
#
# Pass 1 (`option kernelcache off`) is the bug: the bare collection loads as
# one image with no symbol table, so the kext's direct call into the kernel is
# sub_<addr> calling sub_<addr> (and the IMG4 does not load at all).
# Pass 2 (`option kernelcache Widget`) loads the kext out of the IMG4: the
# kext's direct `bl` into the kernel and its __stubs call both render
# kernel_add, bound through the collection's symbols. Pass 3 (`auto`) loads
# the kernel entry out of the complzss IM4P.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'option kernelcache off',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/fileset.macho',
    'read symbols',
    'load addr 0xfffffff007007800',
    'decompile',
    'print C',
    'option kernelcache Widget',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/kernelcache.img4',
    'read symbols',
    'load function widget_start',
    'decompile',
    'print C',
    'load function widget_via_stub',
    'decompile',
    'print C',
    'option kernelcache auto',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/kernelcache.lzss.im4p',
    'read symbols',
    'load function kernel_add',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'KERNELCACHE #1: off leaves the kext and its kernel callee unnamed'
count = 1
regex = '^  sub_fffffff007007000\(a0,7\);'

[[match]]
name = 'KERNELCACHE #2: the selected kext entry carries its own symbol'
count = 1
regex = '^void widget_start\('

[[match]]
name = "KERNELCACHE #3: the kext's direct call into the kernel is bound by name"
count = 1
regex = '^  kernel_add\(a0,7\);'

[[match]]
name = "KERNELCACHE #4: the kext's __stubs call is named"
count = 1
regex = '^  kernel_add\(a0,8\);'

[[match]]
name = 'KERNELCACHE #5: auto loads the kernel entry out of the complzss IM4P'
count = 1
literal = 'return a0 + a1;'
