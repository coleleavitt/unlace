[[match]]
name = 'octeoneffects #1: off forwards past the atomic and barrier; atomic past a barrier only'
count = 3
literal = 'return 7;'

[[match]]
name = 'octeoneffects #2: a stack spill across syncw stays the value'
count = 1
literal = 'return value;'

[[match]]
name = 'octeoneffects #3: atomic and ordered keep the barrier as an Octeon operation'
count = 5
literal = 'octeon_syncw();'

[[match]]
name = 'octeoneffects #4: off lifts syncw as upstream SYNC(4)'
count = 1
literal = 'SYNC(4);'

[[match]]
name = "octeoneffects #5: off lifts sc as upstream's plain store"
count = 1
literal = 'CONCAT44(value,7)'

[[match]]
name = 'octeoneffects #6: atomic keeps the store a load-linked reads'
count = 1
literal = '= value;'

[[match]]
name = 'octeoneffects #7: pointer snapshots stay before atomic updates'
count = 2
literal = [
    '= *pointer;',
    'octeon_fetch_add64(pointer,increment);',
]

[[match]]
name = 'octeoneffects #8: ordered preserves pointer load ordering at a barrier'
count = 1
literal = [
    '= *pointer;',
    'octeon_syncw();',
]

[[match]]
name = 'octeoneffects #9: opaque atomic and unordered barrier controls still inline the load'
count = 2
literal = 'return *pointer;'

[[match]]
name = 'octeoneffects #10: only off forwards a neighboring stack value across zeroing'
count = 2
literal = 'return neighbor_value;'

[[match]]
name = 'octeoneffects #11: both zero operations retain neighboring stores in both guarded modes'
count = 4
literal = [
    '= neighbor_value;',
    'octeon_zero_cache_block',
]

[[match]]
name = "octeoneffects #12: zeroing through an incoming pointer keeps a spill in the frame's top cache block"
count = 2
literal = [
    '= kept;',
    'octeon_zero_cache_block(block);',
]

[[match]]
name = 'octeoneffects #13: a spill more than a cache block below the entry stack pointer stays a value'
count = 2
literal = [
    'octeon_zero_cache_block(block);',
    'return kept;',
]

[[match]]
name = "octeoneffects #14: sparse call guards keep the call guard an atomic's guard reads"
count = 2
regex = '^0x00001b98:[0-9a-f]+:\s+r0x00002108:4\(0x00001b98:[0-9a-f]+\) = r0x00002108:4\(0x00001b90:[0-9a-f]+\) \[\] i0x00001b98:'

[[match]]
name = "octeoneffects #15: no atomic guard reads a global's value from entry past calls"
count = 0
regex = '= r0x0000210[0-8]:4\(i\) \[\] i0x00001b98:'

[[match]]
name = 'octeoneffects #16: only off forwards deep values through transformed zero addresses'
count = 2
literal = 'return moved;'

[[match]]
name = 'octeoneffects #17: transformed zero addresses retain deep stores in both guarded modes'
count = 4
literal = [
    '= moved;',
    'octeon_zero_cache_block',
]
