[script]
commands = [
    # rangefold would invert the guard's comparison and the raw branch it pins
    'option rangefold off',
    'option sourcelang go',
    'option outlang go',
    'option noreturn runtime.panicdivide',
    'option noreturn application.panicdivide',
    'map prototype guarded_quotient int8 guarded_quotient(int8 a,int8 b);',
    'map prototype raw_quotient int8 raw_quotient(int8 a,int8 b);',
    'map prototype bounds_control int8 bounds_control(int8 *data,uint8 index,uint8 length);',
    'map prototype application_guard int8 application_guard(int8 a,int8 b);',
    'map prototype mixed_panics void mixed_panics(int8 a,int8 b);',
    'map prototype abi_quotient int8 abi_quotient(int8 a,int8 b);',
    'load function guarded_quotient',
    'decompile',
    'print C',
    'print raw',
    'option gobounds off',
    'decompile',
    'print C',
    'print raw',
    'option gobounds on',
    'load function raw_quotient',
    'decompile',
    'print C',
    'print raw',
    'load function bounds_control',
    'decompile',
    'print C',
    'print raw',
    'load function application_guard',
    'decompile',
    'print C',
    'load function mixed_panics',
    'decompile',
    'print C',
    'print raw',
    'load function abi_quotient',
    'decompile',
    'print C',
    'print raw',
    'option sourcelang auto',
]

[[match]]
name = 'Go AArch64 compiler division keeps the original fail edge in default and audit modes'
count = 2
regex = '^0x00100000:[[:xdigit:]]+:[[:space:]]+goto .*Block_[0-9]+:0x0010000c'

[[match]]
name = 'Go AArch64 compiler division prints its terminal panic in both modes'
count = 3
regex = '^[[:space:]]+runtime\.panicdivide\(\) // no-return'

[[match]]
name = 'Go AArch64 divide guard recognizes the exact ABI0 helper'
count = 1
regex = '^0x0010014c:[[:xdigit:]]+:[[:space:]]+call fruntime\.panicdivide\.abi0\('

[[match]]
name = 'Go AArch64 bare SDIV still computes its quotient'
count = 1
regex = '^0x00100040:[[:xdigit:]]+:.*x0\(i\) / x1\(i\)'

[[match]]
name = 'Go AArch64 bare SDIV never gains a panic helper'
count = 0
regex = '^0x001000(40|44):[[:xdigit:]]+:.*call'

[[match]]
name = 'Go AArch64 ordinary bounds folding still keeps the indexed access'
count = 1
regex = 'return \*\(\*int64\)\(unsafe.Add\(unsafe.Pointer\(data\),index \* 8\)\)'

[[match]]
name = 'Go AArch64 ordinary bounds folding still removes its own helper'
count = 0
regex = '^0x00100090:[[:xdigit:]]+:.*call'

[[match]]
name = 'Go AArch64 an application helper with the same suffix remains'
count = 1
regex = '^[[:space:]]+application\.panicdivide\(\) // no-return'

[[match]]
name = 'Go AArch64 a two-panic branch retains both arms'
count = 2
regex = '^0x001001(04|0c):[[:xdigit:]]+:[[:space:]]+call fruntime\.panic(Index|divide)\('
