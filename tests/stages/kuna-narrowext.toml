[script]
commands = [
    'parse line extern int1 rsc(int4 k);',
    'parse line extern uint2 rus(int4 k);',
    'parse line extern int4 ri(int4 k);',
    'parse line extern uint4 ru(int4 k);',
    'parse line extern int8 csc(int4 k);',
    'parse line extern int8 cus(int4 k);',
    'parse line extern int8 ci(int4 k);',
    'parse line extern int8 cu(int4 k);',
    'parse line extern int8 pi(int4 x);',
    'parse line extern int8 pus(uint2 x);',
    'parse line extern int8 pu(uint4 x);',
    'parse line extern int8 psc(int1 x);',
    'option narrowext off',
    'lo fu csc',
    'decompile',
    'print C',
    'lo fu cus',
    'decompile',
    'print C',
    'lo fu ci',
    'decompile',
    'print C',
    'lo fu cu',
    'decompile',
    'print C',
    'lo fu pi',
    'decompile',
    'print C',
    'lo fu pus',
    'decompile',
    'print C',
    'lo fu pu',
    'decompile',
    'print C',
    'lo fu psc',
    'decompile',
    'print C',
    'option narrowext abi',
    'lo fu csc',
    'decompile',
    'print C',
    'lo fu cus',
    'decompile',
    'print C',
    'lo fu ci',
    'decompile',
    'print C',
    'lo fu cu',
    'decompile',
    'print C',
    'lo fu pi',
    'decompile',
    'print C',
    'lo fu pus',
    'decompile',
    'print C',
    'lo fu pu',
    'decompile',
    'print C',
    'lo fu psc',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'NARROWEXT #1: off, an int result is zero-extended'
count = 1
literal = 'return (uint8)(uint4)ri(k);'

[[match]]
name = 'NARROWEXT #2: abi, an int result is sign-extended'
count = 1
literal = 'return ri(k);'

[[match]]
name = 'NARROWEXT #3: off, a signed char result is zero-extended'
count = 1
literal = 'return (uint1)rsc(k) * 3UL;'

[[match]]
name = 'NARROWEXT #4: abi, a signed char result is sign-extended'
count = 1
literal = 'return (int8)rsc(k) * 3;'

[[match]]
name = 'NARROWEXT #5: off, an unsigned int result is zero-extended'
count = 1
literal = 'return (uint8)ru(k);'

[[match]]
name = 'NARROWEXT #6: abi, an unsigned int result is sign-extended'
count = 1
literal = 'return (int4)ru(k);'

[[match]]
name = 'NARROWEXT #7: off, an int parameter is zero-extended'
count = 1
literal = 'return (uint8)(uint4)x << 1;'

[[match]]
name = 'NARROWEXT #8: abi, an int parameter is sign-extended'
count = 1
literal = 'return (int8)x << 1;'

[[match]]
name = 'NARROWEXT #9: off, an unsigned int parameter is zero-extended'
count = 1
literal = 'return (uint8)x;'

[[match]]
name = 'NARROWEXT #10: abi, an unsigned int parameter is sign-extended'
count = 1
literal = 'return (int4)x;'

[[match]]
name = 'NARROWEXT #11: off, a signed char parameter is zero-extended'
count = 1
literal = 'return (uint1)x * 3UL;'

[[match]]
name = 'NARROWEXT #12: abi, a signed char parameter is sign-extended'
count = 1
literal = 'return x * 3L;'

[[match]]
name = 'NARROWEXT #13: an unsigned short result is zero-extended either way'
count = 2
literal = 'return (uint8)rus(k) + 1;'

[[match]]
name = 'NARROWEXT #14: an unsigned short parameter is zero-extended either way'
count = 2
literal = 'return x + 1UL;'
