# Unlace `kernelcache-boot` option (P1 code-data partition): resolve the
# pointers an Auxiliary kernel collection holds into the boot collection it
# was linked against.
#
# The fixtures are generated by gen_linked.py: BootKernelExtensions.kc, a
# boot collection defining kernel_add and kernel_log, and beside it
# AuxiliaryKernelExtensions.kc, whose one kext calls both through `__got`
# slots that are DYLD_CHAINED_PTR_64_KERNEL_CACHE rebases at cache level 0.
# The Auxiliary collection's plist names the boot collection by UUID
# (_BootKCID); the kext has no symbol for either kernel function.
#
# Pass 1 (`option kernelcache-boot off`) is the bug: the slots keep their
# packed chain words, so each call is an indirect call through a data word.
# Pass 2 (default `auto`) finds the boot collection beside the input, rebases
# the slots against its base and names the functions from its symbol table.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'option kernelcache-boot off',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/linked/AuxiliaryKernelExtensions.kc',
    'read symbols',
    'load function gadget_start',
    'decompile',
    'print C',
    'option kernelcache-boot auto',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/linked/AuxiliaryKernelExtensions.kc',
    'read symbols',
    'load function gadget_start',
    'decompile',
    'print C',
    'load function gadget_log',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'KERNELCACHE-BOOT #1: off leaves the call an indirect call through the unresolved slot'
count = 1
regex = '^  \(\*dat_fffffe0017007000\)\(a0,7\);'

[[match]]
name = "KERNELCACHE-BOOT #2: the authenticated slot's call names the kernel function"
count = 1
regex = '^  kernel_add\(a0,7\);'

[[match]]
name = "KERNELCACHE-BOOT #3: the plain slot's call names the kernel function"
count = 1
regex = '^  kernel_log\(a0,3\);'

[[match]]
name = 'KERNELCACHE-BOOT #4: no call through the slot is left once it is resolved'
count = 1
literal = '(*dat_fffffe00170070'
