[script]
commands = [
    'option outlang go',
    'parse line extern uint4 load_offset(void *base);',
    'parse line extern void store_offset(void *base,uint4 value);',
    'parse line extern uint4 *return_offset(void *base);',
    'parse line extern uint4 load_dynamic(void *base,int4 offset);',
    'parse line extern void store_dynamic(void *base,int4 offset,uint4 value);',
    'parse line extern uint4 *return_dynamic(void *base,int4 offset);',
    'parse line extern uint4 *return_negative(void *base);',
    'parse line extern uint4 *integer_address(uint4 base);',
    'load function load_offset',
    'decompile',
    'print C',
    'load function store_offset',
    'decompile',
    'print C',
    'load function return_offset',
    'decompile',
    'print C',
    'load function load_dynamic',
    'decompile',
    'print C',
    'load function store_dynamic',
    'decompile',
    'print C',
    'load function return_dynamic',
    'decompile',
    'print C',
    'load function return_negative',
    'decompile',
    'print C',
    'load function integer_address',
    'decompile',
    'print C',
]

[[match]]
name = 'Go32 pointer: live pointer bases survive all seven additions'
count = 7
literal = 'unsafe.Add(unsafe.Pointer(base),'

[[match]]
name = 'Go32 pointer: dynamic offsets preserve their signed variable'
count = 3
literal = 'unsafe.Add(unsafe.Pointer(base),offset)'

[[match]]
name = 'Go32 pointer: negative offset is a signed byte displacement'
count = 1
literal = 'unsafe.Add(unsafe.Pointer(base),-0x4)'

[[match]]
name = 'Go32 pointer: integer addresses keep their explicit reconstruction'
count = 1
literal = 'unsafe.Pointer(uintptr(base + 0x'

[[match]]
name = 'Go32 pointer: pointer arithmetic has no signed integer roundtrip'
count = 0
regex = 'int[36][24]\(uintptr\(unsafe\.Pointer\(base\)\)\)'
