# Unlace #810 / P6 byte origins and P9 shared storage. stackviews off reads fictitious upper fields; on prints the native byte/word stores without synthetic whole-RGB rewrites.

[image]
arch = 'x86:LE:64:default:windows'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'rgb_reuse' },
    { space = 'ram', offset = '0x401051', name = 'read_rgb' },
    { space = 'ram', offset = '0x401067', name = 'make_manager' },
    { space = 'ram', offset = '0x40106f', name = 'read_manager' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x402000'
hex = '3700000000000000'

[script]
commands = [
    'option partialaccess off',
    'parse line struct RGB { uint1 red; uint1 green; uint1 blue; };',
    'parse line struct Manager { int4 value; };',
    'parse line extern int4 rgb_reuse(uint8 ignored,bool inverted,uint1 blue);',
    'parse line extern void read_rgb(RGB *color);',
    'parse line extern Manager *make_manager(void);',
    'parse line extern int4 read_manager(Manager *manager);',
    'map addr r0x402000 Manager datum',
    'map addr r0x402004 int4 rgb_result',
    'option structdefs on',
    'option stackalias off',
    'option stackviews off',
    'lo fu rgb_reuse',
    'decompile',
    'print C',
    'option stackviews on',
    'lo fu rgb_reuse',
    'decompile',
    'print C',
    'print stack objects',
    'quit',
]

[[match]]
name = 'partial stack: off reads fictitious upper fields'
count = 2
literal = 'v2[0]._3_5_'

[[match]]
name = 'partial stack: on copies changed RGB bytes'
count = 3
regex = 'v2\.(view_RGB\.blue|view_uint2) ='

[[match]]
name = 'partial stack: RGB call retains its member view'
count = 1
literal = 'read_rgb(&v2.view_RGB)'

[[match]]
name = 'partial stack: the complete RGB object is defined'
count = 1
literal = 'object_40102c_1 stack=0x8 size=3 state=defined'

[[match]]
name = 'partial stack: the word retains its native write'
count = 1
regex = '^  bytes 0\.\.2 0x401022$'

[[match]]
name = 'partial stack: the blue byte retains both native branches'
count = 1
regex = '^  bytes 2\.\.3 0x40100e\|0x401019$'
