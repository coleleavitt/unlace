[[match]]
name = 'boolbyte #1: with the option off a byte that is only ever branched on is a character -- the bug'
count = 1
literal = 'unsigned long flagparam(char a0)'

[[match]]
name = 'boolbyte #2: with the option on the same parameter is a bool'
count = 1
literal = 'unsigned long flagparam(bool a0)'

[[match]]
name = "boolbyte #3: the witness function's body is the same in both passes -- here only the declaration moves"
count = 6
literal = 'return 0x2a;'

[[match]]
name = 'boolbyte #4: a byte that is also widened and added is refused in both passes'
count = 2
literal = 'int4 bytearith(uint1 a0)'

[[match]]
name = 'boolbyte #5: a byte tested for its low bit is a parity test, not a truth test, in both passes'
count = 2
literal = 'unsigned long lowbit(uint1 a0)'

[[match]]
name = 'boolbyte #6: and that test keeps its shape, with no bool cast appearing around it'
count = 2
literal = 'if (a0 & 1)'

[[match]]
name = 'boolbyte #7: a byte that is also stored through a pointer is refused in both passes'
count = 2
literal = 'unsigned long flagstore(char a0,char *a1)'

[[match]]
name = 'boolbyte #8: the callfill control keeps its shape in both passes'
count = 2
literal = 'unsigned long callfill(void)'

[[match]]
name = 'boolbyte #9: and so is a byte parameter copied into a slot the callee is handed the address of'
count = 2
literal = 'unsigned long callslot(char a0)'

[[match]]
name = 'boolbyte #10: the slot both controls hand to the callee stays a character in both passes -- the INDIRECT a call leaves on it is not identity, and one byte of a bigger object is not a declaration of its own'
count = 4
literal = 'char v1 [9];'

[[match]]
name = 'boolbyte #11: with the option off a truncation whose destination a comparison already made bool prints as the raw SUB41 intrinsic -- an undeclared identifier'
count = 1
literal = 'v1 = SUB41((uint4)a0 >> 0x1f,0);'

[[match]]
name = 'boolbyte #12: with the option on the same truncation prints as the cast it is'
count = 1
literal = 'v1 = (bool)((uint4)a0 >> 0x1f);'

[[match]]
name = 'boolbyte #13: with the option off a byte truncated from a value with bits above it is a character'
count = 1
literal = 'v1 = (char)(a0 & 0x201);'

[[match]]
name = 'boolbyte #14: with the option on the truncation is kept explicit inside the bool cast'
count = 1
literal = 'v1 = (bool)(uint1)(a0 & 0x201);'

[[match]]
name = 'boolbyte #15: and never prints as a bare bool cast, which would test bit 9 as well'
count = 0
literal = '(bool)(a0 & 0x201)'
