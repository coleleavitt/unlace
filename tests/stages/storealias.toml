[[match]]
name = 'storealias #1: load, the parameter stored to gi stands in for the load after the pointer store'
count = 1
literal = 'return a0 / 0x10;'

[[match]]
name = 'storealias #2: default, that load reads gi'
count = 1
literal = [
    '*a1 = a2;',
    'return gi / 0x10;',
]

[[match]]
name = 'storealias #3: load, the constant stored to gi folds the load away'
count = 1
literal = [
    'gi = 5;',
    '*a0 = a1;',
    'return 0;',
]

[[match]]
name = "storealias #4: default, the load after the constant's store stays a load"
count = 1
literal = [
    '*a0 = a1;',
    'return gi / 0x10;',
]

[[match]]
name = 'storealias #5: load, a value used once is computed again for the load'
count = 1
literal = 'return a0 * 3 >> 4;'

[[match]]
name = 'storealias #6: default, the load of that value reads gi'
count = 1
literal = 'return gi >> 4;'

[[match]]
name = 'storealias #7: load, a value read before the pointer store prints as a read after it'
count = 1
literal = [
    '*a0 = a1;',
    'return gi;',
]

[[match]]
name = 'storealias #8: default, the value read before the store keeps its own variable'
count = 1
literal = [
    'v1 = gi;',
    '*a0 = a1;',
    'return v1;',
]

[[match]]
name = 'storealias #9: load, three reads around two pointer stores collapse into one'
count = 1
literal = 'return gi * 0x6f;'

[[match]]
name = 'storealias #10: default, each read stays where the binary makes it'
count = 1
literal = 'return v1 * 100 + v2 * 10 + gi;'

[[match]]
name = 'storealias #11: load, the store to gi is printed after the pointer store'
count = 1
literal = [
    '*a1 = a2;',
    'gi = a0;',
    'touch();',
]

[[match]]
name = 'storealias #12: default, the store to gi stays in front of the pointer store'
count = 1
literal = [
    'gi = a0;',
    '*a1 = a2;',
    'touch();',
]

[[match]]
name = 'storealias #13: load, the load through the pointer is printed after the store to gi'
count = 1
literal = [
    'gi = a1;',
    'return *a0;',
]

[[match]]
name = 'storealias #14: default, the load through the pointer stays in front of the store to gi'
count = 1
literal = [
    'v1 = *a0;',
    'gi = a1;',
    'return v1;',
]

[[match]]
name = 'storealias #15: load, the increment after the pointer store reads gi again'
count = 1
literal = [
    '*a0 = a1;',
    'gi += 1;',
]

[[match]]
name = 'storealias #16: default, the increment uses the value read before the pointer store'
count = 1
literal = [
    'v1 = gi;',
    '*a0 = a1;',
    'gi = v1 + 1;',
]

[[match]]
name = 'storealias #17: load, the load through the pointer is printed after a store to gi on a branch'
count = 1
literal = [
    'gi = a1;',
    'return *a0 + a2;',
]

[[match]]
name = 'storealias #18: default, the load stays in front of the store to gi on a branch'
count = 1
literal = [
    'v1 = *a0;',
    'if (a2)',
    'gi = a1;',
    'return v1 + a2;',
]

[[match]]
name = 'storealias #19: load, the load is printed after stores to gi and gj on two branches'
count = 1
literal = [
    'gj = a1;',
    'return *a0 - a2;',
]

[[match]]
name = 'storealias #20: default, the load stays in front of the stores on two branches'
count = 1
literal = [
    'v1 = *a0;',
    'if ((6 <= a2) && (gi = a1, 8 <= a2))',
    'gj = a1;',
    'return v1 - a2;',
]

[[match]]
name = 'storealias #21: load, the load in a loop is printed after the store to gi'
count = 1
literal = [
    'gi = v2 + a2;',
    'v1 += a0[v2];',
]

[[match]]
name = 'storealias #22: default, the load in a loop stays in front of the store to gi'
count = 1
literal = [
    'v1 = a0[v3];',
    'gi = v3 + a2;',
    'v2 += v1;',
]

[[match]]
name = 'storealias #23: load, the store to gi is printed after the load, at the call'
count = 1
literal = [
    'v1 = *a1;',
    'gi = a0;',
    'touch();',
]

[[match]]
name = 'storealias #24: default, the store to gi stays in front of the load'
count = 1
literal = [
    'gi = a0;',
    'v1 = *a1;',
    'touch();',
]

[[match]]
name = 'storealias #25: both levels, a store ahead of the load stays there when a branch stores again'
count = 2
literal = [
    'gi = ((int4 *)a1)[3];',
    'if (a2)',
    'gi = (*a0 - ((int4 *)a1)[1]) * 3;',
    'gj = gi + -7;',
]

[[match]]
name = 'storealias #26: both levels, a store ahead of a branch load stays there when gi is stored again'
count = 2
literal = [
    'gi = ((int4 *)a1)[3];',
    'if (a2)',
    'gi = *a0 * 3;',
    'gi -= 7;',
]

[[match]]
name = 'storealias #27: both levels, the same when the branch stores gi too'
count = 2
literal = [
    'gi = (*a0 - ((int4 *)a1)[1]) * 3;',
    'gi -= 7;',
]

[[match]]
name = 'storealias #28: both levels, a store ahead of the load stays there before a shared return block'
count = 2
literal = [
    'gi = a2;',
    'return *a1;',
]

[[match]]
name = 'storealias #29: both levels, past the guard budget gk is stored ahead of the load and the pointer store'
count = 4
literal = [
    'gk = a3 + gk;',
    'v1 = *a0;',
    '*a1 = 7;',
]

[[match]]
name = 'storealias #30: both levels, past the guard budget gk is read again after the pointer store'
count = 2
literal = [
    '*a1 = 7;',
    'return gk + v1 * 100;',
]
