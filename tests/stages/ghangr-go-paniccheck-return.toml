# `ghangr-go-paniccheck-return.toml` checks that a returning Go panic helper falls through to the
# terminal `runtime.gopanic` call. It also checks the helper's conditional throw and shows the
# caller's sentinel with the known no-return analysis disabled.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/go-paniccheck-return/paniccheck-elf',
    'read symbols',
    'load function runtime.panicshift',
    'decompile',
    'print C',
    'load function runtime.panicCheck1',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/go-paniccheck-return/paniccheck-elf',
    'option noreturn_known off',
    'read symbols',
    'load function runtime.panicshift',
    'decompile',
    'print C',
]

[[match]]
name = 'Go panicCheck1 returns to the terminal gopanic call'
count = 1
regex = [
    '^void runtime\.panicshift\(void\)( // no-return)?$',
    '^\{$',
    '^\s+runtime\.panicCheck1\(\);$',
    '^\s+runtime\.gopanic\(\); // no-return$',
    '^\}$',
]

[[match]]
name = 'Go panicCheck1 keeps its return and terminal throw paths'
count = 1
regex = [
    '^void runtime\.panicCheck1\(.*\)$',
    '^\{$',
    '^\s+if \(a0\)$',
    '^\s+runtime\.throw\(\); // no-return$',
    '^\}$',
]

[[match]]
name = 'Go gopanic fallthrough sentinel appears only with known no-return off'
count = 1
regex = [
    '^void runtime\.panicshift\(void\)( // no-return)?$',
    '^\{$',
    '^\s+runtime\.panicCheck1\(\);$',
    '^\s+runtime\.gopanic\(\);$',
    '^\s+dat_[[:xdigit:]]+ = 0x5a;$',
    '^\}$',
]
