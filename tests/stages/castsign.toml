# unlace castsign (P9, sub-stage cast-policy; option castsign on|off).
#
# Source: the 2026-09-23 cast census.  `signedness auto` re-declares a
# register local signed when every signedness-sensitive reader of it is
# signed, but it skips every high mapped onto a Symbol, and a stack local is
# mapped onto its frame Symbol; it also vetoes a variable used as a pointer
# index.  So a frame-resident value that the program only compares signed
# stays `uint8` and every comparison carries `(int8)v1`.
#
# gcc -O0 -fno-pie -fno-stack-protector -fcf-protection=none, linked at
# 0x1000 (the bytes below are .text), with ulen and fill declared below:
#
#   ulen(s)          declared below: extern uint8 ulen(char *s)
#   fill(p)          declared below: extern void fill(uint8 *p)
#   trim_right(s)    { long i = ulen(s) - 1;
#                      while (i >= 0 && s[i] == ' ') { s[i] = 0; i -= 1; }
#                      return i * 10 + 3; }
#   halved(s)        { unsigned long n = ulen(s) - 2;
#                      if ((long)n < 0) return -1; return (long)(n >> 1); }
#   through_ptr()    { unsigned long n; fill(&n);
#                      if ((long)n < 0) return -3; return (long)n; }
#   sign_of(s, t)    { unsigned long n = ulen(s);
#                      if ((long)n < 0) n = ulen(t);
#                      if ((long)n < -1) return 2;
#                      if ((long)n >= 0) return s[n]; return 0; }
#
# Pass 1 (option castsign off) reproduces the defect: sign_of's stack value
# is declared uint8 and each signed comparison casts it back (#1, #2).  Pass 2
# (option castsign on) declares it int8 and the casts, now no-ops, are
# dropped (#3, #4); the `a0[v1]` pointer index is signedness-neutral at
# pointer width.  Both passes keep trim_right's index unsigned: the body
# computes `v1 - 1`, which wraps at 2^63 as uint8 and would overflow as int8
# (#2, #5).  Both passes keep halved's register value unsigned, since it is
# shifted right logically (#6), and through_ptr's stack value unsigned, since
# its address is passed as a uint8 * (#2, #7).  Pass 3 (option castsign still
# on) maps sign_of's slot as `uint8 idx`, which locks its type the way a
# DWARF local or a type assertion does: the declaration and its casts stay
# (#8, #9).

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'ulen' },
    { space = 'ram', offset = '0x102f', name = 'fill' },
    { space = 'ram', offset = '0x1045', name = 'trim_right' },
    { space = 'ram', offset = '0x10aa', name = 'halved' },
    { space = 'ram', offset = '0x10e5', name = 'through_ptr' },
    { space = 'ram', offset = '0x1111', name = 'sign_of' },
]

