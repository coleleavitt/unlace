# Synthetic caller: save ra; addiu a1,a0,1; jal callee; addiu a2,zero,7
# (delay slot); restore ra; return. Callee: addu v0,a0,a1; addu v0,v0,a2;
# jr ra; nop. O32 passes each four-byte word in the low half of an
# eight-byte register; the caller never touches a3.

[image]
arch = 'MIPS:BE:64:64-32addr:o32'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'caller' },
    { space = 'ram', offset = '0x1040', name = 'callee' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '27bdfff0afbf000c248500010c000410240600078fbf000c03e0000827bd0010'

[[image.bytes]]
space = 'ram'
offset = '0x1040'
readonly = true
hex = '008510210046102103e0000800000000'

[script]
commands = [
    'option ctypes on',
    'lo fu caller',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'O32 call: word arguments reach the call'
count = 1
literal = 'callee(a0,a0 + 1,7)'

[[match]]
name = 'O32 call: only the read argument register is an input'
count = 1
literal = 'caller(int a0)'

[[match]]
name = 'O32 call: unread registers are not passed'
count = 0
regex = 'a3|unaff_|CONCAT|halt_baddata'
