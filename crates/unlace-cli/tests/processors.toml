# The Xtensa ESP32-S3 language decodes the PIE (EE.*) vector instructions: a loop of two
# post-incrementing 128-bit loads, a saturating byte add and a store, and a 32-bit fused
# add-and-load. The base instructions were assembled with llvm-mc, the EE.* words encoded from
# the field layout of Espressif's ESP32-S3 TableGen description.
[[family]]
name = "xtensa_esp32s3_pie_loop"
language = "Xtensa:LE:32:esp32s3"
base = "0x40000000"
image = "xtensa_esp32s3_pie_loop"

[[family.function]]
test = "esp32s3_pie_vector_loop_decompiles"
address = "0x40000000"
expect = [
    "a0 += 0x10;",
    "a1 += 0x10;",
    "*(char (*)[16])(a2 & 0xfffffff0) = ee_vadds_s8(*v1,*v2);",
    "} while (a3);",
]

[[family]]
name = "xtensa_esp32s3_pie_fused"
language = "Xtensa:LE:32:esp32s3"
base = "0x40000000"
image = "xtensa_esp32s3_pie_fused"

[[family.function]]
test = "esp32s3_pie_fused_load_decompiles"
address = "0x40000000"
expect = [
    "= ee_vadds_s16(",
    "v2 = a0 + 0x10;",
]

# CMPccXADD and ENQCMD in the 64-bit x86 language: a compare-and-add on memory and an
