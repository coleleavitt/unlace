# ARM32 `probe` (little- and big-endian) ends in a call unlace cannot prove no-return, followed by
# its PC-relative literal pool; the walk took the call's fall-through, decoded the constants as
# instructions and printed `halt_baddata(); // warn: Bad instruction` after the call. P2 flow
# classification (`p2_lift/unlace_funcboundflow.rs` `unlace_should_bound_at_pool`): a call's
# fall-through onto a literal pool the Listing's trusted loads prove (`unlace-analysis`
# `listing/unlace_poolextents.rs`) ends the function `option funcboundflow off\ on`

[image]
arch = 'ARM:LE:32:v8:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '1eff2fe1'

