# The native Blackfin language decompiles a raw image: a zero-overhead
# hardware loop (LSETUP) becomes a loop, and a CALL with register arguments
# and a multi-issue bundle decompiles to a call.
[[family]]
name = "blackfin"
language = "Blackfin:LE:32:default"
base = "0x1000"
fixture = "crates/unlace-cli/tests/fixtures/blackfin/sum_loop.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "blackfin_hardware_loop_decompiles"
address = "0x1000"
expect = [
    "do {",  # the LSETUP loop is recovered
    "+= ",  # the loop accumulates
]

[[family.function]]
test = "blackfin_call_with_register_arguments_decompiles"
address = "0x1010"
expect = [
    "sub_1000(5,7) + 1",  # R0/R1 arguments and the R0 result
]

# The vendored TMS320C28x language loads a word-addressed raw image and
# decompiles it.
[[family]]
name = "c28x"
language = "tms320c28:LE:32:default"
base = "0x8000"
fixture = "crates/unlace-cli/tests/fixtures/c28x/addb_lret.bin"

[[family.function]]
test = "c28x_add_immediate_and_return_decompiles"
address = "0x8000"
xfail = "reads past the 16-byte image: \"Unable to load 16 bytes at r0x00008008\" (also on main at a16f4c0c42)"

# The native RCA CDP1802 language (SCRT variant) decompiles a raw image: a
# store-increment loop through R1 closed by BNZ, returning with SEP R5.
[[family]]
name = "cdp1802"
language = "CDP1802:BE:16:SCRT"
base = "0x0"
fixture = "crates/unlace-cli/tests/fixtures/cdp1802/fill_loop.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "cdp1802_fill_loop_decompiles"
address = "0x0"
expect = [
    "(char *)0x1000",  # R1 is built from PHI/PLO
    "do {",  # the BNZ loop is recovered
]

# The CLIPPER language (written from the C300 data book) decompiles a
# hand-assembled raw image of four routines.
