[package]
autotests = false
name = "unlace-decomp"
description = "unlace Rust port: the decompiler core (DECCORE + unlace_* stage model)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
unlace-base.workspace = true
unlace-num.workspace = true
unlace-sleigh.workspace = true
unlace-middle.workspace = true
unlace-lift.workspace = true
unlace-structure.workspace = true
unlace-bandb-base.workspace = true
unlace-bandb-core.workspace = true
unlace-bandb.workspace = true
unlace-emit.workspace = true
thiserror.workspace = true
smallvec.workspace = true
slotmap.workspace = true

[dev-dependencies]
unlace-stagefile.workspace = true
unlace-slacomp.workspace = true
# Verifier-only: the datatest <stringmatch> engine (item w10-structure-printbody).
regex = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std", "preserve_order"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "actionprof_unwind"
path = "tests/actionprof_unwind.rs"

[[test]]
name = "verify_w6_s4_fspec_2_r2"
path = "tests/verify_w6_s4_fspec_2_r2.rs"

[[test]]
name = "verify_w8_sig_pack"
path = "tests/verify_w8_sig_pack.rs"
