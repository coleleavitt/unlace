# The XML wrapper only provides the harness architecture. The script loads
# the original GCC MIPS32r2 big-endian O32 shared object
# tests/fixtures/mips-import-flow/flow-mips32r2-be-local-plain.so, whose `.MIPS.stubs`
# entries load the lazy resolver, save ra in t7, call the resolver with
# `jalr t9` and pass the dynamic-symbol index in the delay slot.
#
# Flow keeps the resolver call and ends the stub with a return after it,
# instead of decoding it as an ordinary call whose fall-through reaches the
# next stub.

[image]
arch = 'MIPS:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '03e0000800000000'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/mips-import-flow/flow-mips32r2-be-local-plain.so',
    'read symbols',
    'load addr 0x1190',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "STUBTAILCALL: the resolver call is the stub's tail call"
count = 1
literal = 'return (char *)(**(code **)(v1 + -0x7ff0))();'

[[match]]
name = 'STUBTAILCALL: the resolver call never falls through into the next stub'
count = 0
literal = 'fall-through reached the next function entry'

[[match]]
name = 'STUBTAILCALL: no pass treats the resolver as an indirect branch'
count = 0
literal = 'jump-as-call'
