[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'add8' },
    { space = 'ram', offset = '0x100020', name = 'sub64' },
    { space = 'ram', offset = '0x100040', name = 'mul32' },
    { space = 'ram', offset = '0x100060', name = 'negate64' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '89f84000f0c3'

[[image.bytes]]
space = 'ram'
offset = '0x100020'
readonly = true
hex = '4889f84829f0c3'

[[image.bytes]]
space = 'ram'
offset = '0x100040'
readonly = true
hex = '89f80fafc6c3'

[[image.bytes]]
space = 'ram'
offset = '0x100060'
readonly = true
hex = '4889f848f7d8c3'

[script]
commands = [
    'option outlang rust',
    'map prototype add8 uint1 add8(uint1 left,uint1 right);',
    'map prototype sub64 int8 sub64(int8 left,int8 right);',
    'map prototype mul32 uint4 mul32(uint4 left,uint4 right);',
    'map prototype negate64 uint8 negate64(uint8 value);',
    'load function add8',
    'decompile',
    'print C',
    'load function sub64',
    'decompile',
    'print C',
    'load function mul32',
    'decompile',
    'print C',
    'load function negate64',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/rust_integer_conversions_x86_64',
    'read symbols',
    'option outlang rust',
    'map prototype as_unsigned8 uint1 as_unsigned8(int1 value);',
    'map prototype as_signed16 int2 as_signed16(uint2 value);',
    'map prototype mixed_add32 uint4 mixed_add32(uint4 left,int4 right);',
    'map prototype inplace64 int8 inplace64(int8 left,uint8 right);',
    'map prototype call_unsigned int8 call_unsigned(uint8 value);',
    'map prototype negative_mask uint8 negative_mask(int8 value);',
    'map prototype counted_unsigned uint8 counted_unsigned(uint8 value);',
    'load function mixed_add32',
    'decompile',
    'print C',
    'load function as_unsigned8',
    'decompile',
    'print C',
    'load function as_signed16',
    'decompile',
    'print C',
    'load function inplace64',
    'decompile',
    'print C',
    'load function call_unsigned',
    'decompile',
    'print C',
    'load function negative_mask',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/rust_integer_context_x86_64',
    'read symbols',
    'option outlang rust',
    'map prototype isolated_bit uint8 isolated_bit(uint8 n);',
    'map prototype shift_again uint8 shift_again(uint8 n,uint8 m);',
    'map prototype accumulate_calls int8 accumulate_calls(int8 acc,uint8 step,uint4 count);',
    'map prototype mixed_sub_less uint8 mixed_sub_less(uint8 a,int8 b,uint8 c);',
    'map prototype mixed_sub_left uint8 mixed_sub_left(uint8 a,int8 b,uint8 n);',
    'map prototype counted_unsigned uint8 counted_unsigned(uint8 value);',
    'load function isolated_bit',
    'decompile',
    'print C',
    'load function shift_again',
    'decompile',
    'print C',
    'load function accumulate_calls',
    'decompile',
    'print C',
    'load function mixed_sub_less',
    'decompile',
    'print C',
    'load function mixed_sub_left',
    'decompile',
    'print C',
]

[[match]]
name = 'Rust signed byte return preserves bits as unsigned'
count = 1
literal = 'return value as u8;'

[[match]]
name = 'Rust unsigned short return preserves bits as signed'
count = 1
literal = 'return value as i16;'

# Check the four fixed-width operations immediately before the mixed addition.
[[match]]
name = 'Rust mixed word addition converts its signed operand'
count = 1
regex = [
    '^unsafe fn add8\(',
    '^\{$',
    '^\s*return u8::wrapping_add\((left,right|right,left)\);$',
    '^\}$',
    '^$',
    '^$',
    '^#\[allow\(',
    '^unsafe fn sub64\(',
    '^\{$',
    '^\s*return i64::wrapping_sub\(left,right\);$',
    '^\}$',
    '^$',
    '^$',
    '^#\[allow\(',
    '^unsafe fn mul32\(',
    '^\{$',
    '^\s*return u32::wrapping_mul\((left,right|right,left)\);$',
    '^\}$',
    '^$',
    '^$',
    '^#\[allow\(',
    '^unsafe fn negate64\(',
    '^\{$',
    '^\s*return u64::wrapping_neg\(value\);$',
    '^\}$',
    '^$',
    '^$',
    '^#\[allow\(',
    '^unsafe fn mixed_add32\(',
    '^\{$',
    '^\s*return u32::wrapping_add\(right as u32,left\);$',
    '^\}$',
]

[[match]]
name = 'Rust mixed wide addition restores its signed result'
count = 1
literal = 'return u64::wrapping_add(left as u64,right) as i64;'

[[match]]
name = 'Rust converted call return evaluates the call once'
count = 1
literal = 'return counted_unsigned(value) as i64;'

[[match]]
name = 'Rust bitwise mask preserves its full unsigned bits'
count = 1
literal = 'return value as u64 & 0xffffffffffffff7f;'

[[match]]
name = 'Rust literal shift keeps its full source width'
count = 1
literal = 'return ::core::convert::identity::<i64>(1 << (n as u8 & 0x3f)) as u64;'

[[match]]
name = 'Rust nested shift retains context through an existing cast'
count = 1
literal = 'return (::core::convert::identity::<i64>(1 << (n as u8 & 0x3f)) as u64) >> (m as u8 & 0x3f);'

[[match]]
name = 'Rust loop conversion keeps one callback evaluation'
count = 1
literal = 'acc = i64::wrapping_add(acc,counted_unsigned(step) as i64);'

[[match]]
name = 'Rust cast at the end of subtraction preserves comparison parsing'
count = 1
literal = 'return (u64::wrapping_sub(a,b as u64) < c) as u64;'

[[match]]
name = 'Rust cast at the end of subtraction preserves shift parsing'
count = 1
literal = 'return u64::wrapping_sub(a,b as u64) << (n as u8 & 0x3f);'
