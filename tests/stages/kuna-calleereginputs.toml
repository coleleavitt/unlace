[[match]]
name = "CALLEEREGINPUTS #1: off, the constructor is handed v's fields"
count = 1
literal = 'sub_401020(a0,a1,0);'

[[match]]
name = 'CALLEEREGINPUTS #2: off, the method reached through a stub gets nothing'
count = 1
literal = 'sub_4010a8()'

[[match]]
name = 'CALLEEREGINPUTS #3: default, the constructor gets this and nothing else'
count = 1
regex = '^  sub_401020\(v[0-9]+\);'

[[match]]
name = 'CALLEEREGINPUTS #4: default, the method reached through a stub gets this'
count = 1
regex = 'sub_4010a8\(&v[0-9]+\)'

[[match]]
name = 'CALLEEREGINPUTS #5: default, the constructed field is read back'
count = 1
regex = '\+ \(float10\)v[0-9]+\[0\]\);'

[[match]]
name = 'CALLEEREGINPUTS #6: off, forward hands obj_set only the stack argument'
count = 1
regex = '^  sub_401000\(a0\);'

[[match]]
name = 'CALLEEREGINPUTS #7: default, forward takes this in ECX'
count = 1
regex = '^void forward\(unsigned int a0,unsigned int a1\)'

[[match]]
name = 'CALLEEREGINPUTS #8: default, forward passes its own this through and keeps the stack argument'
count = 1
regex = '^  sub_401000\(a0,a1\);'

[[match]]
name = 'CALLEEREGINPUTS #9: off, inherited hands obj_set only 5'
count = 1
regex = '^  sub_401000\(5\);'

[[match]]
name = 'CALLEEREGINPUTS #10: default, inherited passes the inherited ESI and keeps 5'
count = 1
regex = '^  sub_401000\(v[0-9]+,5\);'

[[match]]
name = 'CALLEEREGINPUTS #11: both, reload keeps the cdecl argument whose slot is the next this'
count = 2
regex = '^  sub_4010e0\(a0\);'

[[match]]
name = 'CALLEEREGINPUTS #12: default, reload passes the reloaded slot as this'
count = 1
regex = '^  sub_401000\(v[0-9]+,2\);'

[[match]]
name = 'CALLEEREGINPUTS #13: both, drift keeps the import argument'
count = 2
regex = '^  FooBar\(3\);'

[[match]]
name = 'CALLEEREGINPUTS #14: default, drift passes the local to obj_init'
count = 1
regex = '^  sub_401010\(&[A-Za-z0-9_]+\);'

[[match]]
name = 'CALLEEREGINPUTS #15: default, fastcaller passes ECX and EDX'
count = 1
literal = '= sub_401020(1,2);'

[[match]]
name = 'CALLEEREGINPUTS #16: no call loses its stack arguments to a register the callee reads'
count = 0
regex = 'sub_401000\(\);|sub_4010e0\(\);|FooBar\(\);|sub_401110\(\);'

[[match]]
name = 'CALLEEREGINPUTS #17: both, a callee that sets CX before reading ECX takes no register'
count = 2
regex = '^  sub_401110\(a0\);'

[[match]]
name = 'CALLEEREGINPUTS #18: off, the virtual call gets no receiver'
count = 1
literal = '(*a0 + 8))(5);'

[[match]]
name = 'CALLEEREGINPUTS #19: default, the virtual call gets the object in ECX as this'
count = 2
literal = '(*a0 + 8))(a0,5);'

[[match]]
name = 'CALLEEREGINPUTS #20: the COM call keeps its pushed interface in both passes'
count = 2
literal = '(*a0 + 0xc))(a0,7);'

[[match]]
name = 'CALLEEREGINPUTS #21: default, a push ecx that only reserves a float slot does not hide this'
count = 1
literal = '(*a0 + 4))(a0,1,a1);'

[[match]]
name = 'CALLEEREGINPUTS #22: no call takes its object twice'
count = 0
literal = '(a0,a0,'

[[match]]
name = 'CALLEEREGINPUTS #23: both, a C table call the caller cleans up after gets no receiver'
count = 2
literal = '(*a0 + 0x10))(5);'

[[match]]
name = 'CALLEEREGINPUTS #24: both, a COM call pushing the register ECX copies keeps one interface'
count = 2
literal = '(*a0 + 0x14))(a0,7);'

[[match]]
name = 'CALLEEREGINPUTS #25: default, with C types the virtual call is made through a function pointer type'
count = 1
literal = '(**(void (**)(int *,unsigned int))(*a0 + 8))(a0,5);'

[[match]]
name = 'CALLEEREGINPUTS #26: both, COM calls through a register copied from ECX before earlier calls keep one interface'
count = 2
regex = '\(\*v[0-9]+ \+ 0x18\)\)\(v[0-9]+,v[0-9]+\);'

[[match]]
name = 'CALLEEREGINPUTS #27: both, a C table call through a register copied from ECX before a call gets no receiver'
count = 2
regex = '\(\*v[0-9]+ \+ 8\)\)\(5\);'

[[match]]
name = "CALLEEREGINPUTS #28: off, the call with ECX copied from the vtable's register gets no receiver"
count = 1
literal = '(*a0 + 0x24))(6);'

[[match]]
name = 'CALLEEREGINPUTS #29: default, ECX copied from the register the vtable is then loaded from passes this'
count = 1
literal = '(*a0 + 0x24))(a0,6);'

[[match]]
name = 'CALLEEREGINPUTS #30: both, a GCC __cdecl member whose this is stored at [esp+4] behind the hidden return pointer gets no receiver'
count = 2
literal = '(*a1 + 0x28))(a0,a1);'

[[match]]
name = "CALLEEREGINPUTS #31: off, ECX copied from the vtable's register after the pushes gets no receiver"
count = 1
literal = '(*a0 + 0x30))(6);'

[[match]]
name = "CALLEEREGINPUTS #32: default, ECX copied from the vtable's register after the pushes passes this"
count = 1
literal = '(*a0 + 0x30))(a0,6);'

[[match]]
name = 'CALLEEREGINPUTS #33: both, ECX loaded with another object after the vtable gets no receiver'
count = 2
literal = '(*a0 + 0x2c))(6);'

[[match]]
name = 'CALLEEREGINPUTS #34: off, the virtual call before another call gets no receiver'
count = 1
literal = '(*a0 + 0x34))(7);'

[[match]]
name = 'CALLEEREGINPUTS #35: default, a frame pop after a later call does not hide this'
count = 1
literal = '(*a0 + 0x34))(a0,7);'

[[match]]
name = "CALLEEREGINPUTS #36: off, the virtual call yielding the next call's object gets no receiver"
count = 1
literal = '(*a0 + 0x38))(1'

[[match]]
name = 'CALLEEREGINPUTS #37: default, a later callee popping the earlier pushes does not hide this'
count = 1
literal = '(*a0 + 0x38))(a0,'

[[match]]
name = 'CALLEEREGINPUTS #38: off, the virtual call under an SEH frame gets no receiver'
count = 1
literal = '[7] + 0x3c))(7'

[[match]]
name = 'CALLEEREGINPUTS #39: default, the pop after the SEH unlink does not hide this'
count = 1
literal = '[7] + 0x3c))(((int4 **)a0)[7],7'

[[match]]
name = 'CALLEEREGINPUTS #40: both, a C table call whose cleanup is deferred past the next call gets no receiver'
count = 2
literal = '(*a0 + 0x40))(5);'
