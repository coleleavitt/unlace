# Two calls pass stack arguments through a copy of %esp (clang -O0), then a
# variable-size allocation saves %esp in a frame slot, and after it %esp is
# restored from that slot before a third call:
#
#     static_frame(n): reg(1, n); reg(0, n); reg(n);
#     later_vla(n):    reg(1, n); reg(0, n); { char a[n]; a[0] = 7; } reg(n);
#
# When call inputs are scored, the third call's argument store still goes
# through the restored stack pointer, so the alias gather recorded it as a
# pointer at -0x2c and every slot above it as aliased: later_vla printed
# reg(1) for reg(1, n). That pointer is the stack pointer plus constants
# through the frame slot, used only as the store's address, so it touches
# only its own four bytes. Hand-assembled; reg is a ret stub.

[image]
arch = 'x86:LE:32:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'static_frame' },
    { space = 'ram', offset = '0x100080', name = 'later_vla' },
    { space = 'ram', offset = '0x100100', name = 'reg' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = ''

[script]
commands = [
    'parse line extern uint4 reg(uint4 count, ...);',
    'parse line extern void static_frame(uint4 n);',
    'parse line extern void later_vla(uint4 n);',
    'lo fu static_frame',
    'decompile',
    'print C',
    'lo fu later_vla',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'x86-directalias #1: both functions pass n to the first call'
count = 2
literal = 'reg(1,n);'

[[match]]
name = 'x86-directalias #2: no first call loses its argument'
count = 0
literal = 'reg(1);'

[[match]]
name = 'x86-directalias #3: the call after the restore keeps its argument'
count = 2
literal = 'reg(n);'
