]

[[match]]
name = 'c preserves signed_int8 extraction'
count = 1
literal = 'return (int1)make_pair(a,b).second;'

[[match]]
name = 'c preserves signed_int16 extraction'
count = 1
literal = 'return (int2)make_pair(a,b).second;'

[[match]]
name = 'c preserves signed_int32_wide extraction'
count = 1
literal = 'return (int4)make_pair(a,b).second;'

[[match]]
name = 'c preserves shift32 extraction'
count = 1
literal = 'return (uint4)(make_unsigned(a,b).second >> 0x20);'

[[match]]
name = 'go preserves signed_int8 extraction'
count = 1
literal = 'return int8(make_pair(a,b).second)'

[[match]]
name = 'go preserves signed_int16 extraction'
count = 1
literal = 'return int16(make_pair(a,b).second)'

[[match]]
name = 'go preserves signed_int32_wide extraction'
count = 1
literal = 'return int64(int32(make_pair(a,b).second))'

[[match]]
name = 'go preserves shift32 extraction'
count = 1
literal = 'return uint32(make_unsigned(a,b).second >> 0x20)'

[[match]]
name = 'rust preserves signed_int8 extraction'
count = 1
literal = 'return make_pair(a,b).second as i8;'

[[match]]
name = 'rust preserves signed_int16 extraction'
count = 1
literal = 'return make_pair(a,b).second as i16;'

[[match]]
name = 'rust preserves signed_int32_wide extraction'
count = 1
literal = 'return (make_pair(a,b).second as i32) as i64;'

[[match]]
name = 'rust preserves shift32 extraction'
count = 1
literal = 'return (make_unsigned(a,b).second >> 0x20) as u32;'

[[match]]
name = 'C and Rust field casts respect diagnostic suppression'
count = 2
regex = '^  return make_pair\(a,b\)\.second;'

[[match]]
name = 'Go field conversions respect diagnostic suppression'
count = 1
regex = '^  return int64\(make_pair\(a,b\)\.second\)$'
