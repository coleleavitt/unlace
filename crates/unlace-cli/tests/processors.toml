fixture = "crates/unlace-cli/tests/fixtures/aarch64/neon_intrinsics.bin"
forbid = ["NEON_", "a64_TBL"]

# `fixtures/aarch64/neon_intrinsics.c` (clang 22 -O2, armv8-a+crypto), `.text` only: the
# SLEIGH NEON user ops print as their ACLE intrinsics on ACLE vector types (option neonintrin).
[[family.function]]
test = "aarch64_neon_acle_tbl"
address = "0x0"
expect = ["uint8x16_t sub_0(uint8x16_t a0,uint8x16_t a1)", "return vqtbl1q_u8(a0,a1);"]

[[family.function]]
test = "aarch64_neon_acle_qadd"
address = "0x8"
expect = ["return vqaddq_s16(a0,a1);"]

[[family.function]]
test = "aarch64_neon_acle_rshr"
address = "0x30"
expect = ["return vrshrq_n_s32(a0,3);"]

[[family.function]]
test = "aarch64_neon_acle_aes"
address = "0x24"
expect = ["vaeseq_u8(a0,a1)", "return vaesmcq_u8(v1);"]

[[family]]
name = "aarch64_neon_fused"
language = "AARCH64:LE:64:v8A"
base = "0"
fixture = "crates/unlace-cli/tests/fixtures/aarch64/neon_intrinsics.bin"
args = ["--option", "neonintrin", "all"]

# With `neonintrin all` the lane-wise float multiply and add and the scalar splat fuse.
[[family.function]]
test = "aarch64_neon_fused_fma"
address = "0x18"
expect = ["return vaddq_f32(vmulq_f32(a0,a1),a2);"]

[[family.function]]
test = "aarch64_neon_fused_dup"
address = "0x4c"
expect = ["return vdupq_n_s32(a0);"]

# Option carryuse: Xtensa has no carry flag, so a 64-bit add branches on the low sum
# (add a2,a2,a4; bgeu a2,a4,1f; addi a3,a3,1); the returned sum keeps its low word.
[[family]]
name = "xtensa_gcc_carryuse"
loader = "auto"
args = ["--option", "carryuse", "on"]
fixture = "crates/unlace-cli/tests/fixtures/xtensa/wide.o"
forbid = ["void w_"]

[[family.function]]
test = "xtensa_carryuse_add_const"
address = "w_add7"
expect = ["return "]

[[family.function]]
test = "xtensa_carryuse_add"
address = "w_add"
expect = ["return "]

[[family.function]]
test = "xtensa_carryuse_mul_wide"
address = "w_mul3"
expect = ["__umulsidi3(", "return "]

[[family.function]]
test = "xtensa_carryuse_call8_result"
address = "w_call7"
expect = ["ext64(", "return "]

# The OakDSP languages are TeakLite II's module restricted to Oak's encodings (tools/gen_oakdsp.py).
[[family]]
name = "teaklite_oakdsp"
language = ["teak:LE:16:default", "teak:LE:16:modulo", "oakdsp:LE:16:default", "oakdsp:LE:16:modulo"]
base = "0x1000"
image = "teak_oak_acc_store"

[[family.function]]
test = "teak_oak_accumulator_store_decompiles"
address = "0x1000"
expect = ["*v1 = 8;"]

[[family]]
name = "oakdsp"
language = ["oakdsp:LE:16:default", "oakdsp:LE:16:modulo"]
base = "0x1000"
image = "oakdsp_acc_to_pointer"

[[family.function]]
test = "oakdsp_accumulator_register_move_decompiles"
address = "0x1000"
expect = ["= 0x21;"]

# TMS320C1x: a BANZ loop that sums eight words through AR0 (*+) while AR1 counts. ARP and DP are
# flow context, so the store is a fixed address and the counter a fixed register.
[[family]]
name = "tms320c1x"
language = "TMS320C1x:BE:16:default"
base = "0x0"
image = "tms320c1x_sum"
forbid = ["halt_baddata"]

[[family.function]]
test = "tms320c1x_banz_sum"
address = "0x0"
expect = [
    "} while (",    # BANZ on AR1 closes the loop
    "dat_20 = ",    # SACL 0x10 (word 0x10 = byte 0x20) on page 0
]

# NEC 78K0: a call into a routine that adds two immediates and stores the sum to an absolute
# address, and a BNZ loop (0x20). The 78K0S language has different opcode bytes and is not run here.
[[family]]
name = "k78"
language = "78K0:LE:16:default"
base = "0x0"
image = "k78_routines"
forbid = ["halt_baddata"]

[[family.function]]
test = "k78_call_reaches_store_routine"
address = "0x0"
expect = ["sub_10();"]

[[family.function]]
test = "k78_immediate_add_then_absolute_store"
address = "0x10"
expect = ["dat_8000 = 8;"]

[[family.function]]
test = "k78_bnz_loop"
address = "0x20"
expect = ["} while ("]

[[family]]
name = "aarch64_svc_names"
language = "AARCH64:LE:64:v8A"
base = "0"
fixture = "crates/unlace-cli/tests/fixtures/aarch64/svc_syscalls.bin"
args = ["--option", "syscallregs", "on"]
forbid = ["CallSupervisor"]

# `fixtures/aarch64/svc_syscalls.c`, `.text` only: a Linux `svc #0` write (x8 = 64), a
# Darwin `svc #0x80` write (x16 = 4) and Mach trap (x16 = -28), each wrapper passing its
# own parameters in place (option syscallnames).
[[family.function]]
test = "aarch64_svc_linux_write"
address = "0x0"
expect = ["return sys_write(a0,a1,a2);"]

[[family.function]]
test = "aarch64_svc_darwin_write"
address = "0x1c"
expect = ["return sys_write(a0,a1,a2);"]

[[family.function]]
test = "aarch64_svc_mach_trap"
address = "0x28"
expect = ["return task_self_trap();"]

[[family]]
name = "arm_svc_names"
language = "ARM:LE:32:v8"
base = "0"
