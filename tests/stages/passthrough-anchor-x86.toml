[script]
commands = [
    'option passthrough off',
    'lo fu d3',
    'decompile',
    'print C',
    'option passthrough on',
    'lo fu d3',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'passthrough-anchor-x86 #1: the frame locals are no arguments of the first call'
count = 2
literal = 'xprintf(0x401082);'

[[match]]
name = 'passthrough-anchor-x86 #2: d3 gains no parameter from the forwarded registers'
count = 2
literal = 'void d3(void)'
