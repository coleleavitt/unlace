[[match]]
name = 'calleenamedlocals #1: the representative is declared in every pass'
count = 3
regex = '^  Node \*object;( // [^\n]+)?$'

[[match]]
name = 'calleenamedlocals #2: the member is declared under its own name in every pass'
count = 3
regex = '^  Node \*object_00;( // [^\n]+)?$'

[[match]]
name = 'calleenamedlocals #3: the representative is loaded, consumed and flagged'
count = 3
literal = [
    'object = *representatives;',
    'consume(object);',
    'object->skip = 1;',
]

[[match]]
name = 'calleenamedlocals #4: the inner loop loads each member into the member variable'
count = 3
regex = [
    'object_00 = \*(v2|Var2);',
    'if \(!object_00\) goto',
]

[[match]]
name = 'calleenamedlocals #5: the flag is cleared through the representative after the loop'
count = 3
literal = [
    'representatives = &representatives[1];',
    'object->skip = 0;',
]

[[match]]
name = 'calleenamedlocals #6: a member never overwrites the representative'
count = 0
regex = 'object = \*(v2|Var2);'

[[match]]
name = 'calleenamedlocals #7: the cleared flag never lands on a member'
count = 0
literal = 'object_00->skip = 0;'

[[match]]
name = 'calleenamedlocals #8: k1 builds y in its own variable and passes x second'
count = 3
regex = [
    'pt = \*px;',
    'pt_00.b = d \* 0xb;',
    'pt_00.a = c \* 7;',
    'take\(pt_00\);',
    'take\(pt\);',
]

[[match]]
name = "calleenamedlocals #9: k1 never stores y's fields into x"
count = 0
regex = '^ +pt\.(a|b) = '

[[match]]
name = 'calleenamedlocals #10: m1 and m2 build and pass the local, not the global'
count = 9
regex = [
    '^ +obj_1\.b = d \* (0xb|5);',
    'obj_1\.a = c \* (7|3);',
    'put\(obj_1,(1|2)\);',
]

[[match]]
name = 'calleenamedlocals #11: the global is only read, never written or passed'
count = 0
regex = '^ +obj\.(a|b) = |put\(obj,'

[[match]]
name = 'calleenamedlocals #12: both renamed slots are declared in every pass'
count = 3
regex = '^  int8 w_1;'

[[match]]
name = "calleenamedlocals #13: the second slot's address follows its new name"
count = 3
literal = [
    'w_1 = n * 5;',
    'touchl(&w_1);',
    'return w + w_1 * 100;',
]

[[match]]
name = 'calleenamedlocals #14: gc declares the local under a suffix and passes it'
count = 3
regex = '^  Item \*node_1;( // [^\n]+)?$'

[[match]]
name = "calleenamedlocals #15: gc's array accesses keep the global's name"
count = 3
regex = '\*\(int4 \*\)&node\[\(\(uint4\)(v1|uVar1) & 7\) \* 8UL \+ 4\] = \*\(int4 \*\)&node\['

[[match]]
name = 'calleenamedlocals #16: the global is never indexed through the local'
count = 0
literal = 'node_1['

[[match]]
name = "calleenamedlocals #17: the slot's narrow views follow its renamed declaration"
count = 3
literal = [
    'perf_ret_1 = small(1,0x14);',
    'small_ret = (int4)perf_ret_1;',
    'perf_ret_1._2_2_ = big(2,0x1e);',
    'big_ret = CONCAT44(perf_ret_1._4_4_,(unsigned int)perf_ret_1);',
]

[[match]]
name = 'calleenamedlocals #18: the slot renamed v1 keeps it and the other takes a fresh default'
count = 3
literal = [
    'v3 = n * 3;',
    'touchl(&v3);',
    'v1 = n * 5;',
    'touchl(&v1);',
    'return v3 + v1 * 100;',
]

[[match]]
name = "calleenamedlocals #19: no slot is declared under a suffix of the caller's v1"
count = 0
literal = 'v1_1'
