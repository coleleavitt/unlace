base = "0x1000"
fixture = "crates/unlace-cli/tests/fixtures/hexagon_loop/loop.bin"
forbid = ["halt_baddata", "(a1 <= 1);", "(v3 <= 1);"]

[[family.function]]
test = "hexagon_loop_endloop0_back_edge"
address = "0x1000"
expect = [
    "while( true ) {",
    "v2 += *a0;",
    "if (a1 <= 1) break;",
]

[[family.function]]
test = "hexagon_loop_endloop1_back_edge"
address = "0x1020"
expect = [
    "while( true ) {",
    "v2 ^= *a0;",
    "if (v3 <= 1) break;",
]

