# unlace infrastructure test: the LLM-settable assertion catalog (`stage catalog`).
#
# This is the discovery surface an external operator (human or LLM) reads to choose
# which sub-phase assertion to flip and how (then flips it via the
# unlace.decompile option/kassert flags). The catalog is a single C++
# table (kuna_stages.cc settableTable) emitted as JSON; `python -m unlace.catalog`
# parses it and `docs/options.md` is generated from the same registry.
#
# These assertions pin the JSON contract the Python tooling depends on:
#   - the array opens (well-formed JSON the catalog parser balances);
#   - representative settables are present with their post-DIV-2 shipped defaults
#     (compareform=original, arraynotation=on) and phase/sub-phase address;
#   - the destructive option is flagged (default + destructive marker) so an
#     agent judges it before changing it, and a target-gated default is on;
#   - the live `current` value is joined in when a program is loaded.
#
# Reuses the GH-558 bytes as a loadable program for the `current` field.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'gh558' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '83ff087f06b801000000c331c0c3'

[script]
commands = [
    'parse line extern int4 gh558(int4 x);',
    'lo fu gh558',
    'phase catalog',
    'phase catalog returnpair',
    'option fast_funcdisc on',
    'phase catalog fast_funcdisc',
    'phase catalog armframes',
    'option armframes on',
    'phase catalog armframes',
    'phase catalog fid',
    'option fid strict',
    'phase catalog fid',
    'phase catalog bytearrayc',
    'option bytearrayc on',
    'phase catalog bytearrayc',
    'quit',
]

[[match]]
name = 'UNLACE-CATALOG #1: compareform documented with its post-DIV-2 default and P3 address'
count = 1
literal = '"option": "compareform", "values": ["canonical", "original"], "default": "original", "current": "original", "destructive_as_default": false, "phase": "P3"'

[[match]]
name = 'UNLACE-CATALOG #2: arraynotation documented as default-on, P9 pointer-notation'
count = 1
literal = '"option": "arraynotation", "values": ["on", "off"], "default": "on", "current": "on", "destructive_as_default": false, "phase": "P9"'

[[match]]
name = 'UNLACE-CATALOG #3: returnpair flagged destructive-as-default so an agent keeps it opt-in'
count = 2
literal = '"option": "returnpair", "values": ["pair", "single"], "default": "pair", "current": "pair", "destructive_as_default": true'

[[match]]
name = 'UNLACE-CATALOG #4: v850indirectbranch is a V850-gated default ()'
count = 1
literal = '"option": "v850indirectbranch", "values": ["on", "off"], "default": "on", "current": "on", "destructive_as_default": false'

[[match]]
name = 'UNLACE-CATALOG #5: each settable carries symptom-keyed use_when guidance for the operator'
# One per catalog row: every registry row and each of the eight single-option queries.
count = { settables = {}, plus = 8 }
literal = '"use_when": '

[[match]]
name = 'UNLACE-CATALOG #6: angr-derived features carry source_decompiler provenance'
count = { settables = { source_decompiler = "angr" } }
literal = '"source_decompiler": "angr"'

[[match]]
name = 'UNLACE-CATALOG #7: change_kind structure-recovery tags the structure reconstructors'
count = { settables = { change_kind = "structure-recovery" } }
literal = '"change_kind": "structure-recovery"'

[[match]]
name = 'UNLACE-CATALOG #8: the opt-in-tool change_kind counts explicitly opted transformations (one more for the returnpair query)'
count = { settables = { change_kind = "opt-in-tool" }, plus = 1 }
literal = '"change_kind": "opt-in-tool"'

[[match]]
name = 'UNLACE-CATALOG #9: every settable carries a machine-readable change_kind so an LLM can judge default-on eligibility'
count = { settables = {}, plus = 8 }
literal = '"change_kind": '

[[match]]
name = 'UNLACE-CATALOG #10: fast whole-project discovery is default-off but live-toggleable'
count = 1
literal = '"option": "fast_funcdisc", "values": ["on", "off"], "default": "off", "current": "on", "destructive_as_default": false, "phase": "P1"'

[[match]]
name = 'UNLACE-CATALOG #12: scalar ARM hard-float inputs are a VFP-ABI-gated default'
count = 1
literal = '"option": "armfloatargs", "values": ["on", "off"], "default": "on", "current": "on"'

[[match]]
name = 'UNLACE-CATALOG #13: validated A32 inventory frames are the default'
count = 2
literal = '"option": "armframes", "values": ["inventory", "on", "off"], "default": "inventory", "current": "inventory"'

[[match]]
name = 'UNLACE-CATALOG #14: full ARM frames are explicitly enabled'
count = 1
literal = '"option": "armframes", "values": ["inventory", "on", "off"], "default": "inventory", "current": "on"'

[[match]]
name = 'UNLACE-CATALOG #15: every registry row plus eight individual queries'
count = { settables = {}, plus = 8 }
literal = '"option": '

[[match]]
name = 'global array anchoring is default off'
count = 1
literal = '"option": "globalarrayanchor", "values": ["on", "off"], "default": "off", "current": "off"'

[[match]]
name = 'UNLACE-CATALOG #16: standard C byte-array rendering is explicitly opt-in'
count = 2
literal = '"option": "bytearrayc", "values": ["on", "off"], "default": "off", "current": "off"'

[[match]]
name = 'UNLACE-CATALOG #17: standard C byte-array rendering exposes its live state'
count = 1
literal = '"option": "bytearrayc", "values": ["on", "off"], "default": "off", "current": "on"'

[[match]]
name = 'UNLACE-CATALOG FID defaults off'
count = 2
literal = '"option": "fid", "values": ["on", "off", "strict"], "default": "off", "current": "off"'

[[match]]
name = 'UNLACE-CATALOG FID strict is live'
count = 1
literal = '"option": "fid", "values": ["on", "off", "strict"], "default": "off", "current": "strict"'
