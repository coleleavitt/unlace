# SysV XMM6 is volatile. Keep this spill-like sequence because the helper
# reads its bytes through an explicit pointer argument.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'fixture_sysv_observed_lane' },
    { space = 'ram', offset = '0x401020', name = 'fixture_read_saved_lane' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = '4883ec180f293424488d3c24e80f0000000f283424660f7ef04883c418c39090'

[[image.bytes]]
space = 'ram'
offset = '0x401020'
hex = '488b07c3'

[script]
commands = [
    'map prototype 0x401000 unsigned long long fixture_sysv_observed_lane(void)',
    'map prototype 0x401020 unsigned long long fixture_read_saved_lane(const unsigned long long *source)',
    'option stackviews on',
    'lo fu fixture_sysv_observed_lane',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'SAVED-XMM-SYSV fixture #1: a volatile-register spill observed by a direct helper remains mapped'
min = 1
max = 2
literal = 'stack - 0x18'
