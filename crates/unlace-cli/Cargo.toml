[package]
name = "unlace-cli"
version.workspace = true
edition.workspace = true

[dependencies]
unlace-ir = { workspace = true }
unlace-loader = { workspace = true, features = ["http-symfetch"] }
unlace-lift = { workspace = true }
unlace-passes = { workspace = true }
unlace-struct = { workspace = true }
unlace-output = { workspace = true }
unlace-plugin = { workspace = true }
unlace-lumina = { workspace = true }
unlace-session = { path = "../unlace-session" }
unlace-emu = { path = "../unlace-emu" }
unlace-debugger = { path = "../unlace-debugger" }
unlace-gui = { path = "../unlace-gui" }
unlace-flirt = { path = "../unlace-flirt" }
unlace-idapython = { path = "../unlace-idapython" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smallvec = { workspace = true }
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
regex = "1"
memmap2 = "0.9"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[features]
default = []
# Enable the real iced desktop GUI subcommand. Off by default so cargo
# build/check is fast on hosts that don't ship a GPU stack.
gui-render = ["unlace-gui/render"]
# Enable the Linux ptrace debugger backend behind `unlace dbg`. Linux-only.
dbg-ptrace = ["unlace-debugger/linux-ptrace"]
# Enable IDAPython script execution via pyo3.
python = ["unlace-idapython/python"]

[[bin]]
name = "unlace"
path = "src/main.rs"

[[bench]]
name = "decompile_medium"
harness = false

[[bench]]
name = "spec_suite"
path = "../../benches/spec/suite.rs"
harness = false

[[bench]]
name = "hexrays_throughput"
path = "../../benches/hexrays_comparison/throughput.rs"
harness = false
