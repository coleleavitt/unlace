# kuna issue testcase: an x86-32 function's stack-pointer deltas, solved for
# the calls that pop arguments or do not return (`option spsolve on|off`,
# default on).
#
# Issue:      under a compiler spec whose default model states its extrapop
#             (x86gcc.cspec: __cdecl, 4), every call is taken to pop its
#             return address and nothing else. A callee that pops more, or a
#             call that does not return, leaves two paths reaching a block
#             with different stack pointers: the stack pointer stays a
#             variable, arguments are written through it and calls lose
#             them.
# Stage:      P4 calls - ActionExtraPopSetup (`p4_calls/kuna_spsolve.rs`).
# P0 assert:  option spsolve on|off (default on).
#
# spsolve_elf_i386 (source and build line in spsolve_elf_i386.s):
# caller_sret calls mk, which returns a pair through a hidden pointer and
# ends in `ret 4`, once on one path and twice on the other, then sum on the
# block both reach. caller_ptr calls scale, which ends in `ret 12`, through a
# pointer, and reads its own second argument afterwards. caller_die calls
# die, which leaves through a pointer and never comes back, right before the
# block the other path enters with twelve more bytes reserved.
#
# Pass 1 (`option spsolve off`) reproduces the bug; pass 2 is the default.
# Pass 3 states `option extrapop 4 mk`: the solve keeps a stated extrapop,
# so caller_sret prints as in pass 1.
#
# calleeretpurge (default on) reads mk's `ret 4` itself and fixes
# caller_sret without the solve, so every pass pins it off.

[image]
arch = 'x86:LE:32:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/spsolve_elf_i386',
    'option spsolve off',
    'option calleeretpurge off',
    'read symbols',
    'load function caller_sret',
    'decompile',
    'print C',
    'load function caller_ptr',
    'decompile',
    'print C',
    'load function caller_die',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/spsolve_elf_i386',
    'option calleeretpurge off',
    'read symbols',
    'load function caller_sret',
    'decompile',
    'print C',
    'load function caller_ptr',
    'decompile',
    'print C',
    'load function caller_die',
    'decompile',
    'print C',
    'option extrapop 4 mk',
    'load function caller_sret',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'SPSOLVE #1: off, the stack pointer is a variable in two functions; on, in none; with a stated extrapop 4 for mk, in caller_sret again'
count = 3
literal = '; // esp'

[[match]]
name = 'SPSOLVE #2: off, and on with a stated extrapop 4 for mk, the first call to the aggregate-returning callee loses its arguments'
count = 2
literal = 'mk();'

[[match]]
name = 'SPSOLVE #3: on, it takes the result buffer and the value'
count = 1
regex = 'mk\(v[0-9]+,a0\);'

[[match]]
name = 'SPSOLVE #4: on, the second call takes the other buffer'
count = 1
regex = 'mk\(v[0-9]+,v1\);'

[[match]]
name = 'SPSOLVE #5: off, the call both paths reach takes nothing; on, the first buffer'
count = 1
regex = 'return sum\(v[0-9]+\) \+ v1;'

[[match]]
name = 'SPSOLVE #6: off, the argument read after a callee that pops twelve bytes is an unassigned local'
count = 1
literal = 'return v2 + v3 + v1;'

[[match]]
name = "SPSOLVE #7: on, it is the caller's second parameter"
count = 1
literal = 'return v2 + a1 + v1;'

[[match]]
name = 'SPSOLVE #8: off and on, the call through the pointer keeps its three arguments'
count = 2
literal = '(*dat_804a000)(a0,a1,3);'

[[match]]
name = 'SPSOLVE #9: on, the call that cannot have returned is marked'
count = 1
literal = 'die(); // no-return'

[[match]]
name = 'SPSOLVE #10: off, the argument of the call after it is stored through the stack pointer'
count = 1
regex = '\*\(int4 \*\)&v[0-9]+\[-4\] = v1;'

[[match]]
name = 'SPSOLVE #11: on, it is passed'
count = 1
literal = 'report(v1);'

[[match]]
name = 'SPSOLVE #12: off and on, the call that returns keeps its argument'
count = 2
literal = 'v2 = check(a0);'
