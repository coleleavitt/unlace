[package]
name = "unlace-idb"
description = "IDA databases (.idb/.i64) read into plain values: segments and bytes, functions, names, comments, entry points and the raw type strings (a port of idb-rs's readers)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
flate2.workspace = true
