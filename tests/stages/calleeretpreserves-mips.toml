[script]
commands = [
    'lo fu afterstore2',
    'decompile',
    'print C',
    'lo fu afterbranch',
    'decompile',
    'print C',
    'lo fu aftervoid',
    'decompile',
    'print C',
    'lo fu hiword',
    'decompile',
    'print C',
    'parse line extern int4 hk(int4 x);',
    'lo fu afterstore2',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLEERETPRESERVES-MIPS #1: $v1 is never a pointer local nothing assigns'
count = 0
regex = '^  unsigned int \*v1; // v1$'

[[match]]
name = 'CALLEERETPRESERVES-MIPS #2: the store never reads through it'
count = 0
literal = 'dat_410290 = *v1;'

[[match]]
name = 'CALLEERETPRESERVES-MIPS #3: the callers never lose the parameter'
count = 0
regex = '^void after(store2|branch)\(void\)$'

[[match]]
name = 'CALLEERETPRESERVES-MIPS #4: the store reads p, also with hk declared int'
count = 4
literal = 'dat_410290 = *a0;'

[[match]]
name = 'CALLEERETPRESERVES-MIPS #5: the callers take p, also with hk declared int'
count = 3
regex = '^void after(store2|branch)\(unsigned int \*a0\)$'

[[match]]
name = 'CALLEERETPRESERVES-MIPS #6: a void leaf keeps $v1 too'
count = 1
regex = '^unsigned int aftervoid\(unsigned int \*a0,unsigned int a1\)$'

[[match]]
name = 'CALLEERETPRESERVES-MIPS #7: a callee that writes $v1 still returns it'
count = 1
literal = 'return (int4)((uint8)wide(3) >> 0x20);'
