    'parse line extern char *strcat(char *d,char *s);',
    'parse line extern void wipe(char *s);',
    'lo fu name_len',
    'decompile',
    'print C',
    'lo fu last_char',
    'decompile',
    'print C',
    'lo fu weighted_len',
    'decompile',
