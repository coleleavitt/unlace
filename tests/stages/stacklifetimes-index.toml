[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x0000000000401000', name = 'bounded_index_store' },
    { space = 'ram', offset = '0x0000000000401040', name = 'bounded_index_load' },
    { space = 'ram', offset = '0x0000000000401074', name = 'bounded_byte_store' },
    { space = 'ram', offset = '0x00000000004010b1', name = 'bounded_reverse_store' },
    { space = 'ram', offset = '0x0000000000401100', name = 'unbounded_index_store' },
    { space = 'ram', offset = '0x000000000040113d', name = 'read_pair' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = ''

[script]
commands = [
    'option partialaccess off',
    'parse line typedef struct LifetimePair { int x; int y; } LifetimePair;',
    'parse line extern int read_pair(const struct LifetimePair *pair);',
    'parse line extern int bounded_index_store(unsigned int index);',
    'parse line extern int bounded_index_load(unsigned int index);',
    'parse line extern int bounded_byte_store(unsigned int index);',
    'parse line extern int bounded_reverse_store(unsigned int index);',
    'parse line extern int unbounded_index_store(unsigned int index);',
    'option stackalias off',
    'option stackviews off',
    'lo fu bounded_index_store',
    'decompile',
    'print C',
    'option stackviews on',
    'lo fu bounded_index_store',
    'decompile',
    'print C',
    'lo fu bounded_index_load',
    'decompile',
    'print C',
    'lo fu bounded_byte_store',
    'decompile',
    'print C',
    'lo fu bounded_reverse_store',
    'decompile',
    'print C',
    'lo fu unbounded_index_store',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'stack indices: off and unresolved bounds retain the original array'
count = 2
literal = 'LifetimePair v2 [3];'

[[match]]
name = 'stack indices: four bounded accesses recover one backing object'
count = 4
regex = '^  stack_views_.* v2;'

[[match]]
name = 'stack indices: byte copies start at the whole backing object'
count = 4
literal = '(uint1 *)&v2'

[[match]]
name = 'stack indices: the reverse index keeps its byte displacement'
count = 1
literal = '&v2 + 4) -'

[[match]]
name = 'stack indices: typed calls still use the shared Pair view'
count = 7
literal = 'read_pair(&v2.view_LifetimePair)'
