arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'fetch_add' },
    { space = 'ram', offset = '0x100010', name = 'add_only' },
    { space = 'ram', offset = '0x100020', name = 'release' },
    { space = 'ram', offset = '0x100030', name = 'or_only' },
    { space = 'ram', offset = '0x100040', name = 'xchg' },
