# unlace issue testcase: a `rep movsd` that copies a by-value struct into the
# outgoing argument area with a known count is expanded before the stack is
# heritaged (`p3_dataflow/unlace_repframecopy.rs`, always on; `indexaliasguard
# off` turns it off with the other stack guards).
#
# Issue:      unlace GH-1562 - x86-32 MSVC: a by-value struct argument copied
#             with `rep movsd` makes the call that takes it print with no
#             arguments, and a pushed return address prints as a value.
# Stage:      P3 dataflow - right after the first heritage pass, before the
#             stack's first heritage (`ActionHeritage`).
# P0 assert:  none (a strict fix); one pass.
#
# byval_pe_i386.exe (VC8 /O2, notes in byval_pe_i386.txt), draw (0x401000):
# paint(a, b, 3), then `Rect r = *src` (rep movsd into a local) and
# `fill(r, b)` (`sub esp,0x20; mov edi,esp; rep movsd` into the outgoing
# area). Before: `v9 = 0x401018;` (paint's pushed return address), two
# `while` copy loops and `sub_401070()`. Now fill takes r's eight dwords and
# b, paint keeps its three arguments, and neither the loops nor the return
# address are left.
# repframecopy_pe_i386.exe (clean-room asm, notes in repframecopy_pe_i386.asm):
# ebp_draw (0x401070, frame pointer, a branch before the copies) passes src's
# eight dwords and b to fill8; forward (0x401130) passes its own by-value
# parameter on; the entry (0x401180) passes a global table by value, and its
# other calls keep their pushed arguments. copy_global (0x4010d0, no frame
# slot) is left to `repstring`, which prints it as a memcpy. Left as loops:
# big_pass (0x4010b0, 32 dwords, too large), zero_pass
# (0x4010f0, the copy reads a local a `rep stosd` walks) and loop_fill
# (0x401150, the copy reads a local an indexed loop writes). shift_pass
# (0x401270) moves nine slots at the stack pointer down by one with an
# overlapping copy: fill8 takes 1..8 and 8 (on main the copied slots kept
# their old values). The register-argument callers d_virtual (0x401300),
# d_ptr (0x401340) and d_direct (0x401370) copy a record into a local at the
# bottom of the frame: no call takes it, so each move stays a loop and no
# call gains a stack argument.
# byvalreuse_pe_i386.exe (clean-room, source and recipe in
# byvalreuse_pe_i386.s): byval (0x401000) copies a 32-byte struct into an
# outgoing block that reuses an earlier __cdecl call's 12 bytes of pushes
# (`sub esp,0x14`) and calls a __thiscall method ending in `ret 0x20` whose
# stack effect the purge walk cannot settle: the method takes the eight
# dwords (#14). Three copies whose callee's own returns do not pop the block
# stay loops: cleanup (0x4010d0) calls a __cdecl callee and removes the block
# itself, and keeps reading its second parameter after the call (#15); local
# (0x401100) copies a local at the bottom of the frame before an unrelated
# __cdecl call and reads it back (#16); nested (0x401130) copies f's struct
# and then calls g(0) first, and g takes only its 0 (#17); stray (0x4011d0)
# calls a __cdecl callee whose cold path ends in a call that does not return;
# the walk stops at the int3 padding after that call instead of running on into
# the next function's `ret 0x20` (#643), so nf states no pop, and its reads of
# t.x[0] and t.x[7] bound its arguments at 32 bytes: it takes the eight dwords,
# as `nf(*r)` does in the source (#18); quit (0x401240)
# passes a block to a __stdcall callee (ret 0x20) whose other path ends in
# exit, which takes it while exit is known not to return, and the walk is
# taken again once `noreturn_known` is turned off: it no longer does (#19);
# settle (0x401280) calls the __stdcall note (ret 4, which the walk proves)
# before the block for take: once take's pop is stated every call has one,
# so note's is stated too and the block is read from settle's parameter
# (#20); unsettled (0x4012c0) calls the __stdcall guess first (ret 4, but
# it calls through a pointer, so the walk cannot settle it): stating take's
# pop would leave guess's pop to the solver, whose guess moves the block,
# so it stays a loop (#21).

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/byval_pe_i386.exe',
    'read symbols',
    'load addr 0x401000',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/repframecopy_pe_i386.exe',
    'read symbols',
    'load addr 0x401070',
    'decompile',
    'print C',
    'load addr 0x401130',
    'decompile',
    'print C',
    'load addr 0x401180',
    'decompile',
    'print C',
    'load addr 0x4010b0',
    'decompile',
    'print C',
    'load addr 0x4010d0',
    'decompile',
    'print C',
    'load addr 0x4010f0',
    'decompile',
    'print C',
    'load addr 0x401150',
    'decompile',
    'print C',
    'load addr 0x401270',
    'decompile',
    'print C',
    'load addr 0x401300',
    'decompile',
    'print C',
    'load addr 0x401340',
    'decompile',
    'print C',
    'load addr 0x401370',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/byvalreuse_pe_i386.exe',
    'read symbols',
    'load addr 0x401000',
    'decompile',
    'print C',
    'load addr 0x4010d0',
    'decompile',
    'print C',
    'load addr 0x401100',
    'decompile',
    'print C',
    'load addr 0x401130',
    'decompile',
    'print C',
    'load addr 0x4011d0',
    'decompile',
    'print C',
    'load addr 0x401280',
    'decompile',
    'print C',
    'load addr 0x4012c0',
    'decompile',
    'print C',
    'map function r0x401230 exit',
    'load addr 0x401240',
    'decompile',
    'print C',
    'option noreturn_known off',
    'load addr 0x401240',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'REPFRAMECOPY #1: fill takes the copied struct and b'
count = 1
regex = 'sub_401070\(v[0-9]+ \+ v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+\)'

[[match]]
name = 'REPFRAMECOPY #2: paint keeps its three arguments'
count = 1
literal = 'sub_401050(a0,a1,3)'

[[match]]
name = 'REPFRAMECOPY #3: no pushed return address is printed as a value'
count = 0
regex = '= 0x4010(18|85|8e|9b|a8|b2);'

[[match]]
name = "REPFRAMECOPY #4: src's eight dwords and b reach fill8 through a frame pointer"
count = 1
literal = 'sub_401000(*a0,a0[1],a0[2],a0[3],a0[4],a0[5],a0[6],a0[7],a1);'

[[match]]
name = 'REPFRAMECOPY #5: a by-value parameter is passed on whole'
count = 1
literal = 'sub_401000(a0,a1,a2,a3,a4,a5,a6,a7,7);'

[[match]]
name = 'REPFRAMECOPY #6: a global table passed by value'
count = 1
literal = 'sub_401130(dat_402000,dat_402004,dat_402008,dat_40200c,dat_402010,dat_402014,dat_402018,dat_40201c);'

[[match]]
name = "REPFRAMECOPY #7: the entry's other calls keep their pushed arguments"
count = 1
literal = 'sub_401070(0x402000,2,0);'

[[match]]
name = 'REPFRAMECOPY #8: the twelve frame moves left alone (big_pass, zero_pass stosd and movsd, loop_fill, d_virtual, d_ptr, d_direct, cleanup, local, nested, unsettled, quit without noreturn_known) stay loops, and only those'
count = 12
regex = 'while \(v[0-9]+\) \{'

[[match]]
name = 'REPFRAMECOPY #8b: copy_global, which reaches no frame slot, is a memcpy (repstring)'
count = 1
regex = '^  builtin_memcpy\(a0,&dat_402000,0x10\);'

[[match]]
name = 'REPFRAMECOPY #9: the indexed fill stays a loop'
count = 1
regex = '\} while \(v[0-9]+ < 8\);'

[[match]]
name = 'REPFRAMECOPY #10: an overlapping move at the stack pointer shifts the slots down'
count = 1
literal = 'sub_401000(1,2,3,4,5,6,7,8,8);'

[[match]]
name = 'REPFRAMECOPY #11: the virtual calls after a bottom-of-frame local take no stack argument'
count = 0
regex = '0x58\)\)\([^)]'

[[match]]
name = 'REPFRAMECOPY #12: both virtual calls are kept'
count = 2
regex = '\(code \*\*\)\(\*v[0-9]+ \+ 0x58\)'

[[match]]
name = 'REPFRAMECOPY #13: the register-argument call takes no stack argument after either local'
count = 2
literal = 'sub_4012e0();'

[[match]]
name = "REPFRAMECOPY #14: a block reusing an earlier call's pushes reaches a method whose pop the walk cannot settle"
count = 1
regex = 'sub_401040\(v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+\);'

[[match]]
name = "REPFRAMECOPY #15: a caller's cleanup is not a __cdecl callee's pop, so the caller still reads its own parameter"
count = 1
regex = 'sub_401170\([^)]*\) \+ a1;'

[[match]]
name = 'REPFRAMECOPY #16: a local copied before an unrelated call is read back as the local'
count = 1
regex = 'sub_401190\(1\) \+ v[0-9]+\[1\];'

[[match]]
name = "REPFRAMECOPY #17: the call between a block's copy and its call takes only its own push"
count = 1
literal = 'sub_401190(0))'

[[match]]
name = "REPFRAMECOPY #18: a ret the walk reaches past a call that does not return is not the callee's pop"
count = 1
regex = 'sub_401200\((v[0-9]+,){7}v[0-9]+\) \+ a1;'

[[match]]
name = 'REPFRAMECOPY #19: a pop proven by a no-return name holds only while noreturn_known is on'
count = 1
literal = 'sub_401260(*a0,a0[1],a0[2],a0[3],a0[4],a0[5],a0[6],a0[7]);'

[[match]]
name = "REPFRAMECOPY #20: once a stated pop settles every call, an earlier call's proven pop is stated too"
count = 1
literal = 'sub_401040(*a0,a0[1],a0[2],a0[3],a0[4],a0[5],a0[6],a0[7]);'

[[match]]
name = "REPFRAMECOPY #21: a block whose stated pop would leave an earlier call's pop a guess is not expanded through the misplaced frame"
count = 0
regex = 'sub_401040\(v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+,v[0-9]+\) \+ a0;'
