0100000081c7e00891e8000081c7e00891e820019de3bfa080a6600002800003
01000000f226000081c7e00891e800009de3bfa0b4102005f226000081c7e008
91e8001a9de3bfa0b010200181c7e00893e820029de3bfa0b2100000b4100018
b010001981c7e00893e8001a9de3bfa0b25e4018b140000081c7e00881e80000
'''

