[script]
commands = [
    'parse line extern int4 sinki(int4 x);',
    'parse line extern int4 prf(char *f, ...);',
    'option castimplied off',
    'lo fu argi',
    'decompile',
    'print C',
    'lo fu argl',
    'decompile',
    'print C',
    'lo fu vararg',
    'decompile',
    'print C',
    'lo fu asg',
    'decompile',
    'print C',
    'lo fu ret',
    'decompile',
    'print C',
    'lo fu stacked',
    'decompile',
    'print C',
    'lo fu keepinner',
    'decompile',
    'print C',
    'option castimplied on',
    'lo fu argi',
    'decompile',
    'print C',
    'lo fu argl',
    'decompile',
    'print C',
    'lo fu vararg',
    'decompile',
    'print C',
    'lo fu asg',
    'decompile',
    'print C',
    'lo fu ret',
    'decompile',
    'print C',
    'lo fu stacked',
    'decompile',
    'print C',
    'lo fu keepinner',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'castimplied #1: with the option off a char passed to a declared int4 parameter carries the (int4) C applies itself'
count = 1
literal = 'sinki((int4)a0);'

[[match]]
name = 'castimplied #2: with the option on the argument is passed bare'
count = 1
literal = 'sinki(a0);'

[[match]]
name = 'castimplied #3: a callee with no declared prototype keeps the cast in both passes'
count = 2
literal = 'sinkl((int8)a0);'

[[match]]
name = 'castimplied #4: a varargs argument keeps the cast in both passes'
count = 2
literal = 'prf(a0,(int8)a1);'

[[match]]
name = 'castimplied #5: with the option off a widening assigned to a local declared int8 carries an (int8)'
count = 1
literal = 'v1 = (int8)a0[v2];'

[[match]]
name = 'castimplied #6: with the option on the assignment converts'
count = 1
literal = 'v1 = a0[v2];'

[[match]]
name = 'castimplied #7: with the option off an int4 returned from an int8 function carries an (int8)'
count = 1
literal = 'return (int8)a0;'

[[match]]
name = 'castimplied #8: with the option on the return converts'
count = 1
literal = 'return a0;'

[[match]]
name = 'castimplied #9: with the option off one byte is widened through three casts'
count = 1
literal = '(int4)(uint4)(uint1)to_uchar((int4)a1)'

[[match]]
name = 'castimplied #10: with the option on the widening under (int4) goes and the (uint1) sign change stays'
count = 1
literal = 'a0[(int4)(uint1)to_uchar((int4)a1)]'

[[match]]
name = 'castimplied #11: with the option off the return widens a sign-changed value'
count = 1
literal = 'return (int8)(int4)a0;'

[[match]]
name = 'castimplied #12: with the option on the widening goes and the (int4) sign change stays'
count = 1
literal = 'return (int4)a0;'
