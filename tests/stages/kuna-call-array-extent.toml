[script]
commands = [
    'parse line extern uint4 escaped_output(uint4 seed);',
    'parse line extern void fill_words(uint4 *out, uint4 seed);',
    'parse line extern uint4 bounded_output(uint4 seed);',
    'parse line extern void touch_word(uint4 *out);',
    'load function escaped_output',
    'decompile',
    'print C',
    'option callarrayextent on',
    'decompile',
    'print C',
    'load function bounded_output',
    'decompile',
    'print C',
    'parse line extern uint4 separate_word(uint4 seed);',
    'load function separate_word',
    'decompile',
    'print C',
    'parse line extern uint4 overlapping_output(uint4 seed);',
    'parse line extern uint4 observe_words(uint4 *in);',
    'parse line extern void copy_words(uint4 *in, uint4 *out);',
    'load function overlapping_output',
    'option callarrayextent off',
    'decompile',
    'print C',
    'option callarrayextent on',
    'decompile',
    'print C',
    'parse line extern uint4 looping_output(uint4 seed);',
    'load function looping_output',
    'option callarrayextent off',
    'decompile',
    'print C',
    'option callarrayextent on',
    'decompile',
    'print C',
    'parse line extern uint4 lower_scalar_output(uint4 seed);',
    'load function lower_scalar_output',
    'option callarrayextent off',
    'decompile',
    'print C',
    'option callarrayextent on',
    'decompile',
    'print C',
    'parse line extern uint4 parent_tail_scalar(uint4 seed);',
    'load function parent_tail_scalar',
    'option callarrayextent off',
    'decompile',
    'print C',
    'option callarrayextent on',
    'decompile',
    'print C',
    'parse line extern uint4 duplicate_arg_output(uint4 seed);',
    'parse line extern void mixed_words(uint4 *out,uint8 *other);',
    'load function duplicate_arg_output',
    'option callarrayextent off',
    'decompile',
    'print C',
    'option callarrayextent on',
    'decompile',
    'print C',
    'phase catalog callarrayextent',
    'quit',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #1: off retains the short array'
count = 1
literal = [
    'uint4 escaped_output(uint4 seed)',
    '{',
    'uint4 v1 [2];',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #2: off returns an independent scalar'
count = 1
literal = [
    'fill_words(v1,seed);',
    'return v2;',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #3: on reserves shared frame capacity'
count = 1
literal = 'uint4 v1 [12];'

[[match]]
name = 'CALL-ARRAY-EXTENT #4: on reads the third helper output'
count = 2
regex = 'return v[0-9]+\[2\];'

[[match]]
name = 'CALL-ARRAY-EXTENT #5: discoverable opt-in'
count = 1
literal = '"option": "callarrayextent", "values": ["on", "off"], "default": "off", "current": "on", "destructive_as_default": true'

[[match]]
name = 'CALL-ARRAY-EXTENT #6: another address-taken slot bounds capacity'
count = 1
regex = 'uint4 v[0-9]+ \[10\];'

[[match]]
name = 'CALL-ARRAY-EXTENT #7: caller-defined scalar blocks frame-wide coalescing'
count = 1
literal = [
    'uint4 separate_word(uint4 seed)',
    '{',
    'uint4 v1 [2]; // stack - 0x10',
    'uint4 v2; // i0 | o0 | stack - 0x8',
    '',
    'v2 = seed;',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #8: caller-defined scalar remains separate'
count = 1
literal = [
    'touch_word(v1);',
    'return v2;',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #9: off splits the later copy output'
count = 1
regex = [
    'copy_words\(&v[0-9]+\[1\],v[0-9]+\);',
    'return v[0-9]+ \+ v[0-9]+;',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #10: indexed parent retains room for every store'
count = 1
regex = 'uint4 v[0-9]+ \[23\];'

[[match]]
name = 'CALL-ARRAY-EXTENT #11: return reads the copied word in shared storage'
count = 1
regex = 'return v[0-9]+\[(13|0xd)\] \+ v[0-9]+;'

[[match]]
name = 'CALL-ARRAY-EXTENT #12: loop-carried pointer declines'
count = 2
regex = 'uint4 v[0-9]+ \[13\];'

[[match]]
name = 'CALL-ARRAY-EXTENT #13: lower initialized scalar remains separate'
count = 2
literal = [
    'uint4 lower_scalar_output(uint4 seed)',
    '{',
    'uint4 v1; // i0 | o0 | stack - 0x34',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #14: lower scalar does not block output repair'
count = 1
literal = [
    'fill_words(v2,seed);',
    'return v1 + v2[2];',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #15: initialized scalar after parent declines'
count = 2
literal = [
    'uint4 v2; // stack - 0x30',
    'int4 v3; // l1',
    'uint4 v4; // i0 | o0 | stack - 0x2c',
]

[[match]]
name = 'CALL-ARRAY-EXTENT #16: conflicting duplicate pointees decline'
count = 2
literal = [
    'mixed_words(v1,(uint8 *)v1);',
    'return v2;',
]
