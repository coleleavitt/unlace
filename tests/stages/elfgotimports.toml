# ELF GOT data imports (`option importdata on|off`, pass `elfgotimports`).
#
# Issue: a -fPIC read of data another image defines loads a GOT slot the
# dynamic loader fills with the symbol's address (R_*_GLOB_DAT), then loads
# through it. kuna painted PE and Mach-O import slots externref but never an
# ELF GOT slot, so the read printed as `*dat_<slot>` (libcurl, libssl and
# libxml2 on this host all read stdout, environ or a library global that way).
#
# Stage / sub-stage: P1 environment-binding, the ELF GOT import slots
# (`unlace-analysis/src/loader/kuna_elfgotimports.rs`: reported as import slots,
# named and painted externref), rendered by P9 naming-policy
# `PrintC::op_load` (`importdata`).
#
# P0 assertion: `option importdata on|off` (default on). The ELF slot facts
# are committed under the same gate, so passes 1 and 3 set it off after
# `load file` and before the `read symbols` that commits them.
#
# Fixtures: `elf_gotdata_x86_64.so` and `elf_gotdata_aarch64.so` (built from
# `elf_gotdata.c`, see the fixtures README). `get_counter` reads the undefined
# `imported_counter`; `get_exported` reads `exported_value`, a symbol the object
# defines, whose GLOB_DAT slot `dynrelocs` already folds.
#
# Pass 1 / 3 (`option importdata off`, the BUG): `get_counter` returns
# `*dat_2680` / `*dat_205c0`. Pass 2 / 4 (the default, the FIX): it returns
# `imported_counter`. `get_exported` returns `exported_value` in all four
# passes: a defined symbol's slot is never painted.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elf_gotdata_x86_64.so',
    'option importdata off',
    'read symbols',
    'load addr 0x1580',
    'decompile',
    'print C',
    'load addr 0x15b0',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elf_gotdata_x86_64.so',
    'read symbols',
    'load addr 0x1580',
    'decompile',
    'print C',
    'load addr 0x15b0',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elf_gotdata_aarch64.so',
    'option importdata off',
    'read symbols',
    'load addr 0x104e4',
    'decompile',
    'print C',
    'load addr 0x10514',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elf_gotdata_aarch64.so',
    'read symbols',
    'load addr 0x104e4',
    'decompile',
    'print C',
    'load addr 0x10514',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'elfgotimports off: x86-64 reads the import through its GOT slot'
count = 1
literal = 'return *dat_2680;'

[[match]]
name = 'elfgotimports off: AArch64 reads the import through its GOT slot'
count = 1
literal = 'return *dat_205c0;'

[[match]]
name = 'elfgotimports on: both architectures render the import'
count = 2
literal = 'return imported_counter;'

[[match]]
name = "elfgotimports: a defined symbol's GOT read is the object in every pass"
count = 4
literal = 'return exported_value;'
