# Independent AArch64 controls compiled from indexed loads/stores.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x400000', name = 'negative' },
    { space = 'ram', offset = '0x400014', name = 'negative_load' },
    { space = 'ram', offset = '0x400028', name = 'two_indices' },
    { space = 'ram', offset = '0x400074', name = 'byte_index' },
    { space = 'ram', offset = '0x40008c', name = 'word_index' },
    { space = 'ram', offset = '0x410000', name = 'wide_byte' },
    { space = 'ram', offset = '0x410014', name = 'wide_short' },
    { space = 'ram', offset = '0x410028', name = 'float_bits' },
    { space = 'ram', offset = '0x420000', name = 'wide_index_u32' },
    { space = 'ram', offset = '0x420014', name = 'wrapped_index_u32' },
]

