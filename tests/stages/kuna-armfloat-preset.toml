[[match]]
name = "armfloat preset #1: off cuts scale's double return to its low word and loses its parameter"
count = 1
literal = 'unsigned int scale(void)'

[[match]]
name = "armfloat preset #2: the preset, and both soft-float passes from r0:r1, take and return scale's double"
count = 3
literal = 'double scale(double a0)'

[[match]]
name = "armfloat preset #3: off loses mix's double parameter"
count = 1
literal = 'unsigned int mix(float a0,int a1)'

[[match]]
name = "armfloat preset #4: the preset takes mix's double, float and int"
count = 1
literal = 'double mix(double a0,float a1,int a2)'

[[match]]
name = "armfloat preset #5: off reads backfill's double as two integer words"
count = 1
literal = 'float backfill(float a0,float a1,unsigned int a2,unsigned int a3)'

[[match]]
name = "armfloat preset #6: the preset takes backfill's double beside the back-filled float"
count = 1
literal = 'float backfill(float a0,float a1,double a2)'

[[match]]
name = "armfloat preset #7: a float built from its float inputs' bits keeps float parameters in both passes"
count = 2
literal = 'float copysign_bits(float a0,float a1)'

[[match]]
name = 'armfloat preset #8: a NaN payload keeps its bits in every pass'
count = 4
literal = '0x7fc00123'

[[match]]
name = 'armfloat preset #9: no pass prints the NaN payload as NAN'
count = 0
literal = 'NAN'

[[match]]
name = "armfloat preset #10: scale multiplies its double parameter by 1.5 in the preset and in both soft-float passes"
count = 3
literal = 'a0 * 1.5'

[[match]]
name = 'armfloat preset #11: no soft-float function takes a double from a VFP register in either pass'
count = 4
regex = '(mix|backfill)\((int|float) a0,unsigned int a1,'

[[match]]
name = 'armfloat preset #12: the preset returns the NaN payload as a float, bit for bit'
count = 1
literal = 'float payload(void)'

[[match]]
name = "armfloat preset #13: a float narrowed on one exit and a call's float on the other stays float in both passes"
count = 2
literal = 'float scale_err(float a0)'

[[match]]
name = 'armfloat preset #14: an integer handed back in s0 keeps its integer parameter in both passes'
count = 2
literal = 'unsigned int from_bits(unsigned int a0)'

[[match]]
name = 'armfloat preset #15: a register-bank save takes only its pointer in both passes'
count = 2
regex = 'void save_vfp\((double|unsigned long long) \*a0\)'

[[match]]
name = 'armfloat preset #16: the folded AEABI comparison reads its double from core registers in both passes'
count = 2
regex = 'if \(.*CONCAT44\(.*\)\.to < 0\.0\)'

[[match]]
name = 'armfloat preset #17: an integer reloaded into s0 from an unoptimized spill keeps its integer parameter in both passes'
count = 2
literal = 'unsigned int from_bits_o0(unsigned int a0)'

[[match]]
name = 'armfloat preset #18: eight float arguments stored with one vstmia stay parameters in both passes'
count = 2
literal = 'void set8f(float a0,float a1,float a2,float a3,float a4,float a5,float a6,float a7,float *a8)'

[[match]]
name = 'armfloat preset #19: an int getter that loads a double into d0 on one path keeps its int return in both passes'
count = 2
literal = 'unsigned int getpar(void *a0,int a1,'

[[match]]
name = 'armfloat preset #20: an int computed from a double temporary in d0 keeps its int return in both passes'
count = 2
literal = 'int neg_trunc(float a0)'

[[match]]
name = 'armfloat preset #21: a declared AEABI helper keeps the base standard, so its caller keeps its parameters in both passes'
count = 2
literal = 'unsigned long long to_ticks(float a0,unsigned int a1,'

[[match]]
name = 'armfloat preset #22: no pass gives the caller of a declared AEABI helper a double parameter'
count = 0
literal = 'to_ticks(double'
