[[match]]
name = 'strlenscan #1: with no option line (the shipped default) a bare length is strlen'
count = 1
literal = 'return strlen(a0);'

[[match]]
name = 'strlenscan #2: a length read twice is one variable'
count = 1
literal = 'return (uint1)a0[v1 - 1];'

[[match]]
name = 'strlenscan #3: two lengths in one expression keep their order'
count = 1
regex = [
    '^  v1 = strlen\(a0\);',
    '^  return strlen\(a1\) \+ \(v1 \+ 1\) \* 3 \+ -3;',
]

[[match]]
name = 'strlenscan #4: a length is taken before the store that follows the scan'
count = 1
regex = [
    '^  v1 = strlen\(a0\);',
    "^  \\*a0 = '\\\\0';",
    '^  return v1;',
]

[[match]]
name = 'strlenscan #5: and before a call that follows it'
count = 1
regex = [
    '^  v1 = strlen\(a0\);',
    '^  wipe\(a0\);',
    '^  return v1;',
]

[[match]]
name = 'strlenscan #6: an inlined strcat takes the length once, before its two stores'
count = 1
regex = [
    '^  v1 = strlen\(a0\);',
    "^  \\(&a0\\[v1\\]\\)\\[0\\] = '/';",
    "^  \\(&a0\\[v1\\]\\)\\[1\\] = '\\\\0';",
    '^  strcat\(a0,a1\);',
]

[[match]]
name = 'strlenscan #7: each side of a branch keeps its own length'
count = 1
regex = [
    '^    v1 = strlen\(a0\);',
    '^    \*a2 = v1;',
    "^    \\*a0 = '\\\\0';",
]

[[match]]
name = 'strlenscan #8: and the other side its own'
count = 1
regex = [
    '^    v1 = strlen\(a0\);',
    '^    \*a3 = v1;',
]

[[match]]
name = 'strlenscan #9: the join reads the variable, not a length taken after the store'
count = 1
regex = '^  return v1 \+ 100;'

[[match]]
name = 'strlenscan #10: nine lines read a length in the default pass, none with the option off'
count = 9
literal = 'strlen('

[[match]]
name = 'strlenscan #11: a scan for another byte keeps its loop in both passes'
count = 2
literal = "} while (v2 != '/');"

[[match]]
name = 'strlenscan #12: as does a scan whose raw count is returned, once by default and with every length loop when off'
count = 11
literal = '} while (v2);'

[[match]]
name = "strlenscan #13: with the option off a length is the loop's complemented count -- the bug"
count = 3
literal = 'return ~v3 - 1;'
