# Independent SPARC assembly; source in fixtures/indirect-value-arguments.s.

[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'stack_value' },
    { space = 'ram', offset = '0x1020', name = 'stack_pointer' },
    { space = 'ram', offset = '0x1040', name = 'pointer_value' },
    { space = 'ram', offset = '0x1058', name = 'indirect_value' },
    { space = 'ram', offset = '0x1078', name = 'value_reader' },
    { space = 'ram', offset = '0x1200', name = 'value_sink' },
    { space = 'ram', offset = '0x1210', name = 'pointer_sink' },
    { space = 'ram', offset = '0x1300', name = 'advanced' },
    { space = 'ram', offset = '0x1320', name = 'spilled' },
    { space = 'ram', offset = '0x1340', name = 'updated' },
    { space = 'ram', offset = '0x1370', name = 'cursor' },
    { space = 'ram', offset = '0x1400', name = 'indirect_pointer' },
    { space = 'ram', offset = '0x1500', name = 'stack_value_reverse' },
    { space = 'ram', offset = '0x1540', name = 'stack_pointer_reverse' },
    { space = 'ram', offset = '0x1600', name = 'value_sink_reverse' },
