# P3 simplification quiescence, P0 option opaquepredicate (default off).
# A comparison that has one result for every input is folded, and the
# branch it guards loses the arm that never runs. clang -O0, x86-64:
#
#   int check(int x, int y)   { if (((x * (x + 1)) & 1) == 0 || y < 10) return y + 1; return y - 1; }
#   int keep(int x, int y)    { if (((x * (x + 2)) & 1) == 0 || y < 10) return y + 1; return y - 1; }
#   int square(int x, int y)  { if (((x * x) & 3) == 2) return y * 3; return y - 7; }
#   int mixed(unsigned x, unsigned y, int z)
#                             { if ((x | y) - (x & y) != (x ^ y)) return z * 5; return z + 2; }
#   int mixedkeep(unsigned x, unsigned y, int z)
#                             { if ((x | y) - (x & y) != (x ^ (y & 4))) return z * 5; return z + 2; }
#   int parity(unsigned x, unsigned y, int z)
#                             { if (x * (x + 1) == 2 * y + 1) return z * 9; return z + 4; }
#
# x * (x + 1) is even and x * x is 0 or 1 modulo 4 (decided by the low
# bits); (x | y) - (x & y) equals x ^ y (decided with each input all zeros
# or all ones); an even product never equals an odd sum (the low bits of
# the two sides always differ). keep and mixedkeep depend on their inputs
# and must stay.
#
# steps is gcc -O2 -fno-pic -no-pie of
#   void steps(void) { for (int i = 0;; i++) switch (i) { case 0: c0(); break; ... case 9: c9(); break; default: return; } }
# linked with -Ttext-segment=0x100000 beside ten one-store callees c0..c9.
# Its index starts as xor ebx,ebx and its guard is cmp ebx,9; ja. Jump-table
# recovery sees only the path from the xor, so the index reads 0 there; the
# rule must not fold the guard's ebx == 9 half, or case 9 leaves the table.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'check' },
    { space = 'ram', offset = '0x100050', name = 'keep' },
    { space = 'ram', offset = '0x1000a0', name = 'square' },
    { space = 'ram', offset = '0x1000e0', name = 'mixed' },
    { space = 'ram', offset = '0x100120', name = 'mixedkeep' },
    { space = 'ram', offset = '0x100170', name = 'parity' },
    { space = 'ram', offset = '0x101000', name = 'steps' },
    { space = 'ram', offset = '0x1010c0', name = 'c0' },
    { space = 'ram', offset = '0x1010d0', name = 'c1' },
    { space = 'ram', offset = '0x1010e0', name = 'c2' },
    { space = 'ram', offset = '0x1010f0', name = 'c3' },
    { space = 'ram', offset = '0x101100', name = 'c4' },
    { space = 'ram', offset = '0x101110', name = 'c5' },
    { space = 'ram', offset = '0x101120', name = 'c6' },
    { space = 'ram', offset = '0x101130', name = 'c7' },
    { space = 'ram', offset = '0x101140', name = 'c8' },
    { space = 'ram', offset = '0x101150', name = 'c9' },
]

