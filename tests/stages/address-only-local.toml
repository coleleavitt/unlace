# Synthetic assembly: read_escaped saves &amp;status in a stack pointer,
# calls write_word(x, p, 0), then reads the four-byte status through p.
# write_word stores x &lt;&lt; 8 and returns x. A negative return yields -1;
# otherwise the caller returns the low byte of x. The referenced object
# used to be declared int8 because its address offset occupied eight bytes.
# The saved pointer prevents castobject from retyping the escaped object.
# Handwritten x86-64 SysV code; no external fixture is required.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'write_word' },
    { space = 'ram', offset = '0x100b', name = 'read_escaped' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '89f8c1e00889068d0417c3554889e54883ec20897de4488d45ec488945f0488b4df08b45e4ba000000004889ce89c7e8ccffffff85c07810488b45f08b00c1f80825ff000000c9c3b8ffffffffc9c3'

[script]
commands = [
    'parse line extern int4 write_word(int4 x, int4 *p, int4 o);',
    'parse line extern int4 read_escaped(int4 x);',
    'option castobject off',
    'load function read_escaped',
    'decompile',
    'print C',
    'option castobject on',
    'load function read_escaped',
    'decompile',
    'print C',
]

[[match]]
name = 'Address-only local #1: both passes declare the four-byte object'
count = 2
regex = '^  int4 v1; // [^\n]+$'

[[match]]
name = 'Address-only local #2: the saved pointer reaches that object'
count = 2
literal = 'v2 = &v1;'

[[match]]
name = 'Address-only local #3: the address width is never the object width'
count = 0
literal = 'int8 v1;'
