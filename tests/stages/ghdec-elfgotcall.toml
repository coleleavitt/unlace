# ELF GOT import-call binding (`option peimportcall on|off`).
#
# Issue: a `-fno-plt` build (or a linker-relaxed `call *slot(%rip)`) calls an
# import through its GLOB_DAT slot in `.got`; there is no PLT stub to name.
# The call lifts to a CALLIND through a global, so it renders as
# `(*dat_3fb0)()` with no name, no prototype and no no-return flow effect: a
# function ending in `abort()`/`exit()` runs on into the next function until
# funcboundflow truncates it.
#
# Stage / sub-stage: P1 external-refinement (`unlace-analysis`
# `loader/elf_plt.rs` names the `.got` slots of undefined function symbols no
# PLT stub jumps through, and `loader/unlace_peimportcall.rs` paints them
# `externref`) feeding the P2/P4 deindirect seam, whose restart re-flows the
# function with the import's no-return flag.
#
# P0 assertion: `option peimportcall on|off`.
#
# The XML wrapper only supplies the harness architecture; both passes load the
# real fixture `elf_got_noreturn_x86_64` (source `elf_got_noreturn_x86_64.c`,
# gcc -O2 -fPIC -pie -fno-plt). `check` ends in a GOT call to `abort`, `die`
# in a GOT call to `exit`, and `pick` reads a function pointer from a
# `.data.rel.ro` table filled by the same kind of relocation outside `.got`.
#
# Pass 1 (`option peimportcall off`) reproduces the BUG: both calls are
# unnamed and carry the funcboundflow truncation warning.
# Pass 2 (`option peimportcall on`) is the FIX: `abort()` and `exit(2)` are
# named and no-return, and the warning raised before the restart is gone.
# The table read in `pick` stays a table read in both passes. With the
# Listing built, `die` (whose only exit is the `exit` slot call) is
# propagated no-return in both passes, so `main`'s `die("usage")` ends its
# path: the propagation reads the slot's no-return fact, which the binding
# does not gate.
#
# A third load, `elf_got_slotaddr_x86_64` (source `elf_got_slotaddr_x86_64.s`),
# takes the ADDRESS of the `lgetxattr` and `getxattr` slots (`lea
# sym@GOTPCREL(%rip)`) and jumps through the one it selects: with binding on,
# the constant is still the slot's address, not the import's name. A fourth,
# `elf_got_noreturn_aarch64` (clang -O2 -fPIC -fno-plt, lld), reaches `exit`
# through `adrp/ldr/blr`: `exit(2)` binds and `check`'s call to `die` ends its
# path.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elf_got_noreturn_x86_64',
    'option listing on',
    'read symbols',
    'load function check',
    'decompile',
    'print C',
    'load function die',
    'decompile',
    'print C',
    'load function pick',
    'decompile',
    'print C',
    'load function main',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elf_got_slotaddr_x86_64',
    'read symbols',
    'load function pickx',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elf_got_noreturn_aarch64',
    'option listing on',
    'read symbols',
    'load function die',
    'decompile',
    'print C',
    'load function check',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ELFGOTCALL #4: the binding names the abort slot and ends the flow there'
count = 1
regex = '^\s*abort\(\); // no-return$'

[[match]]
name = 'ELFGOTCALL #5: the binding names the exit slot and ends the flow there (x86-64 and AArch64)'
count = 2
regex = '^\s*exit\(2\); // no-return$'

[[match]]
name = 'ELFGOTCALL #6: the binding names the other GOT call in die'
count = 1
literal = '__fprintf_chk('

[[match]]
name = 'ELFGOTCALL #8: die joins the no-return set through its exit slot'
count = 1
regex = '^\s*die\("usage"\); // no-return$'

[[match]]
name = "ELFGOTCALL #9: the address of a bound slot stays an address, not the import's name"
count = 1
literal = 'v1 = (unsigned long *)0x3fd8;'

[[match]]
name = 'ELFGOTCALL #10: no bound slot address prints as a function name'
count = 0
regex = '= (lgetxattr|getxattr);'

[[match]]
name = 'ELFGOTCALL #11: AArch64 die joins the no-return set through its exit slot'
count = 1
regex = '^\s*die\((0x[0-9a-f]+|"big")\); // no-return$'

[[match]]
name = 'ELFGOTCALL #7: the .data.rel.ro function-pointer table stays a table'
count = 1
literal = '&classes['
