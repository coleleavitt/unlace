[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/go-pointer-method-topology/method-elf',
    'read symbols',
    'option outlang go',
    'load function main.(*Meter).Apply',
    'decompile',
    'print C',
    'load function main.Forward',
    'decompile',
    'print C',
    'load function main.ForwardShadow',
    'decompile',
    'print C',
    'load function main.(*Meter).Pretend',
    'decompile',
    'print C',
    'load function main.Apply',
    'decompile',
    'print C',
    'load function main.Forward',
    'override prototype 0x401037 uint8 explicit(void *raw);',
    'decompile',
    'print C',
    'map prototype main.(*Meter).Apply uint8 Apply(void *raw,uint8 count);',
    'load function main.(*Meter).Apply',
    'decompile',
    'print C',
]

[[match]]
name = 'Go linked pointer method binds the receiver and preserves its field effects'
count = 1
regex = [
    '^func \(m \*Meter\) Apply\(delta uint64\) uint64 \{$',
    '^  delta = \(\*m\)\.Total \+ \(\*m\)\.Base \+ delta$',
    '^  \(\*m\)\.Total = delta$',
    '^  return delta$',
    '^\}$',
]

[[match]]
name = 'Go direct method expression preserves both original arguments'
count = 1
regex = '^  return \(\*Meter\)\.Apply\(m,delta\)$'

[[match]]
name = 'Go method call uses the typed receiver when a parameter shadows its type'
count = 1
regex = [
    '^func ForwardShadow\(Meter \*Meter, delta uint64\) uint64 \{$',
    '^  return Meter\.Apply\(delta\)$',
    '^\}$',
]

[[match]]
name = 'A receiver-looking symbol without Go method metadata stays a free function'
count = 1
regex = [
    '^// main\.\(\*Meter\)\.Pretend$',
    '^func Pretend\(m \*Meter, delta uint64\) uint64 \{$',
]

[[match]]
name = 'The ordinary Go function with the same basename stays a free function'
count = 1
regex = [
    '^// main\.Apply$',
    '^func Apply\(m \*Meter, delta uint64\) uint64 \{$',
]

[[match]]
name = 'Go method display leaves the explicit function declaration in authority'
count = 1
regex = '^func Apply\(raw unsafe\.Pointer, count uint64\) uint64 \{$'

[[match]]
name = 'Go method display leaves an explicit per-call prototype in authority'
count = 1
regex = '^  return _unlace_ident_282a4d6574657229\.Apply\(unsafe\.Pointer\(m\)\)$'
