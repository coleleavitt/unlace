# Kuna #810. P3 callee-memory summaries / P6 physical-write liveness. option stackviews off (default) retains the first initializer; on removes it through a stack-passed pointer. Direct caller-frame reads, const-declared writes and returned-pointer reads before/after overwrite preserve native behavior.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'overwrite_after_stack_read' },
    { space = 'ram', offset = '0x40104d', name = 'overwrite_after_stack_hidden' },
    { space = 'ram', offset = '0x40109a', name = 'read_after_stack_write' },
    { space = 'ram', offset = '0x4010d7', name = 'returned_pointer_read_before_overwrite' },
    { space = 'ram', offset = '0x40112b', name = 'returned_pointer_read_after_overwrite' },
    { space = 'ram', offset = '0x40117f', name = 'stack_return_pointer' },
    { space = 'ram', offset = '0x401187', name = 'stack_read_pair' },
    { space = 'ram', offset = '0x40118d', name = 'stack_read_second' },
    { space = 'ram', offset = '0x401196', name = 'stack_hidden_read' },
    { space = 'ram', offset = '0x40119b', name = 'stack_const_write' },
    { space = 'ram', offset = '0x4011a9', name = '_start' },
    { space = 'ram', offset = '0x402000', name = 'stack_saved_pointer' },
    { space = 'ram', offset = '0x402008', name = '__bss_start' },
    { space = 'ram', offset = '0x402008', name = '_edata' },
    { space = 'ram', offset = '0x402008', name = '_end' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x402000'
hex = '0000000000000000'

[script]
commands = [
    'parse line typedef struct CalleePair { int first; int second; } CalleePair;',
    'parse line extern int overwrite_after_stack_read(void);',
    'parse line extern int overwrite_after_stack_hidden(void);',
    'parse line extern int read_after_stack_write(void);',
    'parse line extern int returned_pointer_read_before_overwrite(void);',
    'parse line extern int returned_pointer_read_after_overwrite(void);',
    'parse line extern struct CalleePair *stack_return_pointer(long a, long b, long c, long d, long e, long f, const struct CalleePair *pair);',
    'parse line extern int stack_read_pair(const struct CalleePair *pair);',
    'parse line extern int stack_read_second(long a, long b, long c, long d, long e, long f, const struct CalleePair *pair);',
    'parse line extern int stack_hidden_read(long a, long b, long c, long d, long e, long f, const struct CalleePair *pair);',
    'parse line extern int stack_const_write(long a, long b, long c, long d, long e, long f, const struct CalleePair *pair);',
    'map addr r0x402000 struct CalleePair *stack_saved_pointer',
    'option stackalias off',
    'option stackviews off',
    'lo fu overwrite_after_stack_read',
    'decompile',
    'print C',
    'option stackviews on',
    'lo fu overwrite_after_stack_read',
    'decompile',
    'print C',
    'lo fu overwrite_after_stack_hidden',
    'decompile',
    'print C',
    'lo fu read_after_stack_write',
    'decompile',
    'print C',
    'lo fu returned_pointer_read_before_overwrite',
    'decompile',
    'print C',
    'lo fu returned_pointer_read_after_overwrite',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'x86_64 callee stack: first writes survive off and real observers'
count = 4
literal = '= 5;'

[[match]]
name = 'x86_64 callee stack: all second words survive'
count = 6
literal = '= 7;'

[[match]]
name = 'x86_64 callee stack: all later overwrites survive'
count = 5
literal = '= 9;'

[[match]]
name = 'x86_64 callee stack: stack-passed const writer does not fold stale bytes'
count = 0
literal = 'return 12;'
