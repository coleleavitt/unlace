[script]
commands = [
    'option partialaccess off',
    'lo fu scale',
    'decompile',
    'print C',
    'lo fu zero',
    'decompile',
    'print C',
    'lo fu pick',
    'decompile',
    'print C',
    'lo fu pair',
    'decompile',
    'print C',
    'lo fu add2',
    'decompile',
    'print C',
    'lo fu comb',
    'decompile',
    'print C',
    'lo fu gscale',
    'decompile',
    'print C',
    'lo fu gzero',
    'decompile',
    'print C',
    'lo fu ins0',
    'decompile',
    'print C',
]

[[match]]
name = 'zerofillreturn #1: clang and gcc scale never return q0 for the double'
count = 0
regex = 'undefined16 g?scale\('

[[match]]
name = 'zerofillreturn #2: return 0.0 never prints as ZEXT816(0)'
count = 0
literal = 'return ZEXT816(0);'

[[match]]
name = 'zerofillreturn #3: the two-exit double never returns q0'
count = 0
literal = 'undefined16 pick('

[[match]]
name = 'zerofillreturn #4: the zero fill is joined to the low lane only in the 3 controls'
count = 3
literal = '_8_8_ = 0;'

[[match]]
name = 'zerofillreturn #5: clang and gcc scale return the double'
count = 2
regex = 'float8 g?scale\(int4 a0,'

[[match]]
name = 'zerofillreturn #6: return 0.0 prints'
count = 2
literal = 'return 0.0;'

[[match]]
name = 'zerofillreturn #7: the double is returned on both exits of pick'
count = 1
literal = 'float8 pick('

[[match]]
name = 'zerofillreturn #8: the aggregate is returned in d0 and d1'
count = 1
literal = '_8_8_ = (float8)a1 + a0;'

[[match]]
name = 'zerofillreturn #9: a 64-bit vector built lane by lane is unchanged'
count = 1
literal = 'undefined16 add2('

[[match]]
name = 'zerofillreturn #10: a 128-bit value built with a lane insert keeps 16 bytes'
count = 1
literal = 'undefined16 comb('

[[match]]
name = 'zerofillreturn #11: a 128-bit zero write whose low lane is replaced keeps 16 bytes'
count = 1
literal = 'undefined16 ins0('
