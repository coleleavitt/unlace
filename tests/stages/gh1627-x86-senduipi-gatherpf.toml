# Unlace #1627: "x86-64: SENDUIPI decodes as RDRAND; VGATHERPF0DPS reads a GPR
# index"  https://github.com/Noelo-Lab/kuna/issues/1627
#
# Bytes (the issue's repro, as clang assembles it):
#   f30fc7f7              senduipi %rdi            -> was RDRAND EDI
#   0f183d40000000        prefetchit0 0x40(%rip)   -> was NOP/reserved
#   62f27d49c60c88        vgatherpf0dps (%rax,%zmm1,4){%k1}
#                                                  -> index was RCX, operand a loaded dword
#   c3                    ret
#   f30f01ec f30f01ed f30f01ee f30f01ef   uiret testui clui stui
#                                         (clui/stui were RDPKRU/WRPKRU)
#   0fc7f7                rdrand %edi (control: the unprefixed form stays RDRAND)
#
# Stage: S1 decode-table / S2 p-code lift (x86 spec-fix, no option).  The
# UINTR group lives in uintr.sinc, PREFETCHIT0/1 in ia.sinc ahead of the
# 0F 18 NOP group, and the eight VGATHERPF constructors use the vsib
# operand tables (vm32z/vm64z/vm32y) like VSCATTERPF already did, so the
# user-op receives the gather address, not a dword loaded through a GPR.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'f' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '''
f30fc7f70f183d4000000062f27d49c60c88c3
f30f01ecf30f01edf30f01eef30f01ef
0fc7f7
'''

[script]
commands = [
    'disassemble 0x1000 0x1026',
    'parse line extern void f(unsigned long target);',
    'lo fu f',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'GH1627 #1: f3 0f c7 /6 reg-form is SENDUIPI r64'
count = 1
regex = '^0x0+1000: SENDUIPI +RDI'

[[match]]
name = 'GH1627 #2: RIP-relative 0f 18 /7 is PREFETCHIT0'
count = 1
regex = '^0x0+1004: PREFETCHIT0 *byte ptr \[0x104b\]'

[[match]]
name = 'GH1627 #3: VGATHERPF0DPS indexes with the ZMM register'
count = 1
regex = '^0x0+100b: VGATHERPF0DPS *zmmword ptr \[RAX \+ ZMM1\*0x4\]\{K1\}'

[[match]]
name = 'GH1627 #4a: UIRET decodes'
count = 1
regex = '^0x0+1013: UIRET'

[[match]]
name = 'GH1627 #4b: TESTUI decodes'
count = 1
regex = '^0x0+1017: TESTUI'

[[match]]
name = 'GH1627 #4c: f3 0f 01 ee is CLUI, not RDPKRU'
count = 1
regex = '^0x0+101b: CLUI'

[[match]]
name = 'GH1627 #4d: f3 0f 01 ef is STUI, not WRPKRU'
count = 1
regex = '^0x0+101f: STUI'

[[match]]
name = 'GH1627 #5: unprefixed 0f c7 /6 is still RDRAND'
count = 1
regex = '^0x0+1023: RDRAND +EDI'

[[match]]
name = 'GH1627 #6: no rdrand in the decompiled function'
count = 0
literal = 'rdrand'

[[match]]
name = 'GH1627 #7: senduipi takes the target register'
count = 1
literal = 'senduipi(target);'

[[match]]
name = 'GH1627 #8: the gather prefetch takes an address built from the ZMM index'
count = 1
regex = 'vgatherpf0dps_avx512pf\([^;]*\* 4,'

[[match]]
name = 'GH1627 #9: nothing is loaded for the prefetch'
count = 0
literal = 'vgatherpf0dps_avx512pf(*'
