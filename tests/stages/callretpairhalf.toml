[[image.bytes]]
space = 'ram'
offset = '0x1100'
readonly = true
hex = '411c00eb4000704780b5fff7f9ffc9b280f0010080bd80b5fff7f2ffc8b280bd'

[script]
commands = [
    'set context TMode 1 [ram,0x1100] [ram,0x111f]',
    'lo fu hib',
    'decompile',
    'print C',
    'lo fu hiplus',
    'decompile',
    'print C',
    'lo fu hiw',
    'decompile',
    'print C',
    'lo fu lob',
    'decompile',
    'print C',
    'lo fu hig32',
    'decompile',
    'print C',
    'lo fu hip',
    'decompile',
    'print C',
    'lo fu lo40t',
    'decompile',
    'print C',
    'lo fu hibt',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLRETPAIRHALF #1: the calls that hand back r1 are never bare statements'
count = 0
regex = '^  full\(a0\);$'

[[match]]
name = 'CALLRETPAIRHALF #2: only the g32 control renders r1 as a local nothing assigns (the indirect control merges it with r0)'
count = 1
regex = '; // r1$'

[[match]]
name = 'CALLRETPAIRHALF #3: the high byte is a SUBPIECE of the pair the call returns'
count = 1
literal = 'return (uint4)((uint8)full(a0) >> 0x20) & 0xff;'

[[match]]
name = 'CALLRETPAIRHALF #4: the high word plus a constant'
count = 1
literal = 'return (int4)((uint8)full(a0) >> 0x20) + 7;'

[[match]]
name = 'CALLRETPAIRHALF #5: the high word moved into r0'
count = 1
literal = 'return (int4)((uint8)full(a0) >> 0x20);'

[[match]]
name = 'CALLRETPAIRHALF #6: Thumb: the high byte through uxtb r0,r1'
count = 1
literal = 'return (uint8)fullt(a0) >> 0x20;'

[[match]]
name = 'CALLRETPAIRHALF #7: Thumb: r0 and the byte r1:1 are both pieces of the call result'
count = 1
literal = 'return fullt(a0) & 0xffffffffff ^ 1;'

[[match]]
name = 'CALLRETPAIRHALF #8: Thumb: r1:1 is never concatenated unassigned'
count = 0
literal = 'CONCAT14(v1,fullt(a0))'

[[match]]
name = 'CALLRETPAIRHALF #9: the low-word control is unchanged'
count = 1
literal = 'return full(a0) + 1;'

[[match]]
name = 'CALLRETPAIRHALF #10: a callee whose decoded body never writes r1 keeps a bare call'
count = 1
regex = '^  g32\(a0\);$'

[[match]]
name = 'CALLRETPAIRHALF #11: an indirect call has no callee body to show the write, so it keeps a bare call'
count = 1
regex = '^  \(\*a0\)\(\);$'
