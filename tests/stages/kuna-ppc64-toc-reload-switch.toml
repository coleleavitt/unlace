'''

[script]
commands = [
    'set track r2 0x3000 0x1000 0x1001',
    'set track r2 0x4000 0x2000 0x2001',
    'lo fu dispatch',
    'decompile',
    'print C',
    'option callmechanisms on',
    'lo fu dispatch_copy',
    'decompile',
    'print C',
    'option callmechanisms off',
    'lo fu dispatch',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PPC64 TOC reload #1: on recovers the switch over the table'
count = 1
literal = 'switch('

[[match]]
name = 'PPC64 TOC reload #2: on labels the last case'
count = 1
literal = 'case 3:'

[[match]]
name = 'PPC64 TOC reload #3: on keeps every case body'
count = 1
literal = 'return 0x2c;'

[[match]]
name = 'PPC64 TOC reload #4: the default on a byte chunk and off keep the jump-as-call'
count = 2
literal = 'jump-as-call'

[[match]]
name = 'PPC64 TOC reload #5: the default on a byte chunk and off read r2 from the unwritten slot'
count = 2
literal = '// r2 | stack - 0x58'
