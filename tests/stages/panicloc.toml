# panicloc: P1 external refinement, option panicloc (default on, Rust
# images only). The script loads the committed panicloc/tiny_x86_64.elf
# (a no_std rustc build, source and command beside it): pick() panics with a
# message at tiny.rs:15:9.
#
# Assert #1 is the off pass: the Location argument is a bare address.
# Assert #2 is the on pass: the record is a data symbol typed
# core::panic::Location and named after its position.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/panicloc/tiny_x86_64.elf',
    'option panicloc off',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/panicloc/tiny_x86_64.elf',
    'option panicloc on',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'panicloc #1: off passes the Location as an address'
count = 1
literal = ',0x14,0x2002c0);'

[[match]]
name = 'panicloc #2: on names the Location after its position'
count = 1
literal = ',0x14,&panic_loc_tiny_rs_15_9);'
