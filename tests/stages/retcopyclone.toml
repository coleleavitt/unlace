# A cloned return block wrote a global a second time (kuna #1355).  The
# bytes are crates/unlace-cli/tests/fixtures/return_copy_clone.S
# linked at 0x1000.  audit_select is clang 14 -O1 -fPIC:
#
#     audit_recorded = audit_decoy;
#     if (audit_choice) return audit_fast;
#     return audit_safe;
#
# It stores audit_recorded once, then picks the result with a CMOVE and
# returns.  SLEIGH lifts the CMOVE as a branch around one move, so the RET
# is a block with two in-edges, and the return splitters (returndup,
# earlyreturn, switchreturn, upstream ActionReturnSplit) clone it per edge.
# Heritage puts an `audit_recorded = audit_recorded` guard COPY before
# every RETURN and flags it return_copy, which keeps the propagation rules
# off it.  The clone dropped that flag, so the stored value was propagated
# into the copy and it printed `audit_recorded = audit_decoy;` again on the
# audit_safe path (#3, #4).
#
# audit_retry is gcc 11 -O0 -fPIC:
#
#     if (a) { audit_count = 1; if (b) return 1; audit_tick(); return 2; }
#     return 3;
#
# All three paths jump to one `leave; ret`, which holds a phi for
# audit_count.  Splitting turned that phi into `audit_count = audit_count`
# in each copy (and in the original once one edge was left), and
# propagation turned it into a second `audit_count = 1;` on the b path
# (#6, #7).  A cloned guard now keeps its flag, and a phi on address-tied
# storage leaves no copy behind: its readers take the incoming Varnode.
# Both passes run, with returndup (the harness default, #1) and with
# earlyreturn (#2); #5 checks both results are still returned.
#
# audit_pair (hand-written, at 0x1100) returns 2 without a store, or
# stores its argument to audit_lo and then audit_hi, the next word, and
# returns 1.  Both paths reach one RET, the storing one last.  Copy
# propagation folds the stored register into the RET block's phis and the
# two stores die, so the split prints them from the clone's copies of the
# phis, in the order the phis are cloned, which the binary does not record.
# kuna_clonephiorder.rs clones the phis on globals in address order, which
# is the binary's order here (#8); heritage's order, the reverse, never
# prints (#9).
#
# Stage: P8 structure (return-block node split).  #1-#7 are a strict fix,
# no option; #8-#9 pin the clone's phi order.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'audit_fast' },
    { space = 'ram', offset = '0x1004', name = 'audit_safe' },
    { space = 'ram', offset = '0x1008', name = 'audit_decoy' },
    { space = 'ram', offset = '0x100c', name = 'audit_select' },
    { space = 'ram', offset = '0x1034', name = 'audit_select_gcc' },
    { space = 'ram', offset = '0x105d', name = 'audit_tick' },
    { space = 'ram', offset = '0x105e', name = 'audit_retry' },
    { space = 'ram', offset = '0x1100', name = 'audit_pair' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '''
8d4707c38d470bc38d4713c3488d05f5ffffff488905e61f0000833de71f0000
00488d0ddcffffff488d05d1ffffff480f44c1c3488d05cdffffff488905be1f
00008b05c01f000085c0488d05b3ffffff488d15a8ffffff480f45c2c3c35548
89e54883ec08897dfc8975f8837dfc007423c705901f000001000000837df800
7407b801000000eb11e8cfffffffb802000000eb05b803000000c9c3
'''

[[image.bytes]]
space = 'ram'
offset = '0x1100'
readonly = true
hex = '85ff7507b802000000eb118935ff1e00008935fd1e0000b801000000c3'

[[image.bytes]]
space = 'ram'
offset = '0x3000'
hex = '000000000000000000000000000000000000000000000000'

[script]
commands = [
    'map address r0x3000 code *audit_recorded',
    'map address r0x3008 int4 audit_choice',
    'map address r0x300c int4 audit_count',
    'map address r0x3010 int4 audit_lo',
    'map address r0x3014 int4 audit_hi',
    'lo fu audit_pair',
    'decompile',
    'print C',
    'lo fu audit_select',
    'decompile',
    'print C',
    'lo fu audit_retry',
    'decompile',
    'print C',
    'option returndup off',
    'lo fu audit_select',
    'decompile',
    'print C',
    'lo fu audit_retry',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'RETCOPYCLONE #1: returndup clones the return block'
count = 1
regex = 'audit_select\(void\) // return-dupe$'

[[match]]
name = 'RETCOPYCLONE #2: earlyreturn clones it with returndup off'
count = 1
regex = 'audit_select\(void\) // .*early-return$'

[[match]]
name = 'RETCOPYCLONE #3: audit_select writes the global once in each'
count = 2
literal = 'audit_recorded = '

[[match]]
name = 'RETCOPYCLONE #4: the write precedes the choice'
count = 2
literal = [
    'audit_recorded = audit_decoy;',
    'if (audit_choice)',
]

[[match]]
name = 'RETCOPYCLONE #5: both results are returned'
count = 4
regex = 'return audit_(fast|safe);'

[[match]]
name = 'RETCOPYCLONE #6: audit_retry writes the global once in each'
count = 2
literal = 'audit_count = '

[[match]]
name = 'RETCOPYCLONE #7: the b path returns without a second write'
count = 2
regex = [
    'audit_count = 1;',
    'if \(\w+\)',
    'return 1;',
]

[[match]]
name = "RETCOPYCLONE #8: by default audit_pair's stores print in address order, as the binary makes them"
count = 1
regex = [
    'audit_lo = \w+;',
    'audit_hi = \w+;',
    'return 1;',
]

[[match]]
name = "RETCOPYCLONE #9: they never print in heritage's order, reversed"
count = 0
regex = [
    'audit_hi = \w+;',
    'audit_lo = \w+;',
    'return 1;',
]
