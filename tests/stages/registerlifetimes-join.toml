[script]
commands = [
    'parse line typedef struct LifetimeWide { unsigned long long x; unsigned long long y; } LifetimeWide;',
    'parse line typedef struct LifetimeWide LifetimeWideAlias;',
    'parse line extern void wide_names(void);',
    'parse line extern struct LifetimeWide wide_source(void);',
    'parse line extern void observe_wide(struct LifetimeWide value);',
    'lo fu wide_names',
    'decompile',
    'print C',
    'rename value recovered_wide',
    'decompile',
    'print C',
    'retype recovered_wide LifetimeWideAlias',
    'decompile',
    'print C',
    'parse line extern void multiply_names(unsigned long long input);',
    'parse line extern void observe_number(unsigned long long value);',
    'option impliedrefs 0',
    'lo fu multiply_names',
    'decompile',
    'print C',
    'rename v1 operand',
    'decompile',
    'print C',
    'rename v2 multiplier',
    'decompile',
    'print C',
    'option impliedrefs 2',
    'parse line extern int4 register_parameter_reuse(int4 property);',
    'parse line extern int4 consume_key(int4 key);',
    'lo fu register_parameter_reuse',
    'decompile',
    'print C',
    'rename property_00 cleared_property',
    'decompile',
    'print C',
    'parse line struct Node { struct Node *next; struct Node *previous; uint4 identity; uint1 padding[4]; };',
    'map addr r0x409038 uint8 observed_hash',
    'lo fu value_domains',
    'decompile',
    'print C',
    'parse line extern struct Node *value_domains(struct Node *first,struct Node *last,struct Node **selected,uint4 choose_last);',
    'lo fu value_domains',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'register lifetimes: native join baseline remains readable'
count = 2
literal = 'observe_wide(value);'

[[match]]
name = 'register lifetimes: a join rename is attached across recovery'
count = 4
literal = 'observe_wide(recovered_wide);'

[[match]]
name = 'register lifetimes: a locked join type survives recovery'
count = 1
literal = 'LifetimeWideAlias recovered_wide;'

[[match]]
name = 'register lifetimes: an anonymous widened operand starts as a value'
count = 1
literal = 'v1 = ZEXT816(input);'

[[match]]
name = 'register lifetimes: a temporary name survives each rebuild'
count = 2
literal = 'operand = ZEXT816(input);'

[[match]]
name = 'register lifetimes: a second temporary remains independently named'
count = 1
literal = 'multiplier = ZEXT816(7);'

[[match]]
name = 'register lifetimes: a later rename keeps incoming branch conditions'
count = 2
literal = 'if (property != 200)'

[[match]]
name = 'register lifetimes: a later rename keeps the incoming return value'
count = 2
literal = 'return property;'

[[match]]
name = 'register lifetimes: the dispatched key has its requested name'
count = 1
literal = 'consume_key(cleared_property)'

[[match]]
name = 'register lifetimes: byte operands leave the pointer return independent'
count = 1
literal = 'return last;'

[[match]]
name = 'register lifetimes: inferred return contracts preserve the final pointer'
count = 1
literal = 'return a1;'

[[match]]
name = 'register lifetimes: an inferred scalar destination keeps the pointer bits'
count = 1
regex = '\*a2 = \(unsigned long\)v[0-9]+;'
