# MSVC `__real@` FP-constant COMDAT recovery.
#
# MSVC never encodes a floating-point literal into the instruction stream (x87
# and SSE both load one from memory), so it emits each literal as a COMDAT
# whose NAME spells the value. COMDAT folding keeps the definition in exactly
# one translation unit, so in every other object that symbol is UNDEFINED: no
# section, no bytes, and the loader binds it to a synthetic extern slot with
# nothing behind it. The defined half fares no better at the shipped defaults:
# its bytes are mapped and read-only, but folding a read-only global is gated
# by the program-wide `option readonly`, which is default-off. Either way the
# expression came out written in opaque addresses, `dat_<addr>` on both sides.
#
# The XML wrapper only supplies the harness architecture. The pass clears it
# and loads the real i386 COFF fixture, which carries all four spellings in both
# states: `__real@3fb999999999999a` (16 hex, IEEE double bits) and
# `__real@3f000000` (8 hex, IEEE float bits) DEFINED, plus
# `__real@8@3ffec90fdaa22168c000` and `__real@4@3fff8000000000000000` (the
# VC6-era x87 80-bit form, at both storage widths) UNDEFINED.
#
# All four constants render as literals: pi/4 and 0.1 in `_scale`, 1.0 and
# 0.5 in `_fscale`. The loader-level facts are covered by the Rust gate
# `crates/unlace-console/tests/verify_msvcfpconst.rs`.

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/msvcfpconst_i386.obj',
    'read symbols',
    'load function _scale',
    'decompile',
    'print C',
    'load function _fscale',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'MSVCFPCONST #1: _scale reads pi/4 from the undefined 20-hex x87 name and 0.1 from the defined 16-hex IEEE double'
count = 1
literal = '(float10)a0 * (float10)0.7853981633974483 + (float10)0.1;'

[[match]]
name = 'MSVCFPCONST #2: _fscale reads 1.0 from the 20-hex x87 name at float width and 0.5 from the defined 8-hex IEEE float, the modern MSVC spelling'
count = 1
regex = '\(float10\)1\.0f? \* \(float10\)a0 \* \(float10\)0\.5f?;'

[[match]]
name = 'MSVCFPCONST #3: no opaque operand survives'
count = 0
literal = 'dat_4'

[[match]]
name = 'MSVCFPCONST #4: the recovery changes the operands only -- the signature is unchanged'
count = 1
literal = 'float10 _scale(float8 a0)'
