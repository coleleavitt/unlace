# gotypeglobals: a Go image's type descriptors and itabs are named as the
# linker names them, on every release the harvest decodes.
#
# The script loads three stripped builds of tests/fixtures/go-type-names/main.go
# (go1.16.15, go1.17.13 and go1.26.2, linux/amd64). main.mk allocates a
# main.Point; main.main converts a *main.Point to the main.Shape interface;
# internal/bisect.New allocates a Matcher; internal/poll.(*FD).Close returns
# the errNetClosing error.
#
# Asserts #1-#2 are the go1.16 image: its name records carry a u16 length
# (the varint arrived in go1.17), so before this the harvest decoded nothing
# there; now the itab store and the descriptor comparisons in
# runtime.printany are named. Assert #3 is the go1.17 image: its build info
# is the pointer form, whose version selects the packed struct-field
# encoding, so main.Point is interned with its fields (before, the layout
# was refused and the allocation typed struct_0). Asserts #4-#5 are the go1.26 image: a
# sub-package type is spelled with its full import path, as the linker
# spells the symbol (type:internal/bisect.Matcher, not
# type:bisect.Matcher; go:itab.internal/poll.errNetClosing,error).
# Assert #6 is the off pass of the same image: the allocation takes a bare
# address.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/go-type-names/go1.16.15-amd64',
    'read symbols',
    'load function main.main',
    'decompile',
    'print C',
    'load function runtime.printany',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/go-type-names/go1.17.13-amd64',
    'read symbols',
    'load function main.mk',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/go-type-names/go1.26.2-amd64',
    'read symbols',
    'load function internal/bisect.New',
    'decompile',
    'print C',
    'load function internal/poll.(*FD).Close',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/go-type-names/go1.26.2-amd64',
    'option gotypeglobals off',
    'read symbols',
    'load function internal/bisect.New',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'gotypenames #1: go1.16 names the itab of the interface conversion'
count = 1
regex = 'dat_[0-9a-f]+ = go:itab\.\*main\.Point,main\.Shape;'

[[match]]
name = 'gotypenames #2: go1.16 names the descriptors printany compares against'
count = 1
literal = 'a0 == &type:string'

[[match]]
name = 'gotypenames #3: go1.17 interns the allocated struct with its fields'
count = 1
literal = 'main.Point *v1; // rax'

[[match]]
name = 'gotypenames #4: go1.26 spells the allocated type with its import path'
count = 1
literal = 'runtime.newobject(&type:internal/bisect.Matcher)'

[[match]]
name = 'gotypenames #5: go1.26 spells the itab with its import path'
count = 1
literal = '= go:itab.internal/poll.errNetClosing,error;'

[[match]]
name = 'gotypenames #6: off passes a bare descriptor address'
count = 1
literal = 'runtime.newobject(0x4a29e0)'
