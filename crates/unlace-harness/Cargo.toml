[package]
autotests = false
name = "unlace-harness"
description = "unlace Rust port: dev-only differential-testing helpers (Rust engine vs C++ oracle)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
unlace-base.workspace = true
unlace-num.workspace = true
unlace-sleigh.workspace = true
unlace-decomp.workspace = true
unlace-console.workspace = true
regex.workspace = true
unlace-stagefile.workspace = true
unlace-decomp-dylib = { workspace = true, optional = true }

[features]
# Dev only: link the engine as one Rust dylib (crates/unlace-decomp-dylib). Off by default.
dynamic_linking = ["dep:unlace-decomp-dylib", "unlace-console/dynamic_linking"]

[dev-dependencies]
unlace-slacomp.workspace = true
serde_json = "1"

[lints]
workspace = true

# The XML datatest harness binary (the upstream `decomp_test_dbg` name).  It
# lives here — not in `unlace-console` — because it drives the datatest runner
# (`unlace_harness::testfunction`), and `unlace-harness` depends on `unlace-console`
# (the reverse would be a dependency cycle).  Built to `target/<profile>/
# decomp_test_dbg`, the path `unlace/run_tests.py` resolves.
[[bin]]
name = "decomp_test_dbg"
path = "src/bin/decomp_test_dbg.rs"

# The datatest and stage-corpus parity gates (tests/parity.rs); UNLACE_BLESS=1 re-records them.
[[test]]
name = "parity"
path = "tests/parity.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "verify_w10_callarg_piece_switchhide_guard"
path = "tests/verify_w10_callarg_piece_switchhide_guard.rs"

[[test]]
name = "verify_w10_inline_body"
path = "tests/verify_w10_inline_body.rs"

[[test]]
name = "verify_w10_rsp_8_guardfold"
path = "tests/verify_w10_rsp_8_guardfold.rs"

[[test]]
name = "verify_w10_rsp_l4l5_stackframe_adversarial"
path = "tests/verify_w10_rsp_l4l5_stackframe_adversarial.rs"
