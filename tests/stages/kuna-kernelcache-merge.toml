# Kuna `kernelcache` option, several entries in one image (P1 code-data
# partition). The fixture is the two-entry kernel collection from
# gen_fileset.py wrapped in IMG4; the kext's widget_kernel_table returns the
# address of the kernel's kernel_table.
#
# Pass 1 (`option kernelcache Widget`) is the bug: the kext loads alone, so
# the kernel object it points at is a bare address. Pass 2 (`option
# kernelcache com.apple.kernel,Widget`) loads both entries as one image: the
# pointer names kernel_table, the kernel's own code decompiles, and the
# kext's __stubs call through the merged indirect-symbol table still names
# kernel_add.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/fileset.macho',
    'option kernelcache Widget',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/kernelcache.img4',
    'read symbols',
    'load function widget_kernel_table',
    'decompile',
    'print C',
    'option kernelcache com.apple.kernel,Widget',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/kernelcache.img4',
    'read symbols',
    'load function widget_kernel_table',
    'decompile',
    'print C',
    'load addr 0xfffffff007007000',
    'decompile',
    'print C',
    'load function widget_via_stub',
    'decompile',
    'print C',
    'option kernelcache auto',
    'quit',
]

[[match]]
name = 'KERNELCACHE-MERGE #1: the kext alone points at a bare kernel address'
count = 1
literal = 'return 0xfffffff007008000;'

[[match]]
name = 'KERNELCACHE-MERGE #2: kernel and kext in one image name the kernel object'
count = 1
literal = 'return &_kernel_table;'

[[match]]
name = "KERNELCACHE-MERGE #3: the kernel's code decompiles in the merged image"
count = 1
literal = 'return a0 + a1;'

[[match]]
name = "KERNELCACHE-MERGE #4: the merged indirect table still names the kext's __stubs call"
count = 1
regex = '^  kernel_add\(a0,8\);'
