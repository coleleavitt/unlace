# revisitrefine: refining a range a later heritage pass revisited.
#
# Issue #1034: decompile-all of a large Rust/MSVC DLL panicked in
# Heritage::build_refinement ("index out of bounds: the len is 8 but the
# index is 8").
#
# Stage / sub-stage: P3 heritage, phi-range refinement of a revisited range
# (strict bug fix, no option).
#
# The first stack pass heritages the 8-byte slots at rsp+0x10 and rsp+0x18
# apart and places a MULTIEQUAL for each at the join. The 8-byte read at
# rsp+0x13 goes through a spilled pointer, so it is seen only on the second
# pass. It joins both slots into one 16-byte range, which is refined at
# 0, 3, 8 and 11. Each old MULTIEQUAL spans two partitions; they were left
# to the partitions, so each 3-byte partition held an 8-byte phi: the read's
# high piece was linked to the whole 8-byte phi of rsp+0x18 and the return
# printed CONCAT85, a 13-byte value in an 8-byte sum. A partition that also
# takes a frame byte copy is refined again, and that refinement indexed past
# its array.
#
# Assembled with clang -c (x86-64), the .text bytes of f verbatim below:
#
#     f:  sub rsp,0x38
#         mov [rsp+0x10],rdi
#         mov [rsp+0x18],rsi
#         test edx,edx
#         je .L1
#         mov qword [rsp+0x10],1
#         mov qword [rsp+0x18],2
#     .L1:
#         lea rax,[rsp+0x13]
#         mov [rsp+0x8],rax
#         mov rcx,[rsp+0x8]
#         mov rax,[rcx]
#         add rax,[rsp+0x10]
#         add rax,[rsp+0x18]
#         add rsp,0x38
#         ret
#
# #1: the unaligned read is the 3 low bytes of rsp+0x18 over the 5 high
# bytes of rsp+0x10 (the old build printed CONCAT85).  #2: both slots are
# one 8-byte variable each.
#
# g is the same join on a global, from gcc -O0 of
#
#     long G[2];
#     long g(long a, long b) {
#         G[0] = a; G[1] = b;
#         return *(long *)((char *)G + 3);
#     }
#
# The first ram pass gives each slot a return COPY and nothing else. The
# read through the spilled constant pointer joins them on a later pass,
# and the refinement cuts both COPYs; the partitions holding bytes 0-2 and
# 11-15 have no read of their own. Retiring the COPYs without guarding
# those partitions again left their bytes with no return COPY, so both
# stores lost them and the second argument shrank to 3 bytes.  #4-#6:
# every byte of both stores survives.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'f' },
    { space = 'ram', offset = '0x401136', name = 'g' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
readonly = true
hex = '4883ec3848897c2410488974241885d2741248c74424100100000048c744241802000000488d4424134889442408488b4c2408488b01480344241048034424184883c438c3'

[[image.bytes]]
space = 'ram'
offset = '0x401136'
readonly = true
hex = 'f30f1efa554889e548897de8488975e0488b45e8488905ef2e0000488b45e0488905ec2e000048c745f843404000488b45f8488b00488945f0488b45f05dc3'

[script]
commands = [
    'option typevote off',
    'option partialaccess off',
    'lo fu f',
    'decompile',
    'print C',
    'lo fu g',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'REVISITREFINE #1: the unaligned read pieces 3 + 5 bytes, never an 8-byte phi as its high piece'
count = 1
literal = 'return CONCAT35((undefined3)v2,v1._3_5_) + v1 + v2;'

[[match]]
name = 'REVISITREFINE #2: each slot is one 8-byte variable'
count = 2
regex = '^  int8 v[12]; // stack - 0x2[08]$'

[[match]]
name = 'REVISITREFINE #3: no 13-byte concatenation'
count = 0
literal = 'CONCAT85'

[[match]]
name = "REVISITREFINE #4: a global's bytes no read reaches are still stored"
count = 1
regex = '^  dat_404040 = '

[[match]]
name = 'REVISITREFINE #5: the second argument stays 8 bytes'
count = 1
regex = '^unsigned long g\(unsigned long a0,unsigned long a1\)$'

[[match]]
name = 'REVISITREFINE #6: the high bytes of the second global are stored'
count = 1
regex = '^  dat_4040(4b = \(undefined5\)|48 = a1;)'
