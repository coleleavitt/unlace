# GH-874: an ARM function that returns a constant through a conditional
# return and otherwise tail-calls printed void.
#
#   pick:    cmp r0,#0; moveq r0,#7; bxeq lr; b getv
#   pair:    the same with a 64-bit 7 (moveq r0,#7; moveq r1,#0), so the
#            value written first passes two merges that re-test Z
#   popr:    push {r11,lr}; bl getv; cmp r0,#0; moveq r0,#3;
#            popeq {r11,pc}; pop {r11,lr}; b getv
#   tpick:   pick in Thumb (itt eq; moveq r0,#7; bxeq lr; b.w getvt)
#   differ:  the return tests r1, not r0 (cmp r1,#0; bxeq lr), so the 7
#            reaches getv when a0 == 0 and a1 != 0
#   stores:  streq r0,[r1] stores the 7 on the path that returns it
#   compl:   the return is inverted (bxne lr), so the 7 only reaches getv
#   spin:    cmp r0,#0; moveq r0,#7; beq 1f; str r0,[r1]; bx lr; 1: b 1b
#   nrexit:  cmp r0,#0; moveq r0,#7; bleq exit; str r0,[r1]; bx lr
#   tnrexit: nrexit in Thumb (itt eq; moveq r0,#7; bleq abort)
#
# Conditional execution leaves a merge block that branches on Z again, so
# in the graph the 7 reaches both the RETURN and the tail call, though
# the execution that wrote it always returns.  ActionConditionalExe
# threads that block only after ActionReturnRecovery scored the output
# trials, and onlyOpUse rejected r0 for the competing CALL use.  A use the
# merge rules out is skipped (kuna_condexeretuse.rs, always on).  In differ
# the 7 can reach getv, in stores the STORE is on the path that returns, and
# in compl the call is the only use the 7 can reach, so all three keep the
# upstream void.  In spin, nrexit and tnrexit the 7 is forced away from the
# RETURN (into a spin loop or a call that does not return), so it never
# reaches it: skipping the STORE and the RETURN there would pass the walk
# with nothing checked, and all three must keep void too.
#
# Stage / sub-stage: P4 "output-prototype".

[image]
arch = 'ARM:LE:32:v8:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'pick' },
    { space = 'ram', offset = '0x100010', name = 'pair' },
    { space = 'ram', offset = '0x100024', name = 'popr' },
    { space = 'ram', offset = '0x100040', name = 'differ' },
    { space = 'ram', offset = '0x100054', name = 'stores' },
    { space = 'ram', offset = '0x100068', name = 'compl' },
    { space = 'ram', offset = '0x100078', name = 'getv' },
    { space = 'ram', offset = '0x10008c', name = 'tpick' },
    { space = 'ram', offset = '0x100098', name = 'getvt' },
    { space = 'ram', offset = '0x1000a8', name = 'spin' },
    { space = 'ram', offset = '0x1000c0', name = 'nrexit' },
    { space = 'ram', offset = '0x1000d4', name = 'exit' },
    { space = 'ram', offset = '0x1000d8', name = 'tnrexit' },
    { space = 'ram', offset = '0x1000e6', name = 'abort' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
hex = '''
