# 32-bit PowerPC (System V ABI) is ILP32: long is 4 bytes and long long is
# 8. ppc_32.cspec had no data_organization, so the type factory fell back to
# an 8-byte long (its LP64 default when int is 4). A declared long then took
# a register pair, and an 8-byte value printed as long:
#     int8 ln(int8 a) { return CONCAT44((int4)((uint8)a >> 0x20) + 1,(int4)a); }   (bug)
#     unsigned long cll(unsigned int a0,unsigned int a1)                           (bug)
#       ... (int4)(v1 * 3UL >> 0x20) ...   a 4-byte literal shifted by 32           (bug)
# Stage: P0 knowledge plane (compiler-spec data organization). No option:
# the cspec states the ABI's long_size, a data fix. ilp32long-mips.xml
# is the same check for MIPS o32 built by gcc.
#
# Source (clang 14 -target powerpc-linux-gnu -O2 -fno-pic -fno-inline -c;
# .text verbatim below, the three R_PPC_REL24 call sites resolved by hand):
#     long ln(long a) { return a + 1; }
#     long long ll(long long a) { return a + 1; }
#     long pick(long a, long long b, long c) { return a + c + (long)b; }
#     long cl(long x) { return ln(x) * 3; }
#     long long cll(long long x) { return ll(x) * 3; }
#     long cp(long a, long long b) { return pick(a, b, 7) * 2; }
# pick reads a in r3, b in the pair r5:r6 (high word r5) and c in r7.
#
# Pass 1 (catalog default) decompiles cll before anything is declared, then
# declares ln, ll and pick with C keyword types and decompiles the rest.
# Pass 2 repeats ln, ll and pick with option ctypes on (the CLI rendering).
# Assert #1: cll's recovered 8-byte return spells long long, and its 8-byte
# constant carries the ULL suffix.
# Assert #2: a declared long is 4 bytes; ln adds one to a single register.
# Assert #3: pick takes a 4-byte a and c around the 8-byte b.
# Assert #4: cl and cp pass one register per long.
# Assert #5: with ctypes on the prototypes read int / long long.
# Assert #6: nothing spells an 8-byte integer as unsigned long.

[image]
arch = 'PowerPC:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'ln' },
    { space = 'ram', offset = '0x10008', name = 'll' },
    { space = 'ram', offset = '0x10014', name = 'pick' },
    { space = 'ram', offset = '0x10020', name = 'cl' },
    { space = 'ram', offset = '0x10044', name = 'cll' },
    { space = 'ram', offset = '0x10078', name = 'cp' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '''
386300014e800020308400017c6301944e8000207c671a147c6332144e800020
7c0802a6900100049421fff04bffffd51c63000380010014382100107c0803a6
4e8000207c0802a6900100049421fff04bffffb938a000037ca4281680010014
1c6300037c651a141c840003382100107c0803a64e8000207c0802a690010004
9421fff038e000074bffff8d5463083c80010014382100107c0803a64e800020
'''

[script]
commands = [
    'lo fu cll',
    'decompile',
    'print C',
    'parse line extern long ln(long a);',
    'parse line extern long long ll(long long a);',
    'parse line extern long pick(long a,long long b,long c);',
    'lo fu ln',
    'decompile',
    'print C',
    'lo fu ll',
    'decompile',
    'print C',
    'lo fu pick',
    'decompile',
    'print C',
    'lo fu cl',
    'decompile',
    'print C',
    'lo fu cp',
    'decompile',
    'print C',
    'option ctypes on',
    'lo fu ln',
    'decompile',
    'print C',
    'lo fu ll',
    'decompile',
    'print C',
    'lo fu pick',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ilp32long ppc #1: an 8-byte return spells long long'
count = 1
literal = 'unsigned long long cll(unsigned int a0,unsigned int a1)'

[[match]]
name = 'ilp32long ppc #1b: an 8-byte constant is ULL'
count = 1
literal = 'v1 * 3ULL >> 0x20'

[[match]]
name = 'ilp32long ppc #2: a declared long is one 4-byte register'
count = 1
literal = 'int4 ln(int4 a)'

[[match]]
name = 'ilp32long ppc #2b: ln and ll both add one'
count = 4
literal = 'return a + 1;'

[[match]]
name = 'ilp32long ppc #3: pick has a 4-byte a and c around the 8-byte b'
count = 1
literal = 'int4 pick(int4 a,int8 b,int4 c)'

[[match]]
name = 'ilp32long ppc #3b: pick adds a, c and the low word of b'
count = 2
regex = 'return c \+ a \+ \((int4|int)\)b;'

[[match]]
name = 'ilp32long ppc #4: cl passes ln one register'
count = 1
literal = 'return ln(a0) * 3;'

[[match]]
name = 'ilp32long ppc #4b: cp passes pick r3, r5:r6 and 7'
count = 1
literal = 'return pick(a0,CONCAT44(a2,a3),7) << 1;'

[[match]]
name = 'ilp32long ppc #5: ctypes spells the declared long as int'
count = 1
regex = '^int ln\(int a\)'

[[match]]
name = 'ilp32long ppc #5b: ctypes spells the 8-byte integer long long'
count = 1
regex = '^long long ll\(long long a\)'

[[match]]
name = 'ilp32long ppc #5c: ctypes pick prototype'
count = 1
regex = '^int pick\(int a,long long b,int c\)'

[[match]]
name = 'ilp32long ppc #6: no 8-byte integer spells unsigned long'
count = 0
regex = 'unsigned long(\)| [^l])'
