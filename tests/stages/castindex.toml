# Cast campaign, the (long)v residue `castindex`: a pointer plus a VARIABLE
# index, and the difference of two byte pointers, are printed as integer
# round trips.  coreutils sort -O0 `mergefps` (sub_a5c0) prints
#
#     *(long *)((long)v7 + v19 * 8) = v10 + -0x20;
#
# and ls -O0 `print_long_format` (sub_c6c8) prints
#
#     sub_5453(v14,(long)v24 - (long)v14);
#
# where the same arithmetic is element v19 of a `long *` and the byte
# difference of two `char *`.  Root cause (P9, ActionSetCasts): castarith
# keeps only a pointer plus a CONSTANT in pointer terms; a variable addend
# reaches the cast pass as the same INT_ADD, priced as integer arithmetic
# (`(long)` in, a cast back out), and an INT_SUB's operands are converted to
# `long` by the default input-cast rule.
#
# Stage / sub-stage: P9 "casts".  The P0 assertion `option castindex on|off`
# decides whether such a sum, used as a `T *` with a scale of sizeof(T),
# becomes PTRADD(base, i, #sizeof T), and whether a difference of two
# pointers to the same byte type keeps its operands uncast.
#
# The fixture (SysV x86-64):
#
#     ldidx:  movsxd rsi,esi; mov eax,[rdi+rsi*4]     an int index, 4-byte
#             add eax,[rdi+8]                          elements (the constant
#                                                      read makes rdi void *)
#     ld64:   mov rax,[rdi+rsi*8]; add rax,[rdi+0x10]  a long index
#     ldbyte: movzx eax,byte [rdi+rsi]; add eax,[rdi+4] a byte index
#     rec16:  movsxd; shl rsi,4; mov rax,[rdi+rsi+8]   a 16-byte record read at
#                                                      8 bytes: the scale is not
#                                                      the element, so the
#                                                      integer form stays
#     diff:   call strchr; sub rax,rbx                 strchr(s,c) - s
#
# Pass 1 (`option castindex off`) reproduces the bug; pass 2 turns it on.
# Both run with `option elemptr off`: with it on, P5 already types `ldidx`'s
# parameter `int4 *`, so both passes print `a0[a1]` before this option runs.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'ldidx' },
    { space = 'ram', offset = '0x100020', name = 'ld64' },
    { space = 'ram', offset = '0x100040', name = 'ldbyte' },
    { space = 'ram', offset = '0x100060', name = 'rec16' },
    { space = 'ram', offset = '0x100080', name = 'diff' },
    { space = 'ram', offset = '0x1000c0', name = 'strchr' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
hex = ''

[script]
commands = [
    'parse line extern char *strchr(char *s,int4 c);',
    'option elemptr off',
    'option castindex off',
    'lo fu ldidx',
    'decompile',
    'print C',
    'lo fu ld64',
    'decompile',
    'print C',
    'lo fu ldbyte',
    'decompile',
    'print C',
    'lo fu rec16',
    'decompile',
    'print C',
    'lo fu diff',
    'decompile',
    'print C',
    'option castindex on',
    'lo fu ldidx',
    'decompile',
    'print C',
    'lo fu ld64',
    'decompile',
    'print C',
    'lo fu ldbyte',
    'decompile',
    'print C',
    'lo fu rec16',
    'decompile',
    'print C',
    'lo fu diff',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'castindex #1: with the option off an int-indexed read through a void pointer is an integer round trip -- the bug'
count = 1
literal = 'return *(int4 *)((int8)a0 + a1 * 4L) + ((int4 *)a0)[2];'

[[match]]
name = 'castindex #2: and a byte-pointer difference converts both pointers to integers'
count = 1
literal = 'return (int8)strchr(a0,a1) - (int8)a0;'

[[match]]
name = "castindex #3: on, the int index is a subscript of the 4-byte element, and its extension is C's own"
count = 1
literal = 'return ((int4 *)a0)[a1] + ((int4 *)a0)[2];'

[[match]]
name = 'castindex #4: a long index is a subscript of the 8-byte element'
count = 1
literal = 'return ((int8 *)a0)[a1] + ((int8 *)a0)[2];'

[[match]]
name = 'castindex #5: a byte read takes the variable itself as the index'
count = 1
literal = 'return (uint4)((uint1 *)a0)[a1] + ((int4 *)a0)[1];'

[[match]]
name = 'castindex #6: a 16-byte stride read at 8 bytes keeps the integer form in both passes'
count = 2
literal = 'return *(int8 *)((int8)a0 + a1 * 0x10L + 8) + ((int8 *)a0)[2];'

[[match]]
name = "castindex #7: on, the difference of two char pointers is C's own pointer subtraction"
count = 1
literal = 'return strchr(a0,a1) - a0;'
