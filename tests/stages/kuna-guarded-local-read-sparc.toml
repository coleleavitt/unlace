[image]
arch = 'sparc:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'guarded' },
    { space = 'ram', offset = '0x1100', name = 'acquire' },
    { space = 'ram', offset = '0x1200', name = 'mutate' },
    { space = 'ram', offset = '0x1300', name = 'consume' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '9de3bfa04000003f9007bffc80a220000248000901000000f007bffcb2102017f227bffc400000779007bffc400000b590100018b0102007f027bffc400000719007bffcf007bffc81c7e00881e80000'

[[image.bytes]]
space = 'ram'
offset = '0x1100'
readonly = true
hex = '81c3e00801000000'

[[image.bytes]]
space = 'ram'
offset = '0x1200'
readonly = true
hex = '81c3e00801000000'

[[image.bytes]]
space = 'ram'
offset = '0x1300'
readonly = true
hex = '81c3e00801000000'

[script]
commands = [
    'parse line extern int4 guarded(void);',
    'parse line extern int2 acquire(int4 *);',
    'parse line extern void mutate(int4 *);',
    'parse line extern void consume(int4);',
    'load function guarded',
    'decompile',
    'print C',
    'parse line extern int2 acquire(volatile int4 *);',
    'parse line extern void mutate(volatile int4 *);',
    'load function guarded',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'guarded SPARC stack read: capture stays inside success branch'
count = 2
regex = [
    'if \([^\n]*\) \{',
    'v[0-9]+ = v[0-9]+;',
    'v[0-9]+ = 0x17;',
]

[[match]]
name = 'guarded SPARC stack read: the capture never precedes the success branch'
count = 0
regex = [
    'acquire\([^;]*;',
    'v[0-9]+ = v[0-9]+;',
]

[[match]]
name = 'guarded SPARC stack read: saved value reaches consumer'
count = 2
regex = [
    'mutate\([^;]*;',
    'consume\(v[0-9]+\);',
]

[[match]]
name = 'guarded SPARC stack read: volatile reads retain observable qualifiers'
min = 2
max = 99
regex = '^  volatile (int|int4) v[0-9]+; // '
