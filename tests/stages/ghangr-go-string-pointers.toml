# Length-bounded internal strings remain pointers in Go expressions.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'plain' },
    { space = 'ram', offset = '0x100100', name = 'escaped' },
    { space = 'ram', offset = '0x100200', name = 'unicode' },
    { space = 'ram', offset = '0x101000', name = 'sink' },
]

