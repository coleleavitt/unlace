# switchmerge: a search tree of jump tables printed as one switch.
#
# Authored AArch64 (clang -c of hand-written assembly). Both functions
# range-check w0 against 0x41..0x48 and index an eight-entry table; an
# out-of-range value goes to a second range check, 0x60..0x67, and a second
# table. Every case sets the result and jumps to a shared `lsl w0,w0,#1; ret`
# tail; the holes and the out-of-range values of the second table go to
# `add w0,w0,#1; eor w0,w0,#0x80; ret`.
# f: the holes 0x43 and 0x46 of the first table also go to that code.
# g: the holes of the first table go to the second range check.
#
# Fixed: each prints one `switch(a0)` with twelve value labels and one
# `default: return a0 + 1U ^ 0x80;`.
# Before (option switchmerge off): `default: switch(a0) { ... }` inside
# the first switch; f also printed `case 0x43: case 0x46:` above the
# default code and `default: goto label_100098;` in the inner switch.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'f' },
    { space = 'ram', offset = '0x101000', name = 'g' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x101000'
readonly = true
hex = ''

[script]
commands = [
    'parse line extern int4 f(int4 x);',
    'parse line extern int4 g(int4 x);',
    'lo fu f',
    'decompile',
    'print C',
    'lo fu g',
    'decompile',
    'print C',
    'option switchmerge off',
    'lo fu f',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'SWITCHMERGE #1: f and g print one switch each, the unmerged f two'
count = 4
literal = 'switch(x) {'

[[match]]
name = 'SWITCHMERGE #2: no hole of either table prints a label'
count = 1
literal = 'case 0x43:'

[[match]]
name = 'SWITCHMERGE #3: one default arm per merged switch, two in the unmerged f'
count = 4
literal = 'default:'

[[match]]
name = 'SWITCHMERGE #6: the default code prints once per function'
count = 3
literal = 'return x + 1U ^ 0x80;'

[[match]]
name = 'SWITCHMERGE #7: the label only the left-out jump reached is gone'
count = 1
regex = 'label_[0-9a-f]+:'

[[match]]
name = 'SWITCHMERGE #4: no arm jumps to the default code'
count = 1
literal = 'goto label_'

[[match]]
name = "SWITCHMERGE #5: the second table's labels land in the merged switch"
count = 3
literal = 'case 0x67:'
