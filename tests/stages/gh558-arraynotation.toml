# GH-558 (secondary complaint, and what the PHADE dataset repro keys on):
# standalone pointer arithmetic is rendered as `p->r + i` instead of array
# notation, because PrintC::opPtradd only uses subscript form inside a
# load/store context.
#
# Bytes: the `foo` function from the issue's own attached binary (foo.zip,
# gcc 13.3 -O3, x86-64), at its original address 0x1120:
#
#     typedef struct { unsigned int n; unsigned int **r; } S;
#     extern void init(unsigned int *x);
#     void foo(S *p) {
#         for (int i = 0; i < p->n; i++)
#             init(p->r[i]);
#     }
#
# Default output renders the PTRADD as `p->r + lVar` (pointer-arith form).
#
# Stage model: which notation a standalone PTRADD gets is an S9
# "literal/format policy" decision (LATENT upstream).  unlace exposes it as the
# P0 assertion `option arraynotation on|off`; when on, PrintC::opPtradd emits
# `&base[index]` instead of `base + index`.
#
# Pass 1 (default) proves the issue reproduces; pass 2 (option on) proves the
# stage-level intervention fixes the rendering.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1050', name = 'init' },
    { space = 'ram', offset = '0x1120', name = 'foo' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1050'
readonly = true
hex = 'c3'

[[image.bytes]]
space = 'ram'
offset = '0x1120'
readonly = true
hex = 'f30f1efa8b0785c0742e554889fd5331db4883ec080f1f00488b4508488b3cd84883c301e807ffffff3b5d0072ea4883c4085b5dc30f1f00c3'

[script]
commands = [
    'parse line struct S { uint4 n; uint4 **r; };',
    'parse line extern void init(uint4 *x);',
    'parse line extern void foo(S *p);',
    'lo fu foo',
    'decompile',
    'print C',
    'option arraynotation off',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'GH558 #3: arraynotation off restores upstream pointer arithmetic (old behavior, opt-in)'
count = 1
literal = '= p->r + '

[[match]]
name = 'GH558 #4: default pipeline renders &p->r[i] (fix is DIV-2 default)'
count = 1
literal = '= &p->r['
