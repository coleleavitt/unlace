# Synthetic halfword output: a register argument takes the address of a
# local initialized before a null-output check, then read after the call.

[image]
arch = 'ARM:LE:32:v7'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'widen_value' },
    { space = 'ram', offset = '0x2000', name = 'read_half' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '10482de900c0a0e3004053e208b08de20cd04de2bec04be10500000a0e304be2f60300ebbe305be1003084e508d04be21088bde80000e0e3fbffffea'

[[image.bytes]]
space = 'ram'
offset = '0x2000'
hex = '1eff2fe1'

# Three passes: upstream's scoring (passthrough off, stackaddrargtrial off)
# loses the call; stackaddrargtrial protects the stack-address trial from the
# inactive-chain veto; the default (passthrough on) keeps the three forwarded
# registers out of that chain, so the call is recovered without it.

[script]
commands = [
    'option passthrough off',
    'load function widen_value',
    'decompile',
    'print C',
    'option stackaddrargtrial on',
    'load function widen_value',
    'decompile',
    'print C',
    'option stackaddrargtrial off',
    'option passthrough on',
    'load function widen_value',
    'decompile',
    'print C',
]

[[match]]
name = "STACK ADDRESS #1: upstream's scoring loses the output argument"
count = 1
literal = 'read_half()'

[[match]]
name = 'STACK ADDRESS #2: enabled, and the default, retain the local address'
count = 2
literal = 'read_half(a0,a1,a2,v'

[[match]]
name = "STACK ADDRESS #3: only upstream's scoring folds the output to zero"
count = 1
literal = '*a3 = 0;'
