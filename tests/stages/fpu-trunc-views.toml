[script]
commands = [
    'parse line extern void touch(float4 *);',
    'parse line extern void sink_word(int2);',
    'parse line extern void sink_float(float4);',
    'parse line extern float8 sample(float8 *);',
    'parse line extern void alter(float4 *);',
    'parse line extern void transport(float8 *source,float4 *value);',
    'parse line extern void effect(float8 *source,float4 *value);',
    'parse line extern void clobber(float8 *source,float4 *value);',
    'parse line extern void release(void);',
    'parse line extern uint4 phi_0(float8 *source,float4 *value,int4 branch);',
    'parse line extern uint4 phi_1(float8 *source,float4 *value,int4 branch);',
    'option castnarrow off',
    'lo fu phi_0',
    'decompile',
    'print C',
    'lo fu phi_1',
    'decompile',
    'print C',
    'lo fu transport',
    'decompile',
    'print C',
    'lo fu effect',
    'decompile',
    'print C',
    'lo fu clobber',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'FPU TRUNC VIEWS #1: keep the logical numeric result'
count = 3
regex = 'v[0-9]+ = \(int4\)\*source;'

[[match]]
name = 'FPU TRUNC VIEWS #2: evaluate the provider into integer locals'
count = 2
regex = 'v[0-9]+ = \(int4\)sample\(source\);'

[[match]]
name = 'FPU TRUNC VIEWS #3: keep genuine floating multiplication'
count = 3
literal = '= *value * *value;'

[[match]]
name = 'FPU TRUNC VIEWS #4: retain the floating storage write'
count = 5
regex = 'unsigned int from; float to;.*\.from = v[0-9]+ \}\)\.to;'

[[match]]
name = 'FPU TRUNC VIEWS #5: a clobber reads actual floating storage'
count = 1
regex = 'float from; unsigned int to;.*\.from = v[0-9]+\[0\] \}\)\.to;'
