# calltargettype (GH-869) on AArch64: the function-pointer type built for an
# indirect call agrees with where the call passes its values, or the call
# keeps void *.
#
# Stage: P5 type recovery, after every variable has its final type and just
# before casts are decided. P0 assertion: option calltargettype on|off.
#
# Source (clang 14 -target aarch64-linux-gnu -O2 -fno-pic, the object's .text at 0x10000, its
# relocations left unapplied so the tables read from the image):
#
#     typedef float (*f1)(float);
#     typedef int (*i2)(int, int);
#     extern f1 ftab[];
#     extern i2 itab[];
#     void fstore(unsigned i, float *p) { p[0] = ftab[i & 1](p[1]); }
#     float fmul(unsigned i, float x) { return ftab[i & 1](x * 2.0f) + 1.0f; }
#     int icall(unsigned i, int a, int b) { return itab[i & 1](a, b) + 3; }
#
# Pass 1 (ctypes on, calltargettype off) is the bug: every target prints
# void *. Pass 2 (calltargettype on) types fmul's target float (*)(float),
# the float passed and returned in s0 (asserts 1, 2), and icall's int one
# (assert 3). fstore passes the float it loaded, which recovery holds as an
# unsigned int in s0; a type built from that unsigned int would pass it in
# r0/w0, so the call keeps void * in both passes (asserts 4 to 6).
#
# Assertions span the combined output of both passes.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'fstore' },
    { space = 'ram', offset = '0x10038', name = 'fmul' },
    { space = 'ram', offset = '0x10068', name = 'icall' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '''
fd7bbea9080000120900009029010091200440bdf30b00f9fd030091285968f8
f30301aa00013fd6600200bdf30b40f9fd7bc2a8c0035fd6fd7bbfa908000012
09000090290100910028201efd030091285968f800013fd601102e1e0028211e
fd7bc1a8c0035fd6fd7bbfa9080000120900009029010091e003012ae103022a
fd030091285968f800013fd6000c0011fd7bc1a8c0035fd6
'''

[script]
commands = [
    'option ctypes on',
    'option calltargettype off',
    'lo fu fstore',
    'decompile',
    'print C',
    'lo fu fmul',
    'decompile',
    'print C',
    'lo fu icall',
    'decompile',
    'print C',
    'option ctypes on',
    'option calltargettype on',
    'lo fu fstore',
    'decompile',
    'print C',
    'lo fu fmul',
    'decompile',
    'print C',
    'lo fu icall',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLTARGETTYPE-A64 #1: on types a float call float (*)(float)'
count = 1
literal = '(**(float (**)(float))&fstore[(a1 & 1) * 8UL])(a0 + a0)'

[[match]]
name = 'CALLTARGETTYPE-A64 #2: the float call itself prints as it did'
count = 2
regex = 'return \(float\)\(\*\*\(.*\)&fstore\[\(a1 & 1\) \* 8UL\]\)\(a0 \+ a0\) \+ 1\.0f?;'

[[match]]
name = 'CALLTARGETTYPE-A64 #3: on types an integer call'
count = 1
literal = '(**(int (**)(unsigned int,unsigned int))&fstore[(a0 & 1) * 8UL])(a1,a2)'

[[match]]
name = 'CALLTARGETTYPE-A64 #4: a float held as an integer in s0 keeps the call untyped'
count = 2
literal = 'unsigned int v1; // s0'

[[match]]
name = 'CALLTARGETTYPE-A64 #5: that call prints as it did'
count = 2
literal = '*a1 = (**(void **)&fstore[(a0 & 1) * 8UL])(v1);'

[[match]]
name = 'CALLTARGETTYPE-A64 #6: no integer function type is built over s0'
count = 0
literal = 'unsigned int (*v1)(unsigned int)'
