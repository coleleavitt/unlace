[script]
commands = [
    'lo fu t9',
    'decompile',
    'print C',
    'lo fu fwd',
    'decompile',
    'print C',
    'lo fu neg',
    'decompile',
    'print C',
    'lo fu negv',
    'decompile',
    'print C',
    'lo fu sbbpick',
    'decompile',
    'print C',
    'lo fu k1d',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "calleereadarg #1: t9's tested argument is never dropped"
count = 0
literal = 'return ext() + 1;'

[[match]]
name = "calleereadarg #2: fwd's tail call never loses the argument it also compares and returns"
count = 0
literal = 'return ext(); // tail-call'

[[match]]
name = 'calleereadarg #3: t9 passes the value it tests because ext reads edi'
count = 1
regex = 'return ext\(v[0-9]+ \+ 2\) \+ 1;'

[[match]]
name = 'calleereadarg #4: fwd tail-calls ext with the value it compares and returns'
count = 1
regex = 'return ext\(v[0-9]+\); // tail-call'

[[match]]
name = 'calleereadarg #5: a callee that reads no register gets no argument'
count = 1
literal = 'g();'

[[match]]
name = 'calleereadarg #6: a variadic register-save prologue is no evidence, so vlog keeps one argument'
count = 1
literal = 'vlog(msg); // tail-call'

[[match]]
name = 'calleereadarg #7: a register a callee subtracts from itself (sbb %ecx,%ecx) is no evidence, so cmpf keeps two arguments'
count = 1
regex = 'return cmpf\(v[0-9]+,v[0-9]+\); // tail-call'

[[match]]
name = "calleereadarg #8: the caller's own incoming register left in an argument slot the callee never reads is no gap to fill, so g3 keeps one argument"
count = 1
regex = 'v[0-9]+ = g3\(1\);'
