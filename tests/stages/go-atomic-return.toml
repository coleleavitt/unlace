[[match]]
name = 'exact one direct-return signed 32-bit atomic addition'
count = 1
regex = '^  return atomic\.AddInt32\(p, *d\)$'

[[match]]
name = 'exact one signed 64-bit atomic addition'
count = 1
regex = '^  return atomic\.AddInt64\(.*unsafe\.Pointer\(p\).*, *d\)$'

[[match]]
name = 'C source folds the locked add through option atomics, not goatomicreturn'
count = 1
regex = '^  return d \+ __sync_fetch_and_add\(p, *d\)$'

[[match]]
name = 'refusals and foreign renderings retain LOCK'
count = 20
regex = '^ +LOCK\(\)'

[[match]]
name = 'refusals and foreign renderings retain UNLOCK'
count = 20
regex = '^ +UNLOCK\(\)'

[[match]]
name = 'carry value remains consumed'
count = 1
literal = 'CARRY4(v1,d)'

[[match]]
name = 'transaction hint remains explicit'
count = 1
literal = 'XACQUIRE()'

[[match]]
name = 'narrow result keeps 16-bit modular width'
count = 1
literal = 'return int32(uint16(v1 + int16(d)))'

[[match]]
name = 'old-valued exchange and add remain explicit'
min = 2
max = 4
regex = 'return v1$'

[[match]]
name = 'Go retry retains the locked update inside the loop'
count = 1
regex = [
    '^  for _unlace_first_[0-9]+ := true; .*uint32\(v[0-9]+( \+ d)?\) == 0x0.* \{$',
    '^    LOCK\(\)$',
    '^    v[0-9]+ = \*p$',
    '^    \*p = (\*p|v[0-9]+) \+ d$',
    '^    UNLOCK\(\)$',
]

[[match]]
name = 'Go call after the atomic update keeps its order and the returned value'
count = 1
regex = [
    '^  UNLOCK\(\)$',
    '^  observe_result\(\)$',
    '^  return d \+ v[0-9]+$',
]
