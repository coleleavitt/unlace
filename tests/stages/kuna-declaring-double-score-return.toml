[script]
commands = [
    'option msvcstackguard off',
    'read symbols',
    'lo fu log_helper',
    'parse line extern float8 log_helper(float8 x);',
    'lo fu cookie',
    'parse line extern void cookie(uint8 c);',
    'lo fu clobber',
    'parse line extern void clobber(void);',
    'lo fu score',
    'parse line extern float8 score(void);',
    'decompile',
    'print C',
    'lo fu clobber_caller',
    'parse line extern float8 clobber_caller(void);',
    'decompile',
    'print C',
    'lo fu cookie_clobber',
    'parse line extern void cookie_clobber(uint8 c);',
    'lo fu exact_clobber_caller',
    'parse line extern float8 exact_clobber_caller(void);',
    'decompile',
    'print C',
    'lo fu wide_exact_caller',
    'parse line extern float8 wide_exact_caller(void);',
    'decompile',
    'print C',
    'lo fu refined_score',
    'decompile',
    'print C',
    'parse line extern float8 refined_score(void);',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'DECLARING-DOUBLE-SCORE #1: the log result is never discarded'
count = 0
regex = '^  log_helper\(dat_20d8\);$'

[[match]]
name = 'DECLARING-DOUBLE-SCORE #2: the pipeline assigns the log result'
count = 1
literal = '= log_helper(dat_20d8);'

[[match]]
name = 'DECLARING-DOUBLE-SCORE #3: the pipeline returns both additive doubles'
count = 2
regex = 'return .* \+ .*;'

[[match]]
name = 'DECLARING-DOUBLE-SCORE #4: preserving XMM0 does not remove any cookie call'
count = 4
regex = 'cookie\(.*\^'

[[match]]
name = 'DECLARING-DOUBLE-SCORE #5: a body write vetoes preservation of the pre-call XMM0 value'
count = 1
regex = '^  float8 v1; // xmm0_qa$'

[[match]]
name = 'DECLARING-DOUBLE-SCORE #6: an exact cookie marker yields to a recovered XMM0 body write'
count = 1
regex = [
    '',
    '^  cookie_clobber\(.*\);$',
    '^  return v[0-9]+;$',
]

[[match]]
name = 'DECLARING-DOUBLE-SCORE #7: a wide XMM0 range retains the exact low double'
count = 1
regex = '^  return v1 \+ v3;$'

[[match]]
name = 'DECLARING-DOUBLE-SCORE #8: the overlapping upper XMM0 scratch lane remains killed'
count = 1
regex = '^  float8 v3; // ([^\n]+ \| )?xmm0_qb( \| [^\n]+)?$'

[[match]]
name = 'EXPLICIT-DOUBLE-SCORE #1: the refined high return cell is never left unassigned'
count = 0
regex = '^  unsigned int v[0-9]+; // xmm0_db$'

[[match]]
name = 'EXPLICIT-DOUBLE-SCORE #2: the declared caller returns the complete double division'
count = 1
regex = [
    '',
    '^  v1 = dat_20d0 / dat_20d8;$',
    '^  cookie\(.*\);$',
    '^  return v1;$',
]

[[match]]
name = 'EXPLICIT-DOUBLE-SCORE #3: an unlocked inferred output does not gain the unjustified cell'
count = 1
regex = '^  return \(int4\)\(\(union \{ double from; unsigned long long to; \}\)\{ \.from = v1 \}\)\.to;$'
