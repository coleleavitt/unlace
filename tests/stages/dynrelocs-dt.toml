# Kuna #64 (personal): P1 GOT synthesis for relocatable objects and
# dynamic relocations read from PT_DYNAMIC (option dynrelocs, default on).
# #1-#2: a PIC x86-64 object's GOTPCRELX/REX_GOTPCRELX and a PIC AArch64
# object's ADR_GOT_PAGE/LD64_GOT_LO12_NC go through a synthesized read-only
# GOT, so the global reads as itself (before: the field kept the assembler's
# zero and the access read dat_4803e183f9893801).
# #4-#5: an lld-linked PIE with its section headers zeroed. Before, the
# section walk found no relocation table, the RELA RELATIVE slots stayed
# zero and the call through tab[1] was (*dat_2848)(a0) (the same as
# `option dynrelocs off`, a load-time option this test does not toggle
# because it would leak into later tests). Now PT_DYNAMIC's DT_RELA fills
# them, the call resolves, and the IRELATIVE resolver is named ifunc_1790.

[image]
arch = 'x86:LE:64:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/stages/fixtures/relocs/x64pic.o',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/relocs/a64pic.o',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/relocs/lld-nosht.elf',
    'read symbols',
    'map function r0x1730 call_two',
    'load function call_two',
    'decompile',
    'print C',
    'load function ifunc_1790',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'dynrelocs #1: x86-64 GOTPCRELX and AArch64 GOT page/offset reach the named global'
count = 2
literal = 'counter += a0;'

[[match]]
name = 'dynrelocs #4: on fills it from DT_RELA without section headers'
count = 1
literal = 'sub_1690(a0);'

[[match]]
name = 'dynrelocs #5: the IRELATIVE resolver is a named function'
count = 1
literal = 'ifunc_1790(void)'
