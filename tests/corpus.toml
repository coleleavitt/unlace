# Fixture manifest for the unlace decompiler test corpus.
#
# Each [[fixture]] entry describes one binary under fixtures/. Compiler
# and flag info is sourced from fixtures/README.md and the original
# `feat(fixtures):` commit messages. When a flag set is not documented,
# the field is "unknown" rather than guessed.
#
# `feature_tags` uses the controlled vocabulary from plan.md:
#   stack_vars, frame_pointer_omitted, alloca_dynamic_stack,
#   structs_arrays, switches_jump_tables, indirect_calls,
#   varargs_printf, cpp_methods_vtables, rust_panics_enums,
#   objc_dispatch, go_interfaces_defer, eh_landing_pads,
#   simd_callother_heavy, multi_arch.
#
# Tags are conservative: only assigned when the binary's source or
# build recipe makes the feature obvious. Missing tags ≠ absent
# feature; they just mean we didn't claim coverage.
#
# Validated by `cargo run -p xtask -- validate-corpus-toml`.

# ---------- Core C fixtures (x86_64, gcc -O2, no debug) ----------

