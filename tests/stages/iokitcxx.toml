# Unlace `iokitclasses on` (the typed classes) against `iokitclasses names`
# on an XNU kext.
#
# The fixture (gen_iokitcxx.py) is an arm64 MH_KEXT_BUNDLE whose
# initializer registers Base and Derived (0x30 bytes, a site.Derived
# kalloc_type view) through an unnamed OSMetaClass constructor. Derived's
# vtable holds an unnamed override of Base::m2 that reads the field at 0x10;
# Derived::Derived stores the vtable's address point and a field;
# Base::twice calls slot 4 of its own vtable; make_derived calls
# Derived::MetaClass::alloc.
#
# Pass 1 (`names`) is the bug: the override's this is void *a0 read by
# index, the constructor stores a raw constant, the virtual call is pointer
# arithmetic on a0 and the alloc returns nothing. Pass 2 (`on`, the default)
# types this as its class, the store as this->vtable = &Derived_vtable, the
# call as a named slot of this->vtable, and the alloc as returning Derived *.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/iokitcxx_kext.macho',
    'option iokitclasses names',
    'read symbols',
    'load addr 0xfffffff007b04190',
    'decompile',
    'print C',
    'load function Derived::Derived',
    'decompile',
    'print C',
    'load function Base::twice',
    'decompile',
    'print C',
    'load function make_derived',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernelcache/iokitcxx_kext.macho',
    'option iokitclasses on',
    'read symbols',
    'load addr 0xfffffff007b04190',
    'decompile',
    'print C',
    'load function Derived::Derived',
    'decompile',
    'print C',
    'load function Base::twice',
    'decompile',
    'print C',
    'load function make_derived',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "IOKITCXX #1: names leaves the override's this untyped"
count = 1
regex = '^unsigned long Derived::m2\(void \*a0\)'

[[match]]
name = 'IOKITCXX #2: names reads the field by index'
count = 1
literal = 'return ((unsigned long *)a0)[2];'

[[match]]
name = 'IOKITCXX #3: names stores the vtable as a raw constant'
count = 1
literal = 'a0->field_0x0 = 0xfffffff007b05150;'

[[match]]
name = 'IOKITCXX #4: names calls the slot by pointer arithmetic'
count = 1
literal = '(*a0 + 0x20))(a0,7);'

[[match]]
name = 'IOKITCXX #5: names leaves the alloc result an integer'
count = 1
literal = '*(unsigned long *)(Derived::MetaClass::alloc(gMetaClass) + 8) = 1;'

[[match]]
name = "IOKITCXX #6: on types the override's this as its class"
count = 1
literal = 'Derived::m2(Derived *this)'

[[match]]
name = "IOKITCXX #7: on reads the field of the class's kalloc_type layout"
count = 1
literal = 'return this->field_0x10;'

[[match]]
name = "IOKITCXX #8: on the constructor's this is its class"
count = 1
regex = '^void Derived::Derived\(Derived \*this\)'

[[match]]
name = 'IOKITCXX #9: on the vtable store names the typed vtable'
count = 1
literal = 'this->vtable = &Derived_vtable;'

[[match]]
name = 'IOKITCXX #10: on the virtual call goes through the named slot'
count = 1
regex = '^void Base::twice\(Base \*this\)'

[[match]]
name = 'IOKITCXX #11: on the slot call passes this'
count = 1
literal = 'this->vtable->m2)(this,7);'

[[match]]
name = 'IOKITCXX #12: on the alloc returns the class'
count = 1
literal = 'Derived::MetaClass::alloc(gMetaClass)->field_0x8 = 1;'
