# switchguardmerge: a switch with far outliers (option switchguardmerge).
#
# Source (x86-64, -O2):
#   int two(int x) {
#     switch (x) {
#     case 0: return f0(x); ... case 6: return f6(x);
#     case 100: return f8(x + 1); case 200: return f9(x);
#     }
#     return -1;
#   }
#
# gcc guards the jump table with x <= 6 and tests 100 and 200 on the
# guard's other side, so the default's case labels split into
# if (a0 <= 6) { switch ... } if (a0 == 100) ...
#
# Stage: P2/switchnorm, ActionSwitchGuardMerge: the guard is evaluated on
# the outliers and on every case label, the equality chain becomes two more
# cases, and the guard is removed.
#
# Pass 1 (default) prints one switch with case 100 and case 200; pass 2
# (switchguardmerge off) the guard and the separate tests.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'f0' },
    { space = 'ram', offset = '0x401010', name = 'f1' },
    { space = 'ram', offset = '0x4010a0', name = 'f10' },
    { space = 'ram', offset = '0x4010b0', name = 'f11' },
    { space = 'ram', offset = '0x401020', name = 'f2' },
    { space = 'ram', offset = '0x401030', name = 'f3' },
    { space = 'ram', offset = '0x401040', name = 'f4' },
    { space = 'ram', offset = '0x401050', name = 'f5' },
    { space = 'ram', offset = '0x401060', name = 'f6' },
    { space = 'ram', offset = '0x401070', name = 'f7' },
    { space = 'ram', offset = '0x401080', name = 'f8' },
    { space = 'ram', offset = '0x401090', name = 'f9' },
    { space = 'ram', offset = '0x401190', name = 'side' },
    { space = 'ram', offset = '0x4012f0', name = '_start' },
    { space = 'ram', offset = '0x4010c0', name = 'two' },
    { space = 'ram', offset = '0x401230', name = 'uns' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
readonly = true
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x402000'
readonly = true
hex = ''

[script]
commands = [
    'lo fu two',
    'decompile',
    'print C',
    'option switchguardmerge off',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'KUNA-SWITCHGUARDMERGE #1: the outliers are cases of the switch (default)'
count = 1
literal = 'case 100:'

[[match]]
name = 'KUNA-SWITCHGUARDMERGE #2: both outliers are cases (default)'
count = 1
literal = 'case 200:'

[[match]]
name = 'KUNA-SWITCHGUARDMERGE #3: switchguardmerge off keeps the range guard'
count = 1
literal = 'if (a0 <= 6)'

[[match]]
name = 'KUNA-SWITCHGUARDMERGE #4: one switch per pass'
count = 2
literal = 'switch(a0)'
