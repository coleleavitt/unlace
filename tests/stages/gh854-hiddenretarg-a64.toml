[script]
commands = [
    'lo fu f',
    'decompile',
    'print C',
    'lo fu f2',
    'decompile',
    'print C',
    'lo fu g',
    'decompile',
    'print C',
    'lo fu g2',
    'decompile',
    'print C',
    'lo fu use',
    'decompile',
    'print C',
    'lo fu use2',
    'decompile',
    'print C',
    'lo fu cursor',
    'decompile',
    'print C',
    'lo fu call_helper',
    'decompile',
    'print C',
    'lo fu call_cnt',
    'decompile',
    'print C',
    'lo fu phibuf',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "hiddenretarg #1: a constant left in x8 is never foo's first argument"
count = 0
literal = 'foo(0x38,3);'

[[match]]
name = "hiddenretarg #2: a computed value left in x8 is never foo's first argument"
count = 0
literal = 'foo(a1 + 1,3);'

[[match]]
name = 'hiddenretarg #3: x8 is dropped at both calls to the leaf foo'
count = 2
literal = 'foo(3);'

[[match]]
name = 'hiddenretarg #4: the syscall number is never passed to a callee whose body proves nothing'
count = 0
literal = 'lib(0x38)'

[[match]]
name = 'hiddenretarg #5: the null-page constant is dropped from the call to lib'
count = 1
regex = 'lib\((a0)?\)'

[[match]]
name = "hiddenretarg #6: g2's x1 is never passed through x8 to cancel"
count = 0
literal = 'cancel(a1'

[[match]]
name = 'hiddenretarg #7: a callee that stores through x8 keeps its result buffer'
count = 1
regex = 'mk\([a-z][a-z0-9]*,7\);'

[[match]]
name = 'hiddenretarg #8: a tail call into a body that stores through x8 keeps its result buffer'
count = 1
regex = 'mkthunk\([a-z][a-z0-9]*,9\);'

[[match]]
name = "hiddenretarg #9: a value vetoed from one call does not become another call's argument"
count = 1
literal = 'return corrupt(0x10e1);'

[[match]]
name = "hiddenretarg #10: a callee whose svc reads the caller's x8 keeps the syscall number"
count = 1
literal = 'helper(0x40,1);'

[[match]]
name = 'hiddenretarg #11: a callee that reads x8 keeps a null-page constant there'
count = 1
literal = 'cnt(10,'

[[match]]
name = "hiddenretarg #12: a frame address dropped at one call keeps its place as a later call's result buffer"
count = 1
regex = 'pmk\([a-z][a-z0-9]*,a1\);'
