# `global-load-call-order.toml` keeps a post-call memory-loaded global write after the
# getter, including a later call, a loop marker and a no-final-call control. The CLI roundtrips
# check an impure getter, a computed-value reload control and overlapping x86-64 SIMD reads using
# GCC/Clang at O0/O2. - `register-pair-call-args.toml`: overwritten wide-return register
# components at an undeclared call, with single-half and unchanged-pair controls.

[image]
arch = 'sparc:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'caller' },
    { space = 'ram', offset = '0x1400', name = 'no_finish' },
    { space = 'ram', offset = '0x1800', name = 'loop_clear' },
    { space = 'ram', offset = '0x1100', name = 'get' },
    { space = 'ram', offset = '0x1200', name = 'finish' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '9de3bfa021000008d1042000d127bffc4000003c01000000d107bffc95a209a02500000cd524a0002700000cd124e004400000740100000081c7e00881e80000'

