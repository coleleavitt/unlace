# b1 probe (prototype variant): a stack struct's address is passed to a call, and a field read after the call
# is returned. The field's slot is outside any parameter window (no stack parameters).
# Bug shape: RuleIndirectCollapse drops the call's INDIRECT on the unmapped field, so the
# read folds to the 0 stored before the call.
#
# Bytes (hand-assembled x86-64, no compiler):
#   sub rsp,0x18; mov qword [rsp+8],0; mov rdi,rsp; call ext; mov eax,[rsp+8];
#   add rsp,0x18; ret.  ext at 0x100020 is a bare ret.

[image]
arch = 'x86:LE:64:default:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'esc' },
    { space = 'ram', offset = '0x100020', name = 'ext' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '4883ec1848c7442408000000004889e7e80b0000008b4424084883c418c3cccc'

[[image.bytes]]
space = 'ram'
offset = '0x100020'
readonly = true
hex = 'c3'

[script]
commands = [
    'parse line extern int4 ext(int4 *p);',
    'lo fu esc',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'B1 proto probe: the call passes the struct address'
count = 1
regex = 'ext\(&'
