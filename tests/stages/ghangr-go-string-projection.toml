# angr test_go_decompiler.py check_statements_and_runtime_cleanup, reduced
# to one verified AMD64 string and one guarded byte. P1 godwarfsig owns
# the input proof and P9 uses it only on the guarded byte load. The
# definition and all direct calls keep the ABI pointer and length.
# Off and explicit declarations retain the previous body.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'option sourcelang auto',
    'clear architecture',
    'load file tests/fixtures/go-string-projection/amd64',
    'option godwarfsig off',
    'read symbols',
    'option outlang go',
    'load function main.ByteOr',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/go-string-projection/amd64',
    'option godwarfsig on',
    'read symbols',
    'option outlang go',
    'load function main.ByteOr',
    'decompile',
    'print C',
    'load function main.Forward',
    'decompile',
    'print C',
    'load function main.FromPrefix',
    'decompile',
    'print C',
    'load function main.FromOther',
    'decompile',
    'print C',
    'load function main.Length',
    'decompile',
    'print C',
    'load function main.HeaderData',
    'decompile',
    'print C',
    'load function main.UnsafeFirst',
    'decompile',
    'print C',
    'load function main.ExplicitWords',
    'decompile',
    'print C',
    'option outlang c',
    'load function main.ByteOr',
    'decompile',
    'print C',
    'option outlang rust',
    'load function main.ByteOr',
    'decompile',
    'print C',
    'option outlang go',
    'load function main.Forward',
    'override prototype 0x45d193 uint1 ByteOr(void)',
    'decompile',
    'print C',
    'echo explicit nominal lookalike',
    'map prototype main.ByteOr uint1 ByteOr(uint1 *s_data,int8 s_len,int8 i,uint1 fallback);',
    'load function main.ByteOr',
    'decompile',
    'print C',
]

[[match]]
name = 'disabled Go DWARF leaves the original inferred inputs'
count = 1
literal = 'func ByteOr(a0 int64, a1 uint64, a2 uint64, a3 uint32) uint32'

[[match]]
name = 'verified Go byte indexing stays inside the original bounds check'
count = 1
regex = [
    '',
    '^func ByteOr\(s_data \*byte, s_len int64, i int64, fallback byte\) byte \{$',
    '^  if uint64\(s_len\) <= uint64\(i\) \{$',
    '^    return fallback$',
    '^  \}$',
    '^  return unsafe\.String\(s_data,\s*s_len\)\[i\]$',
    '^\}$',
]

[[match]]
name = 'direct forwarding keeps both actual string words'
count = 1
regex = [
    '',
    '^func Forward\(s_data \*byte, s_len int64, i int64, fallback byte\) byte \{$',
    '^  return ByteOr\(s_data,\s*s_len,\s*i,\s*fallback\)$',
]

[[match]]
name = 'shortened forwarding uses the live length operand'
count = 1
regex = [
    '',
    '^func FromPrefix\(s_data \*byte, s_len int64, prefix int64, i int64, fallback byte\) byte \{$',
    '^  if uint64\(s_len\) < uint64\(prefix\) \{$',
    '^    return fallback$',
    '^  \}$',
    '^  return ByteOr\(s_data,\s*prefix,\s*i,\s*fallback\)$',
]

[[match]]
name = 'forwarding a different backing preserves the actual call string'
count = 1
regex = [
    '',
    '^func FromOther\(s_data \*byte, s_len int64, i int64, fallback byte\) byte \{$',
    '^  if uint64\(s_len\) == 0x0 \{$',
    '^    return fallback$',
    '^  \}$',
    '^  return ByteOr\(.*unsafe\.StringData\("other\\x00"\).*,\s*5,\s*i,\s*fallback\)$',
]

[[match]]
name = 'length-only keeps the verified physical length'
count = 1
regex = [
    '',
    '^func Length\(s_data \*byte, s_len int64\) int64 \{$',
    '^  return s_len$',
]

[[match]]
name = 'observable pointer bits keep the full physical header'
count = 1
regex = [
    '',
    '^func HeaderData\(s_data \*byte, s_len int64\) uint64 \{$',
    '^  return uint64\(uintptr\(unsafe\.Pointer\(s_data\)\)\) \^ uint64\(s_len\)$',
]

[[match]]
name = 'unguarded dereference retains the physical byte load'
count = 1
regex = [
    '',
    '^func UnsafeFirst\(s_data \*byte, s_len int64\) byte \{$',
    '^  return \*s_data$',
]

[[match]]
name = 'independent pointer and count are not a nominal string'
count = 1
literal = 'func ExplicitWords(data *byte, size int64, i int64, fallback byte) byte'

[[match]]
name = 'C keeps the original physical inputs and read'
count = 1
regex = [
    '',
    '^uint1 main\.ByteOr\(uint1 \*s_data,int8 s_len,int8 i,uint1 fallback\)$',
    '^\{$',
    '^  if \(\(uint8\)s_len <= \(uint8\)i\)$',
    '^    return fallback;$',
    '^  return s_data\[i\];$',
]

[[match]]
name = 'Rust keeps the original physical inputs'
count = 1
literal = 'unsafe fn main_ByteOr(mut s_data: *mut u8, mut s_len: i64, mut i: i64, mut fallback: u8) -> u8'

[[match]]
name = 'explicit call site keeps its declared arity'
count = 1
regex = '^  return ByteOr\(\)$'

[[match]]
name = 'explicit identical physical names do not inherit nominal authority'
count = 1
regex = [
    '',
    '^\s*explicit nominal lookalike$',
    '(?:^\s*$)?',
    '^// main\.ByteOr$',
    '^func ByteOr\(s_data \*byte, s_len int64, i int64, fallback byte\) byte \{$',
    '^  if uint64\(s_len\) <= uint64\(i\) \{$',
    '^    return fallback$',
    '^  \}$',
    '^  return \*\(\*byte\)\(unsafe\.Add\(unsafe\.Pointer\(s_data\),i \* 1\)\)$',
]
