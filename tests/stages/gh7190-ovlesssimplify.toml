# GH-7190: V850 BranchLessThen (SXB; CMP; BLT) decompiles to overflow-flag garbage.
#
# Source loop:   do { ... } while (cVar5 < 8);   (signed byte counter compare)
# The V850 SLEIGH set_OV_neg macro models the OV flag via a sub-register sign
# shift instead of `A s< 0`, so the BLT condition lifts to the p-code idiom
#   INT_SLESS(V+K,0) != ( byte_sign(V) && INT_SLESS(-1, V+K) ).
# The default S3 simplification pool cannot see through the constant offset
# (V + K) plus the sub-register sign test, so the convoluted boolean leaks into
# the rendered C instead of collapsing to a clean signed less-than.
#
# Stage / sub-stage: S3 simplification-quiescence (new named rule RuleOvLessSimplify).
# The rule is always on: assertion #2 proves it collapses the condition to
# a clean `cVar5 < '\b'` (signed byte compare against 8), and #1 that the
# OV-flag garbage condition never appears.

[image]
arch = 'V850:LE:32:default'
symbols = [
    { space = 'ram', offset = '0x0', name = 'FUN_00000000' },
]

[[image.bytes]]
space = 'ram'
offset = '0x0'
hex = '06f0e7008056a5a5b51560085f3a007241f2ca660100a152c16e01002c69b205aa56f76b4172a10aae006872b6f5e039dfed7f00'

[script]
commands = [
    'map fun r0x0 FUN_00000000',
    'lo fu FUN_00000000',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'GH7190 #1: the OV-flag garbage condition never appears (0<= form via DIV-2 compareform)'
count = 0
literal = "while (v6 + -8 < 0 != (v5 >> 7 < '\\0' && 0 <= v6 + -8))"

[[match]]
name = 'GH7190 #2: the pipeline collapses to a clean signed byte compare'
count = 1
literal = "while (v5 < '\\b')"
