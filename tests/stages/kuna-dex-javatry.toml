# Kuna DEX loader, try/catch: P2 flow + P8 structure + P9 Java output,
# option javatry (default on). The script loads the committed DEX fixture
# built from tests/stages/fixtures/dex/Tries.java and prints Java.
#
# Asserts #1-#2 are the off pass: no catch handler is reachable, so the
# catch bodies vanish and parse prints only its protected statement.
# Asserts #3-#10 are the default pass: every dispatch prints as
# try { } catch (T e) { }, with clauses of one try merged (twoCatches),
# a try/finally's normal-path copy after the try (withFinally), a try
# inside a loop (loopTry), a synchronized block's catch-all (sync), and
# Dalvik's throw as a Java throw statement (rethrow).

[image]
arch = 'Dalvik:LE:32:DEX_Android12'
symbols = [
    { space = 'ram', offset = '0x0', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x0'
readonly = true
hex = '0e00'

[script]
commands = [
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'option javatry off',
    'read symbols',
    'load function demo::Tries::parse',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'option javatry off',
    'read symbols',
    'load function demo::Tries::rethrow',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Tries::parse',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Tries::twoCatches',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Tries::withFinally',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Tries::loopTry',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Tries::sync',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Tries::rethrow',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'javatry #1: off loses the catch of parse'
count = 1
regex = [
    'return Integer\.parseInt\(a0\);',
    '^}',
]

[[match]]
name = 'javatry #2: off runs on past the call that could throw'
count = 1
regex = [
    '^  Integer\.parseInt\(a0\);',
    '^}',
]

[[match]]
name = 'javatry #3: parse catches NumberFormatException'
count = 1
literal = [
    'catch (NumberFormatException e) {',
    'return -1;',
]

[[match]]
name = 'javatry #4: twoCatches has two clauses on one try'
count = 1
literal = [
    'catch (NumberFormatException e) {',
    'v1 = -1;',
    '}',
    'catch (ArrayIndexOutOfBoundsException e) {',
    'v1 = -2;',
]

[[match]]
name = 'javatry #5: withFinally keeps the finally copy after the try'
count = 1
literal = [
    'catch (Throwable v3) {',
    'a0.append(v2);',
    'throw v3;',
    '}',
    'a0.append(v2);',
    'return v1;',
]

[[match]]
name = "javatry #6: loopTry's try sits in the loop body"
count = 1
literal = [
    'for (v1 = 0; v1 <= 9; v1 = v1 + 1) {',
    'try {',
    'v2 += a0[v1];',
]

[[match]]
name = "javatry #7: sync's catch-all releases the monitor and rethrows"
count = 1
literal = [
    'catch (Throwable v1) {',
    'monitorExit(a0);',
    'throw v1;',
]

[[match]]
name = 'javatry #8: rethrow binds the caught exception'
count = 1
literal = [
    'catch (RuntimeException v1) {',
    'ref = new IOException("bad",v1);',
    'throw ref;',
]

[[match]]
name = 'javatry #9: no dispatch or caught value leaks'
count = 0
regex = 'java_try|java_caught|java_throws'

[[match]]
name = 'javatry #10: throwException prints as throw'
count = 0
literal = 'throwException'
