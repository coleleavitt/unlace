[[match]]
name = 'swiftcall off: the class method takes no self'
count = 1
literal = 'vtable#7.method(int8 a0,int8 a1)'

[[match]]
name = 'swiftcall off: self is an unnamed register read'
count = 2
literal = 'int8 *v3; // r13'

[[match]]
name = 'swiftcall off: the struct witness writes through an unnamed register'
count = 1
literal = '*(int8 *)(v1 + 8) = *(int8 *)(v1 + 8) + a0;'

[[match]]
name = "swiftcall off: the throwing call's error path folds away"
count = 1
literal = 'v2 = (**(code **)(*a0 + 0x88))();'

[[match]]
name = 'swiftcall off: the virtual call drops the self it is passed'
count = 1
literal = 'v1 = (**(code **)(*a0 + 0x80))(a2,2);'

[[match]]
name = 'swiftcall off: a final method calls another without its self'
count = 1
literal = 'v1 = callfix.Account.fee(for:)(a0);'

[[match]]
name = "swiftcall on: the class method takes the class's self first"
count = 1
literal = 'callfix.Account.vtable#7.method(callfix.Account *self,int8 a1,int8 a2)'

[[match]]
name = 'swiftcall on: a virtual call on self passes self'
count = 2
literal = '(*((code **)self->isa)[9])(self);'

[[match]]
name = 'swiftcall on: the struct witness writes a field of self'
count = 1
literal = 'self->step = self->step + a1;'

[[match]]
name = 'swiftcall on: a class witness takes the address of the reference'
count = 1
literal = 'requirement#1(callfix.Account **self,int8 a1)'

[[match]]
name = 'swiftcall on: the virtual call passes the self it set'
count = 1
literal = 'v1 = (**(code **)(*a0 + 0x80))(a0,a2,2);'

[[match]]
name = 'swiftcall on: the throwing virtual call passes self'
count = 1
literal = 'v2 = (**(code **)(*a0 + 0x88))(a0);'

[[match]]
name = 'swiftcall on, symbols: a free function is declared from its name'
count = 1
literal = 'callfix.run(_:_:_:)(callfix.Account *a0,callfix.Counter *a1,int8 a2)'

[[match]]
name = 'swiftcall on, symbols: the virtual call on a declared class goes through its isa'
count = 1
literal = 'v1 = (*((code **)a0->isa)[0x10])(a0,a2,2);'

[[match]]
name = 'swiftcall on: the error path survives'
count = 2
literal = 'swift_release(v4);'

[[match]]
name = "swiftcall on: the throwing call's error is read as a call result"
count = 2
literal = 'v4 = swift_error();'

[[match]]
name = 'swiftcall on, symbols: the throwing function hands its error back'
count = 1
literal = 'swift_throw(v6);'

[[match]]
name = "swiftcall on, symbols: the mutating struct method takes the struct's self by address"
count = 1
literal = 'callfix.Counter.advance(by:times:)(int8 by,int8 times,callfix.Counter *self)'

[[match]]
name = "swiftcall on, symbols: the mutating method's body reads self's fields"
count = 1
literal = 'self->value = v1 + times + self->value;'

[[match]]
name = "swiftcall on, symbols: the call passes the struct's address as self"
count = 1
literal = 'callfix.Counter.advance(by:times:)(a2,3,a1);'

[[match]]
name = 'swiftcall on, symbols: the non-mutating method takes self by value'
count = 1
literal = 'callfix.Counter.peek(_:)(a2,*a1)'

[[match]]
name = 'swiftcall on, symbols: a final method hands its own self on'
count = 1
literal = 'v1 = callfix.Account.fee(for:)(a0,self);'

[[match]]
name = 'swiftcall on, symbols: and again after a call'
count = 1
literal = 'return callfix.Account.fee(for:)(for_,self) + v1;'

[[match]]
name = 'swiftcall off: the call after a runtime helper passes no self'
count = 2
literal = 'helperfix.Counter.bump()();'

[[match]]
name = 'swiftcall on: a runtime helper call leaves the self the caller set'
count = 2
literal = 'helperfix.Counter.bump()(a0);'

[[match]]
name = 'swiftcall on: the zeroed r12 of a C function stays a constant across its call'
count = 1
literal = 'return sub_10d2(a0) + 5;'

[[match]]
name = "swiftcall on: reading it after the call is not the callee's error"
count = 1
literal = 'return 1;'

[[match]]
name = "swiftcall on: a class-bound protocol's class witness takes the reference"
count = 1
literal = 'requirement#0(swift.type_metadata *Self,void *witness_table,nativefix.Impl *self)'

[[match]]
name = 'swiftcall on: and reads a field through it'
count = 1
literal = 'return self->v;'

[[match]]
name = 'swiftcall on: no class-bound witness is typed as a reference to a reference'
count = 0
literal = 'nativefix.Impl **self'

[[match]]
name = 'swiftcall on: a leaf call that never reads r13 leaves the self the caller set'
count = 1
literal = 'leaffix.Counter.bump(_:)(a0,v1,0);'

[[match]]
name = 'swiftcall on: a call to a module function leaves the self the caller set'
count = 1
literal = 'freefix.Counter.bump(_:)(a0,v1,0);'

[[match]]
name = 'swiftcall on: a spilled and reloaded error register keeps the error path, as the moved slot does'
count = 2
literal = 'return 0xffffffffffffffff;'

[[match]]
name = "swiftcall on: the throwing call's result is not returned unchecked"
count = 0
literal = 'return sub_2800();'
