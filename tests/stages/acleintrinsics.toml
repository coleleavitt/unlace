[[match]]
name = 'ACLE #1: off, a tagging function returns its argument unchanged'
count = 3
regex = '^\s*return a0;$'

[[match]]
name = 'ACLE #2: off, barriers print under their SLEIGH names'
count = 4
regex = 'DataMemoryBarrier\(2,3\);|DataSynchronizationBarrier\(3,3,0\);|InstructionSynchronizationBarrier\(\);'

[[match]]
name = 'ACLE #3: off, hints print under their SLEIGH names'
count = 5
regex = 'WaitForInterrupt\(\);|Yield\(\);|WaitForEvent\(\);|SendEvent\(\);|SendEventLocally\(\);'

[[match]]
name = 'ACLE #4: irg is a call that produces the returned pointer'
count = 1
regex = '^\s*return __arm_mte_create_random_tag\(a0,0\);$'

[[match]]
name = 'ACLE #5: barriers print with their CRm recombined'
count = 3
regex = '^\s*__dmb\(11\);$|^\s*__dsb\(15\);$|^\s*__isb\(15\);$'

[[match]]
name = 'ACLE #6: the isb option comes from the instruction'
count = 1
regex = '^\s*__isb\(1\);$'

[[match]]
name = 'ACLE #7: hints print as intrinsics'
count = 5
regex = '^\s*__wfi\(\);$|^\s*__yield\(\);$|^\s*__wfe\(\);$|^\s*__sev\(\);$|^\s*__sevl\(\);$'

[[match]]
name = 'ACLE #8: addg and subg increment the tag of the moved pointer'
count = 3
regex = 'return __arm_mte_increment_tag\(a0,3\);|return __arm_mte_increment_tag\(a0 \+ 0x20,1\);|return __arm_mte_increment_tag\(a1 \+ -0x10,2\);'

[[match]]
name = 'ACLE #9: gmi and ldg produce their results'
count = 2
regex = 'return __arm_mte_exclude_tag\(a0,a1\);|return __arm_mte_get_tag\(a0\);'

[[match]]
name = 'ACLE #10: a pointer tagging its own granule is __arm_mte_set_tag'
count = 4
regex = '^\s*__arm_mte_set_tag\((a0|v1)\);$'

[[match]]
name = 'ACLE #11: the tagged pointer flows from irg through stg to the return'
count = 1
literal = 'v1 = __arm_mte_create_random_tag(a0,__arm_mte_exclude_tag(a0,0));'

[[match]]
name = 'ACLE #12: a tag store or load of another granule keeps its user-op name'
count = 3
regex = '^\s*StorePtrTag\(a0,a1\);$|^\s*StorePtrTag\(a0 \+ 0x10,a0\);$|return LoadPtrTag\(a1,a0\);'

[[match]]
name = 'ACLE #13: no alignment-fault branch'
count = 0
regex = 'AlignmentFault|if \('
