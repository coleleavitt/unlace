[script]
commands = [
    'option ctypes on',
    'parse line extern void clear_slot(short slot);',
    'map address 0x400018 short flags[2]',
    'map address 0x500018 double neighbor',
    'map address 0x500020 short neighboring_flags[2]',
    'parse line extern void clear_neighbor(short slot);',
    'parse line extern void clear_unbiased(short slot);',
    'parse line extern void clear_unmapped(short slot);',
    'parse line extern void clear_byte(short slot);',
    'parse line extern unsigned int calculate(unsigned int slot);',
    'parse line extern short read_slot(short slot);',
    'parse line extern void clear_positive(short slot);',
    'parse line extern void clear_far(short slot);',
    'parse line extern void clear_unscaled(short slot);',
    'parse line extern void clear_two_indices(short first, short second);',
    'map address 0x18 short low_flags[2]',
    'parse line extern void clear_low(short slot);',
    'map address 0x400028 char bytes[4]',
    'parse line extern void clear_byte_array(short slot);',
    'map address 0x420000 short page_flags[2]',
    'map address 0x41ff00 char page_neighbor[256]',
    'parse line extern void clear_split(short slot);',
    'map address 0x430000 short page_alone[2]',
    'parse line extern void clear_split_alone(short slot);',
    'option globalarrayanchor off',
    'lo fu clear_slot',
    'decompile',
    'print C',
    'option globalarrayanchor on',
    'lo fu clear_slot',
    'decompile',
    'print C',
