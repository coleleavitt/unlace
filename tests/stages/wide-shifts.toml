[[match]]
name = 'wide-shifts #1: the default keeps the compact shift'
count = 8
regex = 'return value << 0x[13]f;'

[[match]]
name = 'wide-shifts #2: all shifts the complete unsigned input'
count = 8
regex = '\(uint8\)value << 0x[13]f'

[[match]]
name = 'wide-shifts #3: shared value stores remain in both passes'
count = 8
literal = '*echo = value;'

[[match]]
name = 'wide-shifts #4: a sign extension stays inside the unsigned conversion'
count = 3
literal = '(uint8)(int8)value << 0x1f'
