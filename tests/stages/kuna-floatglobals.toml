[[match]]
name = 'FLOATGLOBALS #1: with the option off a double copied into a global prints as an integer'
count = 2
literal = 'void fy(unsigned long a0,unsigned int *a1)'

[[match]]
name = 'FLOATGLOBALS #2: with the option off a float copied into a global prints as an integer'
count = 3
literal = 'void ff(unsigned int a0,unsigned int *a1)'

[[match]]
name = 'FLOATGLOBALS #3: a double copied into a float-only global is a double'
count = 2
literal = 'void fy(float8 a0,unsigned int *a1)'

[[match]]
name = 'FLOATGLOBALS #4: a float copied into a float-only global is a float'
count = 3
literal = 'void ff(float4 a0,unsigned int *a1)'

[[match]]
name = "FLOATGLOBALS #5: a float memcpy'd into a global read as an integer keeps its integer type"
count = 3
literal = 'void set_gpun(unsigned int a0)'

[[match]]
name = 'FLOATGLOBALS #6: a double stored into a global an integer store zeroes keeps its integer type'
count = 2
literal = 'void setz(unsigned long a0)'

[[match]]
name = 'FLOATGLOBALS #7: a double stored into a global the same function reads as an integer keeps its integer type'
count = 4
regex = 'void fy\(unsigned long a0(,uint4 a1)?\)'

[[match]]
name = 'FLOATGLOBALS #8: no integer read of such a global prints as a value conversion or a reinterpretation'
count = 0
regex = '\(long\)gd|\(long long\)|union \{ double from'

[[match]]
name = 'FLOATGLOBALS #9: a double stored into a scalar global the same function reads through an index from its address keeps its integer type'
count = 6
regex = 'void (ixa|lv0)\(unsigned long a0,'

[[match]]
name = 'FLOATGLOBALS #10: a double stored into a scalar global the same function writes through an index from its address keeps its integer type'
count = 1
literal = 'void ixs(unsigned long a0,int4 a1,int8 a2)'

[[match]]
name = 'FLOATGLOBALS #11: a double stored into a struct or array the same function reads through an index as an integer keeps its integer type'
count = 4
regex = 'void (fld|neg)\(unsigned long a0,int4 a1\)'

[[match]]
name = 'FLOATGLOBALS #12: a double stored into an array the function indexes only as doubles is a double'
count = 3
literal = 'void put(float8 a0,int4 a1)'
