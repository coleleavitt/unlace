# kuna option bejoin callers (the default), GH-904: a big-endian long long
# the callee alone cannot prove joins high word first when a caller reads
# its second register after the call.
#
# PowerPC returns a long long in r3:r4 with the HIGH word in r3.  A 64-bit
# sum compiles to the bytes of the int that returns its high word:
#     add64:  addc 4,4,6 / adde 3,3,5 / blr       return a + b;
#     add_hi: addc 4,4,6 / adde 3,3,5 / blr       return (a + b) >> 32;
# so with option bejoin evidence add64 printed its halves swapped:
#     return CONCAT44(a1 + a3,a0 + a2 + (uint4)CARRY4(a1,a3));   (bug)
# and its callers read the low word as the high one.  A caller compiled
# against int add_hi() never reads r4 after the call, which the call
# clobbered; c_add stores r4 (stw 4,4(9)), so add64 returns both words.
# pass returns add64's pair through its frame (no tail call), and c_pass
# stores both words of it.  keep never writes r4, so a caller may keep its
# own value there across the call (gcc's IPA-RA), and a read of r4 after
# keep says nothing about keep.
#
# Stage: P4 calls and prototypes (output-prototype), option bejoin.
# Pass 1 is the default (callers), pass 2 option bejoin evidence.
#
# Image: crates/unlace-analysis/tests/fixtures/bejoin_callers_ppc32_O2
# (bejoin_callers.c, powerpc-linux-gnu-gcc 13.3 -O2 -nostdlib -static).
#
# Assert #1: the default returns add64's sum high word first; evidence
#   swaps it, and add_hi keeps the old join in both passes.
# Assert #2: the default reads add64's and pass's pair r3 high in c_add and
#   c_pass and stores the high word at the lower address; evidence reads
#   them r3 low.
# Assert #3: keep and c_hi stay as they were in both passes.

[image]
arch = 'PowerPC:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '4e80002000000000'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/bejoin_callers_ppc32_O2',
    'option typevote off',
    'option partialaccess off',
    'read symbols',
    'lo fu add64',
    'decompile',
    'print C',
    'lo fu add_hi',
    'decompile',
    'print C',
    'lo fu c_add',
    'decompile',
    'print C',
    'lo fu c_hi',
    'decompile',
    'print C',
    'lo fu keep',
    'decompile',
    'print C',
    'lo fu c_pass',
    'decompile',
    'print C',
    'option bejoin evidence',
    'lo fu add64',
    'decompile',
    'print C',
    'lo fu add_hi',
    'decompile',
    'print C',
    'lo fu c_add',
    'decompile',
    'print C',
    'lo fu c_hi',
    'decompile',
    'print C',
    'lo fu keep',
    'decompile',
    'print C',
    'lo fu c_pass',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "bejoin-callers #1: the default returns add64's sum high word first"
count = 1
literal = 'return CONCAT44(a0 + a2 + (uint4)CARRY4(a1,a3),a1 + a3);'

[[match]]
name = 'bejoin-callers #1b: evidence swaps add64, and add_hi keeps the old join in both passes'
count = 3
literal = 'return CONCAT44(a1 + a3,a0 + a2 + (uint4)CARRY4(a1,a3));'

[[match]]
name = "bejoin-callers #2: the default reads c_add's and c_pass's pair r3 high"
count = 2
literal = 'unsigned long long v1; // r3:r4'

[[match]]
name = 'bejoin-callers #2b: the default stores the high word at the lower address'
count = 2
literal = 'sinku._0_4_ = (int4)((uint8)v1 >> 0x20);'

[[match]]
name = 'bejoin-callers #2c: evidence reads both pairs r3 low'
count = 2
literal = 'unsigned long long v1; // r4:r3'

[[match]]
name = 'bejoin-callers #3: keep stays an int in both passes'
count = 2
literal = 'int4 keep(int4 a0)'

[[match]]
name = "bejoin-callers #3b: c_hi reads add_hi's int in both passes"
count = 2
literal = 'sink32 = add_hi();'
