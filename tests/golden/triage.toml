consumer = "crates/unlace-sleigh/tests/golden_lift.rs"
reason = "Per-instruction raw p-code lift for one corpus binary, replayed byte-for-byte by the Rust SLEIGH runtime against the C++ oracle."
next_action = "Keep the lift replay locked; a SLEIGH spec change re-captures this file with a reviewed diff."

