# Kuna #63 (personal): P1 relocatable-object layout, instruction relocation
# families (option relocobjects, default on). Objects built from
# fixtures/relocs/t.c and a64.s as their headers say. Before this change
# each family below was "unsupported" and its field kept the assembler's
# placeholder: RISC-V HI20/LO12 data read as address 0 and the tail call a
# switch, MIPS HI16/LO16 data read as dat_0 and the jal as sub_0, PPC32
# ADDR16_HA/LO data read as dat_0.
# mipspic.o is PIC: before, every $gp load stayed *(t9 + off) and the call
# went through an unknown pointer, because a big-endian object got no
# rebased analyzer view (so no t9 = entry seed) and GOT16/CALL16 were
# unsupported.
# #1-#2 AArch64 ADR_PREL_LO21, LD_PREL_LO19, MOVW_UABS_G1/G0_NC,
# CONDBR19, TSTBR14. #3 RISC-V HI20/LO12_I/LO12_S. #10 RISC-V CALL (tail) to an extern: its
# one destination has no bytes, so tailcalljump takes it as a tail call. #4-#5 MIPS REL HI16/LO16
# pairing and R_MIPS_26 (#5 also covers CALL16 in mipspic.o). #8-#9 MIPS
# _gp_disp, local GOT16+LO16 page entries, global GOT16. #6-#7 PPC32 ADDR16_HA/LO and REL24.

[image]
arch = 'x86:LE:64:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/stages/fixtures/relocs/a64.o',
    'read symbols',
    'load function probe',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/relocs/riscv64.o',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/relocs/mips.o',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/relocs/mipspic.o',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/relocs/ppc32.o',
    'read symbols',
    'load function pick',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'relocs #1: AArch64 ADR, literal load and MOVW reach the extern data'
count = 1
literal = 'return (uint4)(dat_402004 + dat_402010 + dat_402008);'

[[match]]
name = 'relocs #2: AArch64 CBZ/TBNZ/B.cond reach their global labels'
count = 1
literal = 'if (a0 >> 3 & 1) {'

[[match]]
name = 'relocs #3: RISC-V HI20/LO12 resolve the global'
count = 1
literal = 'counter += (int4)a0;'

[[match]]
name = 'relocs #10: RISC-V auipc+jr to an extern slot is a tail call'
count = 1
literal = 'v3 = ext_fn((int8)-(int4)a0); // tail-call'

[[match]]
name = 'relocs #4: MIPS HI16/LO16, MIPS PIC GOT16 through _gp and PPC32 ADDR16_HA/LO resolve the global'
count = 3
literal = 'counter += a0;'

[[match]]
name = 'relocs #5: MIPS R_MIPS_26 calls the extern'
count = 2
literal = 'return ext_fn(-a0);'

[[match]]
name = 'relocs #8: MIPS PIC GOT16 page + LO16 reaches the local table (as the RISC-V, MIPS and PPC32 forms do)'
count = 4
literal = 'local_tab[(a0 & 3) * 4]'

[[match]]
name = 'relocs #7: PPC32 REL24 calls the extern'
count = 1
literal = 'v2 = ext_fn(-a0);'
