# jumptablemax: the most entries one jump table may have (upstream's
# OptionJumpTableMax, Architecture::max_jumptable_size, shipped at 1024).
# Jump-table recovery refuses a switch whose range check admits more cases
# than the cap, and the dispatch then prints as a computed call.
#
# Source (hand-written gcc -O2 shape, assembled with GNU as, linked at
# 0x100000): a four-case switch behind `cmp $3,%edi; ja default`, lowered
# through a table of 32-bit displacements (lea jt(%rip); movslq; add; jmp).
#
# Pass 1 (default 1024, asserts #1/#2): the four cases are recovered.
# Pass 2 (`option jumptablemax 2`, asserts #3/#4): four cases exceed the cap,
#     recovery declines, and the dispatch prints as `// jump-as-call`.
#
# Stage model: P2 / switch-model, tier transform, change_kind opt-in-tool.
# The default is upstream's constant, so it is byte-identical (675/675
# datatests, stages PARITY OK).

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'pick' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '83ff03772a89ff488d1532000000486304ba4801d0ffe0b80a000000c3b814000000c3b81e000000c3b828000000c331c0c366662e0f1f8400000000000f1f00d7ffffffddffffffe3ffffffe9ffffff'

[script]
commands = [
    'parse line extern int4 pick(uint4 sel);',
    'lo fu pick',
    'decompile',
    'print C',
    'option jumptablemax 2',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'JUMPTABLEMAX #1: at the default cap the four-case switch is recovered'
count = 1
literal = 'switch(sel)'

[[match]]
name = 'JUMPTABLEMAX #2: every case of the table is a case label'
count = 1
literal = 'case 3:'

[[match]]
name = 'JUMPTABLEMAX #3: `option jumptablemax 2` refuses the four-case table and the dispatch prints as a call'
count = 1
literal = '// jump-as-call'

[[match]]
name = 'JUMPTABLEMAX #4: the lower cap prints no case label, so the one `case 0:` is the default pass'
count = 1
literal = 'case 0:'
