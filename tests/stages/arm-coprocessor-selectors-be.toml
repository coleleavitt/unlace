# Independently authored MCR/MRC selector regression, P2 SLEIGH correctness
# repair without an option.
# WriteRegion: mov r0,#1; mcr p15,0,r0,c6,c0,0; bx lr.
# WriteSelectors: mcr p15,3,r0,c6,c5,2; bx lr.
# ReadSelectors: mrc p15,3,r0,c6,c5,2; bx lr.
# Before the repair all three assertions fail: CRn/CRm become uninitialized
# pseudo-register values. CPU write data must remain the live argument.
# This big-endian v4t control models ARM7 decoding only; the little-endian
# v5t file models the ARM9 decode target. Neither assumes CP15 is present.

[image]
arch = 'ARM:BE:32:v4t'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'WriteRegion' },
    { space = 'ram', offset = '0x1000c', name = 'WriteSelectors' },
    { space = 'ram', offset = '0x10014', name = 'ReadSelectors' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
hex = 'e3a00001ee060f10e12fff1eee660f55e12fff1eee760f55e12fff1e'

[script]
commands = [
    'parse line extern void WriteRegion(void);',
    'parse line extern void WriteSelectors(uint4 data);',
    'parse line extern uint4 ReadSelectors(void);',
    'load function WriteRegion',
    'decompile',
    'print C',
    'load function WriteSelectors',
    'decompile',
    'print C',
    'load function ReadSelectors',
    'decompile',
    'print C',
]

[[match]]
name = 'CP selectors BE #1: region numbers are constants'
count = 1
literal = 'coprocessor_moveto(0xf,0,0,1,6,0);'

[[match]]
name = 'CP selectors BE #2: CPU data stays dynamic'
count = 1
literal = 'coprocessor_moveto(0xf,3,2,data,6,5);'

[[match]]
name = 'CP selectors BE #3: read numbers are constants'
count = 1
literal = 'return coprocessor_movefromRt(0xf,3,2,6,5);'
