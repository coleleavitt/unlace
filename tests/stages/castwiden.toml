[script]
commands = [
    'option castwiden off',
    'lo fu add_load',
    'decompile',
    'print C',
    'lo fu mul_two',
    'decompile',
    'print C',
    'lo fu lit_mul',
    'decompile',
    'print C',
    'lo fu store_long',
    'decompile',
    'print C',
    'lo fu assign_size',
    'decompile',
    'print C',
    'lo fu keep_less',
    'decompile',
    'print C',
    'lo fu keep_mixed',
    'decompile',
    'print C',
    'option castwiden on',
    'lo fu add_load',
    'decompile',
    'print C',
    'lo fu mul_two',
    'decompile',
    'print C',
    'lo fu lit_mul',
    'decompile',
    'print C',
    'lo fu store_long',
    'decompile',
    'print C',
    'lo fu assign_size',
    'decompile',
    'print C',
    'lo fu keep_less',
    'decompile',
    'print C',
    'lo fu keep_mixed',
    'decompile',
    'print C',
    'option castwiden literal',
    'lo fu add_load',
    'decompile',
    'print C',
    'lo fu mul_two',
    'decompile',
    'print C',
    'lo fu lit_mul',
    'decompile',
    'print C',
    'lo fu store_long',
    'decompile',
    'print C',
    'lo fu assign_size',
    'decompile',
    'print C',
    'lo fu keep_less',
    'decompile',
    'print C',
    'lo fu keep_mixed',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'castwiden #1: with the option off the int4 beside a loaded int8 carries an (int8)'
count = 1
literal = 'return (int8)a1 + ((int8 *)a0)[1];'

[[match]]
name = 'castwiden #2: on and literal leave the widening to the usual arithmetic conversions'
count = 2
literal = 'return a1 + ((int8 *)a0)[1];'

[[match]]
name = 'castwiden #3: with the option off both factors carry an (int8)'
count = 1
literal = 'return (int8)a1 * (int8)a0;'

[[match]]
name = 'castwiden #4: on and literal keep one (int8), which keeps the product 64-bit'
count = 2
literal = 'return (int8)a1 * a0;'

[[match]]
name = 'castwiden #5: off and on keep the widening beside an int literal'
count = 2
literal = 'return (int8)a0 * 0xc + 7;'

[[match]]
name = 'castwiden #6: literal types the 8-byte literal and leaves the widening to C'
count = 1
literal = 'return a0 * 0xcL + 7;'

[[match]]
name = 'castwiden #7: with the option off the store through an int8 pointer carries an (int8)'
count = 1
literal = '((int8 *)a0)[1] = (int8)a1;'

[[match]]
name = 'castwiden #8: on and literal leave the conversion to the store'
count = 2
literal = '((int8 *)a0)[1] = a1;'

[[match]]
name = 'castwiden #9: with the option off the store through a uint8 pointer carries an (int8)'
count = 1
literal = '*a1 = (int8)a0;'

[[match]]
name = 'castwiden #10: on and literal leave the value-keeping widening to the store of the same width'
count = 2
literal = '*a1 = a0;'

[[match]]
name = 'castwiden #11: off and on keep the (uint8) beside an int literal'
count = 2
literal = 'return (uint8)a0 / 3;'

[[match]]
name = 'castwiden #12: literal prints 3UL and leaves the conversion to C'
count = 1
literal = 'return a0 / 3UL;'

[[match]]
name = 'castwiden #13: every pass keeps the widening in a comparison'
count = 3
literal = 'return *a0 < (int8)a1;'

[[match]]
name = 'castwiden #14: every pass keeps a zero-extension beside a signed int8'
count = 3
literal = 'return *a0 + (uint8)*a1;'
