# unlace protoorder, single-function drive: the callees a function tail-calls.
#
# gcc 15.3 -O2 -fno-pic -no-pie -nostartfiles -static (x86-64) of
#
#     int sink;
#     int target(int a, int *b) { if (b) *b = a; sink = a; return a * 3 + 1; }
#     int thunk(int a) { return target(a, 0); }            xor esi,esi; jmp target
#     int helper(int a, int b, int c) { sink = b; return a + b * c; }
#     int pass(int a, int b, int c) { return helper(a, b + 1, c); }   add esi,1; jmp helper
#
# A decompile of one function has no callee-first run behind it.  Nothing in
# `thunk` reads RAX after the tail call, so the call kept no result and the
# thunk printed as void; `pass` dropped `c`, which it forwards untouched in
# EDX.  The single-function drive now decompiles each callee the function
# tail-calls and states its recovered prototype first, as a callee-first
# decompile-all does.
#
# Stage / sub-stage: P4 "prototype-source", option `protoorder`.  Pass 1
# (`protoorder off`) pins the output without any callee statement, pass 2
# (the default) pins the forwarded result and argument.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'target' },
    { space = 'ram', offset = '0x401020', name = 'thunk' },
    { space = 'ram', offset = '0x401030', name = 'helper' },
    { space = 'ram', offset = '0x401050', name = 'pass' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = '''
f30f1efa4885f67402893e893def1f00008d447f01c3662e0f1f840000000000f30f1efa31f6ebd80f1f840000000000f30f1efa8935c61f00000faff28d043e
c30f1f400066662e0f1f840000000000f30f1efa83c601ebd70f1f8000000000f30f1efabf01000000ba03000000e8adffffffbe0200000089c1e8d1ffffff01
c8c30f1f0066662e0f1f840000000000f30f1efabf01000000ba03000000e87dffffffbe02000000eba6
'''

[script]
commands = [
    'option protoorder off',
    'lo fu thunk',
    'decompile',
    'print C',
    'lo fu pass',
    'decompile',
    'print C',
    'option protoorder cycles',
    'lo fu thunk',
    'decompile',
    'print C',
    'lo fu pass',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "tail callees #1: with nothing stated the thunk drops the tail call's result"
count = 1
regex = '^  target\(a0,0\); // tail-call$'

[[match]]
name = "tail callees #2: the thunk returns the tail call's result"
count = 1
regex = '^  return target\(a0,NULL\); // tail-call$'

[[match]]
name = 'tail callees #3: with nothing stated the forwarder drops the argument it passes through'
count = 1
regex = '^  (return )?helper\(a0,a1 \+ 1\); // tail-call$'

[[match]]
name = 'tail callees #4: the forwarder passes its third argument through'
count = 1
regex = '^  return helper\(a0,a1 \+ 1,a2\); // tail-call$'

[[match]]
name = 'tail callees #5: the forwarder takes the three parameters its callee reads'
count = 1
regex = '^int4 pass\(int4 a0,int4 a1,int4 a2\)$'
