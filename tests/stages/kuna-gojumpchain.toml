[script]
commands = [
    'option sourcelang go',
    'option gowritebarrier auto',
    'lo fu forwarded',
    'decompile',
    'print C',
    'option sourcelang c',
    'option gowritebarrier always',
    'decompile',
    'print C',
    'option sourcelang go',
    'option gowritebarrier auto',
    'lo fu write_forwarder',
    'decompile',
    'print C',
    'lo fu cycle',
    'decompile',
    'print C',
    'option sourcelang auto',
    'quit',
]

[[match]]
name = 'gojumpchain: forwarded barriers fold only with Go and the barrier fold enabled'
count = 2
regex = 'runtime.gcWriteBarrier2\('

[[match]]
name = 'gojumpchain: real stores survive every pass'
count = 3
literal = '*a0 = a1;'

[[match]]
name = 'gojumpchain: a forwarding block with a store is retained'
count = 1
literal = 'dat_300000 = 0x2a;'

[[match]]
name = 'gojumpchain: a jump cycle stays an infinite loop'
count = 1
literal = 'while( true )'
