[script]
commands = [
    'option partialaccess off',
    'parse line extern int4 waitpid(int4 pid, int4 *status, int4 opt);',
    'map addr r0x4000 int4 *keep',
    'option castobject off',
    'lo fu exit_code',
    'decompile',
    'print C',
    'lo fu kept',
    'decompile',
    'print C',
    'lo fu two_widths',
    'decompile',
    'print C',
    'lo fu mixed',
    'decompile',
    'print C',
    'lo fu stored',
    'decompile',
    'print C',
    'option castobject on',
    'lo fu exit_code',
    'decompile',
    'print C',
    'lo fu kept',
    'decompile',
    'print C',
    'lo fu two_widths',
    'decompile',
    'print C',
    'lo fu mixed',
    'decompile',
    'print C',
    'lo fu stored',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "castobject #1: under option castobject off exit_code's out-parameter is declared uint4 (bug reproduces; with kept's, two_widths' and mixed's in both passes, seven times)"
count = 7
regex = [
    '^(uint4 (exit_code|kept|mixed)|uint8 two_widths)\([^\n]+$',
    '^\{$',
    '^  uint4 v1; // ([^\n]+ \| )?stack - 0xc( \| [^\n]+)?$',
]

[[match]]
name = "castobject #2: and the call casts its address (bug reproduces; with kept's and mixed's in both passes, five times)"
count = 5
regex = '^  if \(waitpid\(a0,\(int4 \*\)&v1,0\) <= -1\)$'

[[match]]
name = "castobject #3: and the arithmetic shift casts the value back (bug reproduces; with kept's in both passes, three times)"
count = 3
regex = '^    return \(int4\)v1 >> 8 & 0xff;$'

[[match]]
name = 'castobject #4: option castobject on declares it int4, as waitpid does (fix, once)'
count = 1
regex = '^  int4 v1; // ([^\n]+ \| )?stack - 0xc( \| [^\n]+)?$'

[[match]]
name = "castobject #5: the call passes its address uncast (fix; with two_widths' in both passes, three times)"
count = 3
regex = '^  if \(waitpid\(a0,&v1,0\) <= -1\)$'

[[match]]
name = 'castobject #6: and the shift reads it uncast (fix, once)'
count = 1
regex = '^    return v1 >> 8 & 0xff;$'

[[match]]
name = 'castobject #7: an address that is also stored keeps its declaration and casts in both passes (twice)'
count = 2
regex = '^  keep = \(uint4 \*\)&v1;$'

[[match]]
name = 'castobject #8: a status also read one byte at a time keeps its declaration in both passes (twice)'
count = 2
literal = 'v1._1_1_'

[[match]]
name = "castobject #9: an object that starts with a parameter's value and is also shifted right logically keeps the logical shift on its uint4 declaration in both passes (twice)"
count = 2
regex = '^    v1 >>= 0x14;$'

[[match]]
name = 'castobject #10: a value stored into the object and also shifted right logically on its own keeps the object declared uint4 in both passes (twice)'
count = 2
regex = [
    '^uint4 stored\([^\n]+$',
    '^\{$',
    '^  uint4 v1; // ([^\n]+ \| )?stack - 0x10( \| [^\n]+)?$',
]

[[match]]
name = 'castobject #11: and its call keeps the cast in both passes (twice)'
count = 2
regex = '^    waitpid\(a0,\(int4 \*\)&v1,0\);$'
