[image]
arch = 'x86:LE:32:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/go-runtime-types-386/go1.27.2-386-stripped',
    'option dwarf off',
    'option gotypeglobals off',
    'read symbols',
    'load function main.createWord',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/go-runtime-types-386/go1.27.2-386-stripped',
    'option dwarf off',
    'option gotypeglobals on',
    'read symbols',
    'load function main.createWord',
    'decompile',
    'print C',
    'load function main.create',
    'decompile',
    'print C',
]

[[match]]
name = 'Go 1.27 i386 names the recursive node descriptor'
count = 1
regex = 'mallocgcSmallScanNoHeaderSC1\([^\n]*type:main.Node'

[[match]]
name = 'Go 1.27 i386 names the padded record descriptor'
count = 1
regex = 'mallocgcSmallScanNoHeaderSC5\([^\n]*type:main.Record'

[[match]]
name = 'Go 1.27 i386 descriptor names respect the global display option'
count = 1
literal = 'mallocgcSmallScanNoHeaderSC1(8,0x8150528,1)'

[[match]]
name = 'Go 1.27 i386 retains both node allocation and initialization'
count = 2
literal = '*v1 = a0;'
