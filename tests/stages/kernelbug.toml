# Unlace GH-1651: Linux kernel WARN/BUG sites (always on).
#
# Issue: a kernel module plants a `ud2` at every WARN_ON/BUG_ON site and
# describes it in a `__bug_table` entry (trap address, source file and line,
# flags whose bit 0 says the handler resumes). unlace did not read the table, so
# each site printed as `(*(void (*)(void))invalidInstructionException())();
# // jump-as-call` followed by a return: a WARN site that falls through to the
# next instruction appeared to leave the function, and a BUG site that ends the
# path appeared to return.
#
# Stage / sub-stage: P1 program prep reads the table
# (`unlace-analysis/src/analyzers/kernelbug`), recovering the entry layout from
# the module's `.rela__bug_table`; P2 flow classification
# (`p2_lift/unlace_kernelbug.rs`) turns the trap's CALLOTHER into `__WARN(file,
# line)` and falls through, or into `BUG()` followed by a no-return halt. The
# module's undefined `__fentry__` and `__x86_return_thunk` take the cspec
# call-fixups a defined symbol already took.
#
# Fixture: `crates/unlace-analysis/tests/fixtures/kernel_bugtable_x86_64.ko`,
# built against a 7.3 x86-64 kernel (CONFIG_DEBUG_BUGVERBOSE, relative
# pointers, the 16-byte entry with a format field) from
#
#   int kwarn_counter;
#   noinline int kwarn_check(int value)
#   {
#     WARN_ON(value < 0);
#     kwarn_counter += value;
#     BUG_ON(value > 100);
#     return kwarn_counter;
#   }
#
# then stripped of its debug sections. gcc duplicates the add on the WARN path, so the
# fall-through shows as a second `kwarn_counter += a0`.
#
# One pass at the default: #1-#2 the two sites print as the kernel statements,
# #3 the WARN path continues into the add, #4 nothing prints as a call through
# the trap user-op, #5-#6 the profiling hook and return thunk dissolve.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/kernel_bugtable_x86_64.ko',
    'read symbols',
    'load function kwarn_check',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'kernelbug #1: the WARN site prints with its file and line'
count = 1
regex = '^    __WARN\("kwarn_bugsite.c",9\);$'

[[match]]
name = "kernelbug #2: the BUG site prints as the function's last statement"
count = 1
regex = '^  BUG\(\);$'

[[match]]
name = 'kernelbug #3: the WARN path falls through to the add'
count = 2
literal = 'kwarn_counter += a0;'

[[match]]
name = 'kernelbug #4: no site is a call through the trap user-op'
count = 0
literal = 'invalidInstructionException'

[[match]]
name = 'kernelbug #5: the undefined __fentry__ hook dissolves'
count = 0
literal = '__fentry__()'

[[match]]
name = 'kernelbug #6: the undefined return thunk is a return'
count = 0
literal = '__x86_return_thunk'
