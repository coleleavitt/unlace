[script]
commands = [
    'parse line extern int4 isdash(char *s,uint4 *out);',
    'parse line extern int4 isdashu(uint1 *t,uint4 *out);',
    'parse line extern int4 highbit(char *s,uint4 *out);',
    'parse line extern int4 ishigh(char *s,uint4 *out);',
    'parse line extern uint8 strlen(char *s);',
    'option charbyte off',
    'lo fu isdash',
    'decompile',
    'print C',
    'lo fu isdashu',
    'decompile',
    'print C',
    'lo fu highbit',
    'decompile',
    'print C',
    'lo fu ishigh',
    'decompile',
    'print C',
    'lo fu dashlen',
    'decompile',
    'print C',
    'lo fu argbyte',
    'decompile',
    'print C',
    'lo fu sibling',
    'decompile',
    'print C',
    'lo fu counter',
    'decompile',
    'print C',
    'lo fu highcase',
    'decompile',
    'print C',
    'option charbyte on',
    'lo fu isdash',
    'decompile',
    'print C',
    'lo fu isdashu',
    'decompile',
    'print C',
    'lo fu highbit',
    'decompile',
    'print C',
    'lo fu ishigh',
    'decompile',
    'print C',
    'lo fu dashlen',
    'decompile',
    'print C',
    'lo fu argbyte',
    'decompile',
    'print C',
    'lo fu sibling',
    'decompile',
    'print C',
    'lo fu counter',
    'decompile',
    'print C',
    'lo fu highcase',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'charbyte #1: with the option off a string byte compared with a dash is uint1 and the dash a number (isdash) -- the bug; the unsigned-char-table control keeps that form in both passes'
count = 3
literal = 'return v1 == 0x2d;'

[[match]]
name = 'charbyte #2: with the option on the same byte is char and the dash a character literal'
count = 1
literal = "return v1 == '-';"

[[match]]
name = 'charbyte #3: the widened copy of a char byte prints as the zero-extension it is (isdash, ishigh with the option on)'
count = 2
literal = '*out = (uint4)(uint1)v1;'

[[match]]
name = 'charbyte #4: a byte also compared unsigned stays uint1 in both passes'
count = 2
literal = 'return 0x80 <= v1;'

[[match]]
name = 'charbyte #5: uint1 bytes: all eight functions with the option off; the table, unsigned-compare, call-argument, sibling and counter controls with it on'
count = 13
literal = 'uint1 v1;'

[[match]]
name = 'charbyte #6: char bytes: isdash, ishigh and dashlen with the option on'
count = 3
literal = 'char v1;'

[[match]]
name = 'charbyte #7: with the option off a byte compared with 0xe9 is uint1 against a number'
count = 1
literal = 'return v1 == 0xe9;'

[[match]]
name = 'charbyte #8: with the option on the constant takes char with the byte, so the comparison stays true for 0xe9'
count = 1
literal = "return v1 == '\\xe9';"

[[match]]
name = 'charbyte #9: with the option off the byte pushes uint1 * over the pointer strlen made char *'
count = 1
literal = 'int8 dashlen(uint1 *a0,uint4 *a1)'

[[match]]
name = 'charbyte #10: and the call needs a cast back (dashlen off; argbyte and sibling, whose pointers stay uint1 *, in both passes)'
count = 5
literal = 'v2 = strlen((char *)a0);'

[[match]]
name = 'charbyte #11: with the option on the pointer stays char *'
count = 1
literal = 'int8 dashlen(char *a0,uint4 *a1)'

[[match]]
name = 'charbyte #12: and the call takes it as it is'
count = 1
literal = 'v2 = strlen(a0);'

[[match]]
name = 'charbyte #13: the dash compare in dashlen follows the byte'
count = 1
literal = "return v2 + (v1 == '-');"

[[match]]
name = 'charbyte #14: a byte passed straight to a call keeps uint1 and its pointer uint1 * in both passes (argbyte)'
count = 2
literal = 'int4 argbyte(uint1 *a0)'

[[match]]
name = 'charbyte #15: the one-byte argument prints as the uint1 it is, so C zero-extends it as the binary does'
count = 2
literal = 'logit(0x100200,v1);'

[[match]]
name = 'charbyte #16: a sibling byte passed to a call keeps the shared pointer uint1 * in both passes (sibling)'
count = 2
literal = 'int4 sibling(uint1 *a0)'

[[match]]
name = 'charbyte #17: and the sibling argument is read through that uint1 *'
count = 2
literal = 'logit(0x100200,a0[1]);'

[[match]]
name = 'charbyte #18: a counter whose own sum is stored back keeps uint1 * in both passes (counter)'
count = 2
literal = 'int8 counter(uint1 *a0)'

[[match]]
name = 'charbyte #19: and its increment prints with a number, not a char literal'
count = 2
literal = '*a0 = v1 + 1;'

[[match]]
name = 'charbyte #20: a byte that selects a switch keeps uint1 and its pointer uint1 * in both passes (highcase)'
count = 2
literal = 'int4 highcase(uint1 *a0)'

[[match]]
name = 'charbyte #21: so the case labels past 0x7f still match the unsigned switch variable'
count = 2
literal = 'case 0x80:'
