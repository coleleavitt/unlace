# A 64-bit PowerPC ELFv1 caller reloads its TOC with `ld r2,40(r1)` after a
# call that goes through a linker stub. The stub saved the TOC in that slot;
# the caller never writes it. A relative jump table after the call is
# addressed `addis/addi` from the reloaded r2, so with r2 unknown its base is
# unknown and the dispatch is a jump-as-call.
#
# Stage / sub-stage: P4 abi-trust.
# P0 assertion:      option callmechanisms off|auto|on  (default auto).
#
# Synthetic bytes (hand-assembled), with the entry's TOC 0x3000 tracked:
#
#     dispatch:  mflr r0; std r0,16(r1); stdu r1,-128(r1); addi r3,r1,112
#                bl stub; ld r2,40(r1); lwz r9,112(r1); cmplwi r9,3
#                bgt default; addis r10,r2,0; sldi r9,r9,2
#                addi r10,r10,-0x1fc0; lwax r9,r10,r9; add r9,r9,r10
#                mtctr r9; bctr
#                .long 0x10,0x18,0x20,0x28      (table at 0x1040)
#                cases li r3,11 / 22 / 33 / 44; default li r3,-1; epilogue
#     stub:      std r2,40(r1); addi r2,r2,1; b second
#     second:    lbz r3,0(r2); blr
#
# Pass 1 is the shipped default, `auto`. It acts only on an image whose
# ELFv1 function descriptors the loader validated, which a bare byte chunk
# does not have, so it keeps the old model; the CLI test
# `elfv1_toc_reload_after_a_call_keeps_the_jump_table_base` checks the
# default on a linked ELFv1 image. Pass 2 (option callmechanisms on)
# installs the PPC64 default model's `uponreturn` store of r2Save to
# 0x28(r1), so the reload reads back the TOC `bl` saved and the four-case
# switch is recovered. It decompiles an identical copy at 0x2000 (TOC
# 0x4000), because the console keeps the first decompile's jump-as-call
# for a function it decompiles again. Pass 3 (option callmechanisms off)
# is the old model.

[image]
arch = 'PowerPC:BE:64:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'dispatch' },
    { space = 'ram', offset = '0x1090', name = 'second' },
    { space = 'ram', offset = '0x2000', name = 'dispatch_copy' },
    { space = 'ram', offset = '0x2090', name = 'second_copy' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '''
