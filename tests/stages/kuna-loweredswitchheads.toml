[script]
commands = [
    'lo fu main',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'LOWEREDSWITCHHEADS #1: the inlined cascade re-rolls into a switch over argc'
count = 1
literal = 'switch(a0)'

[[match]]
name = 'LOWEREDSWITCHHEADS #2: all fifteen case labels'
count = 15
regex = 'case 0x[0-9a-f]+:'

[[match]]
name = 'LOWEREDSWITCHHEADS #3: the default arm'
count = 1
literal = 'default:'

[[match]]
name = 'LOWEREDSWITCHHEADS #4: no goto ladder into the join remains'
count = 0
literal = 'goto label_1400013da;'

[[match]]
name = 'LOWEREDSWITCHHEADS #5: the last case value is assigned'
count = 1
literal = '0x2a5;'

[[match]]
name = 'LOWEREDSWITCHHEADS #6: the default value is assigned'
count = 1
literal = '0xffffffff;'
