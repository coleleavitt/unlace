# GH-1034, P3 heritage LOAD guards read at renaming.
# gather hands the address of its 64-word table and of each of 64 stack
# structs to reg, so every stack slot is address-tied, then reads the
# table at 256 data-dependent indexes. Under upstream placement the
# heritage pass that first meets those indexed LOADs still guards the
# whole stack, so it builds an address-forced COPY of every address-tied
# stack range in front of every LOAD (81,135 ops created), then propagates
# every one of them away before the pass ends. Renaming instead reads each
# guarded range at its LOAD, one guard COPY is built per Varnode those
# reads reach, and one per guarded range a later read sees on top of its
# stack, 51,311 fewer ops for the same live IR and body. The fixture's
# source and provenance are beside it.
#
# The counts are measured with option stackguard off: gather's canary
# check runs through the 65 calls' INDIRECTs, which the P7 strip has
# followed since its walk reached depth 256, and stripping it moves the
# op counts these heritage assertions compare.

[image]
arch = 'x86:LE:64:default:gcc'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/loadguardreads_x86_64',
    'read symbols',
    'option stackguard off',
    'load function gather',
    'decompile',
    'print C',
    'count pcode',
]

[[match]]
name = 'loadguardreads #1: gather prints'
count = 1
regex = '^int8 gather\(int8 a0,unsigned long a1\)$'

[[match]]
name = 'loadguardreads #2: the 65 calls to reg are kept'
count = 65
literal = 'reg('

[[match]]
name = 'loadguardreads #3: the 64 struct writes each callee may read are kept'
count = 64
regex = '^  v[0-9]+ = v1( \+ (0x)?[0-9a-f]+)?;$'

[[match]]
name = 'loadguardreads #4: the table is read at all 256 indexes'
count = 1
regex = 'v5\[v4\[0xff\] & 0x3f\];$'

[[match]]
name = "loadguardreads #5: the live IR is upstream's"
count = 1
literal = 'Count - pcode = 11538'

[[match]]
name = 'loadguardreads #6: no guard COPY per LOAD per range is built'
count = 0
literal = 'Count - created = 81135'

[[match]]
name = 'loadguardreads #7: a guard COPY is built only per Varnode reached and per guard read again'
count = 1
literal = 'Count - created = 29824'
