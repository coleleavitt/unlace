# GH-781: an exact ARM veneer bound turns a valid tail transfer into
# halt_missing.
#
# A linker veneer loads its target from a literal and jumps through a
# register:
#
#     0x1000 veneer:     ldr r1,[pc,#0]   ; r1 = *(0x1008) = 0x1010
#     0x1004             bx  r1
#     0x1008             .word 0x1010
#     0x1010 arm_helper: add r0,r0,#1
#     0x1014             bx  lr
#
# Jump-table recovery reads the read-only literal and yields a one-entry
# table whose only target is arm_helper's entry.  The follower walked INTO
# arm_helper as a single-case switch; with the veneer's exact extent
# declared (`function bounds 0x1000 0x1008`) the target lies outside it,
# so the case became halt_missing() under a "flows out of bounds" warning.
#
# Stage / sub-stage: P2 "flow-classification".  The P0 assertion is
# `option tailcalljump on|direct`: under `on` such a jump is a tail call
# when the callee's prototype is locked or the destination is outside the
# declared extent; `direct` keeps the flow into the destination.
#
# The image also holds an `ldr pc,[pc,#-4]` veneer to 0x1020, which is not
# a function (out of bounds in both passes); a Thumb veneer at 0x1028 to
# thumb_helper, where neither side has a prototype but the helper is
# outside the extent (a tail call whose target register r1 = 0x1031 is not
# an argument); an
# unbounded veneer at 0x1038 to arm_helper (a tail call because the
# callee's prototype is declared); and an unbounded veneer at 0x1048 to
# plain_helper, which has no prototype: `direct` copies its body in, and
# `on` decompiles plain_helper first, files that it takes and returns one
# value, and takes the tail call (#10).  bare_veneer at 0x1060 is
# the bounded A32 form with no prototype on either side: a tail call whose
# target register r1 = plain_helper is not an argument.  ret_veneer at
# 0x1070 is the unbounded veneer to arm_helper with no prototype of its
# own: a call would drop the value arm_helper returns, since kuna's own
# return recovery never takes a tail call's result, so it keeps the
# copied-in body in both passes.
#
# Pass 1 (option tailcalljump direct) reproduces the bug: #1, #4, #5.
# Pass 2 (on): #2, #3, #6 and #10 are the tail calls; #7 and #9 hold in
# both.

[image]
arch = 'ARM:LE:32:v7'

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '''
00109fe511ff2fe11010000000000000010080e21eff2fe1
04f01fe520100000020080e21eff2fe1
0049084731100000013070470000a0e1
00109fe511ff2fe11010000000000000
00109fe511ff2fe15810000000000000
030080e21eff2fe1
00109fe511ff2fe15810000000000000
00109fe511ff2fe11010000000000000
'''

[script]
commands = [
    'option readonly on',
    'set context TMode 1 [ram,0x1028] [ram,0x1033]',
    'function bounds 0x1000 0x1008 as veneer',
    'function bounds 0x1010 0x1018 as arm_helper',
    'function bounds 0x1018 0x1020 as far_veneer',
    'function bounds 0x1028 0x102c as thumb_veneer',
    'function bounds 0x1030 0x1034 as thumb_helper',
    'function bounds 0x1038 as open_veneer',
    'function bounds 0x1048 as plain_veneer',
    'function bounds 0x1058 as plain_helper',
    'function bounds 0x1060 0x1068 as bare_veneer',
    'function bounds 0x1070 as ret_veneer',
    'parse line extern unsigned int veneer(unsigned int value);',
    'parse line extern unsigned int arm_helper(unsigned int value);',
    'parse line extern unsigned int far_veneer(unsigned int value);',
    'parse line extern unsigned int open_veneer(unsigned int value);',
    'parse line extern unsigned int plain_veneer(unsigned int value);',
    'option tailcalljump direct',
    'lo fu veneer',
    'decompile',
    'print C',
    'lo fu thumb_veneer',
    'decompile',
    'print C',
    'lo fu far_veneer',
    'decompile',
    'print C',
    'lo fu open_veneer',
    'decompile',
    'print C',
    'lo fu plain_veneer',
    'decompile',
    'print C',
    'lo fu bare_veneer',
    'decompile',
    'print C',
    'lo fu ret_veneer',
    'decompile',
    'print C',
    'option tailcalljump on',
    'lo fu veneer',
    'decompile',
    'print C',
    'lo fu thumb_veneer',
    'decompile',
    'print C',
    'lo fu far_veneer',
    'decompile',
    'print C',
    'lo fu open_veneer',
    'decompile',
    'print C',
    'lo fu plain_veneer',
    'decompile',
    'print C',
    'lo fu bare_veneer',
    'decompile',
    'print C',
    'lo fu ret_veneer',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "VENEERTAILCALL #1: direct, a bounded veneer's transfer is lost to halt_missing"
count = 3
regex = 'halt_missing\(\); // warn: Function flow out of bounds: r0x0000(1004 flows to r0x00001010|102a flows to r0x00001030|1064 flows to r0x00001058)'

[[match]]
name = 'VENEERTAILCALL #2: on, a veneer to a declared prototype tail-calls it, bounded or not'
count = 2
literal = 'return arm_helper(value); // tail-call'

[[match]]
name = 'VENEERTAILCALL #3: on, a bounded veneer tail-calls a helper with no prototype, A32 and Thumb'
count = 2
regex = '(thumb|plain)_helper\(a0\); // tail-call'

[[match]]
name = "VENEERTAILCALL #4: direct, the unbounded veneer copies arm_helper's body in"
count = 1
literal = 'return value + 1;'

[[match]]
name = "VENEERTAILCALL #5: direct, the unbounded veneer copies plain_helper's body in"
count = 1
literal = 'return value + 3;'

[[match]]
name = 'VENEERTAILCALL #6: the register that carried the target is not an argument'
count = 0
regex = '_helper\(.*(0x1031|0x1058|plain_helper|arm_helper)'

[[match]]
name = 'VENEERTAILCALL #7: a target that is not a function stays out of bounds'
count = 2
literal = 'halt_missing(); // warn: Function flow out of bounds: r0x00001018 flows to r0x00001020'

[[match]]
name = 'VENEERTAILCALL #8: every recovered tail call is logged'
count = 5
literal = '// tail-call'

[[match]]
name = 'VENEERTAILCALL #9: a veneer with no output of its own keeps the body of a callee that returns a value'
count = 2
literal = 'return a0 + 1;'

[[match]]
name = 'VENEERTAILCALL #10: on, a helper with no prototype is tail-called once its own decompile files what it takes and returns'
count = 1
literal = 'return plain_helper(value); // tail-call'
