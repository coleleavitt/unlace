// SOURCE_DEBUG_PATHS="C:\\src_dir1;C:\\dst_dir1;C:\\src_dir2;C:\\dst_dir2"

// Should the navigation band always show gaps between segments,
// even when addresses are contiguous?
NAVBAND_FORCE_GAPS = NO

// The various ways to "live-edit" names in (folder-enabled) tabular views.
// This is a (possibly `OR`ed combination) of flags, coming from
// https://doc.qt.io/qt-6/qabstractitemview.html#EditTrigger-enum
//
// You can pass either one of the following `#define`'s (e.g., `EditKeyPressed`),
// or a combination - in which case, it has to be a literal number (e.g. 0xC)
//
#define NoEditTriggers   0 // No editing possible.
#define CurrentChanged   1 // Editing start whenever current item changes.
#define DoubleClicked    2 // Editing starts when an item is double clicked.
#define SelectedClicked  4 // Editing starts when clicking on an already selected item.
#define EditKeyPressed   8 // Editing starts when the platform edit key has been pressed over an item (e.g., F2)
#define AnyKeyPressed   16 // Editing starts when any key is pressed over an item.
#define AllEditTriggers 31 // Editing starts for all above actions.

TREE_VIEW_EDIT_TRIGGERS = EditKeyPressed

