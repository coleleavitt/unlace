# unlace option spphistack (unlace#975): a va_list walk that starts at the
# incoming stack pointer is a local holding a stack address, not the stack
# pointer register.
#
# Hexagon passes the variadic arguments on the stack at the incoming sp
# (r29); the unrolled walk's pointer is a phi of sp(i) and the stack address
# after the unrolled part, and printed
#     Register00000074 = (int4 *)&Stack00000020; ... v3 = *(int4 *)Register00000074;
#
# Stage: P6 variables and merge (merge-aggressiveness), option spphistack
# off|on.  Pass 1 (off) pins the old print, where the loop pointer takes the
# stack pointer's addrtied storage name; pass 2 (on, the default) merges the
# phi with PTRSUB(sp, 0), which prints as a stack reference.
#
# Source (zig cc -target hexagon-freestanding -O2 -c, .text):
#     #include <stdarg.h>
#     int v2(int n, ...) { va_list ap; va_start(ap, n); int s = 0;
#         for (int i = 0; i < n; i++) s += va_arg(ap, int); va_end(ap); return s; }
#
# Assert #1: off, the loop pointer prints under the stack pointer's storage.
# Assert #2: only the off pass names that storage at all.
# Assert #3: on, the walk starts from a stack reference held in a local.

[image]
arch = 'Hexagon:LE:32:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'v2' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '''
