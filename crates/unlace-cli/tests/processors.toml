# The Imagination META language decompiles a GNU as-assembled raw image: a counted loop
# over a pointer with post-increment loads, and a caller that saves registers with MSETL,
# calls through CALLR and builds a 32-bit constant from MOVT and ADD.
[[family]]
name = "meta"
language = "META:LE:32:default"
base = "0"
fixture = "crates/unlace-cli/tests/fixtures/meta/sum_call.bin"

# `sum`: D1Ar1 counts down, GETD D0Ar6,[D0Ar2++] walks the array, MOV PC,D1RtP returns.
[[family.function]]
test = "meta_counted_loop_decompiles"
address = "0x0"
expect = [
    "int sub_0(int a0,int *a1)",
    "while (0 < a0) {",
    "v1 += *a1;",
    "return v1;",
]

# `callit`: CALLR D1RtP links the call, MOVT+ADD fold into 0x12345678, SETD [A1GbP+#8].
[[family.function]]
test = "meta_call_and_constant_decompile"
address = "0x24"
expect = [
    "v1 = sub_0();",
    "(v2 + 8) = 0x12345678;",
    "return v1 + a0;",
]

# The MMIX language decompiles GCC (`mmix`, -O2) output: a compare-and-branch routine, and a
# PUSHJ call whose argument travels through the register stack (caller's $3 is the callee's
# $0) and whose result comes back in the caller's $2.
[[family]]
name = "mmix"
language = "MMIX:BE:64:default"
base = "0x100"
image = "mmix"

[[family.function]]
test = "mmix_compare_branch_decompiles"
address = "0x100"
expect = [
    "long sub_100(long a0,long a1)",
    "return a0 * 3 + a1;",
    "return a1 - a0;",
]

[[family.function]]
test = "mmix_pushj_call_decompiles"
address = "0x15c"
expect = [
    "long sub_15c(long a0)",
    "return sub_154(a0 + 1) + 2;",
]

