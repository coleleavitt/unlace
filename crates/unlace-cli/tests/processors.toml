# C2000 family languages label peripheral registers from C2000Ware's device headers:
# movw DP,#page; mov @off,#0x1234; lretr writes EPwm1's TBPRD, at 0x4063 on the Type-4 ePWM parts
# and at 0x6805 on the older ones (F28E12x and F28P65x place ePWM elsewhere).
[[family]]
name = "c28x_family_names"
language = ["tms320c28:LE:32:f280013x", "tms320c28:LE:32:f280015x", "tms320c28:LE:32:f28002x", "tms320c28:LE:32:f28003x", "tms320c28:LE:32:f28004x", "tms320c28:LE:32:f2807x", "tms320c28:LE:32:f2837xd", "tms320c28:LE:32:f2837xs", "tms320c28:LE:32:f2838x", "tms320c28:LE:32:f28p551x", "tms320c28:LE:32:f28p55x"]
base = "0x8000"
image = "c28x_epwm1_tbprd"

[[family.function]]
test = "c28x_family_names_epwm"
address = "0x8000"
expect = ["EPwm1Regs_TBPRD = 0x1234;"]

[[family]]
name = "c28x_family_names_classic"
language = ["tms320c28:LE:32:f2802x", "tms320c28:LE:32:f2803x", "tms320c28:LE:32:f2805x", "tms320c28:LE:32:f2806x", "tms320c28:LE:32:f2823x", "tms320c28:LE:32:f2833x"]
base = "0x8000"
image = "c28x_epwm1_tbprd_classic"

[[family.function]]
test = "c28x_family_names_classic_epwm"
address = "0x8000"
expect = ["EPwm1Regs_TBPRD = 0x1234;"]

# The native C-SKY ABIv2 language decompiles code built with csky-elf-as -mcpu=ck810:
# a load/accumulate loop closed by a 32-bit bnez, a push/bsr/pop call, and the
# C-flag compares feeding inct and bf.
[[family]]
name = "csky"
language = "CSKY:LE:32:v2"
base = "0x8000"
fixture = "crates/unlace-cli/tests/fixtures/csky/sum_call_cmp.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "csky_load_loop_decompiles"
address = "0x8000"
expect = [
    "v1 += *a0++;",  # ld.w, addu and the pointer increment
    "} while (a1);",  # bnez closes the loop
    "dat_20000000 = v1;",  # movih + st.w
]

[[family.function]]
test = "csky_call_with_register_arguments_decompiles"
address = "0x801c"
expect = [
    "return sub_8018(7,5) << 2;",  # r0/r1 arguments, bsr, and pop returning through lr
]

[[family.function]]
test = "csky_c_flag_compares_decompile"
address = "0x802a"
expect = [
    "if (a0 < a1)",  # cmplt sets C, inct consumes it
    "a0 = a1;",
]

[[family.function]]
test = "csky_unsigned_compare_branch_decompiles"
address = "0x8032"
expect = [
    "if (a0 <= 99)",  # cmphsi + bf
    "return 99;",
]

# C-SKY FPUv2 (CSKY:LE:32:v2) built with csky-elf-as -mcpu=ck810f: single-precision
# multiply-add through fmtvrl/fmfvrl, loads and stores, a compare with zero feeding bt,
# and the int-to-double conversion.
[[family]]
name = "csky_fpuv2"
language = "CSKY:LE:32:v2"
base = "0x8000"
fixture = "crates/unlace-cli/tests/fixtures/csky/fpuv2.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "csky_fpuv2_multiply_add_decompiles"
address = "0x8000"
expect = [
    "return a0 * a1 + a0;",  # fmuls + fadds on the moved-in arguments
]

[[family.function]]
test = "csky_fpuv2_compare_and_convert_decompiles"
address = "0x8028"
expect = [
    "if (!(0.0f <= a0))",  # fcmpzhss + bt
    "return (int)a0;",  # fstosi.rz
]

[[family.function]]
test = "csky_fpuv2_int_to_double_decompiles"
address = "0x8040"
expect = [
    "*a1 = (double)a0;",  # fsitod + fstd
]

# C-SKY FPUv3 (CSKY:LE:32:ck860) built with csky-elf-as -mcpu=ck860f: fr16-fr31, double
# multiply, and an fmovi constant.
[[family]]
name = "csky_fpuv3"
language = "CSKY:LE:32:ck860"
base = "0x8000"
fixture = "crates/unlace-cli/tests/fixtures/csky/fpuv3.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "csky_fpuv3_double_multiply_decompiles"
address = "0x8016"
expect = [
    "*a1 = a0->field_0x0 * a0->field_0x8;",  # fld.64 into fr0 and fr17, fmul.64, fst.64
]

[[family.function]]
test = "csky_fpuv3_fmovi_constant_decompiles"
address = "0x8028"
expect = [
    "*a0 = *a0 * 0.5f;",  # fmovi.32 fr1, 0.5
]

# C-SKY VDSP (CSKY:LE:32:ck810v) built with csky-elf-as -mcpu=ck810v: 128-bit vector
