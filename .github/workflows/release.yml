name: Release binaries

# Builds the user-facing binaries (unlace + its engine siblings decomp_dbg and
# slacomp) for Linux, macOS, and Windows, then tags the commit vMAJOR.MINOR and
# publishes a GitHub Release with the archives plus a platform-independent
# compiled SLEIGH spec tree (the engine needs .sla files at runtime). The
# version scheme -- VERSION file = MAJOR, one past the last release tag = MINOR
# -- lives in scripts/version.sh and docs/release.md.
#
# The release also ships a ready-to-install UnlaceDecompiler Ghidra extension
# zip with prebuilt unlace_ghidra backends for every platform (the ghidra-ext
# job), so airgapped users can install without cargo or network access.
#
# Cadence: ONE release a night, batching whatever landed that day, not one per
# merge. A busy day used to publish ~18 releases and ~18 tags.
#
# No "did anything change?" guard is needed: a commit that already carries a
# release tag reports that tag's version, so a nightly run on an unchanged main
# computes the same MAJOR.MINOR, the `version` job sees that tag already exists,
# and build/specs/release all skip. Quiet days cost one 30-second job and
# publish nothing.

# unlace: releases are cut by hand for now (no nightly schedule, no VERSION-push trigger).
on:
  # Cut a release on demand from the Actions tab (also re-runs a failed one).
  workflow_dispatch:

# `gh release create` pushes the tag and the release.
permissions:
  contents: write

# One release at a time, in order; never cancel a half-published one.
concurrency:
  group: release
  cancel-in-progress: false

# The Ghidra release the extension zip is built against (and version-locked to;
# other 12.x installs need "Install Anyway" at the version-mismatch dialog).
# The asset filename embeds a build date not derivable from the version, so the
# full URL is pinned alongside it -- bump both together to retarget.
env:
  GHIDRA_VERSION: "12.1.2"
  GHIDRA_ZIP_URL: "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip"

jobs:
  # Compute MAJOR.MINOR once; everything downstream consumes it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the minor number is read from the release tags

      - name: Compute MAJOR.MINOR and check the tag is free
        id: ver
        run: |
          ver="$(bash scripts/version.sh)"
          echo "version=$ver" | tee -a "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag v$ver already exists -- skipping (re-run of a released commit)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [version, specs]
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          # Fully static (musl): no glibc dependency, runs on any Linux. unlace
          # pulls no C via a `cc`-crate dep, so the musl target links
          # self-contained -- `rustup target add` is the only setup needed.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Baked into `unlace --version` via option_env! in unlace-cli.
      UNLACE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) + target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # The one third-party action here (same as pages.yml) — the de-facto
      # standard cargo cache.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The compiled SLEIGH tree, laid over the checkout's specs/: the embed-specs
      # build script uses each current prebuilt .sla as is (it would otherwise
      # compile them through the .sla cache).
      - uses: actions/download-artifact@v4
        with:
          name: unlace-specs
          path: specs-dl

      - name: Install the compiled SLEIGH tree
        shell: bash
        run: tar xzf specs-dl/unlace-v${{ needs.version.outputs.version }}-specs.tar.gz

      # `unlace` is the whole release: the console and the SLEIGH compiler are
      # built in, and embed-specs carries the compiled SLEIGH tree.
      - name: Build release binaries
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p unlace-cli -p unlace-ghidra --features unlace-cli/embed-specs

      # x86_64-apple-darwin is cross-compiled on the arm64 runner; skip running it.
      - name: Smoke test (unlace --version reports the release version)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          out="$(./target/${{ matrix.target }}/release/unlace$ext --version)"
          echo "$out"
          [ "$out" = "unlace ${{ needs.version.outputs.version }}" ]

      # The binary alone, away from the checkout and with no spec override,
      # must decompile: nothing beside it is shipped.
      - name: Smoke test (unlace alone decompiles)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          alone="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/unlace$ext" "$alone/"
          fixture="$PWD/crates/unlace-analysis/tests/fixtures/fauxware"
          cd "$alone"
          out="$(env -u UNLACE_SPECS -u SLEIGHHOME -u UNLACE_ROOT ./unlace$ext decompile "$fixture" main)"
          echo "$out"
          grep -q 'main(' <<<"$out"

      - name: Package archive
        shell: bash
        run: |
          ver="${{ needs.version.outputs.version }}"
          bindir="target/${{ matrix.target }}/release"
          pkg="unlace-v${ver}-${{ matrix.name }}"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p "dist/$pkg"
          cp "$bindir/unlace$ext" "dist/$pkg/"
          cp LICENSE NOTICE "dist/$pkg/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$pkg.zip" "$pkg" >/dev/null
          else
            tar czf "$pkg.tar.gz" "$pkg"
          fi
          rm -r "$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: unlace-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      # The unlace_ghidra backend for the Ghidra extension zip (ghidra-ext job).
      # Not named unlace-* on purpose: the release job downloads pattern unlace-*
      # and must not attach these raw binaries as assets. Artifact uploads drop
      # unix permissions; ghidra-ext restores the exec bits when staging.
      - name: Stage unlace_ghidra for the extension job
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p ghidra-bin
          cp "target/${{ matrix.target }}/release/unlace_ghidra$ext" ghidra-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: ghidra-bin-${{ matrix.name }}
          path: ghidra-bin/*
          if-no-files-found: error

  # The compiled SLEIGH tree -- .sla files are platform-independent, so build
  # once. Every build job embeds it into unlace; it also ships as its own asset
  # for UNLACE_SPECS and the nightly baseline.
  specs:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Compile every .slaspec -> .sla
        run: cargo build --release -p unlace-slacomp && ./target/release/slacomp -a specs

      - name: Package the runtime SLEIGH tree
        run: |
          mkdir -p dist
          tar czf "dist/unlace-v${{ needs.version.outputs.version }}-specs.tar.gz" specs

      - uses: actions/upload-artifact@v4
        with:
          name: unlace-specs
          path: dist/*
          if-no-files-found: error

  # The ready-to-install UnlaceDecompiler Ghidra extension: one fat zip carrying
  # prebuilt unlace_ghidra backends for all five platforms, built with Ghidra's
  # own support/buildExtension.gradle against the pinned Ghidra release (which
  # stamps the extension version so the installer's version gate matches).
  # The zip must carry unix modes with 0755 on the four unix binaries --
  # Ghidra's extension installer re-applies them at install time. Gradle 9
  # normalizes archive modes (reproducible archives), so the extension's
  # build.gradle pins 0755 on the unlace_ghidra entries; the zipinfo step below
  # is the gate. unlace_ghidra needs no .sla files at runtime (all specs arrive
  # over the wire), so the zip is fully self-contained -- it installs
  # airgapped.
  ghidra-ext:
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ghidra-bin-*
          path: ghidra-bins

      # The key derives from the URL's basename (version + build date), so a
      # re-spun same-version asset -- only GHIDRA_ZIP_URL bumped -- can never
      # be shadowed by a stale cached zip.
      - name: Compute the Ghidra cache key
        id: ghidra-key
        run: echo "key=ghidra-zip-$(basename "$GHIDRA_ZIP_URL" .zip)" >> "$GITHUB_OUTPUT"

      - name: Cache the Ghidra release zip
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: ghidra-dist
          key: ${{ steps.ghidra-key.outputs.key }}

      - name: Download Ghidra ${{ env.GHIDRA_VERSION }}
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ghidra-dist
          curl -fL --retry 3 -o ghidra-dist/ghidra.zip "$GHIDRA_ZIP_URL"

      - name: Unzip Ghidra
        run: unzip -q ghidra-dist/ghidra.zip -d ghidra-install

      - name: Stage the per-platform unlace_ghidra binaries
        run: |
          ext=integrations/ghidra/UnlaceDecompiler
          install -D -m 755 ghidra-bins/ghidra-bin-linux-x86_64/unlace_ghidra "$ext/os/linux_x86_64/unlace_ghidra"
          install -D -m 755 ghidra-bins/ghidra-bin-linux-arm64/unlace_ghidra "$ext/os/linux_arm_64/unlace_ghidra"
          install -D -m 755 ghidra-bins/ghidra-bin-macos-x86_64/unlace_ghidra "$ext/os/mac_x86_64/unlace_ghidra"
          install -D -m 755 ghidra-bins/ghidra-bin-macos-arm64/unlace_ghidra "$ext/os/mac_arm_64/unlace_ghidra"
          install -D -m 644 ghidra-bins/ghidra-bin-windows-x86_64/unlace_ghidra.exe "$ext/os/win_x86_64/unlace_ghidra.exe"

      # Ghidra 12.x needs Java 21 (runner default is 17); Gradle >= 8.5 is
      # required and the runner's preinstalled Gradle satisfies it (verified
      # against 9.7.0 and 8.5). GHIDRA_INSTALL_DIR is passed as an env var
      # because build.gradle gives it precedence over the -P property.
      - name: Build the extension zip
        working-directory: integrations/ghidra/UnlaceDecompiler
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export GHIDRA_INSTALL_DIR="$GITHUB_WORKSPACE/ghidra-install/ghidra_${GHIDRA_VERSION}_PUBLIC"
          gradle buildExtension

      # Install-correctness gate: all five os/ binaries present, the four unix
      # ones mode 0755 (Ghidra's installer re-applies exactly these bits), the
      # version gate satisfied. Then rename so the asset states both versions.
      - name: Verify the zip and stage it for release
        run: |
          zip="$(ls integrations/ghidra/UnlaceDecompiler/dist/ghidra_*_UnlaceDecompiler.zip)"
          zipinfo "$zip"
          listing="$(zipinfo "$zip")"
          for p in linux_x86_64 linux_arm_64 mac_x86_64 mac_arm_64; do
            echo "$listing" | grep -E "^-rwxr-xr-x .* UnlaceDecompiler/os/$p/unlace_ghidra$"
          done
          echo "$listing" | grep -E " UnlaceDecompiler/os/win_x86_64/unlace_ghidra\.exe$"
          [ "$(zipinfo -1 "$zip" | cut -d/ -f1 | sort -u)" = "UnlaceDecompiler" ]
          unzip -p "$zip" UnlaceDecompiler/extension.properties | grep -qx "version=$GHIDRA_VERSION"
          mkdir -p dist
          cp "$zip" "dist/unlace-v${{ needs.version.outputs.version }}-UnlaceDecompiler-ghidra_${GHIDRA_VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: unlace-ghidra-extension
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build, specs, ghidra-ext]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # unlace-* only: the ghidra-bin-* artifacts are job-to-job plumbing for
      # ghidra-ext, not release assets.
      - uses: actions/download-artifact@v4
        with:
          pattern: unlace-*
          path: dist
          merge-multiple: true

      - name: Create tag + GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ needs.version.outputs.version }}"
          ls -l dist/
          # shellcheck disable=SC2016  # the backticks in the notes are Markdown
          gh release create "v$ver" \
            --target "$GITHUB_SHA" \
            --title "unlace v$ver" \
            --generate-notes \
            --notes "$(printf 'Each archive ships `unlace`, one self-contained binary: the decompiler console and the SLEIGH compiler are built in, and so are the compiled SLEIGH specs (unpacked once into the user cache directory on first use). `unlace-v%s-specs.tar.gz` is the same spec tree, for `UNLACE_SPECS`. See docs/release.md.\n\n`unlace-v%s-UnlaceDecompiler-ghidra_%s.zip` is the ready-to-install UnlaceDecompiler extension for **Ghidra %s** (in Ghidra: File -> Install Extensions... -> `+` -> pick the zip -> restart -> enable UnlaceDecompilerPlugin). It bundles prebuilt `unlace_ghidra` backends for Linux x86_64/arm64, macOS x86_64/arm64, and Windows x86_64, so it installs fully airgapped: the Ghidra release zip plus this zip are the only two files needed -- no network, no Rust toolchain. The zip is version-locked to Ghidra %s; other Ghidra 12.x versions can choose "Install Anyway" at the version-mismatch dialog (compatibility unverified).' "$ver" "$ver" "$GHIDRA_VERSION" "$GHIDRA_VERSION" "$GHIDRA_VERSION")" \
            dist/*
