# unlace issue testcase: a predicated call's fall-through is not a function
# (default correctness fix, no option).
#
# Issue:      unlace GH-299 - mid-function entries on ARM firmware; a
#             conditional `bl` made the instruction after it a function, and
#             three such sites made the callee no-return.
# Stage:      P1 code/data partition - the Listing walk's call targets
#             (`listing/classify.rs`).
#
# The XML wrapper only provides the harness architecture.  The script loads
# `condcall_le32` (generator `condcall_le32.py` beside it): a stripped Thumb
# ELF whose `_start` calls f1, f2 and f3, each `bl ext; cmp r0,#n; it gt;
# blgt ext; pop {r7,pc}`, and `other` at 0x8152, which calls `ext` (a plain
# `adds r0,#1; bx lr` at 0x8164) twice.  The `blgt` lifts to a branch to the
# next instruction ahead of its call, and that branch was read as a second
# call target: the `pop` after each `blgt` became sub_8130, sub_8140 and
# sub_8150, and the no-return discovery pass, seeing three calls to `ext`
# followed by a function start, made `ext` no-return and cut `other` off
# after its first call.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/condcall_le32',
    'mode aggressive',
    'read symbols',
    'functions',
    'load function sub_8152',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'UNLACE-CONDCALL #1: the instruction after a blgt is not a function'
count = 0
regex = '0x81[345]0 sub_81[345]0'

[[match]]
name = 'UNLACE-CONDCALL #2: the predicated callers are functions'
count = 3
regex = '0x81[234]2 sub_81[234]2'

[[match]]
name = 'UNLACE-CONDCALL #3: ext returns, so other makes both calls'
count = 1
literal = 'return sub_8164(v1 + 1) + v1;'

[[match]]
name = 'UNLACE-CONDCALL #4: no call to ext is no-return'
count = 0
literal = 'no-return'
