[image]
arch = 'sparc:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'preload' },
    { space = 'ram', offset = '0x1100', name = 'acquire' },
    { space = 'ram', offset = '0x1200', name = 'mutate' },
    { space = 'ram', offset = '0x1300', name = 'consume' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '9de3bfa04000003f9007bffcf007bffc80a220000248000801000000b2102017f227bffc400000779007bffc400000b590100018b0102007f027bffc400000719007bffcf007bffc81c7e00881e80000'

[[image.bytes]]
space = 'ram'
offset = '0x1100'
readonly = true
hex = '81c3e00801000000'

[[image.bytes]]
space = 'ram'
offset = '0x1200'
readonly = true
hex = '81c3e00801000000'

[[image.bytes]]
space = 'ram'
offset = '0x1300'
readonly = true
hex = '81c3e00801000000'

[script]
commands = [
    'parse line extern int4 preload(void);',
    'parse line extern int2 acquire(volatile int4 *);',
    'parse line extern void mutate(volatile int4 *);',
    'parse line extern void consume(int4);',
    'load function preload',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'preloaded SPARC stack read: capture stays before branch'
count = 1
regex = [
    'acquire\([^;]*;',
    'v[0-9]+ = v[0-9]+;',
    'if \(',
]

[[match]]
name = 'preloaded SPARC stack read: guarded consumer retains saved value'
count = 1
regex = [
    'mutate\([^;]*;',
    'consume\(v[0-9]+\);',
]

[[match]]
name = 'preloaded SPARC stack read: volatile slot retained'
min = 1
max = 99
literal = 'volatile int'
