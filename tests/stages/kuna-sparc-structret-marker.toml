# Independent assembly regression.
# Stage: P2 lift/flow.
# P0 assertion: option sparcstructret on. The disabled behavior remains covered by gh6882-sparcstructret.xml.
# .text
# .global aggregate_marker
# .type aggregate_marker,@function
# aggregate_marker:
#  save %sp, -112, %sp
#  add %fp, -16, %l0
#  st %l0, [%sp+64]
#  call make_pair
#  nop
#  unimp 8
#  ld [%fp-16], %i0
#  add %i0, 7, %i0
#  ret
#  restore
# .global make_pair
# .type make_pair,@function
# make_pair:
#  save %sp, -96, %sp
#  ld [%fp+64], %l0
#  mov 11, %l1
#  st %l1, [%l0]
#  st %g0, [%l0+4]
#  jmp %i7+12
#  restore
# .size make_pair, .-make_pair
# .size aggregate_marker, .-aggregate_marker

[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'aggregate_marker' },
    { space = 'ram', offset = '0x10028', name = 'make_pair' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '''
9de3bf90a007bff0e023a040400000070100000000000008f007bff0b0062007
81c7e00881e800009de3bfa0e007a040a210200be2240000c024200481c7e00c
81e80000
'''

[script]
commands = [
    'parse line typedef struct Pair { int first; int second; } Pair;',
    'parse line extern int aggregate_marker(void);',
    'parse line extern Pair make_pair(void);',
    'option sparcstructret on',
    'lo fu aggregate_marker',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'marker has no executable trap'
count = 0
literal = 'IllegalInstructionTrap'

[[match]]
name = 'continuation still uses aggregate result'
count = 1
literal = '.first + 7;'
