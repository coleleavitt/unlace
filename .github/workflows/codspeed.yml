name: CodSpeed

# Benchmarks in decompiler/crates/unlace-bench, measured by CodSpeed's CPU
# simulation on every push to main and every PR. workflow_dispatch lets CodSpeed
# backfill a baseline.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable) and cargo-codspeed
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          profile: minimal
          bins: cargo-codspeed
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decompiler
          key: codspeed
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The benches read the compiled .sla tree from specs/; same cache as tests.yml.
      - name: Restore the compiled SLEIGH specs
        id: sla
        uses: actions/cache/restore@v4
        with:
          path: specs/**/*.sla
          key: sla-v1-${{ runner.os }}-${{ hashFiles('specs/**/*.slaspec', 'specs/**/*.sinc', 'decompiler/Cargo.lock', 'decompiler/crates/unlace-slacomp/**', 'decompiler/crates/unlace-sleigh/**', 'decompiler/crates/unlace-base/**', 'decompiler/crates/unlace-num/**') }}

      - name: Compile the SLEIGH specs
        if: steps.sla.outputs.cache-hit != 'true'
        run: make specs

      - name: Save the compiled SLEIGH specs
        if: steps.sla.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: specs/**/*.sla
          key: ${{ steps.sla.outputs.cache-primary-key }}

      - name: Build the benchmarks
        working-directory: decompiler
        run: cargo codspeed build -p unlace-bench

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          working-directory: decompiler
          run: cargo codspeed run -p unlace-bench
