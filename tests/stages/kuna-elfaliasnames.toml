# An ELF function name that shares its address with an earlier symbol still
# selects that function (loader-tier fix, no option).
#
# The XML wrapper only provides the harness architecture. The script clears it
# and loads a real ARM32 shared object built from committed assembly
# (`armveneeralias_le32.s`, clang + ld.lld): the exported `answer` sits at the
# same address as the local ARM veneer name `__answer_from_arm`, which comes
# first in `.symtab`, and a Thumb `caller` reaches `answer` through the PLT, so
# `answer` also labels the PLT stub.
#
# The loader used to keep one name per address, so `answer` survived only on
# the PLT stub and `load function answer` decompiled the stub:
# `(*dat_30274)(); // jump-as-call`. The dropped names are now kept as aliases
# of the entry, and the definition wins over its import stub, so both names
# reach the veneer's body. The reported name at that address, and the name
# call sites print, stay `__answer_from_arm` / `answer` as before.
#
# The second load is the guard on the other side: in `elfaliasclash_x86_64`
# (gcc, `elfaliasclash_x86_64.c` + `elfaliasclash_b_x86_64.c`) `shared` is
# both a global alias of `twin` and a static function of its own. An alias
# never outbids a function of the same name, so `shared` still selects the
# static `x - 5`, as it did before the aliases existed, instead of failing as
# ambiguous.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/armveneeralias_le32',
    'read symbols',
    'load function answer',
    'decompile',
    'print C',
    'load function __answer_from_arm',
    'decompile',
    'print C',
    'load function caller',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elfaliasclash_x86_64',
    'read symbols',
    'load function shared',
    'decompile',
    'print C',
    'load function twin',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ELFALIASNAMES #1: the exported name no longer selects the PLT stub'
count = 0
literal = 'jump-as-call'

[[match]]
name = 'ELFALIASNAMES #2: the exported name decompiles the definition'
count = 1
literal = 'unsigned int answer(void)'

[[match]]
name = 'ELFALIASNAMES #3: both names reach the same body'
count = 2
literal = 'return 7;'

[[match]]
name = 'ELFALIASNAMES #4: the call through the PLT keeps its name'
count = 1
literal = 'answer();'

[[match]]
name = 'ELFALIASNAMES #5: an alias spelled like a static function still selects that function'
count = 1
literal = 'return a0 + -5;'

[[match]]
name = "ELFALIASNAMES #6: the alias's own definition keeps its name and body"
count = 1
literal = 'return a0 * 3 + 1;'

[[match]]
name = 'ELFALIASNAMES #7: no name is reported ambiguous'
count = 0
literal = 'ambiguous'
