# GH-839 (unlace): the AArch64 guard for the frame-reload rule (unlace_reloadarg.rs).
# clang 14 -O2 for aarch64-linux-gnu of
#   void fa1(void){ use(__builtin_frame_address(1)); }
#   void fa2(int k){ printf("%d %p\n", k, __builtin_frame_address(1)); }
#   void fa3(void){ use3(__builtin_frame_address(0),
#                        __builtin_frame_address(1), __builtin_return_address(0)); }
#   void fa4(void){ void *p = __builtin_frame_address(1); use(0); use(p); }
# relocated flat at 0x100000 (the format string at 0x100100; use, printf and
# use3 are symbols with no bytes).  Each function reads the caller's frame
# pointer with ldr xN,[x29], a LOAD from the frame whose slot holds the
# incoming x29.  x29 is callee-saved, so the value is real and must be
# passed.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'fa1' },
    { space = 'ram', offset = '0x100014', name = 'fa2' },
    { space = 'ram', offset = '0x100034', name = 'fa3' },
    { space = 'ram', offset = '0x100054', name = 'fa4' },
    { space = 'ram', offset = '0x100200', name = 'use' },
    { space = 'ram', offset = '0x100210', name = 'printf' },
    { space = 'ram', offset = '0x100220', name = 'use3' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '''
fd7bbfa9fd030091a00340f9fd7bc1a87c000014fd7bbfa9fd030091a20340f9
e103002a0000009000000491fd7bc1a878000014fd7bbfa9fd030091a10340f9
ff2003d5e0031daae2031eaafd7bc1a874000014fd7bbea9f30b00f9fd030091
e0031faab30340f966000094e00313aaf30b40f9fd7bc2a862000014
'''

[[image.bytes]]
space = 'ram'
offset = '0x100100'
readonly = true
hex = '25642025700a00'

[script]
commands = [
    'parse line extern int printf(char *f, ...);',
    'lo fu fa1',
    'decompile',
    'print C',
    'lo fu fa2',
    'decompile',
    'print C',
    'lo fu fa3',
    'decompile',
    'print C',
    'lo fu fa4',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'GH839-A64 #1: fa1 and fa4 pass the saved frame pointer'
count = 2
literal = 'use(v1); // tail-call'

[[match]]
name = 'GH839-A64 #2: fa2 prints the saved frame pointer'
count = 1
literal = 'printf("%d %p\n",a0,v1);'

[[match]]
name = 'GH839-A64 #3: fa3 passes the saved frame pointer'
count = 1
literal = 'use3(v1,v2);'
