# Workspace for the decompiler, SLEIGH toolchain, and frontends.

# `cargo install` (or `cargo install --path .`) from the repo root installs the `unlace`
# binary to ~/.cargo/bin. It is the same program as crates/unlace-cli's binary; it finds this
# checkout's specs/ through the path it was built from.
[package]
name = "unlace-install"
description = "Installs the unlace CLI: run `cargo install` in the repo root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false
autoexamples = false
autotests = false
autobenches = false
build = false

[[bin]]
name = "unlace"
path = "crates/unlace-cli/src/main.rs"
test = false
bench = false
doc = false

[features]
# `cargo install --features embed-specs`: carry the compiled SLEIGH tree inside the binary,
# so it runs without this checkout.
embed-specs = ["unlace-cli/embed-specs"]

[dependencies]
unlace-cli.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]
# The dev-only dynamic-link facade is built only through a front-end's `dynamic_linking` feature.
exclude = ["crates/unlace-decomp-dylib"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
thiserror = "2.0"
flate2 = "1.1"
lzma-rs = "0.3"
brotli-decompressor = "5"
smallvec = "1.15"
slotmap = "1.0"
egg = { version = "0.11", default-features = false, features = ["deterministic"] }
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "pe", "macho", "coff", "archive", "std", "compression", "write"] }
regex = "1"
memchr = "2"
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing", "clone-impls", "proc-macro"] }
cpp_demangle = "0.5"
rustc-demangle = "0.1"
msvc-demangler = "0.11"
undname = "2.1"
gimli = { version = "0.33", default-features = false, features = ["read", "std"] }
pdb = "0.8"
flirt-sig = { version = "=0.2.1", default-features = false }
unlace-base = { path = "crates/unlace-base" }
unlace-num = { path = "crates/unlace-num" }
unlace-sleigh = { path = "crates/unlace-sleigh" }
unlace-middle = { path = "crates/unlace-middle" }
unlace-lift = { path = "crates/unlace-lift" }
unlace-structure = { path = "crates/unlace-structure" }
unlace-ctree = { path = "crates/unlace-ctree" }
unlace-bandb-base = { path = "crates/unlace-bandb-base" }
unlace-bandb-core = { path = "crates/unlace-bandb-core" }
unlace-bandb = { path = "crates/unlace-bandb" }
unlace-emit = { path = "crates/unlace-emit" }
unlace-decomp = { path = "crates/unlace-decomp" }
unlace-analysis = { path = "crates/unlace-analysis" }
unlace-console = { path = "crates/unlace-console" }
unlace-project = { path = "crates/unlace-project" }
unlace-idb = { path = "crates/unlace-idb" }
unlace-cli = { path = "crates/unlace-cli" }
unlace-slacomp = { path = "crates/unlace-slacomp" }
unlace-lumina = { path = "crates/unlace-lumina" }
unlace-stagefile = { path = "crates/unlace-stagefile" }
unlace-decomp-dylib = { path = "crates/unlace-decomp-dylib" }

[workspace.lints.clippy]
# Ordered collections keep output decisions deterministic; see clippy.toml.
disallowed_types = "deny"

# Exercise real-image workloads without disabling debug validation. On dev, not test:
# `cargo test` inherits it, so builds and test runs share every compiled crate.
[profile.dev]
opt-level = 1

# Thin LTO: since the crate split, calls between the decompiler crates inline only through LTO.
# Without it, decompile-all on grep/sort/libselinux ran 3-4% slower than the single crate did.
[profile.release]
lto = "thin"
