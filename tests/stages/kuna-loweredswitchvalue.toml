# loweredswitchvalue (GH-468): a re-rolled lowered switch must dispatch on the
# value its cascade compared, or be withdrawn.
#
# `loweredswitch` detects a comparison cascade on the simplified SSA graph, where
# every compare reads one value, and records that value's home storage. The
# install re-lifts raw p-code on the restart and points the synthesized BRANCHIND
# at storage at the cascade head, and that storage need not hold the value
# there.
#
# Bytes: `dispatch` @ 0xd380 is gcc -O2's tail-call dispatcher on its first
# parameter, from a real x86-64 ELF (kuna-re-dataset bin_213). It compiles the
# argument once (`mov eax,edi`) and reuses EDI (the first-parameter register) for
# the tail calls' own argument (`mov rdi,rsi`) before the compares run, so EDI -
# the recorded home storage, holds the SECOND parameter by the time the switch
# would read it. The tail-call targets are stubbed `ret`.
#
# Read at the head, EDI would make the switch dispatch on the second parameter
# (`v1 = (unsigned int)a1; switch(v1)`), which the disassembly never does. The
# install reads EAX, what `cmp eax,c` reads, and the restart proves the BRANCHIND
# input is the first parameter, so it dispatches on the compared value and keeps
# it in the prototype.
#
# Bytes: `big_consts` @ 0x401060, gcc 11 -O2 over
# `void big_consts(long x, long a) { hv(a); switch (x) { case 0x123456789: ... } hv(a); }`
# with `noipa` callees. x moves to RBX and RDI carries a to the first call; each
# compare loads its 64-bit constant into RAX (`movabs rax,C ; cmp rbx,rax`), so the
# head compare reads two registers and has no single operand. The install falls
# back to RDI, the restart names what RDI holds there (the value `hv` leaves) as a
# different value, and the switch is withdrawn: no switch over the second
# parameter (`v1 = a1; switch(v1)`), the compare tree over a0 is kept.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0xd380', name = 'dispatch' },
    { space = 'ram', offset = '0x401000', name = 'h0' },
    { space = 'ram', offset = '0x401010', name = 'h1' },
    { space = 'ram', offset = '0x401020', name = 'h2' },
    { space = 'ram', offset = '0x401030', name = 'h3' },
    { space = 'ram', offset = '0x401040', name = 'h4' },
    { space = 'ram', offset = '0x401050', name = 'hv' },
    { space = 'ram', offset = '0x401060', name = 'big_consts' },
    { space = 'ram', offset = '0xba70', name = 'on_one' },
    { space = 'ram', offset = '0xc330', name = 'on_three_four' },
    { space = 'ram', offset = '0xd320', name = 'on_two' },
]

[[image.bytes]]
space = 'ram'
offset = '0xd380'
readonly = true
hex = '89f84889f783f8037426771483f801743f83f802752aeb880f1f84000000000083f804751bbe01000000e981efffff9031f6e979efffff660f1f840000000000b8ffffffffc3662e0f1f840000000000e99be6ffff66662e0f1f840000000000'

[[image.bytes]]
space = 'ram'
offset = '0xba70'
readonly = true
hex = 'c3'

[[image.bytes]]
space = 'ram'
offset = '0xc330'
readonly = true
hex = 'c3'

[[image.bytes]]
space = 'ram'
offset = '0xd320'
readonly = true
hex = 'c3'

[[image.bytes]]
space = 'ram'
offset = '0x401000'
readonly = true
hex = ''

[script]
commands = [
    'lo fu dispatch',
    'decompile',
    'print C',
    'lo fu big_consts',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'LOWEREDSWITCHVALUE #1: dispatch switches on the compared first parameter'
count = 1
literal = 'switch(a0)'

[[match]]
name = 'LOWEREDSWITCHVALUE #2: neither function dispatches on a local holding a clobbered register'
count = 0
literal = 'switch(v1)'

[[match]]
name = 'LOWEREDSWITCHVALUE #3: no local copies the second parameter for a dispatch'
count = 0
literal = 'v1 = (unsigned int)a1;'

[[match]]
name = 'LOWEREDSWITCHVALUE #4: the dispatched-on parameter stays in the prototype'
count = 1
literal = 'dispatch(unsigned int a0,'

[[match]]
name = 'LOWEREDSWITCHVALUE #5: a case body is present'
count = 1
literal = 'return on_three_four(a1,1);'

[[match]]
name = 'LOWEREDSWITCHVALUE #6: big_consts never switches on the second parameter'
count = 0
literal = 'switch(v1) { // branch-flip'

[[match]]
name = 'LOWEREDSWITCHVALUE #7: nothing copies the second parameter for it'
count = 0
literal = 'v1 = a1;'

[[match]]
name = 'LOWEREDSWITCHVALUE #8: the compare over the first parameter is kept'
count = 1
literal = 'if (a0 == 0x323456789)'

[[match]]
name = 'LOWEREDSWITCHVALUE #9: a case body is present'
count = 1
literal = 'h3();'
