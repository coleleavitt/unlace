[[match]]
name = 'RH850 #46: no instruction of the listing is undecodable'
count = 0
regex = 'Unable to disassemble|halt_baddata|Bad instruction'

[[match]]
name = 'RH850 #47: ROTL by a constant is a rotate'
count = 1
literal = 'return rotl(a0,3);'

[[match]]
name = 'RH850 #48: BINS replaces bits 12 to 23'
count = 1
literal = 'return a1 & 0xff000fff | (a0 & 0xfff) << 0xc;'

[[match]]
name = 'RH850 #49: PUSHSP/POPSP keep r20, r21 and lp out of the body'
count = 1
regex = '^int4 f_sum\(int4 a0,unsigned int \*a1\)$'

[[match]]
name = "RH850 #50: LOOP is the counted loop's back edge"
count = 1
literal = '} while (a0);'

[[match]]
name = 'RH850 #51: LDL.W/STC.W read and write the same word'
count = 1
regex = '^  \*a0 = \*a0 \+ a1;$'

[[match]]
name = 'RH850 #52: LD.DW/ST.DW move one 8-byte value'
count = 1
literal = '((unsigned long long *)a1)[2] = ((unsigned long long *)a0)[1];'

[[match]]
name = 'RH850 #53: JARL [reg1], reg3 is an indirect call that returns'
count = 1
literal = 'return (*a0)() + 1;'

[[match]]
name = 'RH850 #54: ST.W disp23 stores the whole word'
count = 1
literal = '*(unsigned int *)(a0 + 0x12344) = a1;'

[[match]]
name = 'RH850 #55: PUSHSP leaves rt on top and POPSP loads rt first'
count = 2
regex = '^  return a1;$'
