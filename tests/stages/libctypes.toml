#     Named libc/POSIX aggregate types in the prototype tables (`option libctypes
#     off|opaque`).
#
#     The built-in prototype tables' type vocabulary is width-stable, so every
#     aggregate pointer in them is spelled `void *`: `fopen` returns one, `fclose`
#     takes one, `__uflow` takes one. That is honest about the width and silent
#     about the pointee, and the pointee is the one thing a declaration actually
#     knows.
#
#     The XML wrapper only supplies the harness architecture (the `option` command
#     needs one before the first `load file`). Every pass clears it and loads a
#     real ELF.
#
#     Passes 1 and 2 load `libctypes_stat_x86_64` (built from the `.c` beside it),
#     which was written to hold the two halves apart:
#
#       * it declares its stream handles `void *` itself and never names `FILE`,
#         so nothing in its DWARF defines a stream type and the named table has to
#         MINT one  -  `fclose(void *)` in pass 1, `fclose(FILE *)` in pass 2;
#       * it hands `stat` a real `struct stat *`, so its DWARF defines `struct stat`
#         with its real members. `st->st_mode` must read the same in BOTH passes
#         (#5) and no `field_0x` fallback may appear anywhere (#6).
#
#     #5 and #6 are the ones that can fail. A named shell interned BEFORE the DWARF
#     importer completes the same name is completed for everybody except the
#     pointers already built against it  -  completion re-keys the struct into a new
#     object  -  and this function degrades to
#     `*(int *)&st->field_0x18`. The pass runs after the DWARF importer and adopts
#     what is already there, which is what these two assertions pin.
#
#     Pass 3 loads the real coreutils `fmt`, whose DWARF DOES define the stream
#     type, under glibc's own `struct _IO_FILE` spelling. The named table adopts
#     that one rather than minting a second stream type beside it (#7, #8), and it
#     keeps its real field layout (#9).
#
#     Passes 4 and 5 load `libctypes_glibc_x86_64`, which carries NO debug info, so
#     every named aggregate in it is minted by the table rather than adopted  -  the
#     only arm in which `option libctypes glibc` installs a field layout at all.
#     Pass 4 is `opaque` (the shipped default) and pass 5 is `glibc`, over the same
#     two functions: the `getc_unlocked` refill body, whose two stream accesses go
#     from `*(uint1 **)&amp;a0-&gt;field_0x8` to `a0-&gt;_IO_read_ptr` (#10, #11), and a
#     `stat` buffer read, which goes from a cast at an offset to `a1-&gt;st_size`
#     (#12, #13) and takes the field's SIGNED type with it, so the `-1` sentinel
#     stops printing as `0xffffffffffffffff` (#14).
#
#     The script restores the default (`opaque`) in its last command: the gate is a
#     process environment variable, and the corpus runs in one process, so a stale
#     `off` would silently disable the table for every later test in the file.
#
#     Assertions span the combined output of all ten passes. `FILE \*` is a
#     substring of `_IO_FILE \*`, so every stream assertion pins the text from the
#     return type or the `(` onwards.
#
#     Passes 6-9 are the stdio STREAM slots: `libctypes_streams_x86_64` and the
#     shared object built from the same source, each once `off` and once `opaque`.
#     The two link kinds bind a stream differently and their slots hold different
#     things  -  the executable gets an `R_X86_64_COPY` relocation and a `.bss` word
#     holding libc's own `FILE *stdout`, the shared object an `R_X86_64_GLOB_DAT`
#     relocation on an UNDEFINED `stdout` and a GOT word holding its ADDRESS. So
#     the exe slot is named `stdout` and the library's `stdout_ptr`, and the
#     library's accesses carry the extra indirection the program really performs.
#     The library is loaded by address because its four functions are exported and
#     each name also resolves to a PLT stub.
#
#     `pending` is the witness: it reads two fields of the stream and calls
#     nothing, so the relocation is the only thing in the image that says what the
#     word holds (#16/#17 off, #18/#19 on). The other three are the wrong-output
#     controls. `flush_mark` stores THROUGH the stream pointer and must still store
#     to the same address (#20/#21); `hand_off` reads the stream OBJECT into one of
#     the image's own functions and must still read it whole  -  `sink(stdin)`,
#     never `sink(*stdin)` (#22/#23); `say` passes it to a libc call whose
#     prototype already named it, which must not move at all (#24), and whose
#     library form only loses the cast the untyped slot needed (#25).
#
#     Passes 10 and 11 are the second round of names, on `libctypes_obstack_x86_64`
#     (no debug info, so every name in it is MINTED). `grow` is the one channel
#     that is new in kind: `_obstack_newchunk` is DEFINED by the image rather than
#     imported  -  which is how gnulib's obstack reaches every coreutils, grep and
#     tar binary  -  and it is the only thing in the file that says what `grow`'s
#     pointer addresses (#27, #28). `emit` is the ordinary import channel with two
#     named slots at once (#29, #30). Neither body reads a field, so #15 does not
#     move.
#
#     `libctypes_obstack_import_x86_64` is the same witness on the other channel:
#     `_obstack_newchunk` imported from glibc, as the corpus's `dpkg` programs
#     import it. The two publishers disagree about the size parameter  -  gnulib's
#     size type is `size_t`, the installed glibc header declares `int`  -  so #32
#     pins `int4` where #28 pins `uint8`, and a table that spelled both the same
#     would fail one of them.
#
#     #6 is narrowed to the two aggregates a DWARF definition already described
#     (`st`, `f`), because pass 4 is the `opaque` arm and legitimately prints
#     `a0-&gt;field_0x8`. #15 pins the count of LINES carrying an offset-named field
#     the same way: four in pass 4 and four in the two `opaque` stream passes (one
#     `pending` line and one `flush_mark` line per link kind), so a new fallback in
#     any pass moves it.
#
#     Pass 13 is the fit rule, on `libctypes_container_x86_64`. A libc aggregate is
#     often the FIRST member of a larger object (grep's kwset starts with its
#     obstack), and then the object's address is the one the libc call reads. The
#     table's vote used to win anyway, and every other member rendered as an
#     element of an obstack array: `a0[0x1b].field_0x28` for offset 0x970. The
#     function reads past the aggregate's end, so the vote declines to the
#     width-stable void * (#33, #34), for a pthread_mutex_t head too (#35).
#     `grow_in` stays inside its obstack and keeps the name (#36); its one
#     offset-named line is counted by #15.
#
#     Pass 14 is the width gate, on the stripped i386 `libctypes_widths_i386`. The
#     named slots carry glibc's x86-64 widths, and a named pointer handed a frame
#     object's address grows the object to the declared width: an 8-byte i386
#     timespec grown to 16 swallowed the two locals beside it, and an obstack
#     grown to 88 swallowed an int[12]. No slot is named on i386 now, so both
#     frames are the functions' own (#37, #38, #39).
#
# Every load is followed by `typelib off`: the prebuilt type library also declares the
#     imports this file leaves unsaid (`putspent` of #29), and what is pinned here
#     is `libctypes` alone.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
