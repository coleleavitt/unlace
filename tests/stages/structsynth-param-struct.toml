# structsynth: synthesize a structure type from the constant-offset
# dereferences of a pointer parameter.
#
# Source shape (hand-assembled, no prologue, so the parameter arrives in RDI
# with nothing declaring its type):
#
#     int two_fields(void *p) {
#         unsigned char *s = *(unsigned char **)p;   // offset 0, 8 bytes
#         int n = *(int *)((char *)p + 8);           // offset 8, 4 bytes
#         return n + *s;
#     }
#
#     48 8b 07        mov    rax,[rdi]
#     8b 4f 08        mov    ecx,[rdi+8]
#     0f b6 00        movzx  eax,byte [rax]
#     01 c8           add    eax,ecx
#     c3              ret
#
# The dereference at offset 0 is what makes RDI a pointer to type inference;
# `structsynth` never invents pointer-ness, so a parameter the engine still
# believes is an integer is left alone.
#
# With `option structsynth off` (assert #1): the two reads are raw offset arithmetic over an
# untyped pointee, and the reader carries the layout in their head.
#
# With `option structsynth param` (asserts 2 to 6): once type propagation has
# settled, the two constant offsets are completed into `struct_0` and the
# parameter is type-locked to `struct_0 *`, so both reads render as fields and
# the recovered layout is printable.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'two_fields' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '488b078b4f080fb60001c8c3'

[script]
commands = [
    'lo fu two_fields',
    'option structsynth off',
    'decompile',
    'print C',
    'option structsynth param',
    'decompile',
    'print C',
    'print C types',
    'quit',
]

[[match]]
name = 'STRUCTSYNTH #1: off leaves the offset-8 read as raw pointer arithmetic'
count = 1
literal = '*(int4 *)&a0[1]'

[[match]]
name = 'STRUCTSYNTH #2: the parameter is retyped to the synthesized structure'
count = 1
literal = 'struct_0 *a0'

[[match]]
name = 'STRUCTSYNTH #3: the offset-8 read renders as a field'
count = 1
literal = 'a0->field_0x8'

[[match]]
name = 'STRUCTSYNTH #4: the offset-0 read renders as a field'
count = 1
literal = 'a0->field_0x0'

[[match]]
name = 'STRUCTSYNTH #5: offset 0 keeps the pointer type its loaded value carries'
count = 1
literal = 'uint1 *field_0x0;'

[[match]]
name = 'STRUCTSYNTH #6: offset 8 is a 4-byte field, not a padded 8-byte one'
count = 1
literal = 'int4 field_0x8;'
