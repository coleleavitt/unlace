[script]
commands = [
    'option ctypes on',
    'parse line extern int check(int x, int y);',
    'parse line extern int keep(int x, int y);',
    'parse line extern int square(int x, int y);',
    'parse line extern int mixed(unsigned int x, unsigned int y, int z);',
    'parse line extern int mixedkeep(unsigned int x, unsigned int y, int z);',
    'parse line extern int parity(unsigned int x, unsigned int y, int z);',
    'option opaquepredicate off',
    'lo fu check',
    'decompile',
    'print C',
    'lo fu square',
    'decompile',
    'print C',
    'lo fu mixed',
    'decompile',
    'print C',
    'lo fu parity',
    'decompile',
