[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'mmio_select' },
    { space = 'ram', offset = '0x10044', name = 'notify' },
    { space = 'ram', offset = '0x11000', name = 'cursor_order' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '''
9de3bfa02100008080a6200002800006a210201780a6200102800003a2102029
a210203bf2240000e2242004e224200890100019400000040100000081c7e008
81e8000081c3e00801000000
'''

[[image.bytes]]
space = 'ram'
offset = '0x11000'
readonly = true
hex = '''
9de3bfa021000084e2040000e4040000a32c6002a52ca002e6060011e8064012
e6268000e826a00481c7e00881e80000
'''

[script]
commands = [
    'parse line extern void mmio_select(int choice, int payload);',
    'map address 0x20000 volatile int payload_register',
    'map address 0x20004 volatile int configuration',
    'map address 0x20008 volatile int mirror',
    'parse line extern void notify(int value);',
    'parse line extern void cursor_order(int *first, int *second, int *output);',
    'map address 0x21000 volatile int cursor',
    'lo fu mmio_select',
    'decompile',
    'print C',
    'lo fu cursor_order',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'selected local reaches first device write'
count = 1
literal = 'payload_register = payload;'

[[match]]
name = 'selected local reaches configuration'
count = 1
literal = 'configuration = v1;'

[[match]]
name = 'mirror receives the local without a device read'
count = 1
literal = 'mirror = v1;'

[[match]]
name = 'first cursor snapshot is explicit'
count = 1
literal = 'v1 = cursor;'

[[match]]
name = 'second cursor snapshot is explicit'
count = 1
literal = 'v2 = cursor;'

[[match]]
name = 'first index uses first snapshot'
count = 1
literal = '*output = first[v1];'

[[match]]
name = 'second index uses second snapshot'
count = 1
literal = 'v3 = second[v2];'
