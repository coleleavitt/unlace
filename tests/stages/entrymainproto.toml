# unlace issue testcase: the PE CRT entry-function prototype.
#
# Issue:      unlace-analysis-entrymainproto - `unlace decompile` on
#             crackmes.one/65acadf3eef082e477ff5ede (ObfuscationFiesta.exe,
#             PE32+ x86-64, stripped) renders `void sub_140002530(void)`
#             while unlace's own decompilation of sub_14000518c renders
#             `sub_140002530(v7,v1,v6)` three lines after the
#             __p___argc / __p___argv / _get_initial_narrow_environment
#             accessor calls.
# Stage:      P1 program prep - prototype source (the analyzer tier's
#             `AnalysisOutput::prototypes` seam, the same one the libc
#             signature table uses).
#
# The analyzer tier runs ONLY on the real-object bootstrap path, never on this
# XML binaryimage path (docs/spec/01-program-prep.md section 1.1), which is
# exactly why the parity oracle is structurally untouched by the pass.  This
# case pins that the XML path renders as before.
#
# The end-to-end proof (the argc/argv/envp slots) needs a real PE and lives
# in the cargo gate
# `crates/unlace-console/tests/verify_entrymainproto.rs`, over the
# `crtmain_x86_64.exe` fixture: a minimal PE32+ whose startup fetches the
# three arguments through the named UCRT accessors and whose main ignores
# them.
#
# Reuses the GH-558 bytes as a small, deterministic loadable function.
#
# Source:           int gh558(int x) { if (x LE 8) return 1; return 0; }
# Compiled (as):    cmp $8,%edi ; jg +6 ; mov $1,%eax ; ret ; xor %eax,%eax ; ret

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'gh558' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '83ff087f06b801000000c331c0c3'

[script]
commands = [
    'option boolreturn off',
    'parse line extern int4 gh558(int4 x);',
    'lo fu gh558',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'UNLACE-ENTRYMAINPROTO #1: the XML path renders the source form x <= 8'
count = 1
literal = 'if (x <= 8)'
