[[match]]
name = 'lock xadd returns the old value of one fetch-and-add'
count = 1
regex = '^  return __sync_fetch_and_add\(\w+,\w+\);$'

[[match]]
name = 'lock add discards it'
count = 1
regex = '^  __sync_fetch_and_add\(\w+,\w+\);$'

[[match]]
name = 'lock dec tests the old value'
count = 1
regex = '^  return __sync_fetch_and_sub\(\w+,1\) == 1;$'

[[match]]
name = 'lock or'
count = 1
regex = '^  __sync_fetch_and_or\(\w+,\w+\);$'

[[match]]
name = 'xchg with memory is always locked'
count = 1
regex = '^  return __sync_lock_test_and_set\(\w+,\w+\);$'

[[match]]
name = 'lock cmpxchg returns the old value at 4 bytes'
count = 1
regex = '^  return __sync_val_compare_and_swap\(\w+,\w+,\w+\);$'

[[match]]
name = 'lock cmpxchg at 8 bytes tests it'
count = 1
regex = '^  return \w+ == __sync_val_compare_and_swap\(\w+,\w+,\w+\);$'

[[match]]
name = 'lock cmpxchg at 1 byte'
count = 1
regex = '__sync_val_compare_and_swap\(\w+,\(char\)\w+,\w+\)'

[[match]]
name = 'a fetch-and-and retry loop keeps its compare-exchange in the loop condition'
count = 1
regex = '^  while \(\w+ = __sync_val_compare_and_swap\('

[[match]]
name = 'the store_max compare-exchange stays inside its loop'
count = 1
regex = '^    \w+ = __sync_val_compare_and_swap\(\w+,\w+,\w+\);$'

[[match]]
name = 'lock inc of a RIP-relative global names it'
count = 1
regex = '^  __sync_fetch_and_add\(.*counter,1\);$'

[[match]]
name = 'every rewritten form'
count = 11
literal = '__sync_'

[[match]]
name = 'HLE, neg and the fence keep LOCK'
count = 3
regex = '^  LOCK\(\);$'

[[match]]
name = 'and UNLOCK'
count = 3
regex = '^  UNLOCK\(\);$'

[[match]]
name = 'the HLE hint stays'
count = 1
regex = '^  XACQUIRE\(\);$'

[[match]]
name = 'the unlocked add and the HLE add stay plain updates'
count = 2
regex = '^  \*\w+ = \*\w+ \+ \w+;$'

[[match]]
name = 'atomics msvc: lock xadd as _InterlockedExchangeAdd'
count = 1
regex = '^  return _InterlockedExchangeAdd\(\w+,\w+\);$'

[[match]]
name = 'atomics msvc: lock cmpxchg as _InterlockedCompareExchange'
count = 1
regex = '^  return _InterlockedCompareExchange\(\w+,\w+,\w+\);$'
