# GH-854 (unlace), the Apple arm64 convention: AARCH64_apple.cspec lists x8 as its
# `hiddenret` input entry exactly as the Linux AARCH64.cspec does, so a value a
# caller leaves in x8 is printed as the next call's first argument there too.
# gh854-hiddenretarg-a64.xml carries the full fixture and the reasoning; this
# test runs three of its functions under this compiler spec.
#
# Stage / sub-stage: P4 "active-input-trial-scoring" (unlace_hiddenretarg.rs,
# always on).
#
#   f     mov x8,#0x38; mov x0,#3; bl foo   foo is `add x0,x0,#1; ret`
#   g     mov x8,#0x38; svc #0; bl lib      lib's body proves nothing: the
#                                           null-page constant alone
#   use   mov x8,sp; mov w0,#7; bl mk       the control: mk stores through
#                                           x8, a real hidden return
#
# Without the veto the calls render `foo(0x38,3)` and `lib(0x38)`; with it
# neither carries x8, and mk keeps its result buffer.

[image]
arch = 'AARCH64:LE:64:AppleSilicon:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'f' },
    { space = 'ram', offset = '0x100018', name = 'foo' },
    { space = 'ram', offset = '0x100020', name = 'f2' },
    { space = 'ram', offset = '0x100038', name = 'g' },
    { space = 'ram', offset = '0x100050', name = 'lib' },
    { space = 'ram', offset = '0x100060', name = 'g2' },
    { space = 'ram', offset = '0x100078', name = 'cancel' },
    { space = 'ram', offset = '0x100088', name = 'use' },
    { space = 'ram', offset = '0x1000b0', name = 'mk' },
    { space = 'ram', offset = '0x1000c0', name = 'use2' },
    { space = 'ram', offset = '0x1000e8', name = 'mkthunk' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
hex = '''
