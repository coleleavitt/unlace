[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'preload' },
    { space = 'ram', offset = '0x1100', name = 'acquire' },
    { space = 'ram', offset = '0x1200', name = 'mutate' },
    { space = 'ram', offset = '0x1300', name = 'consume' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '534883ec10488d7c240ce8f10000008b5c240c6685c07419c744240c17000000488d7c240ce8d601000089dfe8cf020000c744240c07000000488d7c240ce8bd0100008b44240c4883c4105bc3'

[[image.bytes]]
space = 'ram'
offset = '0x1100'
readonly = true
hex = 'c3'

[[image.bytes]]
space = 'ram'
offset = '0x1200'
readonly = true
hex = 'c3'

[[image.bytes]]
space = 'ram'
offset = '0x1300'
readonly = true
hex = 'c3'

[script]
commands = [
    'parse line extern int4 preload(void);',
    'parse line extern int2 acquire(volatile int4 *);',
    'parse line extern void mutate(volatile int4 *);',
    'parse line extern void consume(int4);',
    'load function preload',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'preloaded x86 stack read: capture stays before branch'
count = 1
regex = [
    'acquire\([^;]*;',
    'v[0-9]+ = v[0-9]+;',
    'if \(',
]

[[match]]
name = 'preloaded x86 stack read: guarded consumer retains saved value'
count = 1
regex = [
    'mutate\([^;]*;',
    'consume\(v[0-9]+\);',
]

[[match]]
name = 'preloaded x86 stack read: volatile slot retained'
min = 1
max = 99
literal = 'volatile int'
