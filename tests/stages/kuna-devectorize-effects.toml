1c0fb6341701f04183c1014883c2014839d175ed44890c2500300000c3c3
'''

[script]
commands = [
    'parse line extern unsigned int sum_flag(unsigned char *bytes, unsigned int length);',
    'parse line extern unsigned int sum_count(unsigned char *bytes, unsigned int length);',
    'option devectorize off',
    'lo fu sum_flag',
    'decompile',
    'print C',
    'lo fu sum_count',
    'decompile',
    'print C',
    'option devectorize on',
    'lo fu sum_flag',
    'decompile',
    'print C',
    'lo fu sum_count',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'devectorize effects #1: both passes keep the vector arm of both functions'
count = 4
literal = '& 0xfffffffc'

[[match]]
name = "devectorize effects #2: both passes keep the early return's store of 1"
count = 2
literal = 'dat_3000 = 1;'
