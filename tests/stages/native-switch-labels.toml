[script]
commands = [
    'option loweredswitch off',
    'parse line extern int4 signed8(int1 selector);',
    'parse line extern int4 signed16(int2 selector);',
    'parse line extern int4 signed32(int4 selector);',
    'parse line extern int4 signed64(int8 selector);',
    'parse line extern int4 unsigned8(uint1 selector);',
    'parse line extern int4 unsigned16(uint2 selector);',
    'parse line extern int4 unsigned32(uint4 selector);',
    'parse line extern int4 unsigned64(uint8 selector);',
    'parse line extern int4 signed16_load(int2 *selector);',
    'parse line extern int4 signed16_widen(int2 selector);',
    'lo fu signed8',
    'decompile',
    'print C',
    'lo fu signed16',
    'decompile',
    'print C',
    'lo fu signed32',
    'decompile',
    'print C',
    'lo fu signed64',
    'decompile',
    'print C',
    'lo fu unsigned8',
    'decompile',
    'print C',
    'lo fu unsigned16',
    'decompile',
    'print C',
    'lo fu unsigned32',
    'decompile',
    'print C',
    'lo fu unsigned64',
    'decompile',
    'print C',
    'lo fu signed16_load',
    'decompile',
    'print C',
    'lo fu signed16_widen',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'NATIVE SWITCH LABELS #1: all scalar native tables use the selector'
count = 9
literal = 'switch(selector)'

[[match]]
name = 'NATIVE SWITCH LABELS #2: every signed first arm is negative'
count = 6
literal = 'case -0xd:'

[[match]]
name = 'NATIVE SWITCH LABELS #3: every signed middle arm is negative'
count = 6
literal = 'case -0xc:'

[[match]]
name = 'NATIVE SWITCH LABELS #4: every signed last arm is negative'
count = 6
literal = 'case -0xb:'

[[match]]
name = 'NATIVE SWITCH LABELS #5: unsigned 8-bit high labels stay positive'
count = 1
literal = [
    'unsigned8(uint1 selector)',
    '{',
    'switch(selector) {',
    'case 0xf3:',
]

[[match]]
name = 'NATIVE SWITCH LABELS #6: unsigned 16-bit high labels stay positive'
count = 1
literal = [
    'unsigned16(uint2 selector)',
    '{',
    'switch(selector) {',
    'case 0xfff3:',
]

[[match]]
name = 'NATIVE SWITCH LABELS #7: unsigned 32-bit high labels stay positive'
count = 1
literal = [
    'unsigned32(uint4 selector)',
    '{',
    'switch(selector) {',
    'case 0xfffffff3:',
]

[[match]]
name = 'NATIVE SWITCH LABELS #8: unsigned 64-bit high labels stay positive'
count = 1
literal = [
    'unsigned64(uint8 selector)',
    '{',
    'switch(selector) {',
    'default:',
    'return 0x21;',
    'case 0xfffffffffffffff3:',
]

[[match]]
name = 'NATIVE SWITCH LABELS #9: a signed short load stays an expression selector'
count = 1
literal = 'switch(*selector)'
