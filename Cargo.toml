[workspace]
resolver = "3"
members = [
    "crates/*",
    "xtask",
]
exclude = [
    ".jfc-worktrees/*",
    "research/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Binary format parsing
object = "0.39"
# Architecture decoders
iced-x86 = "1.21"
capstone = "0.14"
capstone-sys = "0.18"
# Debug info
gimli = "0.33"
addr2line = "0.26"
pdb = "0.8"
fallible-iterator = "0.2"
# Graph algorithms (CFG, dominator trees)
petgraph = { version = "0.8", features = ["serde-1"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["alloc"] }
toml = "0.8"
# CLI
clap = { version = "4.6", features = ["derive"] }
# Async runtime
tokio = "1"
# Binary/object helpers
wasmparser = "0.225"
# Compression
zstd = "0.13"
flate2 = "1.0"
# Hashing
sha2 = "0.10"
# Symbol demangling
symbolic-demangle = "12"
# Snapshot testing
insta = "1"
# Test fixtures / temp files
tempfile = "3"
# Observability
tracing = "0.1"
# Error handling
thiserror = "2"
anyhow = "1"
# Parallelism
rayon = "1"
# Data structures
smallvec = { version = "1", features = ["serde"] }
# Dynamic library loading
libloading = "0.8"
# Internal crates
unlace-ir = { path = "crates/unlace-ir" }
unlace-loader = { path = "crates/unlace-loader" }
unlace-lift = { path = "crates/unlace-lift" }
unlace-capstone = { path = "crates/unlace-capstone" }
unlace-lift-x86 = { path = "crates/unlace-lift-x86" }
unlace-lift-arm = { path = "crates/unlace-lift-arm" }
unlace-lift-riscv = { path = "crates/unlace-lift-riscv" }
unlace-lift-mips = { path = "crates/unlace-lift-mips" }
unlace-lift-ppc = { path = "crates/unlace-lift-ppc" }
unlace-lift-v850 = { path = "crates/unlace-lift-v850" }
unlace-lift-arc = { path = "crates/unlace-lift-arc" }
unlace-lift-tricore = { path = "crates/unlace-lift-tricore" }
unlace-lift-wasm = { path = "crates/unlace-lift-wasm" }
unlace-lift-ebpf = { path = "crates/unlace-lift-ebpf" }
unlace-lift-avr = { path = "crates/unlace-lift-avr" }
unlace-lift-rx = { path = "crates/unlace-lift-rx" }
unlace-lift-agx = { path = "crates/unlace-lift-agx" }
unlace-lift-sparc = { path = "crates/unlace-lift-sparc" }
unlace-lift-msp430 = { path = "crates/unlace-lift-msp430" }
unlace-lift-m68k = { path = "crates/unlace-lift-m68k" }
unlace-lift-sass = { path = "crates/unlace-lift-sass" }
unlace-lift-xtensa = { path = "crates/unlace-lift-xtensa" }
unlace-lift-superh = { path = "crates/unlace-lift-superh" }
unlace-lift-hexagon = { path = "crates/unlace-lift-hexagon" }
unlace-lift-amdgpu = { path = "crates/unlace-lift-amdgpu" }
unlace-lift-sharc = { path = "crates/unlace-lift-sharc" }
unlace-lift-ti = { path = "crates/unlace-lift-ti" }
unlace-lift-evm = { path = "crates/unlace-lift-evm" }
unlace-lift-lua = { path = "crates/unlace-lift-lua" }
unlace-lift-6502 = { path = "crates/unlace-lift-6502" }
unlace-lift-stm8 = { path = "crates/unlace-lift-stm8" }
unlace-passes = { path = "crates/unlace-passes" }
unlace-struct = { path = "crates/unlace-struct" }
unlace-output = { path = "crates/unlace-output" }
unlace-plugin = { path = "crates/unlace-plugin" }
unlace-cli = { path = "crates/unlace-cli" }
unlace-flirt = { path = "crates/unlace-flirt" }
unlace-sbom = { path = "crates/unlace-sbom" }
unlace-test-harness = { path = "crates/unlace-test-harness" }
unlace-lumina = { path = "crates/unlace-lumina" }
unlace-session = { path = "crates/unlace-session" }
unlace-idapython = { path = "crates/unlace-idapython" }
unlace-debugger = { path = "crates/unlace-debugger" }
unlace-emu = { path = "crates/unlace-emu" }

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.test]

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = false
