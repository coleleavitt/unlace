# A goto-to-run rewrite (`ActionCrossJumpTail`, `Plan::Latch`, `loopcontinue` on)
# on `sub_104c00` of the system sqlite3 3.53.1 (x86-64 ELF, `decompile-all` on
# /usr/bin/sqlite3). The `if` at the end of the loop body jumps back to the first
# member of the body's tail, a run that holds that jump itself. Copying the run
# after the jump kept a jump to the same head in each copy, so the rewrite
# nested a new copy at every step: the tree doubled per step and the walk
