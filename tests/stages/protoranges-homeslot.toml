# unlace protoranges: the address of a Win64 home slot prints as a raw stack
# location instead of the local that holds the value.
#
# MSVC x64 spills a value into the home slot its caller allocated above the
# return address and passes the slot by reference:
#
#     140001000  48 83 ec 28            SUB   RSP,0x28
#     140001004  48 8d 05 75 00 00 00   LEA   RAX,[worker_proc]
#     14000100b  48 89 44 24 40         MOV   [RSP + 0x40],RAX   ; entry rsp+0x18
#     140001010  48 8d 4c 24 40         LEA   RCX,[RSP + 0x40]
#     140001015  e8 46 00 00 00         CALL  consume
#     14000101a  48 83 c4 28            ADD   RSP,0x28
#     14000101e  c3                     RET
#     140001060  48 8b 01 c3            consume: MOV RAX,[RCX]; RET
#     140001080  31 c0 c3               worker_proc: XOR EAX,EAX; RET
#
# x86-64-win.cspec declares the home area (stack 8..39) in its prototypes'
# <localrange> and the stack parameters in an <input> entry at 40.  unlace
# ignored both and used the default ranges, which put the home area in the
# parameter range, so no local was ever mapped over the slot: the store
# printed as one variable and the call as &Stack0000000000000018.  With the
# spec's ranges the slot is a local, and its escaping address makes it an
# open range up to the end of the home area, which is what the stock
# decompiler prints: code *local_res18 [2]; local_res18[0] = ...;
# consume(local_res18).
#
# Stage: P6 stack-frame layout; the spec's ranges are always read.  Pass 1
# pins the fix without and pass 2 with a declared prototype for consume.

[image]
arch = 'x86:LE:64:default:windows'
symbols = [
    { space = 'ram', offset = '0x140001000', name = 'f' },
    { space = 'ram', offset = '0x140001060', name = 'consume' },
    { space = 'ram', offset = '0x140001080', name = 'worker_proc' },
]

[[image.bytes]]
space = 'ram'
offset = '0x140001000'
hex = '''
4883ec28488d0575000000488944244048
8d4c2440e8460000004883c428c3
'''

[[image.bytes]]
space = 'ram'
offset = '0x140001060'
hex = '488b01c3'

[[image.bytes]]
space = 'ram'
offset = '0x140001080'
hex = '31c0c3'

[script]
commands = [
    'lo fu f',
    'decompile',
    'print C',
    'parse line extern void *consume(void **slot);',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PROTORANGES HOMESLOT #1: the call is never passed a raw stack location'
count = 0
regex = '^  consume\(&Stack0000000000000018\);$'

[[match]]
name = 'PROTORANGES HOMESLOT #2: the home slot is declared as a local'
count = 2
regex = '^  code \*v[0-9]+ \[2\];'

[[match]]
name = 'PROTORANGES HOMESLOT #3: worker_proc is stored into that local'
count = 2
regex = '^  v[0-9]+\[0\] = worker_proc;$'

[[match]]
name = 'PROTORANGES HOMESLOT #4: the same local is passed to consume'
count = 2
regex = '^  consume\(v[0-9]+\);$'
