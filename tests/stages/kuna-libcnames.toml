# kuna `libcnames`: a local that holds a library call's result, or that is
# handed to a library call whole, keeps a `vN` name although the library
# declares what it is: `v1 = open(a0,0)`, `read(v1,v4,0x200)`.
#
# Stage / sub-stage: P6 "naming-policy".  The P0 assertion
# `option libcnames on|off` decides whether a numbered local prints the
# library's name for it.  The names ride on the prototypes the built-in libc
# tables park (glibc's declared parameter names, plus a result name such as
# `fd` for `open`, `n` for `read`, `len` for `strlen`, `p` for `malloc` and
# `fp` for `fopen`).  The library name is a second name for the local: it
# keeps its number, so every other local is numbered exactly as with the
# option off, and a directive reaches it by either name.
#
# The fixture is crates/unlace-analysis/tests/fixtures/libcnames_x86_64
# (gcc 11 -O2 -fno-inline, source beside it).
#
# Pass 1 sets the option off: every local of `copy_file` is a `vN`.  Pass 2
# turns it back on, the shipped default: the two
# descriptors are `fd` and `fd_2` (a clash takes `_2` in call order), the
# count is `n`, the stack buffer whose address `read` and `write` take is
# `buf`, and the total keeps `v5`.  `joined`'s
# lengths are `len`/`len_2` and its buffer `p`, `first_line`'s stream `fp`,
# and `emit`'s width, which only reaches `write`, takes write's parameter
# name `n`.  `ordered` passes one local to `strcmp` as `s2` and then as `s1`:
# names that only say which side of a call a value is on, and disagree, so it
# keeps `v1`.  Then three console renames, each against the output before
# it: `fd` to `src` leaves `fd_2` as it was and gives the freed `fd` to no
# one; `v5` to `n` takes read's library name, so that local prints its
# number `v3`; and `v3` to `got` reaches it by that number.
# Every pass sets `option condcallpush off`: the test pins the structure
# that counts a call's return-address push, not the condcallpush fold.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/libcnames_x86_64',
    'read symbols',
    'option condcallpush off',
    'option boolreturn off',
    'option helperroles off',
    'option libcnames off',
    'lo fu copy_file',
    'decompile',
    'print C',
    'option libcnames on',
    'lo fu copy_file',
    'decompile',
    'print C',
    'lo fu joined',
    'decompile',
    'print C',
    'lo fu first_line',
    'decompile',
    'print C',
    'lo fu emit',
    'decompile',
    'print C',
    'lo fu ordered',
    'decompile',
    'print C',
    'lo fu copy_file',
    'decompile',
    'rename fd src',
    'decompile',
    'print C',
    'rename v5 n',
    'decompile',
    'print C',
    'rename v3 got',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "libcnames #1: with the option off open's result is a vN"
count = 1
regex = '^  v1 = open\(a0,0\);$'

[[match]]
name = "libcnames #2: and read's count and descriptor are vNs too"
count = 1
regex = '^    v3 = read\(v1,v4,0x200\);$'

[[match]]
name = 'libcnames #3: with the option on the first descriptor is fd'
count = 1
regex = '^  int4 fd; // eax \| ebp$'

[[match]]
name = 'libcnames #4: the second open is fd_2, also after every rename'
count = 4
regex = '^  fd_2 = open\(a1,0x241,0x1a4\);$'

[[match]]
name = "libcnames #5: read's result is n and it reads from fd"
count = 1
regex = '^    n = read\(fd,buf,0x200\);$'

[[match]]
name = 'libcnames #6: the stack buffer read and write take by address is v4 with the option off'
count = 1
regex = '^  char v4 \[512\]; // stack - 0x228$'

[[match]]
name = 'libcnames #17: and buf in every pass with the option on'
count = 4
regex = '^  char buf \[512\]; // stack - 0x228$'

[[match]]
name = "libcnames #7: strlen's results are len and len_2 and malloc's is p"
count = 1
regex = [
    '^  len = strlen\(a0\);',
    '^  len_2 = strlen\(a1\);',
    '^  p = malloc\(len \+ 1 \+ len_2\);$',
]

[[match]]
name = 'libcnames #8: a value used inside an expression names nothing'
count = 1
literal = 'memcpy((void *)((int8)p + len),a1,len_2 + 1);'

[[match]]
name = "libcnames #9: fopen's result is fp"
count = 1
regex = '^  fp = fopen\(a0,"r"\);'

[[match]]
name = "libcnames #10: a local only passed to write takes write's parameter name n"
count = 1
regex = [
    '^  n = measure\(a1\);',
    '^  if \(write\(a0,a1,n\) <= -1\)$',
]

[[match]]
name = "libcnames #11: strcmp's s1 and s2 on one local disagree, so it keeps its vN"
count = 1
regex = '^  if \(1 <= strcmp\(a3,v1\)\)$'

[[match]]
name = 'libcnames #12: the rename names the first descriptor src'
count = 3
regex = '^  src = open\(a0,0\);$'

[[match]]
name = 'libcnames #13: and no local takes the freed fd'
count = 1
regex = '^    n = read\(src,buf,0x200\);$'

[[match]]
name = "libcnames #14: renaming v5 to read's library name leaves that local its number"
count = 1
regex = [
    '^  int8 n; // r12',
    '^  int4 src; // eax \| ebp',
    '^  int8 v3; // rax$',
]

[[match]]
name = 'libcnames #15: and the next rename reaches it by that number'
count = 1
regex = '^    got = read\(src,buf,0x200\);$'

[[match]]
name = 'libcnames #16: fd_2 is declared under the same spelling through every rename'
count = 4
regex = '^  int4 fd_2; // eax \| r13d$'
