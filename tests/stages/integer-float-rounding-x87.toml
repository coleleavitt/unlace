# x87 conversions run through the 80-bit extended format, which has no
# float-format entry but holds every 64-bit integer.
# cmpf (gcc -m32 -O2 `(double)(float)x < y` with excess precision) compares
# an exact fild against a double, lt1 compares fld1 against a double, and
# l2d2f (gcc -m32 -O2 `(float)(double)x` of a long long) spills the exact
# fild to a float slot and reloads it.

[image]
arch = 'x86:LE:32:default:gcc'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'cmpf' },
    { space = 'ram', offset = '0x10100', name = 'lt1' },
    { space = 'ram', offset = '0x10200', name = 'l2d2f' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = 'db44240431c0dd442408dff1ddd80f97c0c3'

[[image.bytes]]
space = 'ram'
offset = '0x10100'
readonly = true
hex = 'd9e8dd442404dfe9ddd80f97c00fb6c0c3'

[[image.bytes]]
space = 'ram'
offset = '0x10200'
readonly = true
hex = '83ec0cdf6c2410d95c2404d944240483c40cc3'

[script]
commands = [
    'parse line extern int cmpf(int x, double y);',
    'parse line extern int lt1(double x);',
    'parse line extern float8 l2d2f(int8 x);',
    'lo fu cmpf',
    'decompile',
    'print C',
    'lo fu lt1',
    'decompile',
    'print C',
    'lo fu l2d2f',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "x87 the float spill's rounding is never dropped"
count = 0
literal = 'return (float8)x;'

[[match]]
name = 'x87 a spilled int64 keeps its float rounding'
count = 1
literal = 'return (float8)(float4)x;'

[[match]]
name = 'x87 an exact int32 fild still compares as a double'
count = 1
literal = 'return (uint4)((float8)x < y);'

[[match]]
name = 'x87 fld1 still folds to a double constant'
count = 1
literal = 'return (uint4)(1.0 < x);'
