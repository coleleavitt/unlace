[script]
commands = [
    'map address r0x2000 float4 input',
    'map address r0x3000 float4 result',
    'map address r0x3004 float4 after',
    'map address r0x3100 uint4 scratch[4]',
    'parse line extern void caller(void);',
    'parse line extern void loop_clear(void);',
    'parse line extern void no_finish(void);',
    'parse line extern float4 get(void);',
    'parse line extern void finish(void);',
    'load function caller',
    'decompile',
    'print C',
    'load function no_finish',
    'decompile',
    'print C',
    'load function loop_clear',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'store order: division call precedes the later global write'
count = 3
regex = [
    'result = [^;]*get\(\);',
    'after = ',
]

[[match]]
name = 'store order: exactly one global write per function'
count = 3
regex = '^  after = '

[[match]]
name = 'store order: the global is never written before the call'
count = 0
regex = [
    'after = [^;]*;',
    'result = [^;]*get\(\);',
]

[[match]]
name = 'store order: final call remains after both writes'
count = 1
regex = [
    'after = [^;]*;',
    'finish\(\);',
]
