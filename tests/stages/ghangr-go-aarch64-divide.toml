# Authored in tests/fixtures/go-aarch64-divide/guard.S. SDIV has a
# nontrapping zero case; the compiler's fail edge must stay explicit.

[image]
arch = 'AARCH64:LE:64:v8A:golang'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'guarded_quotient' },
    { space = 'ram', offset = '0x100040', name = 'raw_quotient' },
    { space = 'ram', offset = '0x100080', name = 'bounds_control' },
    { space = 'ram', offset = '0x1000c0', name = 'application_guard' },
    { space = 'ram', offset = '0x100100', name = 'mixed_panics' },
    { space = 'ram', offset = '0x100140', name = 'abi_quotient' },
    { space = 'ram', offset = '0x100180', name = 'runtime.panicdivide' },
    { space = 'ram', offset = '0x100184', name = 'runtime.panicIndex' },
    { space = 'ram', offset = '0x100188', name = 'application.panicdivide' },
    { space = 'ram', offset = '0x10018c', name = 'runtime.panicdivide.abi0' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '610000b4000cc19ac0035fd65d000094200020d4'

