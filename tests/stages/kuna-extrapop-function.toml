# Per-function extrapop: `option extrapop <n> <name>`.
#
# OptionExtraPop (decompiler/cpp/options.cc) with a function name sets that
# function's prototype extrapop, which every caller copies into its call
# spec (ActionDefaultParams). kuna returned "Unknown function name" for
# every name.
#
# Authored x86-32 (nasm): f pushes 2 and 1, calls g, then returns [esp+4];
# g ends in `ret 8`. The gcc cspec's extrapop (4) leaves the arguments on
# the stack, so [esp+4] reads the pushed 2. With extrapop 12 for g the
# stack pointer is back at f's entry and [esp+4] is f's own argument.
#
# Pass 1 (model extrapop): `g(1); return 2;`
# Pass 2 (`option extrapop 12 g`): `g(1,2); return a0;`
# k calls g through ecx; the deindirected call takes the same
# extrapop, so [esp+8] after it is k's second argument.

[image]
arch = 'x86:LE:32:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'f' },
    { space = 'ram', offset = '0x100020', name = 'g' },
    { space = 'ram', offset = '0x100030', name = 'k' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '''
6a026a01e8170000008b442404c39090909090909090909090909090909090908b442404c20800909090909090909090
6a046a03b920001000ffd18b442408c3
'''

[script]
commands = [
    # calleeretpurge (default on) already reads g's ret 8; the test pins the model extrapop
    'option calleeretpurge off',
    'lo fu f',
    'decompile',
    'print C',
    'option extrapop 12 g',
    'decompile',
    'print C',
    'lo fu k',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'EXTRAPOP #1: the model extrapop leaves the pushed 2 at [esp+4]'
count = 1
literal = 'return 2;'

[[match]]
name = "EXTRAPOP #2: extrapop 12 pops both arguments, so [esp+4] is the caller's argument"
count = 1
literal = 'return a0;'

[[match]]
name = 'EXTRAPOP #3: the call sees both pushed arguments'
count = 1
literal = 'g(1,2);'

[[match]]
name = 'EXTRAPOP #4: a call through a register to g pops its arguments too'
count = 1
literal = 'return a1;'
