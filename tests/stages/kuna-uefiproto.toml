# UEFI protocol interfaces, service-table globals and the PEI and SMM phases
# (`option uefi on|off`).
#
# Stage P1 external-refinement. Four EDK2 modules:
# - uefi_diskio_x64.efi: DiskIoDxe (edk2-stable202505, OvmfX64 RELEASE_GCC5),
#   a DXE driver that locates one protocol and installs three;
# - uefi_fv/StatusCodeHandlerPei.efi and uefi_fv/ReportStatusCodeRouterPei.efi
#   (same build): two PEIMs, the first locating the PPI the second installs;
# - uefi_fv/TcgMorLockSmm.efi (edk2-stable202502, OvmfX64 with SMM, as
#   shipped in Debian's ovmf 2025.02-8): an SMM driver.
# uefi_fv/kuna-uefi.index is what `kuna unpack` with its protocols flag writes
# for the three modules of that directory.
#
# Pass 1 (`uefi off`, the bug): a function other than the entry calls a boot
# service through an offset off an untyped global, and its parameters are
# untyped words.
# Pass 2 (default, the fix): the globals the entry stores the tables in are
# gST and gBS, a protocol lookup types its interface from the GUID, the
# installed instances and the functions they point at carry the interface's
# struct and member names, the PEIM is entered as a PEIM and its PPI lookup
# names the module that installs the PPI, and the SMM driver reaches its
# services through gSmst.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/uefi_diskio_x64.efi',
    'option uefi off',
    'read symbols',
    'load addr 0x24f',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/uefi_diskio_x64.efi',
    'read symbols',
    'load function _ModuleEntryPoint',
    'decompile',
    'print C',
    'load function DriverBindingSupported',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/uefi_fv/StatusCodeHandlerPei.efi',
    'read symbols',
    'load function _ModuleEntryPoint',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/uefi_fv/ReportStatusCodeRouterPei.efi',
    'read symbols',
    'load function _ModuleEntryPoint',
    'decompile',
    'print C',
    'load function PeiRscHandlerRegister',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/uefi_fv/TcgMorLockSmm.efi',
    'read symbols',
    'load function _ModuleEntryPoint',
    'decompile',
    'print C',
    'load addr 0x116b',
    'decompile',
    'print C',
]

[[match]]
name = 'UEFIPROTO #1: off, a boot service outside the entry is an offset off an untyped global'
count = 1
literal = '(**(code **)(dat_1a70 + 0x118))(a1,0x1a10,'

[[match]]
name = 'UEFIPROTO #2: on, the entry stores the tables in gST and gBS'
count = 2
literal = 'gBS = v1;'

[[match]]
name = 'UEFIPROTO #3: on, the located interface pointer is typed from its GUID'
count = 1
literal = '(&gEfiDevicePathUtilitiesProtocolGuid,NULL,&mDevicePathUtilities);'

[[match]]
name = 'UEFIPROTO #4: on, the installed instances are named and typed'
count = 1
literal = '&gEfiDriverBindingProtocolGuid,&gDriverBinding,&gEfiComponentNameProtocolGuid,&gComponentName,&gEfiComponentName2ProtocolGuid,&gComponentName2,0);'

[[match]]
name = 'UEFIPROTO #5: on, a write into the instance names its member'
count = 1
literal = 'gDriverBinding.DriverBindingHandle = ImageHandle;'

[[match]]
name = "UEFIPROTO #6: on, the binding's member function has the member's name and prototype"
count = 1
literal = 'EFI_STATUS DriverBindingSupported(EFI_DRIVER_BINDING_PROTOCOL *This,EFI_HANDLE ControllerHandle,'

[[match]]
name = 'UEFIPROTO #7: on, a boot service outside the entry is a member call through gBS'
count = 1
literal = '(*gBS->OpenProtocol)(ControllerHandle,&gEfiBlockIoProtocolGuid,v2,This->DriverBindingHandle,ControllerHandle,0x10);'

[[match]]
name = 'UEFIPROTO #8: a PEIM is entered with its file handle and the PEI services'
count = 2
literal = 'EFI_STATUS _ModuleEntryPoint(void *FileHandle,EFI_PEI_SERVICES **PeiServices)'

[[match]]
name = 'UEFIPROTO #9: a PPI lookup names the module of the volume that installs the PPI'
count = 1
literal = 'gEfiPeiRscHandlerPpiGuid is installed by ReportStatusCodeRouterPei.efi (EFI_PEI_RSC_HANDLER_PPI at 0x829a90: Register=0x8297ff, Unregister=0x8298c8)'

[[match]]
name = 'UEFIPROTO #10: a PEI service read from below the IDT is a member call'
count = 1
literal = '(*(*v2)->LocatePpi)(v2,&gEfiPeiRscHandlerPpiGuid,0,NULL,&v6);'

[[match]]
name = 'UEFIPROTO #11: a call through the located PPI names its member'
count = 1
literal = '(*v6->Register)('

[[match]]
name = 'UEFIPROTO #12: the PPI descriptor a PEIM installs is named from its GUID'
count = 1
literal = 'PeiServicesInstallPpi(&mEfiPeiRscHandlerPpiDescriptor);'

[[match]]
name = 'UEFIPROTO #13: the IDT read is GetPeiServicesTablePointer'
count = 2
literal = 'v2 = GetPeiServicesTablePointer();'

[[match]]
name = "UEFIPROTO #14: the function an installed PPI points at has the member's prototype"
count = 1
literal = 'EFI_STATUS PeiRscHandlerRegister(void *Callback)'

[[match]]
name = "UEFIPROTO #15: an SMM driver's system table is found through GetSmstLocation"
count = 1
literal = '(*v3->GetSmstLocation)(v3,&gSmst);'

[[match]]
name = 'UEFIPROTO #16: an SMM protocol lookup types its interface and the call names the member'
count = 1
literal = '(*gSmst->SmmLocateProtocol)(&gEfiSmmVariableProtocolGuid,NULL,&mSmmVariable);'

[[match]]
name = 'UEFIPROTO #17: a call through the SMM interface names its member'
count = 1
regex = '\(\*mSmmVariable->SmmSetVariable\)\(L\"MemoryOverwriteRequestControlLock\",'
