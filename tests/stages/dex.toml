# Unlace DEX loader (notes/proposal-dex.md): P1 environment binding,
# option dexmodel, and the P2 switch model, option jumpassist (both
# default on). The script loads the committed DEX fixture built from
# tests/stages/fixtures/dex/Hello.java and prints Java.
#
# Asserts #1-#3 are the off pass, the bare SLEIGH lifting: calls and loads
# go through constant-pool references with no record (UNKNOWNREF), the
# method has no signature, so its parameter never reaches the call that
# used it, and the sparse-switch stays an indirect jump through the
# switchAssist user-op.
# Asserts #4-#10 are the default pass: the constant pool names methods,
# fields and strings, the method's arguments arrive through the entry
# copies (including an invoke-static/range call), the DEX prototypes are
# the signatures, and JumpAssisted recovers the sparse-switch cases.

[image]
arch = 'Dalvik:LE:32:DEX_Android12'
symbols = [
    { space = 'ram', offset = '0x0', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x0'
readonly = true
hex = '0e00'

[script]
commands = [
    'clear architecture',
    'load file tests/stages/fixtures/dex/hello.dex',
    'option setlanguage java-language',
    'option dexmodel off',
    'option jumpassist off',
    'read symbols',
    'load function demo::Hello::greet',
    'decompile',
    'print C',
    'load function demo::Hello::sparse',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/hello.dex',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Hello::greet',
    'decompile',
    'print C',
    'load function demo::Hello::getValue',
    'decompile',
    'print C',
    'load function demo::Hello::sparse',
    'decompile',
    'print C',
    'load function demo::Hello::callMany',
    'decompile',
    'print C',
    'load function demo::Hello::mulWide',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'dexmodel #1: off leaves the constant pool unresolved'
count = 1
literal = 'v2 = new(UNKNOWNREF);'

[[match]]
name = 'dexmodel #2: off loses the signature and its parameter'
count = 1
regex = '^int greet\(\)'

[[match]]
name = 'jumpassist #3: off keeps the sparse-switch an indirect jump'
count = 1
literal = 'switchAssist('

[[match]]
name = 'dexmodel #4: the string literal comes from the pool'
count = 1
literal = 'v1 = ref.append("Hello, ");'

[[match]]
name = 'dexmodel #5: an instance call names its object and method'
count = 1
literal = 'return v1.toString();'

[[match]]
name = 'dexmodel #6: the DEX prototype is the signature'
count = 1
regex = '^String greet\(String a0\)'

[[match]]
name = 'dexmodel #7: instance and static fields print by name'
count = 1
literal = 'return this.value + Hello.counter;'

[[match]]
name = 'jumpassist #8: the sparse-switch cases are recovered'
count = 1
literal = 'case 999999:'

[[match]]
name = 'dexmodel #9: invoke-static/range passes all six arguments'
count = 1
literal = 'Hello.many(a0,2,3,4,5,6)'

[[match]]
name = 'dexmodel #10: a long parameter takes a register pair'
count = 1
regex = '^long mulWide\(long a0,int a1\)'
