# - `integer-float-rounding.toml`, `integer-float-rounding64.toml`,
# `integer-float-rounding-x87.toml`: an integer-to-float conversion keeps its rounding
# through a later float conversion or a narrower float trace (always on), while exact
# intermediates, x87 extended conversions and `fld1` still combine.

[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'rounded' },
    { space = 'ram', offset = '0x10100', name = 'exact_intermediate' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '03000080c500400085a0188281a0192281c3e00801000000'

[[image.bytes]]
space = 'ram'
offset = '0x10100'
readonly = true
hex = '03000080c500400085a0190281a018c281c3e00801000000'

[script]
commands = [
    'parse line extern double rounded(void);',
    'parse line extern float exact_intermediate(void);',
    'map address r0x20000 int value',
    'lo fu rounded',
    'decompile',
    'print C',
    'lo fu exact_intermediate',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'the float rounding is never folded away'
count = 0
literal = 'return (float8)value;'

[[match]]
name = 'integer rounding survives a float-to-double widening'
count = 1
literal = 'return (float8)(float4)value;'

[[match]]
name = 'exact signed32-to-double intermediate still combines'
count = 1
literal = 'return (float4)value;'
