# A PowerPC function sets its return value in r3 before the branch that calls
# __stack_chk_fail_local, which takes no arguments and never returns. P1
# program prep, options noreturn_known (default on) and libgccsigs (default
# off). The script loads a relocatable object that imports the helper and a
# shared object that defines it hidden, each in both byte orders.
#
# Assert #1 is the linked default pass: r3 is passed to the defined helper.
# Assert #2 is the object's noreturn_known off pass, where the call falls
# through to return 0, and the linked libgccsigs on pass, where the defined
# helper takes no argument and, its body not ending the flow, falls through.
# Assert #3 is the object's default pass: the imported helper ends the flow.

[image]
arch = 'PowerPC:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '4e800020'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_be.o',
    'option noreturn_known off',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_be.o',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_le.o',
    'option noreturn_known off',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_le.o',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_linked_be.so',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_linked_be.so',
    'option libgccsigs on',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_linked_le.so',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ppc32_stack_chk_local_linked_le.so',
    'option libgccsigs on',
    'read symbols',
    'load function r6',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'stackchklocal #1: the linked default pass hands the return value to the helper'
count = 2
literal = '__stack_chk_fail_local(a0 * 3);'

[[match]]
name = 'stackchklocal #2: noreturn_known off falls through and libgccsigs on drops the argument'
count = 4
literal = [
    '__stack_chk_fail_local();',
    'return 0;',
]

[[match]]
name = 'stackchklocal #3: the imported helper ends the flow'
count = 2
literal = [
    '__stack_chk_fail_local(); // no-return',
    '}',
]
