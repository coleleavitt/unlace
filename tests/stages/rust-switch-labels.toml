[script]
commands = [
    'option loweredswitch off',
    'parse line extern int4 signed8(int1 selector);',
    'parse line extern int4 signed16(int2 selector);',
    'parse line extern int4 signed32(int4 selector);',
    'parse line extern int4 signed64(int8 selector);',
    'parse line extern int4 unsigned8(uint1 selector);',
    'parse line extern int4 unsigned16(uint2 selector);',
    'parse line extern int4 unsigned32(uint4 selector);',
    'parse line extern int4 unsigned64(uint8 selector);',
    'parse line extern int4 signed16_load(int2 *selector);',
    'parse line extern int4 signed16_widen(int2 selector);',
    'parse line extern int4 text8(char selector);',
    'option setlanguage rust-language',
    'lo fu signed8',
    'decompile',
    'print C',
    'lo fu signed16',
    'decompile',
    'print C',
    'lo fu signed32',
    'decompile',
    'print C',
    'lo fu signed64',
    'decompile',
    'print C',
    'lo fu unsigned8',
    'decompile',
    'print C',
    'lo fu unsigned16',
    'decompile',
    'print C',
    'lo fu unsigned32',
    'decompile',
    'print C',
    'lo fu unsigned64',
    'decompile',
    'print C',
    'lo fu signed16_load',
    'decompile',
    'print C',
    'lo fu signed16_widen',
    'decompile',
    'print C',
    'lo fu text8',
    'decompile',
    'print C',
    'option setlanguage c-language',
    'lo fu text8',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'RUST SWITCH LABELS #1: every function prints a Rust match'
count = 11
regex = 'match \*?selector \{'

[[match]]
name = 'RUST SWITCH LABELS #2: every signed first arm is negative'
count = 6
literal = '-0xd =>'

[[match]]
name = 'RUST SWITCH LABELS #3: every signed last arm is negative'
count = 6
literal = '-0xb =>'

[[match]]
name = 'RUST SWITCH LABELS #4: unsigned and text 8-bit high labels stay positive'
count = 2
literal = '0xf3 =>'

[[match]]
name = 'RUST SWITCH LABELS #5: only the unsigned 16-bit selector keeps 0xfff3'
count = 1
literal = '0xfff3 =>'

[[match]]
name = 'RUST SWITCH LABELS #6: only the unsigned 32-bit selector keeps 0xfffffff3'
count = 1
literal = '0xfffffff3 =>'

[[match]]
name = 'RUST SWITCH LABELS #7: only the unsigned 64-bit selector keeps its high label'
count = 1
literal = '0xfffffffffffffff3 =>'

[[match]]
name = 'RUST SWITCH LABELS #8: a char selector spells u8 with unsigned arms'
count = 1
literal = [
    'unsafe fn text8(mut selector: u8) -> i32',
    '{',
    'match selector {',
    '0xf3 =>',
]

[[match]]
name = 'RUST SWITCH LABELS #9: the same char selector is signed in C'
count = 1
literal = [
    'text8(char selector)',
    '{',
    'switch(selector) {',
    'case -0xd:',
]
