# Data imports read through an import slot (`option importdata on|off`).
#
# Issue: a data import is reached through a slot the dynamic loader fills
# with the import's address, `ldr x8,[slot]; ldr w8,[x8]`. kuna names that
# slot for the import and paints it externref, which is how a CALL through it
# deindirects to the import; a DATA read is not a call, so it printed as a
# dereference of the anonymous slot. In an arm64e iOS system daemon that is
# 921 reads, and `if (*dat_1041cc6c8 == ...)` for the stack-protector guard in
# a large third-party iOS app.
#
# Stage / sub-stage: P9 naming-policy, `PrintC::op_load`
# (`unlace-decomp/src/p9_emit/printc.rs`, `import_slot_name`), resolved as
# ActionDeindirect resolves a call through the same slot.
#
# P0 assertion: `option importdata on|off` (default on). It is read when C is
# printed; `clear architecture` resets it, so pass 1 sets it off after its load.
#
# The XML wrapper only supplies the harness architecture. Both passes clear
# it and load the real arm64 Mach-O fixture `macho_gotdata` (built from
# `macho_gotdata.c`, see the fixtures README): `_main` @0x100000448 reads
# `imported_counter` and `imported_name` through their `__DATA_CONST,__got`
# slots @0x100004000 and @0x100004008.
#
# Pass 1 (`option importdata off`, the BUG): the reads are `*dat_100004000`
# and `*dat_100004008`. Pass 2 (the default, the FIX): they are
# `imported_counter` and `imported_name`.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_gotdata',
    'option importdata off',
    'read symbols',
    'load addr 0x100000448',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_gotdata',
    'read symbols',
    'load addr 0x100000448',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'importdata off: the imported counter is read through its __got slot'
count = 1
literal = 'v1 = *dat_100004000;'

[[match]]
name = 'importdata off: the imported pointer is tested through its __got slot'
count = 1
literal = 'if (*dat_100004008)'

[[match]]
name = 'importdata on: the imported counter renders as the import'
count = 1
literal = 'v1 = imported_counter;'

[[match]]
name = 'importdata on: the imported pointer renders as the import'
count = 1
literal = 'if (imported_name)'
