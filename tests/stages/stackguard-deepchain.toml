# unlace stage test: a canary check that the stack-guard strip misses when its
# derivation walk is cut off, and strips once the walk reaches the entry store.
#
# The image is a clean-room x86-64 function, byte for byte at 0x401000 (built by
# a script, not compiler output): sub rsp,0x28; mov rax,fs:0x28; store it at
# [rsp+0x18]; forty times "lea rdi,[rsp+0x18]; call helper"; then
# "mov rax,[rsp+0x18]; sub rax,fs:0x28; jne fail; add rsp,0x28; ret", and
# fail calls __stack_chk_fail (at 0x401420).
#
# The saved canary reaches the compare through one INDIRECT or MULTIEQUAL per
# call, a chain of about 40 versions. ActionStripStackGuard's walk
# (derives_from_canary_load) used depth 32, so it returned false before it reached
# the fs:0x28 load, and the check stayed. The walk budget is now
# CANARY_WALK_DEPTH = 256 (the visited set still stops cycles). Pass 1 (default
# on) must strip the check; pass 2 (off) must keep it.
#
# Stage: P7 regions, stackguard (ActionStripStackGuard), P0 assertion
# option stackguard on|off.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'chain' },
]

[[image.bytes]]
