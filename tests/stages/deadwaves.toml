# GH-1034, P3 rule pools, dead-removal waves. churn (the prunedssa
# fixture) reads 256 read-only table words between 256 calls; its rule
# pool passes remove dead INDIRECT and MULTIEQUAL chains one link per
# pass. A pass that follows one whose only change was dead-op removal
# visits only the ops that removal touched. The body, the live IR and the
# ops created are the ones a sweep of every op in every pass leaves.

[image]
arch = 'x86:LE:64:default:gcc'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/prunedssa_x86_64',
    'read symbols',
    'load function churn',
    'decompile',
    'print C',
    'count pcode',
]

[[match]]
name = 'deadwaves #1: churn prints'
count = 1
regex = '^uint8 churn\(int8 a0,char \*a1\)$'

[[match]]
name = 'deadwaves #2: churn keeps its 256 calls'
count = 256
literal = 'sink('

[[match]]
name = "deadwaves #3: the live IR is the sweep's"
count = 1
literal = 'Count - pcode = 8085'

[[match]]
name = "deadwaves #4: the ops created are the sweep's"
count = 1
literal = 'Count - created = 35888'
