# unlace relocatable-object loader: a MIPS relocation may be one operation of
# a longer expression. GNU as writes `%hi(%neg(%gp_rel(f)))` in an N32
# object as three records at one offset, GPREL16, SUB and HI16, each taking
# the result of the one before; an N64 record packs up to three operations
# and an expression may continue into the next record at the same offset.
# The loader applied each N32 record on its own and each N64 record alone,
# so every N32 .cpsetup left $gp at the function's entry and its GOT reads
# landed below .text (`*dat_3f8080`), and a call through a composed
# expression kept its placeholder (sub_0, halt_baddata, trap).
#
# Stage: P1 program prep (relocatable-object loader); a strict loader fix,
# no option. Single pass.
#
# Images: tests/fixtures/octeon-relocations/pic-gcc73-n32.o (GCC 7.3 N32 PIC,
# pic.c) and call-composed-{n32,64}-be.o (call-composed.S); see that
# directory's README and provenance files.
#
# Assert #1: N32 PIC read_global reads global_value through the GOT.
# Assert #2: N32 PIC call_external calls external through the GOT.
# Assert #3: every composed N32 and N64 call names its callee.
# Assert #4: no call is left at a placeholder or bad instruction.
# Assert #5: same-offset N32 REL words accumulate both symbols in BE/LE.
# Assert #6: implicit addends are reread with 32-bit wrapping in BE/LE.
# Assert #7: composed PC32 wraps an unsigned R32 result in N32/N64 BE/LE.
# Assert #8: standalone PC32 wraps a displacement below the signed range.
# Assert #9: same-offset N32 REL R_MIPS_32 then HI16 chain as GNU ld does.
# Assert #10: same-offset N32 REL R_MIPS_32 then LO16 keep the field's other half.
# Assert #11: REL GPREL16, SUB, HI16 at one offset compose %hi(%neg(%gp_rel(x))).

[image]
arch = 'MIPS:BE:64:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '03e0000800000000'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/pic-gcc73-n32.o',
    'read symbols',
    'lo fu read_global',
    'decompile',
    'print C',
    'lo fu call_external',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/call-composed-n32-be.o',
    'read symbols',
    'lo fu composed_call',
    'decompile',
    'print C',
    'lo fu scalar_chain_call',
    'decompile',
    'print C',
    'lo fu cross_record_call',
    'decompile',
    'print C',
    'lo fu relative_call',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/call-composed-64-be.o',
    'read symbols',
    'lo fu composed_call',
    'decompile',
    'print C',
    'lo fu scalar_chain_call',
    'decompile',
    'print C',
    'lo fu cross_record_call',
    'decompile',
    'print C',
    'lo fu relative_call',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/rel-chain-n32-be.o',
    'read symbols',
    'lo fu read_combined',
    'decompile',
    'print C',
    'lo fu read_wrapped',
    'decompile',
    'print C',
    'lo fu read_mixed',
    'decompile',
    'print C',
    'lo fu read_mixed_lo',
    'decompile',
    'print C',
    'lo fu read_chain',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/rel-chain-n32-le.o',
    'read symbols',
    'lo fu read_combined',
    'decompile',
    'print C',
    'lo fu read_wrapped',
    'decompile',
    'print C',
    'lo fu read_mixed',
    'decompile',
    'print C',
    'lo fu read_mixed_lo',
    'decompile',
    'print C',
    'lo fu read_chain',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/pc32-n32-be.o',
    'read symbols',
    'lo fu read_composed_pc32',
    'decompile',
    'print C',
    'lo fu read_standalone_pc32',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/pc32-n32-le.o',
    'read symbols',
    'lo fu read_composed_pc32',
    'decompile',
    'print C',
    'lo fu read_standalone_pc32',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/pc32-64-be.o',
    'read symbols',
    'lo fu read_composed_pc32',
    'decompile',
    'print C',
    'lo fu read_standalone_pc32',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/pc32-64-le.o',
    'read symbols',
    'lo fu read_composed_pc32',
    'decompile',
    'print C',
    'lo fu read_standalone_pc32',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'mipsreloc-chains #1: N32 PIC read_global reads global_value'
count = 1
literal = 'return x + global_value;'

[[match]]
name = 'mipsreloc-chains #2: N32 PIC call_external calls external'
count = 1
literal = 'return external('

[[match]]
name = 'mipsreloc-chains #3: composed N32 and N64 calls name their callees'
count = 8
regex = '(composed|scalar|cross|relative)_target\(7,0xb\);'

[[match]]
name = 'mipsreloc-chains #4: no placeholder call or bad instruction'
count = 0
regex = 'sub_[0-9a-f]+\(|halt_baddata|trap\(|dat_3f8'

[[match]]
name = 'mipsreloc-chains #5: N32 REL same-offset sums match GNU in both byte orders'
count = 2
literal = 'return 0x68ac0007;'

[[match]]
name = 'mipsreloc-chains #6: N32 REL rereads wraparound addends in both byte orders'
count = 2
literal = 'return 0x10;'

[[match]]
name = 'mipsreloc-chains #7: composed PC32 wraps in N32 and N64 in both byte orders'
count = 4
literal = 'return 0xffffffffffbffffc;'

[[match]]
name = 'mipsreloc-chains #8: standalone PC32 wraps below the signed range'
count = 4
literal = 'return 0x7fbffffc;'

[[match]]
name = 'mipsreloc-chains #9: N32 REL R32 then HI16 chain in both byte orders'
count = 2
literal = 'return 0x68ac;'

[[match]]
name = 'mipsreloc-chains #10: N32 REL R32 then LO16 keep the other half in both byte orders'
count = 2
literal = 'return 0x5123b;'

[[match]]
name = 'mipsreloc-chains #11: REL GPREL16, SUB, HI16 compose in both byte orders'
count = 2
literal = 'return 0x3c01ee0d;'
