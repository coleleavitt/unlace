[image]
arch = 'PowerPC:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '4e800020'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-cache-swapped.elf',
    'read symbols',
    'option ppc32picimports on',
    'load function check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-cache-original.elf',
    'read symbols',
    'option ppc32picimports on',
    'load function check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-abi.elf',
    'read symbols',
    'option ppc32picimports on',
    'load function check',
    'decompile',
    'print C',
    'option ppc32picimports abi',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-cache-swapped.elf',
    'read symbols',
    'load function check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-cache-original.elf',
    'read symbols',
    'load function check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-cache-swapped.elf',
    'read symbols',
    'load function check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-cache-original.elf',
    'read symbols',
    'load function check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-tar-helper.elf',
    'read symbols',
    'load function check',
    'decompile',
    'print C',
    'option ppc32picimports off',
    'quit',
]

[[match]]
name = 'only the swapped image calls the terminal import'
count = 3
literal = '__stack_chk_fail('

[[match]]
name = 'returning callers retain their original calls'
count = 3
literal = 'sub_1800('

[[match]]
name = 'all returning images retain their return'
count = 5
literal = 'return 7;'

[[match]]
name = 'ABI reloads preserve the returning import identity'
count = 2
literal = 'extra('
