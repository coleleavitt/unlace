# - `integer-float-rounding.toml`, `integer-float-rounding64.toml`,
# `integer-float-rounding-x87.toml`: an integer-to-float conversion keeps its rounding
# through a later float conversion or a narrower float trace (always on), while exact
# intermediates, x87 extended conversions and `fld1` still combine.

[image]
arch = 'sparc:BE:64:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'double_rounded' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '03000080c518400085a0110281a018c2c120600881c3e00801000000'

[script]
commands = [
    'parse line extern void double_rounded(void);',
    'map address r0x20000 long long value',
    'map address r0x20008 float result',
    'lo fu double_rounded',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'signed64 double rounding survives subfloat lowering'
count = 1
literal = 'result = (float4)(float8)value;'
