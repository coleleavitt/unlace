# `storecopyeffects.toml` pins the AArch64 address-spill store across calls, repeated stores,
# a load between calls, and a truly dead-store control. The compiled round trips in
# `unlace-cli/tests/store_copy_effects.rs` also exercise aliasing and distinct pointers on AArch64
# and x86-64 at `-O0` and `-O2`.

[image]
arch = 'x86:LE:64:default:gcc'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/storecopyeffects_clang_O0_aarch64.o',
    'read symbols',
    'load function s7',
    'decompile',
    'print C',
    'load function s_repeat',
    'decompile',
    'print C',
    'load function s_read',
    'decompile',
    'print C',
    'load function s_dead',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'STORECOPYEFFECTS #1: the three live writes of nine survive'
count = 3
literal = 'gi = 9;'

[[match]]
name = 'STORECOPYEFFECTS #2: every subsequent spill reload keeps its store'
count = 3
regex = 'gi = (3|7|0xb);'

[[match]]
name = 'STORECOPYEFFECTS #3: a load between calls saves its pre-store value'
count = 1
regex = 'v[0-9]+ = gi;'

[[match]]
name = 'STORECOPYEFFECTS #4: a truly dead parameter store still disappears'
count = 1
literal = 's_dead(void)'
