[[match]]
name = 'FLOATEQ #1: the bits of -0.0 compare as an integer'
count = 4
regex = '\{ \.from = a0 \}\)\.to [!=]= 0x80000000\)'

[[match]]
name = 'FLOATEQ #2: the quiet NaN pattern compares as an integer'
count = 4
regex = '\{ \.from = ABS\(a0\) \}\)\.to [!=]= 0x7fc00000\)'

[[match]]
name = "FLOATEQ #3: two floats' bits both reinterpret"
count = 4
regex = '\{ \.from = a0 \}\)\.to [!=]= \(\(union \{ float from; unsigned int to; \}\)\{ \.from = a1 \}\)\.to\)'

[[match]]
name = "FLOATEQ #4: the bits of a double's -0.0 compare as an integer"
count = 3
regex = '\(\(union \{ double from; unsigned long long to; \}\)\{ \.from = a0 \}\)\.to [!=]= 0x8000000000000000\)'

[[match]]
name = "FLOATEQ #5: a double's quiet NaN pattern compares as an integer"
count = 3
regex = '\(\(union \{ double from; unsigned long long to; \}\)\{ \.from = ABS\(a0\) \}\)\.to [!=]= 0x7ff8000000000000\)'

[[match]]
name = 'FLOATEQ #6: no float comparison with -0.0 or NAN is left'
count = 0
regex = '[!=]= (-0\.0|-?NAN)\b'

[[match]]
name = 'FLOATEQ #7: the bits of 1.0f keep the exact float comparison'
count = 4
regex = 'if \(a0 [!=]= 1\.0f?\)'

[[match]]
name = "FLOATEQ #10: the magnitude's bits against zero keep the exact float comparison"
count = 4
regex = 'if \(ABS\(a0\) [!=]= 0\.0f?\)'

[[match]]
name = 'FLOATEQ #8: a float == stays a float comparison'
count = 4
regex = '\(?a0 == a1\)?( & 1)?;'

[[match]]
name = 'FLOATEQ #9: a double != stays a float comparison'
count = 3
regex = '\(?a0 != a1\)?( & 1)?;'
