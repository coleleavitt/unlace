language = "FR:BE:32:default"
base = "0x0"
fixture = "crates/unlace-cli/tests/fixtures/fr/delay_call.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "fr_delay_slot_branches_decompile"
address = "0x0"
expect = [
    "if (a1 < a0)",
    "return a0 - a1;",
    "return a0 + a1 * 4;",
]

[[family.function]]
test = "fr_delayed_call_passes_its_slot_argument"
address = "0x12"
expect = [
    "sub_0(",
    ",7)",
    "+ 1",
]

