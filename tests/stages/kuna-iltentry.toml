# MSVC incremental-link table entries (thunkentry).
#
# An MSVC /INCREMENTAL image routes every call and vtable slot through a table
# of `jmp rel32` stubs. Fast discovery walks only from loader roots, so on a C++
# image, whose code is mostly reached through vtables, it found the stubs it
# happened to call and almost none of the bodies.
#
# Fixture: crates/unlace-analysis/tests/fixtures/iltentry_pe_i386.exe
# (build notes in iltentry_pe_i386.s). The entry calls stub 0 only; the
# sixteen stubs at 0x401010..0x40105b jump to bodies at 0x401060 + 0x10*k.
# Under `mode fast` every stub and every body is an entry.

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/iltentry_pe_i386.exe',
    'mode fast',
    'read symbols',
    'functions',
    'load function sub_401130',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ILTENTRY #1: every stub of the table is an entry'
count = 16
regex = '^0x4010[1-5][0-9a-f] sub_4010[1-5][0-9a-f]$'

[[match]]
name = 'ILTENTRY #2: every body behind the table is an entry'
count = 16
regex = '^0x401(0[6-9a-f]|1[0-5])0 sub_401(0[6-9a-f]|1[0-5])0$'

[[match]]
name = 'ILTENTRY #3: a body reached only through the table decompiles'
count = 1
literal = 'return a0 * 0x28;'
