[[match]]
name = 'LIBCTYPES #1: off, the stream parameter is an opaque void *'
count = 1
literal = 'int4 fclose(void *a0)'

[[match]]
name = 'LIBCTYPES #2: on, the same parameter is a minted FILE *'
count = 1
literal = 'int4 fclose(FILE *a0)'

[[match]]
name = 'LIBCTYPES #3: off, the fopen result is an opaque void *'
count = 1
literal = 'void * fopen(char *a0,char *a1)'

[[match]]
name = 'LIBCTYPES #4: on, the fopen result is a minted FILE *'
count = 1
literal = 'FILE * fopen(char *a0,char *a1)'

[[match]]
name = 'LIBCTYPES #5: the DWARF layout of `stat` reads the same in both passes -- the named table adopted it instead of shadowing it'
count = 2
literal = 'st->st_mode'

[[match]]
name = 'LIBCTYPES #6: and neither aggregate a DWARF definition already described fell back to an offset-named field'
count = 0
regex = '(st|f)->field_0x'

[[match]]
name = 'LIBCTYPES #7: on a binary whose DWARF DOES define the stream type, that definition is what the table points at'
count = 1
literal = 'int4 fclose(_IO_FILE *a0)'

[[match]]
name = 'LIBCTYPES #8: including the parameter the whole option exists for'
count = 1
literal = 'int4 get_prefix(_IO_FILE *f)'

[[match]]
name = 'LIBCTYPES #9: with its real field layout, not a shell'
count = 2
literal = 'f->_IO_read_end <= v2'

[[match]]
name = 'LIBCTYPES #10: glibc off, a MINTED stream shell has no members, so the refill body reads an offset'
count = 2
literal = '*(uint1 **)&a0->field_0x8'

[[match]]
name = 'LIBCTYPES #11: glibc on, the same two accesses are the published field'
count = 2
literal = 'a0->_IO_read_ptr'

[[match]]
name = 'LIBCTYPES #12: glibc off, a MINTED stat shell reads its size through a cast at an offset'
count = 1
literal = '&a1->field_0x30'

[[match]]
name = 'LIBCTYPES #13: glibc on, that read is the field'
count = 1
literal = 'return a1->st_size;'

[[match]]
name = "LIBCTYPES #14: and the value carries the FIELD's type, so the sentinel is a signed -1"
count = 1
literal = 'return -1;'

[[match]]
name = "LIBCTYPES #15: and the lines carrying an offset-named field anywhere in this file are exactly the four of pass 4, the four of the opaque stream passes and the one of pass 13's control"
count = 9
literal = 'field_0x'

[[match]]
name = 'LIBCTYPES #16: off, the copy-relocated stream slot is an untyped word and its fields are raw offsets'
count = 1
literal = 'return *(int8 *)(stdout + 0x28) - *(int8 *)(stdout + 0x20);'

[[match]]
name = 'LIBCTYPES #17: off, the GOT slot of a shared object is not even named'
count = 1
literal = 'return *(int8 *)(*dat_3fd8 + 0x28) - *(int8 *)(*dat_3fd8 + 0x20);'

[[match]]
name = 'LIBCTYPES #18: on, the copy-relocated slot is the stream itself, so the reads are fields of it'
count = 1
literal = 'return *(int8 *)&stdout->field_0x28 - *(int8 *)&stdout->field_0x20;'

[[match]]
name = "LIBCTYPES #19: on, the GOT slot holds the stream's ADDRESS, and the name and the extra indirection both say so"
count = 1
literal = 'return *(int8 *)&(*stdout_ptr)->field_0x28 - *(int8 *)&(*stdout_ptr)->field_0x20;'

[[match]]
name = 'LIBCTYPES #20: a store THROUGH the stream pointer still stores to the same address'
count = 1
literal = '*(unsigned long *)&stdout->field_0x28 = a0;'

[[match]]
name = 'LIBCTYPES #21: and so does the GOT form'
count = 1
literal = '*(unsigned long *)&(*stdout_ptr)->field_0x28 = a0;'

[[match]]
name = 'LIBCTYPES #22: a read of the stream OBJECT stays the object -- `sink\(stdin\)`, never `sink\(\*stdin\)`'
count = 2
literal = 'sink(stdin);'

[[match]]
name = 'LIBCTYPES #23: and in the library it is the one indirection the program performs, no more'
count = 1
literal = 'sink(*stdin_ptr);'

[[match]]
name = 'LIBCTYPES #24: a stream handed to a libc call the table already typed does not move'
count = 2
literal = 'fputs(a0,stdout);'

[[match]]
name = "LIBCTYPES #25: and the library's loses the cast the untyped slot needed"
count = 1
literal = 'fputs(a0,*stdout_ptr);'

[[match]]
name = 'LIBCTYPES #27: off, an obstack entry point the image DEFINES says nothing, so its caller has neither arity nor a pointee'
count = 1
literal = 'void grow(void)'

[[match]]
name = "LIBCTYPES #28: on, that same definition -- gnulib's copy, linked in and exported -- names the pointer its caller holds"
count = 1
literal = 'void grow(obstack *a0,uint8 a1)'

[[match]]
name = 'LIBCTYPES #29: off, the imported `putspent` leaves both of its aggregate slots unsaid'
count = 1
literal = 'void emit(void)'

[[match]]
name = 'LIBCTYPES #30: on, its declaration names the shadow record and the stream it is written to'
count = 1
literal = 'void emit(spwd *a0,FILE *a1)'

[[match]]
name = 'LIBCTYPES #31: off, the IMPORTED obstack entry point says nothing either'
count = 1
literal = 'void grow_import(void)'

[[match]]
name = "LIBCTYPES #32: on, an import takes glibc's own spelling -- `int`, where the linked-in gnulib copy of #28 takes `size_t`"
count = 1
literal = 'void grow_import(obstack *a0,int4 a1)'

[[match]]
name = "LIBCTYPES #33: an obstack at the head of a larger object -- the function reads past the obstack's 88 bytes, so the pointer is the object's"
count = 1
literal = 'void kws_grow(void *a0,int4 a1)'

[[match]]
name = 'LIBCTYPES #34: and a member past the obstack is an offset from it, not an element of an obstack array'
count = 1
literal = '((int8 *)a0)[0x12e] = a1;'

[[match]]
name = 'LIBCTYPES #35: the same with a pthread_mutex_t at the head of an instance record'
count = 1
literal = 'unsigned int inst_refs(void *a0)'

[[match]]
name = 'LIBCTYPES #36: the control -- a pointer that stays inside the obstack keeps the name'
count = 1
literal = 'void grow_in(obstack *a0,int4 a1)'

[[match]]
name = 'LIBCTYPES #37: on i386 the x86-64 widths are refused, so the timespec slot no longer swallows the local beside it'
count = 1
literal = 'v4 = a0 + 2;'

[[match]]
name = 'LIBCTYPES #38: and the int array beside the obstack stays an int array'
count = 1
literal = 'v1[v3] = a0 * v3;'

[[match]]
name = 'LIBCTYPES #39: and no local anywhere in this file is a piece of a grown struct'
count = 0
regex = 'v1\._[0-9]+_4_'
