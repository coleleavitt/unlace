# unlace analysis (options funcstart_patterns and aif), GH-904: no function
# starts inside the extent a sized function symbol declares.
#
# gcc sinks buf_dup_char's frame setup past its early return:
#     0x00  bnez a2,0x10 / nop / jr ra / nop
#     0x10  addiu sp,sp,-32 ...
# The MIPS pattern pair (a return before a stack adjust) matches at
# .text+0x10, so the function-start pass committed sub_400010 inside
# buf_dup_char's 0x74-byte symbol, and decompile-all printed the tail of
# buf_dup_char a second time as a function of its own.  On a big-endian
# object, whose analysis view was not yet rebased, the same start landed at the
# pre-link address 0x10.  A pattern or gap-walk entry strictly inside a
# sized function symbol is now that function's code.
#
# Stage: P1 program prep (code/data partition), options funcstart_patterns
# and aif (the drivers' default on every architecture but x86-64).
# Single pass.
#
# Images: crates/unlace-analysis/tests/fixtures/
# funcstart_shrinkwrap_el.o and funcstart_shrinkwrap_eb.o
# (funcstart_shrinkwrap.c); see funcstart_shrinkwrap.provenance.
#
# Assert #1: both objects list buf_dup_char and buf_last.
# Assert #2: neither lists a start inside buf_dup_char.

[image]
arch = 'MIPS:LE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '0800e00300000000'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/funcstart_shrinkwrap_el.o',
    'option listing on',
    'option funcstart_patterns on',
    'option aif on',
    'read symbols',
    'functions',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/funcstart_shrinkwrap_eb.o',
    'option listing on',
    'option funcstart_patterns on',
    'option aif on',
    'read symbols',
    'functions',
    'quit',
]

[[match]]
name = 'funcstart-symbolextent #1: both objects list buf_dup_char'
count = 2
literal = '0x400000 buf_dup_char'

[[match]]
name = 'funcstart-symbolextent #1b: both objects list buf_last'
count = 2
literal = '0x400074 buf_last'

[[match]]
name = 'funcstart-symbolextent #2: no start inside buf_dup_char'
count = 0
regex = 'sub_(4000)?10\b'
