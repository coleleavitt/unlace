# Independent synthetic witness; no existing public issue number.
# P3 simplification quiescence, P0 option globalarrayanchor (default off).
# The disabled/inference-off assertion retains the numeric base; enabled
# LOAD/STORE assertions preserve the declared array and element bias.
# Independent assembly: mapped flags + (slot * 2) - 2; six instructions.

[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'clear_slot' },
    { space = 'ram', offset = '0x10100', name = 'clear_neighbor' },
    { space = 'ram', offset = '0x10200', name = 'clear_unbiased' },
    { space = 'ram', offset = '0x10300', name = 'clear_unmapped' },
    { space = 'ram', offset = '0x10400', name = 'clear_byte' },
    { space = 'ram', offset = '0x10500', name = 'calculate' },
    { space = 'ram', offset = '0x10600', name = 'read_slot' },
    { space = 'ram', offset = '0x10700', name = 'clear_positive' },
    { space = 'ram', offset = '0x10800', name = 'clear_far' },
    { space = 'ram', offset = '0x10900', name = 'clear_unscaled' },
    { space = 'ram', offset = '0x10a00', name = 'clear_two_indices' },
    { space = 'ram', offset = '0x10b00', name = 'clear_low' },
    { space = 'ram', offset = '0x10c00', name = 'clear_byte_array' },
    { space = 'ram', offset = '0x10d00', name = 'clear_split' },
    { space = 'ram', offset = '0x10e00', name = 'clear_split_alone' },
]

