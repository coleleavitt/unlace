# Kuna #1652: P1 loader, eBPF ELF objects (no option: a correctness fix).
# The script loads a clang `-target bpf -O2 -c` object (source beside the
# fixture) and lets the loader pick the language from EM_BPF (247); the
# big-endian twin takes eBPF:BE:64:default the same way.
#
# Asserts #1-#2 prove the R_BPF_64_64 map reference lands in the two imm
# halves of the 16-byte lddw and the opcode survives: the function body is
# recovered and the map symbol is the lookup's first argument. Assert #3
# proves the `call 1` helper id takes the pspec default-symbol name.
# Assert #4 proves the R_BPF_64_32 subprogram call resolves to the callee
# in `.text` (`(S - P) / 8 - 1` into imm, not a 32-bit write over the
# opcode). Assert #5 proves the big-endian object loads and relocates too.
# Asserts #6-#7 load an object whose two static callees in `.text` are
# both named by the `.text` section symbol: the call's own `imm` (`-1`,
# then `2`) is the REL addend `(imm + 1) * 8` that selects the callee, so
# `prog` calls `twice` and then `plus7`, not `twice` twice; the
# big-endian twin keeps the source register in the low nibble of the
# register byte, and its calls are relocated too.

[image]
arch = 'eBPF:LE:64:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '9500000000000000'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ebpf/bpf_map.o',
    'read symbols',
    'load function prog',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ebpf/bpf_subcall.o',
    'read symbols',
    'load function prog',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ebpf/bpf_map_be.o',
    'read symbols',
    'load function prog',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ebpf/bpf_static_call.o',
    'read symbols',
    'load function prog',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ebpf/bpf_static_call_be.o',
    'read symbols',
    'load function prog',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ebpf #1: the lddw opcode survives the map relocation'
count = 0
literal = 'halt_baddata'

[[match]]
name = 'ebpf #2: the map reference is the named map symbol'
count = 3
literal = 'bpf_map_lookup_elem(counters,&'

[[match]]
name = 'ebpf #3: the helper id names the pspec helper'
count = 3
regex = 'v1 = .*bpf_map_lookup_elem\(counters,&v2\);'

[[match]]
name = 'ebpf #4: the subprogram call resolves to the .text callee'
count = 1
literal = 'helper(v1);'

[[match]]
name = 'ebpf #5: the map increment is recovered in every object'
count = 2
literal = '*v1 = *v1 + 1;'

[[match]]
name = 'ebpf #6: a static callee named by the .text section symbol is the one its imm selects'
count = 2
literal = 'return plus7(a0) ^ v1;'

[[match]]
name = 'ebpf #7: the first static call reaches twice in both byte orders'
count = 2
literal = 'v1 = twice('
