# Kuna: P1 environment binding, options dyldimage and dyldcrossrefs
# (default on). The script loads one image out of the committed synthetic
# dyld shared cache (crates/unlace-analysis/tests/fixtures/
# dyld_cache_arm64e.py): a main file, a .01 sub-cache holding a
# __TEXT_STUBS stub island, and a .symbols file. `option dyldimage`
# selects /usr/lib/libcaller.dylib before `load file`.
#
# libcaller calls libcallee's callee_add through the island at 0x180008800
# and tail-calls it through a coalesced __got slot whose v3 slide-info
# chain holds an authenticated pointer.
#
# Pass 1 (dyldcrossrefs off) is the bug: the island call renders as
# sub_180008800() (assert #1) and the slot call as (*dat_180010008)()
# (assert #2). Pass 2 (on) is the fix: both render callee_add() (asserts
# #3-#4). Naming the slot needs the auth pointer decoded to 0x180002800.
# Assert #5 holds in both passes: helper_local is a <redacted>
# placeholder in the image's own symbol table, and only the .symbols
# file names it. `exporttrie` is off so the names come from the target's
# own symbol table (exporttrie covers the import names).

[image]
arch = 'AARCH64:LE:64:v8A'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'option dyldimage /usr/lib/libcaller.dylib',
    'option exporttrie off',
    'option dyldcrossrefs off',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dyld_cache_arm64e/dyld_shared_cache_arm64e',
    'read symbols',
    'load function caller_entry',
    'decompile',
    'print C',
    'load function caller_indirect',
    'decompile',
    'print C',
    'option dyldcrossrefs on',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dyld_cache_arm64e/dyld_shared_cache_arm64e',
    'read symbols',
    'load function caller_entry',
    'decompile',
    'print C',
    'load function caller_indirect',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'dyldcrossrefs #1: off leaves the island call unnamed'
count = 1
literal = 'v1 = sub_180008800();'

[[match]]
name = 'dyldcrossrefs #2: off leaves the GOT slot call unnamed'
count = 1
literal = '(*dat_180010008)(); // jump-as-call'

[[match]]
name = 'dyldcrossrefs #3: on names the island after its target in the other image'
count = 1
literal = 'v1 = callee_add();'

[[match]]
name = 'dyldcrossrefs #4: on names the slot from its decoded auth pointer'
count = 1
regex = '^  callee_add\(\); // jump-as-call'

[[match]]
name = 'dyldcrossrefs #5: the local symbols file names the redacted helper'
count = 2
literal = '_helper_local();'
