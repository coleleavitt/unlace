# unlace issue testcase: no AIF gap entry starts on nop padding (part of
# `option aif`).
#
# Issue:      unlace GH-299 - aif plants entries that are not function starts
#             on large i386 PEs; most of the non-start ones are the nop runs
#             in front of Wine's relay thunks.
# Stage:      P1 code/data partition - the AIF gap-walk probe
#             (`analyzers/aif/unlace_aifnoppad.rs`).
# The XML wrapper only provides the harness architecture.  Both passes clear
# it and loads `aifnoppad_pe_i386.exe` (source `aifnoppad_pe_i386.asm`
# beside it): five called stubs open with nine nops, so `nop, nop` is a
# shared prologue fingerprint; eight nops pad from `relay`'s `ret 4` to the
# called `hot` at 0x401230; `dead` at 0x401239 opens with `mov edi,edi`
# straight after a return; `lone` at 0x40124c sits behind six nops with a
# prologue nothing else shares.  Neither `dead` nor `lone` is referenced.
#
# Before the filler rule the inventory listed sub_401228 and sub_401248,
# both on nops.
# Pass 1 (`mode aggressive`) lists neither, lists `lone` at its own
# address, and keeps `dead`: `mov edi,edi` is not padding.
# Pass 2 (`mode aggressive`, `option aif off`) shows `dead` and `lone` are
# the gap walk's own finds.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/aifnoppad_pe_i386.exe',
    'mode aggressive',
    'read symbols',
    'functions',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/aifnoppad_pe_i386.exe',
    'mode aggressive',
    'option aif off',
    'read symbols',
    'functions',
    'quit',
]

[[match]]
name = 'UNLACE-AIFNOPPAD #1: hot is a function in both passes'
count = 2
literal = '0x401230 sub_401230'

[[match]]
name = 'UNLACE-AIFNOPPAD #2: the padding in front of hot is never a function'
count = 0
literal = '0x401228 sub_401228'

[[match]]
name = 'UNLACE-AIFNOPPAD #3: the padding in front of lone is never a function'
count = 0
literal = '0x401248 sub_401248'

[[match]]
name = 'UNLACE-AIFNOPPAD #4: lone is found at its own address by the gap walk'
count = 1
literal = '0x40124c sub_40124c'

[[match]]
name = 'UNLACE-AIFNOPPAD #5: the mov edi,edi entry after a return stays an AIF function'
count = 1
literal = '0x401239 sub_401239'
