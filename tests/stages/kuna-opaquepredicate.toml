[[match]]
name = 'off keeps the test of a product of consecutive integers'
count = 1
literal = 'x * (x + 1) & 1'

[[match]]
name = 'on returns the only reachable value'
count = 1
regex = '^  return y \+ 1;'

[[match]]
name = 'a product that is odd for some input stays'
count = 1
literal = 'x * (x + 2) & 1'

[[match]]
name = 'off keeps the test of a square modulo four'
count = 1
literal = 'x * x & 3'

[[match]]
name = 'on drops the arm behind a square that is 2 modulo four'
count = 1
regex = '^  return y \+ -7;'

[[match]]
name = 'the dead arm of the square test prints only when off'
count = 1
literal = 'y * 3'

[[match]]
name = 'off keeps the bitwise identity'
count = 1
literal = '(x | y) - (x & y) != (x ^ y))'

[[match]]
name = 'on folds the bitwise identity'
count = 1
regex = '^  return z \+ 2;'

[[match]]
name = 'an equality that fails for some input stays'
count = 1
literal = '(x | y) - (x & y) != (x ^ y & 4)'

[[match]]
name = 'off keeps the comparison of an even product with an odd sum'
count = 1
literal = 'x * (x + 1) != y * 2 + 1'

[[match]]
name = 'on folds sides whose low bits always differ'
count = 1
regex = '^  return z \+ 4;'

[[match]]
name = 'on keeps the last case of a switch whose index starts at zero'
count = 1
literal = 'case 9:'

[[match]]
name = 'on keeps the call in the last case of the switch'
count = 1
literal = 'c9();'
