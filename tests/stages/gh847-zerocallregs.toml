[script]
commands = [
    'lo fu put',
    'decompile',
    'print C',
    'lo fu scale',
    'decompile',
    'print C',
    'lo fu setg',
    'decompile',
    'print C',
    'lo fu zero',
    'decompile',
    'print C',
    'lo fu addg',
    'decompile',
    'print C',
    'lo fu scaleg',
    'decompile',
    'print C',
    'lo fu zpair',
    'decompile',
    'print C',
]

[[match]]
name = 'zerocallregs #1: put never returns the cleared xmm0'
count = 0
literal = 'float8 put('

[[match]]
name = 'zerocallregs #2: put never prints return 0.0'
count = 0
literal = 'return 0.0;'

[[match]]
name = 'zerocallregs #3: scale and scaleg never return the cleared rax'
count = 0
regex = 'unsigned long scaleg?\(void\)'

[[match]]
name = 'zerocallregs #4: the void setg never returns 0'
count = 0
literal = 'unsigned long setg('

[[match]]
name = 'zerocallregs #5: the cleared rdx is never joined above the long of addg'
count = 0
literal = 'undefined16 addg('

[[match]]
name = 'zerocallregs #6: put returns nothing'
count = 1
literal = 'void put('

[[match]]
name = 'zerocallregs #7: scale and scaleg return their double'
count = 2
regex = 'float8 scaleg?\(int4 a0\)'

[[match]]
name = 'zerocallregs #8: setg is void'
count = 1
literal = 'void setg('

[[match]]
name = 'zerocallregs #9: addg returns its long'
count = 1
literal = 'int8 addg(int8 a0,int8 a1)'

[[match]]
name = 'zerocallregs #10: the return 0 before the x87 block of zero is kept'
count = 1
literal = 'unsigned long zero('

[[match]]
name = 'zerocallregs #11: a zero pair returned without the epilogue is kept'
count = 1
literal = 'undefined16 zpair(void)'
