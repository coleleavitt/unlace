[[match]]
name = 'repstring #1: with no option line (the shipped default) a fill of a mixed word is a 4-byte fill'
count = 1
regex = '^  builtin_memset32\(a0,0x1020304,'

[[match]]
name = 'repstring #2: a fill of zero words is a memset of n * 4 bytes'
count = 1
regex = '^  builtin_memset\(a0,0,a1 \* 4UL\);'

[[match]]
name = 'repstring #3: a byte fill is a memset of its run-time byte'
count = 1
regex = '^  builtin_memset\(a0,a1,'

[[match]]
name = 'repstring #4: a copy is a memcpy of n * 4 bytes, in both copies'
count = 2
regex = '^  builtin_memcpy\(a0,a1,a2 \* 4UL\);'

[[match]]
name = 'repstring #5: the destination read after a copy is its end'
count = 1
regex = '^  return &\(\(char \*\)a0\)\[a2 \* 4UL\];'

[[match]]
name = 'repstring #6: an inlined strcmp with a short constant is a memcmp of the string'
count = 1
regex = '^  return builtin_memcmp\(a0,"-",2\) == 0;'

[[match]]
name = 'repstring #7: the carry and zero flags after a compare are the sign of its result'
count = 1
regex = [
    '^  v1 = builtin_memcmp\(a0,a1,5\);',
    '^  return \(char\)\(\(0 < v1\) - \(v1 < 0\)\);',
]

[[match]]
name = 'repstring #8: a compare of a run-time length'
count = 1
regex = '^  return builtin_memcmp\(a0,a1,a2\) == 0;'

[[match]]
name = 'repstring #9: a compare with no flags set before it, of a constant length'
count = 1
regex = '^  return builtin_memcmp\(a0,a1,5\) == 0;'

[[match]]
name = 'repstring #10: eleven builtins in the default pass, none with the option off'
count = 11
literal = 'builtin_mem'

[[match]]
name = 'repstring #11: a compare whose final pointer is returned keeps its loop by default, as do four compares with the option off'
count = 5
regex = '^  \} while \(v2 == v4\);'

[[match]]
name = 'repstring #12: with the option off every copy and fill is an element loop -- the bug'
count = 6
regex = '^  while \('

[[match]]
name = 'repstring #13: and an ordered compare is a loop over two flags -- the bug'
count = 2
regex = '^  \} while \(v5\);'

[[match]]
name = 'repstring #14: a fill of a named global names the global, not its address'
count = 1
regex = '^  builtin_memset\(gfill,0,0x80\);'

[[match]]
name = 'repstring #15: with the option off the fill loop starts at the same global'
count = 1
regex = '^  v[0-9]+ = gfill;$'
