# De-vectorized reduction, `option devectorize on|off`. Same witness as
# wideslice.xml: clang -O3 x86-64 byte_sum, eight bytes per iteration
# widened through SSE unpacks into eight dword lane accumulators, folded after
# the loop, with a scalar remainder loop.
#
# Pass 1 (default, option off): the compiler's shape: the `8 <= length` guard,
# eight lane accumulators, the fold and the second loop. Pass 2 (`option
# devectorize on`): the guard's vector edge is removed and the function is the
# source loop, `v1 += bytes[v2]` over every byte.
#
# This self-contained byte_sum regression embeds 143 bytes of x86-64 code
# loaded at 0x1000.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'byte_sum' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '''
85f6740d89f183fe08730931d231c0eb6f31c0c389ca83e2f8660fefc931c0
660fefd2660fefc0660f1f840000000000660f6e1c07660f6e640704660f60
d9660f61d9660ffed3660f60e1660f61e1660ffec44883c0084839c275d466
0ffec2660f70c8ee660ffec8660f70c155660ffec1660f7ec039ca7414660f
1f4400000fb6341701f048ffc24839d175f2c3
'''

[script]
commands = [
    'parse line extern unsigned int byte_sum(unsigned char *bytes, unsigned int length);',
    'lo fu byte_sum',
    'decompile',
    'print C',
    'option devectorize on',
    'lo fu byte_sum',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'devectorize #1: option off keeps the eight lane accumulators (bug reproduced)'
count = 8
regex = 'v[0-9]+ \+= v[0-9]+( >> (8|0x10|0x18))?( & 0xff)?;'

[[match]]
name = 'devectorize #2: option off guards the stride-eight loop on 8 <= length (bug reproduced)'
count = 1
literal = '8 <= length'

[[match]]
name = 'devectorize #3: option off hands the remainder over at length & ~7 (bug reproduced)'
count = 2
literal = '& 0xfffffff8'

[[match]]
name = 'devectorize #4: both passes keep the scalar byte loop body, once each'
count = 2
regex = 'v[0-9]+ \+= bytes\[v[0-9]+\];'

[[match]]
name = "devectorize #5: three loops in all: two in the compiler's shape, one after the re-roll"
count = 3
literal = '} while ('
