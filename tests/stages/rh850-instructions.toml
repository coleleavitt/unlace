[[image.bytes]]
space = 'ram'
offset = '0x2000'
hex = 'eb574000'

[script]
commands = [
    'disassemble 0x1000 0x10ae',
    'disassemble 0x2000 0x2004',
    'lo fu f_rotl',
    'decompile',
    'print C',
    'lo fu f_bins',
    'decompile',
    'print C',
    'lo fu f_sum',
    'decompile',
    'print C',
    'lo fu f_atomic',
    'decompile',
    'print C',
    'lo fu f_copy',
    'decompile',
    'print C',
    'lo fu f_call',
    'decompile',
    'print C',
    'lo fu f_wide',
    'decompile',
    'print C',
    'lo fu f_pushtop',
    'decompile',
    'print C',
    'lo fu f_poplast',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'RH850 #1: rotl 0x3, r6, r10 decodes'
count = 1
regex = '^0x00001000: rotl +0x3, r6, r10$'

[[match]]
name = 'RH850 #2: rotl r7, r6, r10 decodes'
count = 1
regex = '^0x00001004: rotl +r7, r6, r10$'

[[match]]
name = 'RH850 #3: bins r6, 0x4, 0x8, r10 decodes'
count = 1
regex = '^0x00001008: bins +r6, 0x4, 0x8, r10$'

[[match]]
name = 'RH850 #4: bins r6, 0xc, 0x8, r10 decodes'
count = 1
regex = '^0x0000100c: bins +r6, 0xc, 0x8, r10$'

[[match]]
