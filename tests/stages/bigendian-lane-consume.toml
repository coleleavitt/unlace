[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'saved_output' },
    { space = 'ram', offset = '0x11000', name = 'short_induction' },
    { space = 'ram', offset = '0x30000', name = 'provider' },
    { space = 'ram', offset = '0x12000', name = 'float_recurrence' },
    { space = 'ram', offset = '0x12060', name = 'transform' },
    { space = 'ram', offset = '0x13000', name = 'retained_scale' },
]

