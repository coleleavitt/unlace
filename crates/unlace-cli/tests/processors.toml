language = "clipper:LE:32:default"
base = "0x1000"
fixture = "crates/unlace-cli/tests/fixtures/clipper/funcs.bin"
forbid = ["baddata"]

# addw r1,r0; ret r15
[[family.function]]
test = "clipper_register_add"
address = "0x1000"
expect = [
    "return a0 + a1;",
]

# cmpw r1,r0; bcle pc16; movw r1,r0; ret r15
[[family.function]]
test = "clipper_compare_branch_max"
address = "0x1010"
expect = [
    "if (a0 < a1)",
]

# loadw 0x12345678,r0; ret r15
[[family.function]]
test = "clipper_abs32_load"
address = "0x1020"
expect = [
    "return dat_12345678;",
]

# loadq $7,r1; call r15,pc32 0x1000; ret r15
[[family.function]]
test = "clipper_pc32_call"
address = "0x1030"
expect = [
    "sub_1000(a0,7);",
]

