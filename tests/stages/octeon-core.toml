# Original assembly for the Octeon integer support task. P2 lifting;
# explicit Octeon language selection is the opt-in. No vendor bytes.
# low_sum: baddu v0,a0,a1; jr ra; nop.
# bit_three: bbit0 a0,3,zero; ori v0,zero,0; jr ra; ori v0,zero,1;
#            nop; zero: jr ra; nop.
# byte_at_eight: cins v0,a0,8,7; jr ra; nop. Encoded by GNU as.
# Generic MIPS opcode collision controls are in octeon_core.rs.

[image]
arch = 'MIPS:BE:64:octeon:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'low_sum' },
    { space = 'ram', offset = '0x1020', name = 'bit_three' },
    { space = 'ram', offset = '0x1040', name = 'byte_at_eight' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '7085102803e0000800000000'

[[image.bytes]]
space = 'ram'
offset = '0x1020'
readonly = true
hex = 'c88300043402000003e00008340200010000000003e0000800000000'

[[image.bytes]]
space = 'ram'
offset = '0x1040'
readonly = true
hex = '70823a3203e0000800000000'

[script]
commands = [
    'lo fu low_sum',
    'decompile',
    'print C',
    'lo fu bit_three',
    'decompile',
    'print C',
    'lo fu byte_at_eight',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'OCTEON #1 low_sum retains ordinary addition'
count = 1
regex = 'return [^;]* \+ [^;]*;'

[[match]]
name = 'OCTEON #2 bit branch retains the tested bit'
min = 1
max = 2
regex = '(& 8|& 0x8|>> 3)'

[[match]]
name = 'OCTEON #3 extension instructions have ordinary semantics'
count = 0
regex = 'special2\(|getCopReg\('

[[match]]
name = 'OCTEON #4 bitfield position differs from length'
count = 1
literal = '<< 8'
