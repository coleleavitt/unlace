# Unlace DEX loader, APK input (P1 environment binding; option dexmodel,
# default on). An APK is a zip of classes.dex, classes2.dex, ...; the
# loader inflates each and maps them one after another.
#
# The fixture tests/stages/fixtures/dex/two.apk holds hello.dex
# (Hello.java) as a deflated classes.dex and the DEX built from Other.java
# as a stored classes2.dex. Asserts #1-#2: methods of the second file
# resolve their constant pool against that file and call into the first
# by name. Assert #3: a method of the first file still decompiles.

[image]
arch = 'Dalvik:LE:32:DEX_Android12'
symbols = [
    { space = 'ram', offset = '0x0', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x0'
readonly = true
hex = '0e00'

[script]
commands = [
    'clear architecture',
    'load file tests/stages/fixtures/dex/two.apk',
    'option setlanguage java-language',
    'read symbols',
    'load function demo::Other::twice',
    'decompile',
    'print C',
    'load function demo::Other::hi',
    'decompile',
    'print C',
    'load function demo::Hello::add',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'dex apk #1: classes2.dex calls a static method of classes.dex'
count = 1
literal = 'return Hello.add(a0,a0);'

[[match]]
name = 'dex apk #2: classes2.dex strings come from its own pool'
count = 1
literal = 'return Hello.greet("other");'

[[match]]
name = 'dex apk #3: classes.dex methods load too'
count = 1
regex = '^int add\(int a0,int a1\)'
