# unlace x87depth warnings: a declared type that the x87 stack depth
# contradicts.
#
#     8048100 h:  fld1; ret                 ; leaves one value on the x87 stack
#     8048110 g:  call h; fstp st(0); ret   ; pops what h left
#     8048120 f:  fld1; ret
#
# h and f are declared to return int, so their result is read from EAX,
# while the code returns its value in ST0. IDA warns about both shapes
# (WARN_MUST_RET_FP for the function, and a call warning when a callee
# typed otherwise leaves a value). The depth solve already proves that h's
# call leaves one value (g pops it) and that f returns at depth 1.
#
# Stage: P4 prototype warnings (ActionPrototypeWarnings), option x87depth
# off|on. Pass 1 (off) has no warning, pass 2 (on, the default) both.

[image]
arch = 'x86:LE:32:default:gcc'
symbols = [
    { space = 'ram', offset = '0x8048100', name = 'h' },
    { space = 'ram', offset = '0x8048110', name = 'g' },
    { space = 'ram', offset = '0x8048120', name = 'f' },
]

[[image.bytes]]
space = 'ram'
offset = '0x8048100'
hex = 'd9e8c3'

[[image.bytes]]
space = 'ram'
offset = '0x8048110'
hex = 'e8ebffffffddd8c3'

[[image.bytes]]
space = 'ram'
offset = '0x8048120'
hex = 'd9e8c3'

[script]
commands = [
    'parse line extern int4 h(void);',
    'parse line extern int4 f(void);',
    'option x87depth off',
    'lo fu g',
    'decompile',
    'print C',
    'lo fu f',
    'decompile',
    'print C',
    'option x87depth on',
    'lo fu g',
    'decompile',
    'print C',
    'lo fu f',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'X87DEPTHWARN #1: on, the call to h is flagged'
count = 1
literal = 'call to h leaves a value on the x87 stack'

[[match]]
name = 'X87DEPTHWARN #2: on, f is flagged'
count = 1
literal = 'the function leaves a value on the x87 stack but its return type is not floating-point'
