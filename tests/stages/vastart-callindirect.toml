[script]
commands = [
    'lo fu el_get_like',
    'option vaargconst off',
    'decompile',
    'print C',
    'option vaargconst on',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'vastart call-indirect prologue #1: only the vaargconst pass prints va_start'
count = 1
regex = 'va_start\(.*,a1\);'

[[match]]
name = 'vastart call-indirect prologue #2: only that pass prints a variadic prototype'
count = 1
regex = 'el_get_like\(int8 a0,int4 a1,.*\.\.\.\)'
