# IDA/Hex-Rays reference metrics per fixture.
#
# Each section corresponds to a fixture under fixtures/<name>.elf and lists
# the approximate counts produced by IDA Hex-Rays for the same binary.
# unlace's output is scored against these via Metrics::score(); see
# crates/unlace-test-harness/tests/golden_fixtures.rs.
#
# Counts are intentionally coarse — they are recovery targets, not
# bit-exact expectations. Adjust them when the reference profile is
# re-measured against a newer Hex-Rays release.

[medium]
if_count = 60
for_count = 5
while_count = 3
return_count = 8
goto_count = 0
var_count = 30
line_count = 500

