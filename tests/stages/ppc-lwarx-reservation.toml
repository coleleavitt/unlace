# Synthetic generic PPC32 atomic increment: lwarx r9,0,r3; addi r9,r9,1;
# stwcx. r9,0,r3; bne- retry; blr.
# P2 SLEIGH correctness repair without an option. stwcx. stores only while
# the reservation is set, so lwarx must set it; otherwise the store and the
# loop exit depend on an uninitialized reserve flag.

[image]
arch = 'PowerPC:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'atomic_increment' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
hex = '7d201828392900017d20192d4082fff44e800020'

[script]
commands = [
    'load function atomic_increment',
    'decompile',
    'print C',
]

[[match]]
name = 'PPC lwarx #1: the reservation is set, not read uninitialized'
count = 0
literal = 'reserve'

[[match]]
name = 'PPC lwarx #2: the conditional store runs once without a loop'
count = 1
regex = '^  \*a0 = storeWordConditionalIndexed\(\*a0 \+ 1,0,a0\);'
