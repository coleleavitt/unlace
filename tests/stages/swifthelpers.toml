# Swift instantiation helpers and lazy witness table accessors named from
# their bodies (`option swifthelpers on|off`, the helper arm of
# `swiftmetadata`), and metadata accessor results typed at the call
# (`option swifttypes`).
#
# Issue: a stripped Swift image calls `sub_<addr>(cache)` before every use
# of a generic type instantiated at a concrete type, and `sub_<addr>()` for
# every conformance witness table it builds lazily; neither the helper,
# nor the type it is asked for, nor the conformance is visible. The
# helper's body (a cache test, then `swift_getTypeByMangledNameInContext2`
# on a relative mangled name) and the accessor's (a cache test, then a
# metadata call and `swift_getWitnessTable`) say what they are, and the
# mangled name the call passes says which type. On a large third-party
# iOS app the main binary has two copies of the helper with thousands of
# call sites. A generic type's metadata accessor result stays `long`.
#
# Stage / sub-stage: P1 external-refinement, the Swift metadata pass
# (`unlace-analysis/src/analyzers/swift/unlace_swifthelpers.rs`), and P5
# type propagation (`unlace-decomp/src/p5_types/unlace_swiftmetaresult.rs`,
# a `sitetypelock` client).
#
# P0 assertion: `option swifthelpers on|off` (default on; inert unless
# `swiftmetadata` is on) and `option swifttypes on|off`.
#
# Both passes clear the harness architecture and load the real fixture
# `swift_helpers_arm64_elf` (arm64 ELF shared object, swiftc 6.4.2
# `-parse-stdlib`, `llvm-objcopy strip-all`) with `swiftmetadata on`.
# Pass 1 (`swifthelpers off`, `swifttypes off`) reproduces the BUG:
# `hf.useBox(_:)` calls `sub_112e4(0x31da0)` and `sub_11328()`, and
# `hf.pair(_:)` keeps the accessor result in a `long`. Pass 2 (the
# defaults) is the FIX: the helper call names the cache after
# `hf.Box<hf.Unit>`, the accessor is
# `<hf.Box<hf.Unit>:hf.Shape>.lazy_protocol_witness_table_accessor`
# with its cache, and the accessor results are `swift.type_metadata *`,
# also in `hf.wrap(_:)`, which loads the value witness table below one
# (`valuewitness`).
# The fork pins swiftruntime off in pass 1: its runtime prototypes type
# the accessor result from `swift_allocObject`'s parameter. Pass 2 also
# types `hf.wrap(_:)`'s metadata parameter, which renumbers its locals.

[image]
arch = 'AARCH64:LE:64:v8A'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/swift_helpers_arm64_elf',
    'option swiftmetadata on',
    'option swifthelpers off',
    'option swifttypes off',
    'option swiftruntime off',
    'read symbols',
    'load addr 0x1194c',
    'decompile',
    'print C',
    'load addr 0x11ab8',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/swift_helpers_arm64_elf',
    'option swiftmetadata on',
    'read symbols',
    'load addr 0x1194c',
    'decompile',
    'print C',
    'load addr 0x11328',
    'decompile',
    'print C',
    'load addr 0x11ab8',
    'decompile',
    'print C',
    'load addr 0x1198c',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'swifthelpers off: the helper call is anonymous and passes a bare constant'
count = 1
literal = 'v2 = sub_112e4(0x31da0);'

[[match]]
name = 'swifthelpers off: the lazy witness table accessor is anonymous'
count = 1
literal = 'hf.measure(_:)(&v1,v2,sub_11328());'

[[match]]
name = 'swifttypes off: the accessor result is an integer'
count = 1
literal = 'unsigned long v1; // x0 | x19'

[[match]]
name = 'swifthelpers on: the helper is named and its cache names the type it asks for'
count = 1
literal = 'v2 = __swift_instantiateConcreteTypeFromMangledName(&hf.Box<hf.Unit>.type_metadata_demangling_cache);'

[[match]]
name = 'swifthelpers on: the lazy witness table accessor is named after its conformance at the concrete type'
count = 1
literal = 'hf.measure(_:)(&v1,v2,<hf.Box<hf.Unit>:hf.Shape>.lazy_protocol_witness_table_accessor());'

[[match]]
name = 'swifthelpers on: the accessor takes nothing'
count = 1
literal = 'void * <hf.Box<hf.Unit>:hf.Shape>.lazy_protocol_witness_table_accessor(void)'

[[match]]
name = 'swifthelpers on: its cache is named'
count = 1
literal = 'if (<hf.Box<hf.Unit>:hf.Shape>.lazy_protocol_witness_table_cache)'

[[match]]
name = 'swifthelpers on: the Abstract helper is named too'
count = 1
literal = '__swift_instantiateConcreteTypeFromMangledNameAbstract(&hf.Box<hf.Unit>.type_metadata_demangling_cache)'

[[match]]
name = 'swifttypes on: the helper result is a metadata pointer'
count = 2
literal = 'swift.type_metadata *v2; // x0'

[[match]]
name = "swifttypes on: a generic accessor's result is a metadata pointer"
count = 1
literal = 'swift.type_metadata *v1; // x0 | x19'

[[match]]
name = 'swifttypes on: a result whose value witness table is loaded is typed too'
count = 1
literal = 'swift.type_metadata *self; // x0 | x23'

[[match]]
name = 'swifttypes on: the table below it stays a byte offset'
count = 1
regex = 'v[0-9]+ = \(\(swift\.value_witness_table \*\*\)self\)\[-1\];'
