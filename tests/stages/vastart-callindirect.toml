# unlace option vastart: a va_start prologue whose va_list field writes moved
# into the INDIRECTs of the calls after it still folds to va_start.
#
# gcc -O2 folds every va_arg of a va_list the function starts itself when the
# offsets are constants: here each arm reads the register save area directly
# and only the prologue's three field stores are left (gp_offset = 0x10, no
# fp_offset store since no va_arg reads a double).  Once the fields are
# heritaged the overflow_arg_area and reg_save_area writes survive only as the
# INDIRECTs each call carries, in the switch arms, while their values stay in
# the prologue.  vastart required the writes in the gp_offset COPY's block, so
# the function printed the four stores and a six-parameter prototype (libedit
# el_get, unlace#975).  A write now counts when its value is computed in that
# block.
#
# Stage: P4 calls and prototypes (output-prototype), options vastart (default
# on) and vaargconst (default off; on, vastart takes the lone gp_offset store).
# Pass 1 (vaargconst off) keeps the stores; pass 2 (on) folds the prologue.
#
# Source (gcc 15 -O2 -fno-stack-protector -fcf-protection=none, x86-64,
# .text of elget.o at 0x100000, calls relocated to ret stubs wget 0x100200,
# other 0x100210):
#     int el_get_like(void *e, int op, ...) {
#       va_list ap; int rv;
#       if (!e) return -1;
#       va_start(ap, op);
#       switch (op) {
#       case 0: rv = wget(e, 0, va_arg(ap, int *)); break;
#       case 1: rv = wget(e, 1, va_arg(ap, int *)); break;
#       case 2: { int x = va_arg(ap, int); rv = wget(e, 2, x, va_arg(ap, char **)); break; }
#       case 3: { int q = 0; rv = other(e, va_arg(ap, long), &q, op); *va_arg(ap, int *) = q; break; }
#       default: rv = -1; break;
#       }
#       va_end(ap);
#       return rv;
#     }
#
# Assert #1: only the vaargconst pass folds the prologue to va_start.
# Assert #2: only that pass marks the prototype variadic.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'el_get_like' },
    { space = 'ram', offset = '0x100200', name = 'wget' },
    { space = 'ram', offset = '0x100210', name = 'other' },
]

