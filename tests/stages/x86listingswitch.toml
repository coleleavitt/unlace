# GH-299, P1, x86listingswitch off/on. The stripped i386 fixture is built
# from x86listingswitch_i386.s beside it. Its native entry checks four cases,
# defaults, and the marker written by the case-only void helper. Twenty-four
# directly called XOR-prefix leaves activate AIF; fast_funcdisc is disabled
# here to isolate AIF from its separate pointer-table entry inference.
# The four return-terminated cases surround independent code and a gap.
# A callback word after the four-entry table must not become a fifth case.

[image]
arch = 'x86:LE:32:default:gcc'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/x86listingswitch_i386',
    'mode aggressive',
    'option fast_funcdisc off',
    'option listing on',
    'option x86listingswitch off',
    'read symbols',
    'functions',
    'load function sub_100400',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/x86listingswitch_i386',
    'mode aggressive',
    'option fast_funcdisc off',
    'option listing on',
    'option x86listingswitch on',
    'read symbols',
    'functions',
    'load function sub_100400',
    'decompile',
    'print C',
    'phase catalog x86listingswitch',
]

[[match]]
name = 'KUNA-X86LISTINGSWITCH #1: dispatcher remains an entry in both arms'
count = 2
literal = '0x100400 sub_100400'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #2: first case is an AIF entry only with the option off'
count = 1
literal = '0x100440 sub_100440'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #3: second case is an AIF entry only with the option off'
count = 1
literal = '0x100460 sub_100460'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #4: case after independent code is an AIF entry only with the option off'
count = 1
literal = '0x1004b0 sub_1004b0'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #5: last case is an AIF entry only with the option off'
count = 1
literal = '0x1004d0 sub_1004d0'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #6: independent code between cases stays discoverable'
count = 2
literal = '0x100480 sub_100480'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #7: direct case-only callee is discovered with the option on'
count = 1
literal = '0x100510 sub_100510'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #8: case-only helper call survives both decompilations'
count = 2
literal = 'sub_100510();'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #9: case result after the helper is explicit in both arms'
count = 2
literal = 'return 0x21;'

[[match]]
name = 'KUNA-X86LISTINGSWITCH #10: catalog reports the default-off P1 option and enabled current value'
count = 1
literal = '"option": "x86listingswitch", "values": ["on", "off"], "default": "off", "current": "on", "destructive_as_default": false, "phase": "P1"'
