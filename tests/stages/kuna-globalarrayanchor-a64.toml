[script]
commands = [
    'option ctypes on',
    'map address 0x4000f4 unsigned short flags[16]',
    'map address 0x400114 unsigned char bytes[16]',
    'map address 0x400124 unsigned int words[16]',
    'map address 0x400164 unsigned short other[16]',
    'parse line extern void negative(short slot);',
    'parse line extern unsigned short negative_load(short slot);',
    'parse line extern void two_indices(short slot, short delta);',
    'parse line extern void byte_index(short slot);',
    'parse line extern void word_index(short slot);',
    'map address 0x41003c char signed_bytes[16]',
    'map address 0x41004c short signed_flags[16]',
    'map address 0x41006c float floats[16]',
    'parse line extern unsigned int wide_byte(short slot);',
    'parse line extern unsigned int wide_short(short slot);',
    'parse line extern unsigned int float_bits(short slot);',
    'map address 0x420028 unsigned short index_flags[16]',
    'parse line extern unsigned short wide_index_u32(unsigned int slot);',
    'parse line extern unsigned short wrapped_index_u32(unsigned int slot);',
    'option globalarrayanchor off',
    'lo fu negative',
    'decompile',
    'print C',
    'option globalarrayanchor on',
    'lo fu negative',
    'decompile',
    'print C',
    'lo fu negative_load',
    'decompile',
    'print C',
    'lo fu two_indices',
    'decompile',
    'print C',
    'lo fu byte_index',
    'decompile',
    'print C',
    'lo fu word_index',
    'decompile',
    'print C',
    'lo fu wide_byte',
    'decompile',
    'print C',
    'lo fu wide_short',
    'decompile',
    'print C',
    'lo fu float_bits',
    'decompile',
    'print C',
    'lo fu wide_index_u32',
    'decompile',
    'print C',
    'lo fu wrapped_index_u32',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'disabled retains biased literal'
count = 1
literal = 'slot * 2L + 0x4000f2'

[[match]]
name = 'enabled short store retains base'
count = 1
literal = 'flags[slot + -1L] = 0;'

[[match]]
name = 'enabled short load retains base'
count = 1
literal = 'return flags[slot + -1L];'

[[match]]
name = 'two signed indices retain base'
count = 1
regex = 'flags\[.*slot.*delta.*-1L\] = 3;'

[[match]]
name = 'byte array retains base'
count = 1
literal = 'bytes[slot + -1L] = 0xb;'

[[match]]
name = 'word array retains base and store width'
count = 1
literal = 'words[slot + -1L] = 0xd;'

[[match]]
name = 'byte load stays zero extended'
count = 1
literal = 'return (unsigned char)signed_bytes[slot + -1L];'

[[match]]
name = 'halfword load stays zero extended'
count = 1
literal = 'return (unsigned short)signed_flags[slot + -1L];'

[[match]]
name = 'float load retains its raw bits'
count = 1
regex = 'return.*union.*float.*unsigned int.*\.from = floats\[slot \+ -1L\].*\.to;'

[[match]]
name = 'unsigned index extends before wide bias'
count = 1
literal = 'return index_flags[slot - 1UL];'

[[match]]
name = 'unsigned index wraps before extension'
count = 1
literal = 'return index_flags[slot - 1];'
