# Octeon review: P4 declared ABI storage. Original GCC 7.3 -O2 -g,
# BE -mabi=64 -msoft-float; source/build recipe in tests/fixtures/octeon-abi.
# Strict spec fixes, selected by the explicit target. Old N32 loses aggregate
# arguments/returns; old N64 loses alignment and half the quad result.

[image]
arch = 'MIPS:BE:64:octeon:default'
symbols = [
    { space = 'ram', offset = '0x00000000001000a0', name = 'quad_after' },
    { space = 'ram', offset = '0x00000000001000a8', name = 'quad_identity' },
    { space = 'ram', offset = '0x0000000000100120', name = 'quad_last_after' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = ''

[script]
commands = [
    'option ctypes on',
    'parse line struct Pair { long long a, b; };',
    'parse line struct Small { int x; };',
    'parse line extern long long quad_after(long long a, long double b, long long c);',
    'lo fu quad_after',
    'decompile',
    'print C',
    'parse line extern long double quad_identity(long double b);',
    'lo fu quad_identity',
    'decompile',
    'print C',
    'parse line extern long long quad_last_after(long long p0, long long p1, long long p2, long long p3, long long p4, long long p5, long long p6, long double q, long long value);',
    'lo fu quad_last_after',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'Octeon 64 ABI quad_after returns the source value'
count = 1
literal = 'return c;'

[[match]]
name = 'Octeon 64 ABI quad_identity returns the source value'
count = 1
literal = 'return b;'

[[match]]
name = 'Octeon 64 ABI quad_last_after returns the source value'
count = 1
literal = 'return value;'
