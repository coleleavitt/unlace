# MSVC-mangled PE imports get a prototype.
#
# Issue: GH Noelo-Lab/kuna#990. A 32-bit MSVC image calls C++ imports through
# its IAT. The demangled-signature pass read only defined symbols, so each
# import was named from its mangled name and had no prototype: a `__thiscall`
# call lost the `this` MSVC passes in ECX, and a callee with no declared
# arity took the pushes meant for the next call.
#
# Stage / sub-stage: P1 external-refinement (`unlace-analysis`
# `analyzers/demangle/unlace_msvcsig.rs` reads the declaration off the import
# name; the commit parks it by address under the stated convention's model
# and locks it onto the import symbol) feeding P4 prototype-source
# (`ActionDefaultParams` / `ActionDeindirect` at the IAT call). The arm runs
# whenever `cppsig` is on.
#
# The fixture `msvcsig_protos_i386.exe` is the issue's clean-room repro,
# assembled from `msvcsig_protos_i386.asm` (see the fixtures README). It
# imports from arr.dll, where `Arr` is a 4-byte class with a destructor:
#   ?IsValid@Arr@@QAEHXZ               int Arr::IsValid()            __thiscall
#   ??0Arr@@QAE@ABV0@@Z                Arr::Arr(Arr const &)         __thiscall
#   ?Note@@YAXJ@Z                      void Note(long)               __cdecl
#   ?MakeStack@@YA?AVArr@@V1@AAV1@1@Z  Arr MakeStack(Arr, Arr &, Arr &) __cdecl
# 0x401000 is `int Check(Arr *a) { int v = a->IsValid(); Note(v); return v; }`
# and 0x401020 is `Arr Build(Arr &x, Arr &y) { return MakeStack(x, x, y); }`.
#
# Before the arm, `IsValid()` had no `this`, and the copy constructor took
# MakeStack's arguments. Now `Arr::IsValid(a0)` carries `this` typed `Arr *`,
# the copy constructor takes its slot and its source, and MakeStack keeps its
# hidden return pointer, typed. The copy constructor's evidence (it is
# imported) is what proves MakeStack returns Arr through that pointer.
# MakeStack's by-value `Arr` has a size the name does not state, so the
# parameters after it are left open until the by-value sizing
# (unlace_msvcbyval.rs, always on; tests/stages/msvcbyval.xml) reads the
# class's size from the caller's cleanup and MakeStack takes every argument.

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/msvcsig_protos_i386.exe',
    'read symbols',
    'load addr 0x401000',
    'decompile',
    'print C',
    'load addr 0x401020',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'MSVCSIG #1: this is never dropped from the __thiscall import call'
count = 0
literal = 'v1 = IsValid();'

[[match]]
name = "MSVCSIG #2: MakeStack's pushes never go to the copy constructor"
count = 0
literal = 'Arr(a2,a0,a2,a3);'

[[match]]
name = 'MSVCSIG #3: this is passed to the __thiscall import'
count = 1
literal = 'v1 = Arr::IsValid(a0);'

[[match]]
name = "MSVCSIG #4: the caller's parameter is typed as the class pointer"
count = 1
literal = 'int4 sub_401000(Arr *a0)'

[[match]]
name = 'MSVCSIG #5: the copy constructor gets its slot and its source'
count = 1
literal = 'Arr::Arr((Arr *)&v1,a1);'

[[match]]
name = "MSVCSIG #6: the hidden return pointer leads MakeStack's arguments, then the by-value copy"
count = 1
literal = 'MakeStack(a0,v1,a1,a2);'

[[match]]
name = 'MSVCSIG #7: the hidden return pointer is typed'
count = 1
literal = 'Arr * sub_401020('

[[match]]
name = 'MSVCSIG #8: the cdecl import keeps its argument'
count = 1
literal = 'Note(v1);'
