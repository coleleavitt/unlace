[package]
name = "unlace-middle"
description = "The decompiler's IR band: Funcdata, Varnode/PcodeOp/blocks, types, the call model, symbols, options and the pass hooks (unlace-decomp's lower half)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
unlace-base.workspace = true
unlace-num.workspace = true
unlace-sleigh.workspace = true
thiserror.workspace = true
smallvec.workspace = true
slotmap.workspace = true

[dev-dependencies]
unlace-slacomp.workspace = true
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
