[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'typed_a' },
    { space = 'ram', offset = '0x1100', name = 'typed_b' },
    { space = 'ram', offset = '0x1200', name = 'untouched' },
    { space = 'ram', offset = '0x1300', name = 'triple' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '53e8fa0200004889c3488d7811e8ee0200004801d85bc3'

[[image.bytes]]
space = 'ram'
offset = '0x1100'
readonly = true
hex = '53e8fa0100004889c3488d7811e8ee0100004801d85bc3'

[[image.bytes]]
space = 'ram'
offset = '0x1200'
readonly = true
hex = '53e8fa0000004889c3488d7833e8ee0000004801d85bc3'

[[image.bytes]]
space = 'ram'
offset = '0x1300'
readonly = true
hex = '488d047fc3'

[script]
commands = [
    'parse line typedef uint8 TypeA;',
    'parse line typedef int8 TypeB;',
    'option outlang rust',
    'load function typed_a',
    'decompile',
    'retype v1 TypeB',
    'rename v1 old_user_a',
    'retype v1 TypeA',
    'rename v1 user_a',
    'decompile',
    'option outlang c',
    'print C',
    'load function typed_b',
    'decompile',
    'retype v1 TypeB',
    'rename v1 user_b',
    'decompile',
    'print C',
    'load function untouched',
    'decompile',
    'print C',
    'load addr r0x1000 reopened_a',
    'decompile',
    'print C',
    'option outlang rust',
    'decompile',
    'print C',
    'option outlang c',
    'load function typed_b',
    'decompile',
    'print C',
]

[[match]]
name = 'Console local type A remains bound to its function entry'
count = 2
literal = 'TypeA user_a; // rax | rbx'

[[match]]
name = 'Console local type B remains bound to its function entry'
count = 2
literal = 'TypeB user_b; // rax | rbx'

[[match]]
name = 'Console reselected Rust function keeps its user local name'
count = 1
literal = 'let mut user_a: u64; // rax | rbx'

[[match]]
name = 'Console untouched function keeps its original local name'
count = 1
literal = 'return triple(v1 + 0x33) + v1;'
