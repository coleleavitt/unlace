[script]
commands = [
    'parse line extern uint8 producer(uint4 a,uint4 b);',
    'parse line extern uint4 both(uint4 a,uint4 b);',
    'parse line extern uint4 nonzero(uint4 a,uint4 b);',
    'parse line extern uint4 reversed(uint4 a,uint4 b);',
    'parse line extern uint4 delay(uint4 a,uint4 b);',
    'parse line extern uint4 high_only(uint4 a,uint4 b);',
    'parse line extern uint4 low_only(uint4 a,uint4 b);',
    'parse line extern uint4 unchanged_pair(uint4 a,uint4 b);',
    'load function both',
    'decompile',
    'print C',
    'load function nonzero',
    'decompile',
    'print C',
    'load function reversed',
    'decompile',
    'print C',
    'load function delay',
    'decompile',
    'print C',
    'load function high_only',
    'decompile',
    'print C',
    'load function low_only',
    'decompile',
    'print C',
    'load function unchanged_pair',
    'decompile',
    'print C',
    'parse line extern void single_without_wide(void);',
    'load function single_without_wide',
    'decompile',
    'print C',
    'parse line extern void variadic(int4 first,...);',
    'parse line extern void wide_sink(uint8 value,uint4 size);',
    'parse line extern uint4 one_argument(uint4 a,uint4 b);',
    'load function one_argument',
    'decompile',
    'print C',
    'parse line extern uint4 one_variadic(uint4 a,uint4 b);',
    'load function one_variadic',
    'decompile',
    'print C',
    'parse line extern uint4 declared_wide(uint4 a,uint4 b);',
    'load function declared_wide',
    'decompile',
    'print C',
    'parse line extern uint4 unknown_wide_output(uint4 a,uint4 b);',
    'load function unknown_wide_output',
    'decompile',
    'print C',
    'parse line extern uint4 convert_argument(uint4 a,uint4 b);',
    'load function convert_argument',
    'decompile',
    'print C',
    'parse line extern uint4 interval_argument(uint4 a,uint4 b);',
    'load function interval_argument',
    'decompile',
    'print C',
    'option calloverlap full',
    'load function both',
    'decompile',
    'print C',
    'parse line extern void sink(void *dest,int value,uint4 size);',
    'decompile',
    'print C',
    'parse line extern float8 number(void *context,int4 index);',
    'parse line extern float8 numeric(float8 value);',
    'parse line extern void push(void *context,float8 value);',
    'option calloverlap off',
    'load function math_wrapper',
    'decompile',
    'print C',
    'option calloverlap in',
    'load function math_wrapper',
    'decompile',
    'print C',
    'option calloverlap full',
    'load function math_wrapper',
    'decompile',
    'print C',
    'option calloverlap off',
    'load function pair_then_single',
    'decompile',
    'print C',
    'option calloverlap full',
    'load function pair_then_single',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'zero input survives all write orders'
count = 5
regex = 'sink\(v[0-9]+,0,0xa8\);'

[[match]]
name = 'nonzero overwrite survives'
count = 1
regex = 'sink\(v[0-9]+,7,0xa8\);'

[[match]]
name = 'untouched low return half remains an input'
count = 1
regex = 'sink\(v[0-9]+,\(int4\)v[0-9]+,0xa8\);'

[[match]]
name = 'untouched high return half remains an input'
count = 1
literal = 'sink((int4)(producer(a,b) >> 0x20),0,0xa8);'

[[match]]
name = 'untouched complete pair remains an input'
count = 1
regex = 'sink\(\(int4\)\(v[0-9]+ >> 0x20\),\(int4\)v[0-9]+,0xa8\);'

[[match]]
name = 'unknown single-slot call does not acquire a stale argument'
count = 0
regex = 'unknown_one\([^)]*v[0-9]+'

[[match]]
name = 'stale high slot does not invent a variadic argument'
count = 1
literal = 'variadic(1);'

[[match]]
name = 'declared wide input keeps its complete value'
count = 1
literal = 'wide_sink(producer(a,b),0xa8);'

[[match]]
name = 'coalesced unknown output retains input constants'
count = 1
literal = 'unknown_producer(5,7);'

[[match]]
name = 'converted floating argument survives the wide range'
count = 1
regex = 'v[0-9]+ = \(int4\).*\.to;'

[[match]]
name = 'saved narrow interval keeps its zero fallback'
count = 1
regex = '(v[0-9]+|a) = 1000;'

[[match]]
name = 'saved narrow interval is passed to the call'
count = 1
regex = 'sink\(v[0-9]+,(\(uint2\)v[0-9]+|a),0xa8\);'

[[match]]
name = 'the converted call uses variable-valued arguments'
count = 1
regex = 'sink\(v[0-9]+,v[0-9]+,0xa8\);'

[[match]]
name = 'single argument without a wide return remains visible'
count = 1
literal = 'unknown_one(1);'

[[match]]
name = 'the entry partition never loses the input'
count = 0
literal = 'math_wrapper(void)'

[[match]]
name = 'unlocked entry input survives every overlap level'
count = 3
literal = 'math_wrapper(void *a0)'

[[match]]
name = 'entry value reaches the number call at every overlap level'
count = 3
literal = 'number(a0,1)'

[[match]]
name = 'entry value reaches the push call at every overlap level'
count = 3
literal = 'push(a0,numeric('

[[match]]
name = 'no call retains the old high return half'
count = 0
regex = 'v[0-9]+ = \(unsigned int\)\(v[0-9]+ >> 0x20\);'

[[match]]
name = 'no call retains the old low return half'
count = 0
regex = 'v[0-9]+ = \(unsigned int\)v[0-9]+;'

[[match]]
name = 'the loaded pair is never dropped at the first call'
count = 0
literal = 'pair_take();'

[[match]]
name = "a stale pair half does not hide the next call's single argument"
count = 2
literal = 'unknown_one(3);'

[[match]]
name = 'the loaded pair reaches the first call as two slots'
count = 2
literal = 'pair_take((int4)((uint8)*a0 >> 0x20),(int4)*a0);'
