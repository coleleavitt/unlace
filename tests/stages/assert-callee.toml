# unlace #1644: a reader who knows where an indirect call goes can state it.
# Stage / sub-stage: P2 flow-classification (the per-function Override store's
# indirect-call redirect, consumed by FlowInfo::setup_callind_specs).
# P0 assertion: `override indirect <callsite> <name|address>` (the console
# spelling of `unlace decompile ... &#45;&#45;assert 'callee <callsite> <name|address>'`).
# Fixture: crates/unlace-cli/tests/fixtures/assert_callee.c.
# #1-#2 are the output without the statement; #3-#5 are the stated calls;
# #6-#7 are the stated tail call once its callee is marked no-return.
# The refusals (a direct call, a non-call, a non-function) end a console
# script, so crates/unlace-cli/tests/assert_callee.rs pins them.

[image]
arch = 'x86:LE:64:default:gcc'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/assert_callee_x86_64.elf',
    'read symbols',
    'option protoorder off',
    'load function twice',
    'decompile',
    'print C',
    'override indirect 0x147a handle_open',
    'decompile',
    'print C',
    'load function dispatch',
    'override indirect 0x1457 0x1430',
    'decompile',
    'print C',
    'option noreturn handle_open',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ASSERTCALLEE #1: unstated, the call goes through the table'
count = 1
regex = 'v1 = .*table\[\(a1 & 3\) \* 8UL\]\)\(a0,a2\);'

[[match]]
name = 'ASSERTCALLEE #2: the direct call is the only named one'
count = 2
literal = 'return handle_open(a0,1) + v1;'

[[match]]
name = 'ASSERTCALLEE #3: the stated indirect call is a direct call'
count = 1
literal = 'v1 = handle_open(a0,a2);'

[[match]]
name = 'ASSERTCALLEE #4: the stated indirect jump is a tail call'
count = 1
regex = '^  handle_open\(a0,a2\);$'

[[match]]
name = 'ASSERTCALLEE #5: no switch is recovered from the stated jump'
count = 0
regex = 'switch|halt_missing'

[[match]]
name = 'ASSERTCALLEE #6: a stated tail call to a no-return callee ends the function'
count = 1
regex = '^  handle_open\(a0,a2\); // no-return$'

[[match]]
name = 'ASSERTCALLEE #7: no return follows the no-return tail call'
count = 0
regex = '^  return;'
