[package]
name = "unlace-bench"
description = "CodSpeed/divan benchmarks: SLEIGH load, image load, lift and decompile on committed fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Normal, not dev-dependencies: the package has only a bench target, and this way the
# features they turn on (libc extra_traits, rustix termios) are on in every build too,
# so `cargo build` and `cargo test` compile the same units.
[dependencies]
unlace-slacomp.workspace = true
unlace-base.workspace = true
unlace-console.workspace = true
unlace-sleigh.workspace = true
divan = { package = "codspeed-divan-compat", version = "6.1.0" }

[lints]
workspace = true

[[bench]]
name = "decompiler"
harness = false
