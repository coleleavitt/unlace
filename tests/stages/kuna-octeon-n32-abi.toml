# Octeon review: P4 declared ABI storage. Original GCC 7.3 -O2 -g,
# BE -mabi=n32 -msoft-float; source/build recipe in tests/fixtures/octeon-abi.
# Strict spec fixes, selected by the explicit target. Old N32 loses aggregate
# arguments/returns; old N64 loses alignment and half the quad result.

[image]
arch = 'MIPS:BE:64:octeon-32addr:default'
symbols = [
    { space = 'ram', offset = '0x00100000', name = 'pair_first' },
    { space = 'ram', offset = '0x00100030', name = 'small_result' },
    { space = 'ram', offset = '0x001000a8', name = 'quad_identity' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = ''

[script]
commands = [
    'option ctypes on',
    'parse line struct Pair { long long a, b; };',
    'parse line struct Small { int x; };',
    'parse line extern long long pair_first(struct Pair p);',
    'lo fu pair_first',
    'decompile',
    'print C',
    'parse line extern struct Small small_result(int x);',
    'lo fu small_result',
    'decompile',
    'print C',
    'parse line extern long double quad_identity(long double b);',
    'lo fu quad_identity',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'Octeon n32 ABI pair_first returns the source value'
count = 1
literal = 'return p.a;'

[[match]]
name = 'Octeon n32 ABI small_result returns the source value'
count = 1
literal = '.from = x'

[[match]]
name = 'Octeon n32 ABI quad_identity returns the source value'
count = 1
literal = 'return b;'
