# Callee RCX/RDX homes remain pointer writes at return. Only the first
# caller leaves those cells unread and unexposed. Save offsets differ.

[image]
arch = 'x86:LE:64:default:windows'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'fixture_home_clean' },
    { space = 'ram', offset = '0x401058', name = 'fixture_home_read' },
    { space = 'ram', offset = '0x4010b2', name = 'fixture_home_escape' },
    { space = 'ram', offset = '0x401115', name = 'fixture_copy_rect' },
    { space = 'ram', offset = '0x402020', name = 'rect_source' },
    { space = 'ram', offset = '0x402030', name = 'home_alias' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x402020'
hex = '0000a03f00002040000088410000b8410000000000000000'

[script]
commands = [
    'parse line struct Rect { float x; float y; float width; float height; };',
    'map prototype 0x401000 float fixture_home_clean(void)',
    'map prototype 0x401058 float fixture_home_read(void)',
    'map prototype 0x4010b2 float fixture_home_escape(void)',
    'map prototype 0x401115 void fixture_copy_rect(Rect *destination, const Rect *source)',
    'map addr r0x402020 Rect rect_source',
    'map addr r0x402030 unsigned long long home_alias',
    'option stackviews on',
    'lo fu fixture_home_clean',
    'decompile',
    'print C',
    'lo fu fixture_home_read',
    'decompile',
    'print C',
    'lo fu fixture_home_escape',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLEE-HOMES-WIN64 #1: unread private homes do not retain split XMM saves'
count = 0
regex = 'stack - 0x(?:48|44|40|3c|38|34|30|2c|28|24|20|1c|18|14|10|c)\b'

[[match]]
name = 'CALLEE-HOMES-WIN64 #2: a caller read of the residual home pointer keeps saves mapped'
min = 1
max = 2
regex = 'stack - 0x148\b'

[[match]]
name = 'CALLEE-HOMES-WIN64 #3: exposing the home address keeps saves mapped'
min = 1
max = 2
regex = 'stack - 0x248\b'
