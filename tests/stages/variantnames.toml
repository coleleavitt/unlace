# kuna: name a recovered Rust enum's discriminant VALUES (part of `option
# dwarf`, docs/multilang.md - the first VariantLayout consumer).
#
# Stage / sub-stage: P1 program-prep, external-refinement (the DWARF importer).
#
# `dwarfvariants` (DIV-87) imports a DW_TAG_variant_part into
# `struct E { tag; union E::payload {...} }` and records every
# DW_AT_discr_value and variant name, but the tag member keeps the plain
# integer type DWARF declares for it, so discriminant logic renders bare
# constants: `rethidden->tag = 0` where the compiler said `0` selects `A`.
# The importer gives the tag member a synthesized enum,
# `<enum>::Discriminant`, built from the variant part's own
# discriminant->name map, and the stock enum-constant rendering prints the
# variant name instead.
#
# The XML wrapper only supplies the harness architecture. The pass clears it
# and loads a real x86-64 ELF fixture
# (`crates/unlace-analysis/tests/fixtures/dwarfvariants_x86_64`,
# `rustc 1.90.0 -C debuginfo=2 -C opt-level=1`, source vendored beside it):
# a bytechunk carries no DWARF, and the decision is made inside `load file`.
#
# The witness is `ret_three` (a three-variant tagged enum): it used to store
# bare `0`/`1`/`2` into the tag and declare the latch local as a plain
# integer; it now stores `A`/`B`/`C` and declares the local as
# `fx::Three::Discriminant`, while the payload store keeps its named path.

[image]
arch = 'x86:LE:64:default:gcc'

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '90'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dwarfvariants_x86_64',
    'read symbols',
    'load function ret_three',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'VARIANTNAMES #1: no bare discriminant is stored'
count = 0
literal = 'rethidden->tag = 0;'

[[match]]
name = 'VARIANTNAMES #2: the store names the variant'
count = 1
literal = 'rethidden->tag = A;'

[[match]]
name = 'VARIANTNAMES #3: the latch local is typed as the discriminant enum'
count = 1
literal = 'Three::Discriminant v1;'

[[match]]
name = 'VARIANTNAMES #4: the payload store keeps its named path'
count = 1
regex = '\(rethidden->payload\).A.__0 = x;'
