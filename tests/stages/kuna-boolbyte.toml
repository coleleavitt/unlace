arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'flagparam' },
    { space = 'ram', offset = '0x100010', name = 'bytearith' },
    { space = 'ram', offset = '0x100020', name = 'lowbit' },
    { space = 'ram', offset = '0x100030', name = 'flagstore' },
    { space = 'ram', offset = '0x100050', name = 'callfill' },
    { space = 'ram', offset = '0x100080', name = 'callslot' },
