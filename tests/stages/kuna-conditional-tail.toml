# Authored MSABI conditional tail: compare [rcx],7; preserve all four incoming
# arguments on JNE helper; swap rcx/rdx on the unconditional JMP other.
# P2 flow classification, option tailcalljump off/on/direct. Unknown and
# mid-function targets must still clip. A separately declared interior entry
# stays local. An unbounded caller retains its copied-in callee body; a clipped
# false path still halts; a stated int tail returns its result, and a no-return
# callee stops only its taken path. A final pass explicitly inlines the int leaf.
# No bytes or names are copied from an application binary.

[image]
arch = 'x86:LE:64:default:windows'

