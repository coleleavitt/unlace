# SPARC shifts extract the low integer bits of a floating argument.

[image]
arch = 'sparc:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'low_bits' },
    { space = 'ram', offset = '0x1040', name = 'numeric' },
    { space = 'ram', offset = '0x1080', name = 'integer' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '9de3bf90b12e2010b13e201081c7e00881e80000'

[[image.bytes]]
space = 'ram'
offset = '0x1040'
hex = '9de3bf90f027bffcc307bffc87a01a21c727bffcf007bffc81c7e00881e80000'

[[image.bytes]]
space = 'ram'
offset = '0x1080'
hex = '9de3bf90b12e2010b13e201081c7e00881e80000'

[script]
commands = [
    'parse line extern int2 low_bits(float4 value);',
    'parse line extern int4 numeric(float4 value);',
    'parse line extern int2 integer(int4 value);',
    'option castnarrow off',
    'lo fu low_bits',
    'decompile',
    'print C',
    'lo fu numeric',
    'decompile',
    'print C',
    'lo fu integer',
    'decompile',
    'print C',
    'option castnarrow on',
    'lo fu low_bits',
    'decompile',
    'print C',
    'lo fu numeric',
    'decompile',
    'print C',
    'lo fu integer',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'FLOAT STORAGE TRUNCATION #1: extract the float bits with either cast policy'
count = 2
literal = 'return (int2)((union { float from; unsigned int to; }){ .from = value }).to;'

[[match]]
name = 'FLOAT STORAGE TRUNCATION #2: numeric conversion remains numeric'
count = 2
literal = 'return (int4)value;'

[[match]]
name = 'FLOAT STORAGE TRUNCATION #3: integer truncation keeps its cast with castnarrow off'
count = 1
literal = 'return (int2)value;'

[[match]]
name = 'FLOAT STORAGE TRUNCATION #4: integer conversion is implicit with castnarrow on'
count = 1
literal = 'return value;'
