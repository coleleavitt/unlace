hex = '256900'

[script]
commands = [
    'parse line extern int4 pr(char *f, ...);',
    'parse line extern int4 d2(char *f, int4 a);',
    'parse line extern int4 d3(char *f, int4 a);',
    'parse line extern int4 d5(char *f, int4 a, int4 b, int4 c);',
    'parse line extern uint8 MSABI stored(int4 *value);',
    'parse line extern uint8 MSABI render_value(char *format, ...);',
    'lo fu d2',
    'decompile',
    'print C',
    'lo fu stored',
    'decompile',
    'print C',
    'lo fu d5',
    'decompile',
    'print C',
    'lo fu d3',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'GH829 x86 #1: only d3, which also compares its parameter, keeps pr(f)'
count = 1
literal = 'return pr(f);'

[[match]]
name = 'GH829 x86 #2: the int forwarded in esi is kept, and the stored case passes its value'
count = 2
regex = 'return pr\(f,a\);|return render_value\("%i",[^;]+\);'

[[match]]
name = 'GH829 x86 #3: esi, edx and ecx are kept'
count = 1
regex = 'return render_value\("%i"\);|return pr\(f,a,b,c\);'

[[match]]
name = 'GH829 x86 #4: d3 also compares its parameter, so its call is left as it was'
count = 1
literal = 'if (6 <= a)'
