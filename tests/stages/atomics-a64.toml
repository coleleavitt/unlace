[[match]]
name = 'ldaddal returns the old value'
count = 1
regex = '^  \w+ = __sync_fetch_and_add\(\w+,\w+\);$'

[[match]]
name = 'ldaddal of -1 in a release'
count = 1
regex = '^  \w+ = __sync_fetch_and_add\(\w+,-1\);$'

[[match]]
name = 'ldaddal and the folded ldaxr/stlxr loop that discard it'
count = 2
regex = '^  __sync_fetch_and_add\(\w+,\w+\);$'

[[match]]
name = 'a folded loop returning the old value'
count = 1
regex = '^  return __sync_fetch_and_add\(\w+,\w+\);$'

[[match]]
name = 'a folded release loop'
count = 1
regex = '^  return __sync_fetch_and_sub\(\w+,1\) == 1;$'

[[match]]
name = 'ldsetal and its folded loop'
count = 2
regex = '^  __sync_fetch_and_or\(\w+,\w+\);$'

[[match]]
name = 'swpal'
count = 1
regex = '^  \w+ = __sync_lock_test_and_set\(\w+,\w+\);$'

[[match]]
name = 'a folded exchange loop'
count = 1
regex = '^  return __sync_lock_test_and_set\(\w+,\w+\);$'

[[match]]
name = 'casal at 4 and 1 bytes'
count = 2
regex = '^  return __sync_val_compare_and_swap\(\w+,\w+,\w+\);$'

[[match]]
name = 'casal at 8 bytes tested'
count = 1
regex = '^  return __sync_val_compare_and_swap\(\w+,\w+,\w+\) == \w+;$'

[[match]]
name = 'folded compare-exchange loops keep their failure exit'
count = 2
regex = '^  if \(__sync_val_compare_and_swap\(\w+,\w+,\w+\) == \w+\)$'

[[match]]
name = 'ldclral of a negated operand'
count = 1
regex = '^  \w+ = __sync_fetch_and_and\(\w+,\w+\);$'

[[match]]
name = 'a folded and loop'
count = 1
regex = '^  return __sync_fetch_and_and\(\w+,\w+\);$'

[[match]]
name = 'stadd and a folded loop on globals'
count = 2
regex = '^  __sync_fetch_and_add\(.*counter,1\);$'

[[match]]
name = 'the casal of a max loop stays inside the loop'
count = 1
regex = '^    \w+ = __sync_val_compare_and_swap\(\w+,\w+,\w+\);$'

[[match]]
name = 'a byte compare-exchange loop, a nested max loop and llscfold off keep the monitor'
count = 3
literal = 'ExclusiveMonitorPass('

[[match]]
name = 'the acquire markers stay'
count = 6
regex = '^  LOAcquire\(\);$'
