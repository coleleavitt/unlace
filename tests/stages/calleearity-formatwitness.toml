# A call that stores two arguments through its first parameter immediately
# before passing them to a stripped printf-like helper loses both values.
# onlyOpUse sees the STORE descendants and rejects the esi/edx input trials.
#
# The other arm calls the same helper with the same constant format pointer
# and recovers all three arguments.  This is stronger evidence than an
# ordinary partial-list sibling: the first argument value identifies the
# same format operation at both sites.
#
# Phase: P4 call recovery.  The partial-list extension
# (unlace_calleearitylive.rs, always on) uses the equal constant first argument
# as the sibling witness and restores both values.  no_conversion_control
# repeats the call shapes with a plain string and proves that pointer
# equality alone does not lend the longer arity.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'caller' },
    { space = 'ram', offset = '0x40102c', name = 'printer' },
    { space = 'ram', offset = '0x40102d', name = 'position_format' },
    { space = 'ram', offset = '0x401040', name = 'no_conversion_control' },
    { space = 'ram', offset = '0x40106c', name = 'plain_format' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = '85c974148b57048b37488d3d1d00000031c0e815000000c38937895704488d3d0900000031c0e801000000c3c3706f736974696f6e3d2825642c2564295c6e0085c974148b57048b37488d3d1c00000031c0e8d5ffffffc38937895704488d3d0800000031c0e8c1ffffffc3706c61696e207465787400'

[script]
commands = [
    'lo fu caller',
    'decompile',
    'print C',
    'lo fu no_conversion_control',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLEARITY FORMAT WITNESS #1: the stored values never disappear from the call'
count = 0
literal = 'printer(position_format)'

[[match]]
name = 'CALLEARITY FORMAT WITNESS #2: both stored values remain call arguments'
count = 1
literal = 'printer(position_format,a1,a2)'

[[match]]
name = 'CALLEARITY FORMAT WITNESS #3: the sibling call keeps its three arguments'
count = 1
literal = 'printer(position_format,*a0,a0[1])'

[[match]]
name = 'CALLEARITY FORMAT WITNESS #4: a non-format constant never lends its longer arity'
count = 1
literal = 'printer(plain_format)'

[[match]]
name = 'CALLEARITY FORMAT WITNESS #5: the longer non-format call stays unchanged'
count = 1
literal = 'printer(plain_format,*a0,a0[1])'
