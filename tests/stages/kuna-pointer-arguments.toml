# P9 pointer-argument compatibility: standalone printing has no completed
# batch contract. Printing the callee first must not leak its declaration
# into the next function. The caller's entire eight-byte object survives.
# The buffered positive cases, including caller-first order and workers,
# compile and execute in unlace-cli/tests/emitted_pointer_arguments.rs.
#
# Synthetic SysV x86-64: sink xors the pointed-to byte with 1; change pushes
# its argument, calls sink with that slot's address, then returns the slot.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'sink' },
    { space = 'ram', offset = '0x1004', name = 'change' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '803701c3574889e7e8f3ffffff58c3'

[script]
commands = [
    'lo fu sink',
    'decompile',
    'print C',
    'lo fu change',
    'decompile',
    'print C',
]

[[match]]
name = 'pointer-arguments #1: standalone caller retains its scalar storage'
count = 1
regex = '(unsigned long|uint8|undefined8) v1;'

[[match]]
name = 'pointer-arguments #2: no declaration leaks between standalone renders'
count = 1
literal = 'sink(&v1);'
