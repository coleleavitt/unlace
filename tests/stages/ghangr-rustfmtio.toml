[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/rust_fmt_io_x86_64',
    'option listing on',
    'read symbols',
    'option protoorder off',
    'option setlanguage rust-language',
    'option rustfmt on',
    'load function write_unsigned',
    'decompile',
    'print C',
    'option rustfmt all',
    'print C',
    'load function write_signed',
    'decompile',
    'print C',
    'load function write_flags',
    'decompile',
    'print C',
    'load function write_literal',
    'decompile',
    'print C',
    'load function write_empty',
    'decompile',
    'print C',
    'load function write_string',
    'decompile',
    'print C',
    'load function write_pair',
    'decompile',
    'print C',
    'load function write_dynamic',
    'decompile',
    'print C',
]

[[match]]
name = 'off empty and dynamic formatting preserve runtime writes'
count = 3
literal = 'Stdout::write_fmt('

[[match]]
name = 'all six writes use a scoped trait import'
count = 6
literal = 'use std::io::Write as _;'

[[match]]
name = 'all six writes preserve the owned error word'
count = 6
literal = 'std::mem::transmute::<std::io::Error, *mut ()>'

[[match]]
name = 'unsigned stdout write'
count = 1
regex = 'write!\(.*"\[\{\}\]".*\*const u32'

[[match]]
name = 'signed newline stdout write'
count = 1
regex = 'writeln!\(.*"\{\}".*\*const i64'

[[match]]
name = 'static flags and repeated indices'
count = 1
regex = 'writeln!\(.*"\{:#010x\}/\{:·>12\}"'

[[match]]
name = 'literal braces Unicode NUL and extra newline'
count = 1
regex = 'writeln!\(.*"\{\{é🙂\}\}\\0\\n"'

[[match]]
name = 'empty output preserves the opaque call and error behavior'
count = 1
literal = 'Stdout::write_fmt(a0,1,1)'

[[match]]
name = 'string fill width and precision'
count = 1
regex = 'write!\(.*"\|\{:🦀\^10.3\}\|".*from_utf8_unchecked'

[[match]]
name = 'mixed arguments retain their order'
count = 1
regex = 'write!\(.*"\{\}: \{\}".*\*const u32.*from_utf8_unchecked'

[[match]]
name = 'all six writes preserve the reference-cell receiver'
count = 6
literal = '*mut &std::io::Stdout'

[[match]]
name = 'success preserves the zero result word'
count = 6
regex = 'std::result::Result::Ok\(\(\)\) => 0[ui]64'
