# Unlace #65 (personal): P1 environment binding, separate debug files
# (option debuglink, default on, a load-time gate). Fixtures from
# fixtures/debuglink/p.c as its header says. Both images are stripped:
# before, the only names were the dynamic symbol `main` and the call printed
# as sub_1149(). #1-#2: link's .gnu_debuglink names link.debug next to it
# (CRC32 checked); its .symtab names the functions and its DWARF their
# parameters. #3: mini carries only function symbols, as XZ-compressed
# MiniDebugInfo in .gnu_debugdata.
# (The build-id path, <dir>/.build-id/xx/rest.debug under UNLACE_DEBUG_DIRS,
# is the same lookup; a host directory cannot be pinned in a stage test.)

[image]
arch = 'x86:LE:64:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/stages/fixtures/debuglink/link',
    'read symbols',
    'load function helper_beta',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/debuglink/mini',
    'read symbols',
    'load function helper_beta',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'debuglink #1: the .gnu_debuglink companion supplies names and DWARF'
count = 1
regex = '^int4 helper_beta\(int4 x\)'

[[match]]
name = "debuglink #2: the companion's DWARF parameter reaches the call"
count = 1
literal = 'return helper_alpha(x) + -3;'

[[match]]
name = 'debuglink #3: .gnu_debugdata supplies names only'
count = 1
literal = 'return helper_alpha() + -3;'
