[script]
commands = [
    'parse line extern int4 pr(char *f, ...);',
    'parse line extern int4 d4(char *f, int4 a);',
    'parse line extern int4 du(char *f, uint4 a);',
    'parse line extern int4 d3(char *f, int4 x, int4 a);',
    'parse line extern int4 dl(char *f, int8 a);',
    'parse line extern int4 c4(char *f, int4 a);',
    'parse line extern int4 MSABI mpr(char *f, ...);',
    'parse line extern int4 MSABI w4(char *f, int4 a);',
    'parse line extern int4 u5(char *f, int4 a);',
    'parse line extern int4 u8(char *f, int4 a, int4 b);',
    'parse line extern int4 c5(char *f, int4 a);',
    'lo fu d4',
    'decompile',
    'print C',
    'lo fu du',
    'decompile',
    'print C',
    'lo fu d3',
    'decompile',
    'print C',
    'lo fu c4',
    'decompile',
    'print C',
    'lo fu w4',
    'decompile',
    'print C',
    'lo fu u5',
    'decompile',
    'print C',
    'lo fu u8',
    'decompile',
    'print C',
    'lo fu c5',
    'decompile',
    'print C',
    'lo fu dl',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'GH876 x86 #1: the undeclared upper register half is never printed'
count = 0
regex = 'CONCAT44\([^;]*\);'

[[match]]
name = 'GH876 x86 #2: the int itself is passed in gcc d4, du and clang c4'
count = 3
regex = '^\s*pr\(f,a\);'

[[match]]
name = 'GH876 x86 #3: both ints are passed in gcc d3'
count = 1
regex = '^\s*pr\(f,x,a\);'

[[match]]
name = 'GH876 x86 #4: a computed long stays 8 bytes'
count = 1
regex = '^\s*pr\(f,a \+ 1\);'

[[match]]
name = 'GH876 x86 #5: the int itself is passed under the Windows x64 convention'
count = 1
regex = '^\s*mpr\(f,a\);'

[[match]]
name = 'GH876 x86 #6: the int itself is passed when it also feeds a later argument in gcc u5'
count = 1
regex = '^\s*pr\(f,a,a\);'

[[match]]
name = 'GH876 x86 #7: both ints are passed in gcc u8'
count = 1
regex = '^\s*pr\(f,a,b,a\);'

[[match]]
name = 'GH876 x86 #8: the int itself is passed when it also feeds a later argument in clang c5'
count = 1
regex = '^\s*pr\(f,a,\(uint8\)\(uint4\)a\);'
