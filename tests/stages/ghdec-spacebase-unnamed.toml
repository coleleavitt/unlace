[script]
commands = [
    'option stackexitanchor off',
    'lo fu scan_textfile',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'spacebase-unnamed #1: no internal PTRSUB operator reaches the C body'
count = 0
literal = 'PTRSUB'

[[match]]
name = 'spacebase-unnamed #2: no raw ESP register leaks into an expression'
count = 0
literal = 'ESP'

[[match]]
name = 'spacebase-unnamed #3: every statement touching the untracked frame renders a stack-location leaf'
count = 7
literal = '&Stack'

[[match]]
name = 'spacebase-unnamed #4: positive frame offset renders as its storage'
count = 1
literal = '(&Stack00000008)['

[[match]]
name = 'spacebase-unnamed #5: zero frame offset renders as its storage'
count = 1
literal = '(&Stack00000000)['

[[match]]
name = 'spacebase-unnamed #6: negative frame offset wraps in the space address size'
count = 1
literal = '(&Stackfffffffc)['
