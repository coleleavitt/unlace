# A value a function returns in a register its calling convention reserves
# for floating point is a float of that register's width (kuna_floatreg.rs).
# A strict correction: there is no option, and the one pass is the fix.
#
# The XML wrapper only provides the harness architecture. The script loads
# two in-tree fixtures (sources beside them).
#
# floatret_cm4.o is a Cortex-M4F object: qnanf_ loads the quiet NaN
# 0x7fc00000 into s0 and returns it. Nothing computes with the value as a
# float, so the fold typed it an integer: qnanf_ returned 0x7fc00000 as an
# unsigned int, and a caller that used the result as a float converted the
# bits as a number (the NaN became 2143289344.0). s0 is a float register, so
# it is float4 and the constant prints as NAN. logish returns -INFINITY in
# s0 on one path and the results of core and qnanf_ on the others; decompiled
# alone it knows neither callee's return, a float would convert both by
# value, so the function returns the same register as the bits it is
# (0xff800000). decompile-all, which knows both callees return floats, types
# it float (decompile_all_cli.rs a_nan_returned_in_s0_round_trips).
#
# floatret_x86_64 is a stripped clang -O0 PIE: sub_11c0 and sub_11d0 return
# a global float and double in xmm0 and stay integers: one declaration of a
# global serves every function, and another may read it as an integer.
# sub_11f0 returns its float parameter untouched and stays an unsigned int:
# what a function receives is its callers' to type, and a caller passing it
# an integer would print a conversion by value.
#
# floatret_put_cm4.o is a Cortex-M4F object: putf2 moves its three float
# parameters from s0-s2 into r0-r2 and tail-calls put3, which takes them as
# u32. They stay integers: typed float4, putf2 would hand put3 each value
# converted to an integer instead of its bits.
#
# The refusals: qp, sn and nn return NaNs NAN cannot spell (a payload, a
# signalling NaN, a negative payload) and keep their bits, and third loads a
# double into d0, whose low half s0 is not a float. An ARM hard-float double
# argument is pinned elsewhere: it arrives as the two halves s0 and s1, so
# fmtlf_armhf's show keeps unsigned int halves (formatstring-static.xml,
# FMTSTATIC #21).

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/floatret_cm4.o',
    'read symbols',
    'option armfloatreturn off',
    'option armfloatargs off',
    'load function qnanf_',
    'decompile',
    'print C',
    'load function logish',
    'decompile',
    'print C',
    'load function qp',
    'decompile',
    'print C',
    'load function sn',
    'decompile',
    'print C',
    'load function nn',
    'decompile',
    'print C',
    'load function third',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/floatret_x86_64',
    'read symbols',
    'load function sub_11c0',
    'decompile',
    'print C',
    'load function sub_11d0',
    'decompile',
    'print C',
    'load function sub_11f0',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/floatret_put_cm4.o',
    'read symbols',
    'option armfloatreturn off',
    'option armfloatargs off',
    'load function putf2',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'FLOATRET #1: a NaN returned in s0 is a float'
count = 1
literal = 'float4 qnanf_(void)'

[[match]]
name = 'FLOATRET #2: and prints as NAN, not its bits'
count = 1
literal = 'return NAN;'

[[match]]
name = 'FLOATRET #3: a function also returning calls it cannot see the type of is not a float'
count = 1
literal = 'unsigned int logish(float4 a0)'

[[match]]
name = 'FLOATRET #4: and returns -INFINITY as its bits'
count = 1
literal = 'return 0xff800000;'

[[match]]
name = 'FLOATRET #5: the quiet NaN is not returned as an integer'
count = 0
literal = '0x7fc00000'

[[match]]
name = 'FLOATRET #6: a global returned in xmm0 is not typed a float'
count = 0
regex = 'float[48] sub_11[cd]0\(void\)'

[[match]]
name = 'FLOATRET #7: NaNs NAN cannot spell keep their bits'
count = 3
regex = 'return (0x7fc00123|0x7fa00000|0xffc00005);'

[[match]]
name = "FLOATRET #8: a parameter handed back untouched is its callers' to type"
count = 1
literal = 'unsigned int sub_11f0(unsigned int a0)'

[[match]]
name = 'FLOATRET #9: neither those NaNs nor the low half of a double in d0 is a float'
count = 0
regex = 'float[48] (qp|sn|nn|third)\('

[[match]]
name = 'FLOATRET #10: a float handed on to an integer parameter keeps its bits'
count = 1
literal = 'void putf2(unsigned int a0,unsigned int a1,unsigned int a2,'
