[script]
commands = [
    'option irverify on',
    'lo fu evhttp_send_reply_chunk_with_cb',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'GH6930 #1: the bare-literal form never appears'
count = 0
literal = 'bufferevent_setcb(*(unsigned long *)(v2 + 0x10),0,0x100000,evhttp_error_cb,v2)'

[[match]]
name = 'GH6930 #2: 0x100000 resolves to its function name'
count = 1
literal = 'bufferevent_setcb(*(unsigned long *)(v2 + 0x10),0,evhttp_write_cb,evhttp_error_cb,v2)'

[[match]]
name = 'GH6930 #3: no pass leaves the folded BOOL_OR read ahead of its definition (irverify, GH-1561)'
count = 0
literal = 'irverify:'
