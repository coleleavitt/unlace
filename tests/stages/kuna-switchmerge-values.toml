# switchmerge with value-aware holes, and a guarded jump table longer than
# jumptablemax.
#
# Authored AArch64 (clang -c of hand-written assembly). f and g range-check
# w0 against 0x41..0x48 and index an eight-entry table; an out-of-range value
# goes to `x == 0x60` and `x == 0x70` tests. The holes 0x43 and 0x46 go to the
# code the failed tests reach: in f a block of stores that `x1 == 0` also
# reaches, in g the shared `lsl w0,w0,#1; ret` after the switch.
# h bounds w0 by `cmp w0,#1100; b.hs` and indexes an 1100-entry table.
# p is clang -O2 of a sparse switch with no default: its table's holes
# 0x91..0x9f go straight to the code after the switch, and the arm for
# 0x90 ends in a jump there too, which prints as nothing because the hole
# arm `case 0x91: ... break;` follows it.
#
# Fixed: f and g print no label for a hole, since `default:` sends 0x43 and
# 0x46 through both failed tests to the same code; h prints a switch with
# 1100 labels. p keeps its hole labels: the 0x90 arm runs into them.
# Before: f printed `case 0x43: case 0x46: goto label_...;`, g
# `case 0x43: case 0x46: break;`, and h `jump-as-call` (the table is longer
# than jumptablemax 1024, though its guard bounds it and it reaches four
# arms). Option switchmerge off keeps f's labels.
# The fork's switchguardmerge is pinned off: it merges the same equality
# tests into the switch whatever switchmerge says.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'f' },
    { space = 'ram', offset = '0x101000', name = 'g' },
    { space = 'ram', offset = '0x102000', name = 'h' },
    { space = 'ram', offset = '0x1261c', name = 'p' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x101000'
readonly = true
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x102000'
readonly = true
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x933'
readonly = true
hex = '1a14000d000200070207291018101d2a2a2a2a2a2a2a2a2a2a2a2a2a2a2a07230214001d0521022710251a0d18050510'

[[image.bytes]]
space = 'ram'
offset = '0x1261c'
readonly = true
hex = ''

[script]
commands = [
    'option switchguardmerge off',
    'parse line extern int4 f(int4 x,int4 *p);',
    'parse line extern int4 g(int4 x);',
    'parse line extern int4 h(uint4 x);',
    'parse line extern int4 p(int4 x);',
    'lo fu f',
    'decompile',
    'print C',
    'lo fu g',
    'decompile',
    'print C',
    'lo fu h',
    'decompile',
    'print C',
    'lo fu p',
    'decompile',
    'print C',
    'option switchmerge off',
    'lo fu f',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'SWITCHVALUES #1: a hole label prints only in h and the unmerged f'
count = 4
regex = 'case 0x4[36]:'

[[match]]
name = 'SWITCHVALUES #2: f, g, h and the unmerged f keep their six value labels'
count = 24
regex = 'case 0x4[124578]:'

[[match]]
name = "SWITCHVALUES #3: the hole arm's jump is gone from f"
count = 3
regex = 'goto label_[0-9a-f]+;'

[[match]]
name = 'SWITCHVALUES #4: h prints its table as a switch'
count = 1
literal = 'case 1099:'

[[match]]
name = 'SWITCHVALUES #5: no dispatch prints as a computed call'
count = 0
literal = 'jump-as-call'

[[match]]
name = 'SWITCHVALUES #6: p keeps the hole labels that the arm before them runs into'
count = 15
regex = 'case 0x9[1-9a-f]:'
