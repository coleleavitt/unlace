# A parameter the calling convention passes in a floating-point register is
# a float of that register's width (unlace_floatreg.rs, float_input_vote).
# A strict correction: there is no option, and the one pass is the fix.
#
# The XML wrapper only provides the harness architecture. The script loads
# three in-tree fixtures built from floatparam.c (source beside them): gcc
# -O0 and clang -O2 for x86-64, and clang -O2 for AArch64.
#
# fs and ff store a double and a float through a pointer, fr into a field,
# and sink two floats into an array. Nothing computes with the value, so the
# fold typed it raw bytes and the prototype printed an integer, which the
# convention passes in a general register: fs(unsigned long a0, ..) moved
# the double from xmm0 (d0) to rdi (x0). The register makes it a float.
#
# The refusals: bits hands the double back in rax (x0) and keeps its integer
# type. fy copies its double into a global: with floatglobals off every
# global refuses, and fy keeps its integer type; on, the whole-object scan
# finds nothing else touching the global and fy takes the double.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/floatparam_x86_64_O0.o',
    'read symbols',
    'load function fs',
    'decompile',
    'print C',
    'load function ff',
    'decompile',
    'print C',
    'load function fr',
    'decompile',
    'print C',
    'option floatglobals off',
    'load function fy',
    'decompile',
    'print C',
    'option floatglobals on',
    'load function fy',
    'decompile',
    'print C',
    'load function bits',
    'decompile',
    'print C',
    'load function sink',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/floatparam_x86_64.o',
    'read symbols',
    'load function fs',
    'decompile',
    'print C',
    'load function ff',
    'decompile',
    'print C',
    'load function fr',
    'decompile',
    'print C',
    'option floatglobals off',
    'load function fy',
    'decompile',
    'print C',
    'option floatglobals on',
    'load function fy',
    'decompile',
    'print C',
    'load function sink',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/floatparam_a64.o',
    'read symbols',
    'load function fs',
    'decompile',
    'print C',
    'load function ff',
    'decompile',
    'print C',
    'load function fr',
    'decompile',
    'print C',
    'option floatglobals off',
    'load function fy',
    'decompile',
    'print C',
    'option floatglobals on',
    'load function fy',
    'decompile',
    'print C',
    'load function bits',
    'decompile',
    'print C',
    'load function sink',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'FLOATPARAM #1: a double stored through a pointer is a double, and so is the pointee'
count = 3
literal = 'void fs(float8 a0,unsigned int *a1,float8 *a2)'

[[match]]
name = 'FLOATPARAM #2: a float stored through a pointer is a float'
count = 3
literal = 'void ff(float4 a0,unsigned int *a1,float4 *a2)'

[[match]]
name = 'FLOATPARAM #3: a double stored into a field is a double'
count = 3
literal = 'void fr(float8 a0,'

[[match]]
name = 'FLOATPARAM #4: two floats stored into an array are floats'
count = 3
literal = 'void sink(float4 a0,float4 a1,float4 *a2)'

[[match]]
name = 'FLOATPARAM #5: a double copied into a global keeps its integer type'
count = 3
literal = 'void fy(unsigned long a0,'

[[match]]
name = 'FLOATPARAM #6: bits handed back in an integer register stay an integer'
count = 2
literal = 'unsigned long bits(unsigned long a0)'

[[match]]
name = 'FLOATPARAM #7: a double copied into a global nothing else reads as an integer is a double'
count = 3
literal = 'void fy(float8 a0,'
