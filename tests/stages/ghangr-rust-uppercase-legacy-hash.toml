[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100040', name = 'caller' },
    { space = 'ram', offset = '0x100070', name = 'real_work' },
    { space = 'ram', offset = '0x100080', name = 'core::ptr::drop_in_place::hABCDEF0123456789' },
    { space = 'ram', offset = '0x100090', name = 'core::ptr::drop_in_place::h0123456789abcdef' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100040'
readonly = true
hex = '5389fbe82800000001c3bf44332211e82c000000bf88776655e83200000089d85bc366662e0f1f8400000000000f1f00b842000000c3662e0f1f840000000000c366662e0f1f8400000000000f1f4000c3'

[script]
commands = [
    'load function caller',
    'decompile',
    'print C',
    'option cleanupcode off',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/rust-uppercase-legacy/names.elf',
    'read symbols',
    'load function 0x401000',
    'decompile',
    'print C',
    'load function 0x401010',
    'decompile',
    'print C',
    'load function 0x401020',
    'decompile',
    'print C',
    'load function 0x401030',
    'decompile',
    'print C',
    'load function 0x401040',
    'decompile',
    'print C',
    'load function 0x401050',
    'decompile',
    'print C',
    'load function 0x401060',
    'decompile',
    'print C',
    'load function 0x401070',
    'decompile',
    'print C',
    'load function 0x401080',
    'decompile',
    'print C',
    'load function 0x401090',
    'decompile',
    'print C',
]

[[match]]
name = 'A final uppercase component remains a function name'
count = 1
regex = '\bdemo::hABCDEF0123456789\(void\)'

[[match]]
name = 'A final component with mixed-case digits remains a function name'
count = 1
regex = '\bmixed::hAbCdE0123456789f\(void\)'

[[match]]
name = 'A true Rust hash elides only the compiler suffix after an uppercase member'
count = 1
regex = '\bmember::hABCDEF0123456789\(void\)'

[[match]]
name = 'A lowercase legacy compiler hash remains elided'
count = 1
regex = '\blower::actual\(void\)'

[[match]]
name = 'An Itanium function can itself have an uppercase hash-shaped identifier'
count = 1
regex = '\bcpp_demo::hABCDEF0123456789\(void\)'

[[match]]
name = 'An ordinary Itanium name is unchanged by Rust hash matching'
count = 1
regex = '\bcpp_ok::go\(void\)'

[[match]]
name = 'An uppercase name also survives an accepted LLVM suffix'
count = 1
regex = '\bllvm::hABCDEF0123456789\(void\)'

[[match]]
name = 'A v0 name is unchanged by legacy hash matching'
count = 1
regex = '\bsimple::main\(void\)'

[[match]]
name = 'An MSVC name is unchanged by legacy hash matching'
count = 1
regex = '\bBar::foo\(Bar \*this\)'

[[match]]
name = 'A true lowercase LLVM hash stays elided'
count = 1
regex = '\blowerllvm::actual\(void\)'

[[match]]
name = 'Uppercase hash user call survives default and off'
count = 2
literal = 'core::ptr::drop_in_place::hABCDEF0123456789(0x11223344);'

[[match]]
name = 'Lowercase hash cleanup call stays optional'
count = 1
literal = 'core::ptr::drop_in_place::h0123456789abcdef(0x55667788);'

[[match]]
name = 'Hash guards retain the ordinary work call'
count = 2
literal = 'real_work'
