# GH-6389: "8085 undocumented instructions are missing"
# https://github.com/NationalSecurityAgency/ghidra/issues/6389
#
# Ghidra's 8085 SLEIGH module follows the official Intel ISA and omits the
# well-known undocumented 8085 instructions.  Their opcode bytes are valid on
# real silicon but had no decode entry, so they failed to resolve a
# constructor (the decompiler aborts; in Ghidra's listing they render as `??`
# bad bytes).
#
# Fix (unlace GH-6389, modeled on upstream Ghidra commit 1577081): add the nine
# single-opcode undocumented instructions plus the undocumented K and V flag
# registers:
#   DSUB 0x08, ARHL 0x10, RDEL 0x18, LDSI 0x38, SHLX 0xD9, LHLX 0xED,
#   RSTV 0xCB, JNK 0xDD, JK 0xFD.
#
# Byte stream (one of each, with operands):
#   0x00 08          DSUB HL,BC
#   0x01 10          ARHL
#   0x02 18          RDEL
#   0x03 38 04       LDSI DE,(SP,0x4)
#   0x05 d9          SHLX HL,(DE)
#   0x06 ed          LHLX HL,(DE)
#   0x07 cb          RSTV
#   0x08 dd 34 12    JNK 0x1234
#   0x0b fd 78 56    JK  0x5678
#
# Stage: S1 decode-table (SLEIGH spec-fix, no option). This testcase asserts
# every undocumented opcode now decodes to its proper mnemonic, and that no
# byte is left as an undecoded `??`.

[image]
arch = '8085:LE:16:default'

[[image.bytes]]
space = 'ram'
offset = '0x0'
hex = '0810183804d9edcbdd3412fd7856'

[script]
commands = [
    'disassemble 0x0 0xe',
    'quit',
]

[[match]]
name = 'GH6389 #1: DSUB 0x08 decodes'
count = 1
regex = '^0x0000: DSUB      HL,BC'

[[match]]
name = 'GH6389 #2: ARHL 0x10 decodes'
count = 1
regex = '^0x0001: ARHL'

[[match]]
name = 'GH6389 #3: RDEL 0x18 decodes'
count = 1
regex = '^0x0002: RDEL'

[[match]]
name = 'GH6389 #4: LDSI 0x38 decodes with imm8 operand'
count = 1
regex = '^0x0003: LDSI      DE,\(SP,0x4\)'

[[match]]
name = 'GH6389 #5: SHLX 0xD9 decodes'
count = 1
regex = '^0x0005: SHLX      HL,\(DE\)'

[[match]]
name = 'GH6389 #6: LHLX 0xED decodes'
count = 1
regex = '^0x0006: LHLX      HL,\(DE\)'

[[match]]
name = 'GH6389 #7: RSTV 0xCB decodes'
count = 1
regex = '^0x0007: RSTV'

[[match]]
name = 'GH6389 #8: JNK 0xDD decodes with addr16 operand'
count = 1
regex = '^0x0008: JNK       0x1234'

[[match]]
name = 'GH6389 #9: JK 0xFD decodes with addr16 operand'
count = 1
regex = '^0x000b: JK        0x5678'

[[match]]
name = 'GH6389 #10: no undecoded bad bytes remain'
count = 0
literal = '??'
