[script]
commands = [
    'parse line typedef struct Callback { int4 (*invoke)(int4); } Callback;',
    'parse line extern int4 arm_switch_conditional(int4 input);',
    'parse line extern int4 arm_switch_unconditional(int4 input);',
    'parse line extern int4 arm_switch_addls(int4 input);',
    'parse line extern int4 arm_switch_frame(int4 input, int4 bias);',
    'parse line extern int4 arm_indirect_call(struct Callback *target, int4 input);',
    'option tailcalljump on',
    'load function arm_switch_conditional',
    'decompile',
    'print C',
    'load function arm_switch_unconditional',
    'decompile',
    'print C',
    'load function arm_switch_addls',
    'decompile',
    'print C',
    'load function arm_switch_frame',
    'decompile',
    'print C',
    'load function arm_indirect_call',
    'decompile',
    'print C',
    'option tailcalljump off',
    'load function arm_switch_conditional',
    'decompile',
    'print C',
    'load function arm_switch_unconditional',
    'decompile',
    'print C',
    'load function arm_switch_addls',
    'decompile',
    'print C',
    'load function arm_switch_frame',
    'decompile',
    'print C',
    'load function arm_indirect_call',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ARM GUARD RANGE #1: both ADDPL tables and healthy controls recover switches'
count = 8
regex = 'switch\s*\('

[[match]]
name = 'ARM GUARD RANGE #2: branch entries never become calls'
count = 0
regex = 'jump-as-call|\(code \*\)'

[[match]]
name = 'ARM GUARD RANGE #3: all four cases remain'
count = 8
regex = 'case (3|0x3d|61):'

[[match]]
name = 'ARM GUARD RANGE #4: signed lower-bound guards remain'
count = 6
regex = 'input <= -1|0 <= input'

[[match]]
name = 'ARM GUARD RANGE #5: the genuine indirect call remains'
count = 2
regex = 'return \(\*v[0-9]+\)\(input\) \+ 1;'
