# - `ppc32picimports-abi.toml`, `ppc32picimports-abi-indirect.toml`, and
# `ppc32picimports-driver.toml` exercise explicit `ppc32picimports abi` recovery, including
# ordinary returning callers and compiler start files.

[image]
arch = 'PowerPC:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '4e800020'

[script]
commands = [
    'option ppc32picimports abi',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-indirect.elf',
    'read symbols',
    'load function check2',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PIC indirect caller is decompiled'
count = 1
literal = 'check2(void)'

[[match]]
name = 'PIC indirect returning call retains return 7'
count = 1
literal = 'return 7;'

[[match]]
name = 'PIC conflicting indirect caller acquires no global contract'
count = 0
regex = '__stack_chk_fail|no-return'
