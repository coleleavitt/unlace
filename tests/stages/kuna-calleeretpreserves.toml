# Authored direct-call checker: j sets EAX=5; the returning helper leaves
# it alone, while its failure arm calls cookie_failure and never returns.
[[image.bytes]]
space = 'ram'
offset = '0x1700'
hex = '4883ec28b805000000e8320000004883c428c3'

[[image.bytes]]
space = 'ram'
offset = '0x1740'
hex = '4883c1014885c97401c34883ec28e82d000000cc'

[[image.bytes]]
space = 'ram'
offset = '0x1780'
hex = 'b83c000000bf4b0000000f050f0b'

[script]
commands = [
    'lo fu f',
    'decompile',
    'print C',
    'lo fu g',
    'decompile',
    'print C',
    'lo fu h',
    'decompile',
    'print C',
    'lo fu i',
    'decompile',
    'print C',
    'parse line extern unsigned long long j(unsigned long long cookie);',
    'parse line extern void checked_helper(unsigned long long cookie);',
    'lo fu j',
    'decompile',
    'print C',
    'option noreturn cookie_failure true',
    'decompile',
    'print C',
    'option noreturn cookie_failure false',
    'decompile',
    'print C',
    'option noreturn cookie_failure true',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLEERETPRESERVES #1: the zero set before the cookie check is never lost, so f is not void'
count = 0
regex = '^void f\(int8 a0\)$'

[[match]]
name = 'CALLEERETPRESERVES #2: f returns the constant the caller placed in EAX'
count = 1
regex = '^  return 0;$'

[[match]]
name = 'CALLEERETPRESERVES #3: and that value gives f its own return type back'
count = 1
regex = '^unsigned long long f\(int8 a0\)$'

[[match]]
name = 'CALLEERETPRESERVES #4: the checker is still called with the same argument'
count = 1
regex = '^  sub_1100\(a0 \+ 1\);$'

[[match]]
name = 'CALLEERETPRESERVES #5: an endbr64/ret stub proves nothing and g is unchanged'
count = 1
regex = '^void g\(void\)$'

[[match]]
name = "CALLEERETPRESERVES #6: the stub call keeps the convention's answer"
count = 1
regex = '^  sub_1410\(\);$'

[[match]]
name = "CALLEERETPRESERVES #7: a tailcallee RAX write never preserves the caller's seven"
count = 0
regex = '^  return 7;$'

[[match]]
name = 'CALLEERETPRESERVES #8: both direct- and tailcallee RAX writers keep the call'
count = 2
regex = '^  sub_1[56]40\(\);$'

[[match]]
name = "CALLEERETPRESERVES #9: only a known terminal failure call preserves j's five"
count = 2
regex = '^  return 5;$'

[[match]]
name = 'CALLEERETPRESERVES #10: unknown and unmarked keep the undefined return'
count = 2
regex = '^  return v1;$'

[[match]]
name = 'CALLEERETPRESERVES #11: every pass retains the direct helper call'
count = 4
regex = '^  checked_helper\(cookie\);$'
