[script]
commands = [
    'lo fu call_it',
    'decompile',
    'print C',
    'lo fu sign_it',
    'decompile',
    'print C',
    'lo fu auth_it',
    'decompile',
    'print C',
    'lo fu strip_it',
    'decompile',
    'print C',
    'lo fu sign_fn',
    'decompile',
    'print C',
    'lo fu store_signed',
    'decompile',
    'print C',
    'lo fu sign_ia_plain',
    'decompile',
    'print C',
    'lo fu auth_ib_plain',
    'decompile',
    'print C',
    'lo fu auth_iza',
    'decompile',
    'print C',
    'lo fu strip_data',
    'decompile',
    'print C',
    'lo fu sign_db_store',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PACFLOW #1: no PAC-only function is void'
count = 0
regex = '^void \w+\(void\)'

[[match]]
name = 'PACFLOW #2: every signing, authenticating or stripping function returns its pointer'
count = 8
regex = '^\s*return a0;$'

[[match]]
name = "PACFLOW #3: the pointer is the function's first parameter"
count = 8
regex = '^unsigned long \w+\(unsigned long a0\)$'

[[match]]
name = 'PACFLOW #4: a signed pointer stored through its slot'
count = 2
regex = '^\s*\*a0 = a1;$'

[[match]]
name = 'PACFLOW #5: the FPAC-less failure check folds away (no brk, no compare)'
count = 0
regex = 'SoftwareBreakpoint|if \('

[[match]]
name = 'PACFLOW #6: no hidden PAC op surfaces as a user op'
count = 0
regex = 'pac|Auth|xpac'

[[match]]
name = 'PACFLOW #7: the braaz call still passes its argument'
count = 1
literal = '(*a0)(a1);'
