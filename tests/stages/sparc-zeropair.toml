f027bffcf207bffc81c7e00891e80000
'''

[script]
commands = [
    'option boolreturn off',
    'lo fu keep_zero',
    'decompile',
    'print C',
    'lo fu same',
    'decompile',
    'print C',
    'lo fu flag_zero',
    'decompile',
    'print C',
    'lo fu keep_five',
    'decompile',
    'print C',
    'lo fu ll_const',
    'decompile',
    'print C',
    'lo fu ull_arg',
    'decompile',
    'print C',
    'lo fu ll_mul',
    'decompile',
    'print C',
    'lo fu keep_zero_O0',
    'decompile',
    'print C',
    'lo fu flag_zero_O0',
    'decompile',
    'print C',
    'lo fu ull_arg_O0',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'sparc-zeropair #1: no function returns its second argument in the high word'
count = 0
literal = 'a1 << 0x20'

[[match]]
name = 'sparc-zeropair #2: keep_zero returns an int'
count = 2
regex = 'unsigned int keep_zero(_O0)?\(uint4 \*a0,uint4 a1\)'

[[match]]
name = 'sparc-zeropair #3: same returns an int, 1 or 0'
count = 1
literal = 'unsigned int same(uint4 a0,uint4 a1)'

[[match]]
name = 'sparc-zeropair #4: flag_zero returns an int'
count = 2
regex = 'unsigned int flag_zero(_O0)?\(uint4 \*a0,uint4 a1\)'

[[match]]
name = 'sparc-zeropair #4b: every path that returns 0 returns 0'
count = 5
literal = 'return 0;'

[[match]]
name = 'sparc-zeropair #5: keep_five keeps its literal'
count = 1
literal = 'return 5;'

[[match]]
name = 'sparc-zeropair #6: the 64-bit returns keep their width'
count = 4
regex = '(unsigned long long|int8) (ll_const|ull_arg|ll_mul)(_O0)?\('
