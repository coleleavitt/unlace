# Independent assembly regression.
# Stage: P5 target data organization.
# Strict correctness fix; no option. Every assertion checks the corrected behavior.
# .text
# .global double_field
# .type double_field,@function
# double_field:
#  save %sp, -112, %sp
#  ldd [%i1], %f2
#  std %f2, [%i0+16]
#  ret
#  restore
# .size double_field, .-double_field
# .global eighth_double
# .type eighth_double,@function
# eighth_double:
#  save %sp, -96, %sp
#  ld [%fp+92], %i0
#  st %i0, [%fp-4]
#  ld [%fp-4], %f0
#  ldd [%fp+96], %f2
#  fitod %f0, %f0
#  faddd %f0, %f2, %f0
#  ret
#  restore
# .size eighth_double, .-eighth_double
# Stack argument words keep their slots: the eighth argument, a double after
# seven ints, is the two words at %fp+96, not realigned to %fp+100.

[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'double_field' },
    { space = 'ram', offset = '0x10100', name = 'eighth_double' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '9de3bf90c51e4000c53e201081c7e00881e80000'

[[image.bytes]]
space = 'ram'
offset = '0x10100'
readonly = true
hex = '9de3bfa0f007a05cf027bffcc107bffcc51fa06081a0190081a0084281c7e00881e80000'

[script]
commands = [
    'parse line typedef struct Record { short a; short b; short c; short d; short e; double value; } Record;',
    'parse line extern void double_field(Record *output, double *input);',
    'parse line extern double eighth_double(int a,int b,int c,int d,int e,int f,int g,double x);',
    'lo fu double_field',
    'decompile',
    'print C',
    'lo fu eighth_double',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'double is stored in its declared field'
count = 1
literal = 'output->value = *input;'

[[match]]
name = 'no shifted field store'
count = 0
literal = '&output->value + 4'

[[match]]
name = 'stack double after seven ints is read whole'
count = 1
literal = 'return (float8)g + x;'

[[match]]
name = 'stack double is not split across a realigned slot'
count = 0
literal = 'CONCAT44'
