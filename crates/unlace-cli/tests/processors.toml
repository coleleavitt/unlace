base = "0x0"
image = "x86_64_cmpccxadd"

[[family.function]]
test = "x86_cmpexadd_is_a_conditional_add"
address = "0x0"
expect = [
    "if (v1 == a1)",       # the compare of the old value with the reg operand
    "*a0 = v1 + a2;",      # the add happens only when the condition holds
    "return v1;",          # the reg operand gets the old memory value
]

[[family.function]]
test = "x86_enqcmd_status_is_zf"
address = "0x10"
expect = ["return enqcmd(a0,*a1);"]

