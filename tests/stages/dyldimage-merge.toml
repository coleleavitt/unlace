# Kuna: P1 environment binding, option dyldimage with several images
# (`A+B`). The script loads the committed synthetic dyld shared cache
# (crates/unlace-analysis/tests/fixtures/dyld_cache_arm64e.py):
# libcaller calls libcallee's callee_add through a __TEXT_STUBS island.
#
# Pass 1 (`option dyldimage /usr/lib/libcaller.dylib`) is the gap: only
# libcaller is loaded. caller_entry decompiles, but callee_add at
# 0x180002800 is "not mapped in this input", and a script command naming it
# aborts the script, so pass 1 cannot print it. Pass 2
# (`libcaller+libcallee`) rebuilds both images into one program: callee_add
# decompiles at its cache address (asserts #1-#2, each matched once in the
# whole script). caller_entry reads the same in both passes: its island call
# stays named (assert #3) and libcaller's local symbols are still read from
# the .symbols file (assert #4). exporttrie is off, as in dyldcrossrefs (with it
# on the island call reads callee_entry); before, the test passed only after a
# file that had turned exporttrie off in the same process.

[image]
arch = 'AARCH64:LE:64:v8A'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'option exporttrie off',
    'option dyldimage /usr/lib/libcaller.dylib',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dyld_cache_arm64e/dyld_shared_cache_arm64e',
    'read symbols',
    'load function caller_entry',
    'decompile',
    'print C',
    'option dyldimage libcaller+libcallee',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dyld_cache_arm64e/dyld_shared_cache_arm64e',
    'read symbols',
    'load function _callee_add',
    'decompile',
    'print C',
    'load function caller_entry',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'dyldimage merge #1: A+B loads the callee as a function of the same program'
count = 1
literal = 'int4 _callee_add(int4 a0,int4 a1)'

[[match]]
name = "dyldimage merge #2: the callee's body decompiles from the second image's bytes"
count = 1
literal = 'return a0 + a1;'

[[match]]
name = 'dyldimage merge #3: the caller names its island call in both passes'
count = 2
literal = 'v1 = callee_add();'

[[match]]
name = "dyldimage merge #4: the caller's local symbols are read in both passes"
count = 2
literal = '_helper_local();'
