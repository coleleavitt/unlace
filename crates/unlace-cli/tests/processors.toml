[[family]]
name = "meta_fpu"
language = "META:LE:32:default"
base = "0x0"
image = "meta_fpu"

[[family.function]]
test = "meta_fpu_arithmetic_decompiles"
address = "0x0"
expect = [
    "float sub_0(float a0,float a1)",
    "return (a0 + a1) * a0;",
]

[[family.function]]
test = "meta_fpu_conversion_compare_decompiles"
address = "0x18"
expect = [
    "v1 = (float)a0;",
    "if (v1 < 0.0f)",
    "v1 = -v1;",
]

