# Synthetic generic PPC64: ldx r9,r3,r4; ldarx r3,r9,r5; blr.
# P2 instruction decoding, correctness repair without an option. ldx is
# extended opcode 21 and ldarx is 84; both are doubleword loads, so the
# return is a two-level load rather than a bad-instruction halt.
# atomic_increment: ldarx r9,0,r3; addi r9,r9,1; stdcx. r9,0,r3; bne- retry;
# blr. stdcx. stores only while the reservation is set, so ldarx must set it;
# otherwise the store and the loop exit depend on an uninitialized reserve
# flag. The ISA languages already give this output.

[image]
arch = 'PowerPC:BE:64:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'ldx_then_ldarx' },
    { space = 'ram', offset = '0x1000c', name = 'atomic_increment' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
hex = '7d23202a7c6928a84e8000207d2018a8392900017d2019ad4082fff44e800020'

[script]
commands = [
    'load function ldx_then_ldarx',
    'decompile',
    'print C',
    'load function atomic_increment',
    'decompile',
    'print C',
]

[[match]]
name = 'PPC64 ldarx #1: no bad instruction'
count = 0
literal = 'halt_baddata'

[[match]]
name = 'PPC64 ldarx #2: both doubleword loads reach the return'
count = 1
literal = 'return *(unsigned long *)(*(int8 *)(a0 + a1) + a2);'

[[match]]
name = 'PPC64 ldarx #3: the reservation is set, not read uninitialized'
count = 0
literal = 'reserve'

[[match]]
name = 'PPC64 ldarx #4: the conditional store runs once without a loop'
count = 1
regex = '^  \*a0 = storeDoubleWordConditionalIndexed\(\*a0 \+ 1,0,a0\);'
