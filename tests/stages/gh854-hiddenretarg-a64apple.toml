[script]
commands = [
    'lo fu f',
    'decompile',
    'print C',
    'lo fu g',
    'decompile',
    'print C',
    'lo fu use',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "hiddenretarg-apple #1: a constant left in x8 is never foo's first argument"
count = 0
literal = 'foo(0x38,3);'

[[match]]
name = 'hiddenretarg-apple #2: x8 is dropped at the call to the leaf foo'
count = 1
literal = 'foo(3);'

[[match]]
name = 'hiddenretarg-apple #3: the syscall number is never passed to a callee whose body proves nothing'
count = 0
literal = 'lib(0x38)'

[[match]]
name = 'hiddenretarg-apple #4: the null-page constant is dropped from the call to lib'
count = 1
regex = 'lib\((a0)?\)'

[[match]]
name = 'hiddenretarg-apple #5: a callee that stores through x8 keeps its result buffer'
count = 1
regex = 'mk\([a-z][a-z0-9]*,7\);'
