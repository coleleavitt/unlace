[script]
commands = [
    'lo fu jt871',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'JT871 #1: the switch on the struct field read after the call stands'
count = 1
regex = 'switch\('

[[match]]
name = 'JT871 #2: no single-destination switch is removed'
count = 0
literal = 'destination removed'

[[match]]
name = 'JT871 #3: every case body survives (g3 = 4 is reached only through the table)'
count = 1
literal = '= 4;'
