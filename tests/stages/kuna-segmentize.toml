[script]
commands = [
    'lo fu addtwo',
    'decompile',
    'print C',
    'lo fu video',
    'decompile',
    'print C',
    'lo fu farsum',
    'decompile',
    'print C',
    'lo fu pick',
    'decompile',
    'print C',
    'lo fu farlong',
    'decompile',
    'print C',
    'lo fu pickfar',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'segmentize #1: no RET is a bare segment() statement'
count = 0
regex = '^  segment\(v\d+,\*\(unsigned short \*\)segment\(v\d+,&Stack0000\)\);$'

[[match]]
name = 'segmentize #2: the video store never goes through segment(0xb800,0x10)'
count = 0
regex = '^  \*\(unsigned short \*\)segment\(0xb800,0x10\) = 0x741;$'

[[match]]
name = 'segmentize #3: the stack is seen through the segment op, so the frame parameters are recovered'
count = 1
regex = '^int2 addtwo\(int2 a0,int2 a1\)$'

[[match]]
name = 'segmentize #4: the jump table is never a call through segment()'
count = 0
regex = 'segment\(0,\*\(unsigned short \*\)segment\(0,v\d+ \* 2 \+ 0x42\)\); // jump-as-call$'

[[match]]
name = 'segmentize #5: the near-pointer arithmetic prints alone'
count = 1
regex = '^  return a0 \+ a1;$'

[[match]]
name = 'segmentize #6: a constant segment and offset fold through the snippet to the linear address'
count = 1
regex = '^  dat_b8010 = 0x741;$'

[[match]]
name = 'segmentize #7: LES reads one far pointer, the parameter both halves came from'
count = 1
regex = '^int2 farsum\(int2 \*a0\)$'

[[match]]
name = 'segmentize #8: the far pointer is dereferenced directly'
count = 1
regex = '^  return \*a0 \+ \(\(int2 \*\)a0\)\[1\];$'

[[match]]
name = 'segmentize #9: the cs-relative jump table is emulated through the snippet and recovered'
count = 1
regex = '^  switch\(a0\) '

[[match]]
name = 'segmentize #10: a long read out of global memory is returned whole in DX:AX'
count = 1
regex = '^  return CONCAT22\(dat_82,dat_80\);$'

[[match]]
name = 'segmentize #11: a cs-relative table read from the wrong segment, whose words leave the image, is not followed'
count = 1
regex = '^    v\d+ = \(code \*\)\*\(unsigned short \*\)\(\w+ \* 2 \+ 0x42\); // jump-as-call$'

[[match]]
name = "segmentize #12: no flow reaches the table's out-of-image targets"
count = 0
literal = 'unmapped memory'
