[script]
commands = [
    'set context TMode 1 [ram,0x10008c] [ram,0x1000a7]',
    'set context TMode 1 [ram,0x1000d8] [ram,0x1000e7]',
    'lo fu pick',
    'decompile',
    'print C',
    'lo fu pair',
    'decompile',
    'print C',
    'lo fu popr',
    'decompile',
    'print C',
    'lo fu differ',
    'decompile',
    'print C',
    'lo fu stores',
    'decompile',
    'print C',
    'lo fu compl',
    'decompile',
    'print C',
    'lo fu tpick',
    'decompile',
    'print C',
    'lo fu spin',
    'decompile',
    'print C',
    'lo fu nrexit',
    'decompile',
    'print C',
    'lo fu tnrexit',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'condexeretuse #1: pick pair popr and tpick never lose their return value'
count = 0
regex = 'void (pick|pair|popr|tpick)\('

[[match]]
name = 'condexeretuse #2: pick pair and tpick return 7 on the path that writes it'
count = 3
literal = 'return 7;'

[[match]]
name = 'condexeretuse #3: pair returns both halves'
count = 1
literal = 'unsigned long long pair('

[[match]]
name = 'condexeretuse #4: popr returns 3 through popeq'
count = 1
literal = 'return 3;'

[[match]]
name = 'condexeretuse #5: the tail calls return their result'
count = 4
regex = 'return getvt?\('

[[match]]
name = 'condexeretuse #6: a possible call path keeps differ void'
count = 1
literal = 'void differ('

[[match]]
name = 'condexeretuse #7: a store on the returning path keeps stores void'
count = 1
literal = 'void stores('

[[match]]
name = 'condexeretuse #8: a 7 that only reaches the call keeps compl void'
count = 1
literal = 'void compl('

[[match]]
name = 'condexeretuse #9: a 7 forced into a spin loop keeps spin void'
count = 1
literal = 'void spin('

[[match]]
name = 'condexeretuse #10: a 7 passed to a call that does not return keeps nrexit and tnrexit void'
count = 2
regex = 'void t?nrexit\('
