# Swift standard-library C entry points.
#
# Issue: the standard library's own C entry points (`_swift_stdlib_*`)
# carried no signature, so a caller's live floating-point registers became
# the first arguments of `_swift_stdlib_reportUnimplementedInitializer`
# (`(x, y, width, height, "Frame", 5, "init(frame:)", 0xc, 0)`) and the
# version triple `_swift_stdlib_operatingSystemVersion` returns through
# `x8` read as an untyped stack array.
#
# Stage / sub-stage: P1 external-refinement, `SwiftRuntimePass`
# (`unlace-analysis/src/analyzers/swift/unlace_swiftruntime.rs`). No option: the
# signatures are the shims headers' (`AssertionReporting.h`,
# `FoundationShims.h`), like the rest of the table.
#
# The fixture `swift_stdlib_macho` (arm64 Mach-O, assembled from
# `swift_stdlib_macho.s` against the iOS 16.5 libswiftCore) reports an
# unimplemented initializer from `report_rect`, whose declared rectangle
# rides in `d0`..`d3` and is otherwise unused, and reads the major version
# off the triple in `os_major`. `try_value` is a `try!` that fails into
# `swift_unexpectedError` (`SWIFT_NORETURN` in `swift/Runtime/Error.h`),
# with a `return 7` after the call that is never reached; `free_box_scaled`
# deallocates a box with a double live across `swift_deallocBox`.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/swift_stdlib_macho',
    'read symbols',
    'parse line extern void _report_rect(float8 x,float8 y,float8 width,float8 height);',
    'load addr 0x100004054',
    'decompile',
    'print C',
    'load addr 0x100004080',
    'decompile',
    'print C',
    'load addr 0x1000040b0',
    'decompile',
    'print C',
    'load addr 0x1000040e8',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'the report takes the two names, their lengths and the flags'
count = 1
literal = '_swift_stdlib_reportUnimplementedInitializer("Frame",5,"init(frame:)",0xc,0);'

[[match]]
name = 'the version triple is the struct'
count = 1
literal = 'swift.NSOperatingSystemVersion v1;'

[[match]]
name = 'the major version is its first field'
count = 1
literal = 'return v1.majorVersion;'

[[match]]
name = 'the failed try! does not return'
count = 1
literal = 'swift_unexpectedError(a0,"Lib.swift",9,1,0x2a); // no-return'

[[match]]
name = 'nothing after swift_unexpectedError is reached'
count = 0
literal = 'return 7;'

[[match]]
name = 'the box is the one argument'
count = 1
literal = 'swift_deallocBox(a1);'
