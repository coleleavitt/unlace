# Objective-C methods that pass or return an aggregate by value.
#
# Issue: a method whose type encoding spells a union (`(Word=qf)`) or a
# struct with no name (`{?=ii}`) by value decoded that argument to void, so
# the method lost its whole prototype: `long -[Shape word:](void *a0,
# unsigned long a1, long a2)` reading `((long *)a0)[0x12]`, with no `self`.
# A struct with bit-fields (`{Flags=b3b5S}`) was laid out with one 4-byte
# word per bit-field, 12 bytes for a 4-byte struct, so the model placed it in
# two registers.
#
# Fix: `encoding.rs (struct_type)` builds the struct or union the encoding
# spells with the C layout of its members (natural alignment, a run of
# bit-fields as the bytes it packs into, union members at offset zero), names
# an unnamed one from its member codes, and the calling convention's own
# rules place it: a homogeneous floating-point aggregate in d0..d3, up to 16
# bytes in x registers, anything larger by pointer, and a return past 16
# bytes through x8.
#
# One pass, the fixed output.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_objc_structabi_arm64',
    'read symbols',
    'load addr 0x100000640',
    'decompile',
    'print C',
    'load addr 0x100000658',
    'decompile',
    'print C',
    'load addr 0x100000664',
    'decompile',
    'print C',
    'load addr 0x100000670',
    'decompile',
    'print C',
    'load addr 0x100000680',
    'decompile',
    'print C',
    'load addr 0x100000690',
    'decompile',
    'print C',
    'load addr 0x1000006a4',
    'decompile',
    'print C',
    'load addr 0x1000006d0',
    'decompile',
    'print C',
    'load addr 0x1000006f0',
    'decompile',
    'print C',
    'load addr 0x1000006fc',
    'decompile',
    'print C',
    'load addr 0x100000708',
    'decompile',
    'print C',
    'load addr 0x100000714',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'OBJCSTRUCTABI #1: a union argument keeps the prototype'
count = 1
literal = 'int8 -[Shape word:](Shape *self,objc_selector *_cmd,Word arg1)'

[[match]]
name = 'OBJCSTRUCTABI #2: the union is read by member and self by ivar'
count = 1
literal = 'return self->total + arg1.field_0;'

[[match]]
name = 'OBJCSTRUCTABI #3: an unnamed struct is named from its member codes'
count = 1
literal = 'int4 -[Shape span:](Shape *self,objc_selector *_cmd,struct_ii arg1)'

[[match]]
name = 'OBJCSTRUCTABI #4: its two halves are fields of one register'
count = 1
literal = 'return arg1.field_1 - arg1.field_0;'

[[match]]
name = 'OBJCSTRUCTABI #5: a struct of bit-fields is one 4-byte argument'
count = 1
literal = '((uint4)arg1 >> 3 & 0x1f) + ((uint4)arg1 >> 0x10)'

[[match]]
name = 'OBJCSTRUCTABI #6: a CGRect return comes back in d0..d3'
count = 1
literal = 'CGRect -[Shape frame](Shape *self,objc_selector *_cmd)'

[[match]]
name = 'OBJCSTRUCTABI #7: an NSRange return comes back in x0 and x1'
count = 1
literal = '_NSRange -[Shape range](Shape *self,objc_selector *_cmd)'

[[match]]
name = 'OBJCSTRUCTABI #8: an integer argument follows an NSRange'
count = 1
literal = '(self->range).location = arg1.location * arg2;'

[[match]]
name = 'OBJCSTRUCTABI #9: a double follows four doubles of UIEdgeInsets'
count = 1
literal = 'return ((arg1.top + arg1.bottom) * arg2 - arg1.left) - arg1.right;'

[[match]]
name = 'OBJCSTRUCTABI #10: a 48-byte return is written through x8'
count = 1
literal = 'void -[Shape transform](CGAffineTransform *rethidden,Shape *self,objc_selector *_cmd)'

[[match]]
name = 'OBJCSTRUCTABI #11: a 48-byte argument is copied from its pointer'
count = 1
literal = 'builtin_memcpy(&self->xform,&arg1,0x30);'

[[match]]
name = 'OBJCSTRUCTABI #12: an array member is indexed'
count = 1
literal = 'return arg1.weights[arg2 & 3] * (float8)(int8)arg1.tag;'

[[match]]
name = 'OBJCSTRUCTABI #13: a pointer to a struct reads its field'
count = 1
literal = 'return arg1->width;'

[[match]]
name = 'OBJCSTRUCTABI #14: the CGRect argument is copied field by field'
count = 1
literal = '(self->frame).height = arg1.height;'

[[match]]
name = 'OBJCSTRUCTABI #15: both register returns are one whole value'
count = 2
regex = 'return self->(frame|range);'

[[match]]
name = 'OBJCSTRUCTABI #16: no method of the class loses self'
count = 0
literal = '(void *a0'
