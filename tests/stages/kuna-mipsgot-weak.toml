# kuna relocatable-object loader: the GOT entry of an undefined weak symbol
# in a MIPS PIC object. The run-time loader fills that entry with the
# symbol's address, or 0 when nothing defines it, so
# `optional ? optional(x) : (x ^ 0x42)` tests the entry before calling
# through it. The loader stored the symbol's synthetic extern address in the
# entry and reported it foldable with the rest of the GOT, so the test folded
# to true and the function read `return optional();`.
#
# The entry now holds 0, as GNU ld leaves it, and is an import slot outside
# the foldable range; the call through it binds to the slot's name, as an
# Import Address Table call does, instead of calling through the anonymous
# slot.
#
# Stage: P1 program prep (relocatable-object loader); a strict loader fix
# and the import-slot call binding.
#
# Images: tests/fixtures/octeon-relocations/pic-gcc73-n32.o and
# pic-gcc47-64.o (GCC N32 and N64 PIC, pic.c).
#
# Assert #1: both objects keep the test of the weak function's address.
# Assert #2: both call `optional` by name inside that test.
# Assert #3: no object folds the test into an unconditional call.

[image]
arch = 'MIPS:BE:64:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '03e0000800000000'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/pic-gcc73-n32.o',
    'read symbols',
    'map prototype call_optional unsigned int call_optional(unsigned int x);',
    'map prototype optional unsigned int optional(unsigned int x);',
    'lo fu call_optional',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/octeon-relocations/pic-gcc47-64.o',
    'read symbols',
    'map prototype call_optional unsigned int call_optional(unsigned int x);',
    'map prototype optional unsigned int optional(unsigned int x);',
    'lo fu call_optional',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/mips-weak-imports/identity-n32-be-mixed.o',
    'read symbols',
    'map prototype optional unsigned int optional(unsigned int x);',
    'lo fu same',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/mips-weak-imports/identity-64-be-mixed.o',
    'read symbols',
    'map prototype optional unsigned int optional(unsigned int x);',
    'lo fu same',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "mipsgot-weak #1: the weak function's address is tested"
count = 2
regex = 'if \(dat_[0-9a-f]+\)'

[[match]]
name = 'mipsgot-weak #2: the call binds to optional'
count = 2
literal = 'optional(x);'

[[match]]
name = 'mipsgot-weak #3: no unconditional call'
count = 0
literal = 'return optional('

[[match]]
name = 'mipsgot-weak #4: mixed direct and GOT references retain one import name'
count = 2
regex = 'return (dat_[0-9a-f]+ == optional|1|true);'

[[match]]
name = 'mipsgot-weak #5: a declared import is never ambiguous'
count = 0
literal = 'ambiguous'
