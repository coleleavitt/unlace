[script]
commands = [
    'parse line extern uint8 ulen(char *s);',
    'parse line extern void fill(uint8 *p);',
    'option castsign off',
    'lo fu sign_of',
    'decompile',
    'print C',
    'lo fu trim_right',
    'decompile',
    'print C',
    'lo fu halved',
    'decompile',
    'print C',
    'lo fu through_ptr',
    'decompile',
    'print C',
    'option castsign on',
    'lo fu sign_of',
    'decompile',
    'print C',
    'lo fu trim_right',
    'decompile',
    'print C',
    'lo fu halved',
    'decompile',
    'print C',
    'lo fu through_ptr',
    'decompile',
    'print C',
    'lo fu sign_of',
    'map addr s0xfffffffffffffff0 uint8 idx',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'castsign #1: under option castsign off a stack value the body only compares signed casts each comparison back (bug reproduces, once)'
count = 1
regex = '^  if \(\(int8\)v1 <= -2\)$'

[[match]]
name = "castsign #2: and is declared uint8, beside trim_right's and through_ptr's in both passes (bug reproduces, five times)"
count = 5
regex = [
    '^(int8 (sign_of|trim_right)|uint8 through_ptr)\([^\n]+$',
    '^\{$',
    '^  uint8 v1; // ([^\n]+ \| )?stack - 0x10( \| [^\n]+)?$',
]

[[match]]
name = 'castsign #3: option castsign on declares it int8 (fix, once)'
count = 1
regex = '^  int8 v1; // ([^\n]+ \| )?stack - 0x10( \| [^\n]+)?$'

[[match]]
name = 'castsign #4: and the casts the declaration makes no-ops are dropped (fix, once)'
count = 1
regex = '^  if \(0 <= v1\)$'

[[match]]
name = 'castsign #5: an index the body decrements keeps its cast in both passes, since v1 - 1 would overflow as int8 (twice)'
count = 2
literal = "0 <= (int8)v1 && (a0[v1] == ' ')"

[[match]]
name = 'castsign #6: a value shifted right logically stays unsigned in both passes (twice)'
count = 2
regex = '^  return v1 >> 1;$'

[[match]]
name = "castsign #7: halved's and through_ptr's values keep their cast in both passes, as does sign_of's under option castsign off (five times)"
count = 5
literal = '(int8)v1 <= -1)'

[[match]]
name = 'castsign #8: a stack slot whose type is locked keeps uint8 under option castsign on (lock, once)'
count = 1
regex = '^  uint8 idx; // ([^\n]+ \| )?stack - 0x10( \| [^\n]+)?$'

[[match]]
name = 'castsign #9: and keeps the casts its signed comparisons need (lock, once)'
count = 1
regex = '^  if \(0 <= \(int8\)idx\)$'
