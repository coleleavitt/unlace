[script]
commands = [
    'lo fu v2',
    'option spphistack off',
    'decompile',
    'print C',
    'option spphistack on',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'spphistack hexagon #1: off, the walk is named after the stack pointer'
count = 1
literal = 'v3 = *(int4 *)Register00000074;'

[[match]]
name = 'spphistack hexagon #2: only the off pass names the stack pointer storage'
count = 6
literal = 'Register000'

[[match]]
name = 'spphistack hexagon #3: on, the walk starts at a stack reference'
count = 1
literal = 'v3 = (int4 *)(unsigned int)&Stack00000000;'
