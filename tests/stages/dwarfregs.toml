# DWARF register locals, inlined-subroutine locals and parameter storage
# (`option dwarfscopes on|off`), ida95-57.
#
# Stage P1 external-refinement. dwarfregs_x86_64.c built with gcc -O2 -g:
# `hash` keeps `h` in EAX (a location list), and the inlined `mix` keeps its
# `t` and `u` in EDX/EAX inside a DW_TAG_inlined_subroutine.
# dwarfregparm_i386.c built with gcc -m32 -O2 -g: `combine` is
# `regparm(3)`, so DWARF puts `a`, `b`, `c` in EAX, EDX, ECX at entry while
# the default i386 model expects them on the stack.
#
# Pass 1 (`dwarfscopes off`, the bug): register-held locals are anonymous, and
# `combine` reads three uninitialized registers while its caller passes stack
# garbage. Pass 2 (default, the fix): the locals carry their DWARF names and
# `combine` takes its parameters in the registers DWARF states, at the
# definition and at the call.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'option dwarfscopes off',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dwarfregs_gcc_O2_x86_64',
    'read symbols',
    'load function hash',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dwarfregparm_gcc_O2_i386',
    'read symbols',
    'load function combine',
    'decompile',
    'print C',
    'option dwarfscopes on',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dwarfregs_gcc_O2_x86_64',
    'read symbols',
    'load function hash',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/dwarfregparm_gcc_O2_i386',
    'read symbols',
    'load function combine',
    'decompile',
    'print C',
    'load function main',
    'decompile',
    'print C',
]

[[match]]
name = 'DWARFREGS #1: off, the hash accumulator is anonymous'
count = 1
literal = 'int4 v2; // eax | ecx'

[[match]]
name = 'DWARFREGS #2: off, combine reads registers it never names'
count = 1
literal = 'return (v1 * 7 + v3 * 3) - v2;'

[[match]]
name = 'DWARFREGS #3: on, the register local takes its DWARF name'
count = 1
literal = 'int4 h; // eax | ecx'

[[match]]
name = "DWARFREGS #4: on, the inlined mix's locals are named"
count = 1
literal = 'u = t >> 7 ^ t;'

[[match]]
name = 'DWARFREGS #5: on, combine takes its parameters in their DWARF registers'
count = 1
literal = 'return (a * 7 + b * 3) - c;'

[[match]]
name = 'DWARFREGS #6: on, and its caller passes them there'
count = 1
literal = 'combine(argc,argc + 1,'
