# unlace infrastructure test: the stage registry + console capability.
#
# Proves that the unlace-owned IfaceUnlaceCapability self-registers its console
# commands inside the datatest harness (testfunction.cc ConsoleCommands ->
# IfaceCapability::registerAllCommands) with no upstream anchor edit, and
# that the stage registry (kuna_stages.cc) answers queries:
#
#   phase list        - phases + Band B + sub-phase catalog (with LATENT)
#   phase map <name>  - group / surface / sub-phase resolution
#   phase status      - pipeline variant + unlace sub-phase option states
#
# Reuses the GH-558 bytes purely as a loadable function for `stage status`.
# Infrastructure only: nothing here perturbs decompilation output.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'gh558' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '83ff087f06b801000000c331c0c3'

[script]
commands = [
    'parse line extern int4 gh558(int4 x);',
    'lo fu gh558',
    'phase list',
    'phase map analysis',
    'phase map force goto',
    'phase map comparison-canonicalization',
    'phase status',
    'quit',
]

[[match]]
name = 'UNLACE-CONSOLE #1: phase list shows Band B membership'
count = 4
literal = '[Band B]'

[[match]]
name = 'UNLACE-CONSOLE #2: phase list includes the P3 dead-definition gate sub-phase'
count = 1
literal = '[P3] dead-definition-gate'

[[match]]
name = 'UNLACE-CONSOLE #3: LATENT decisions are flagged in the catalog'
min = 5
max = 40
literal = '(LATENT)'

[[match]]
name = 'UNLACE-CONSOLE #4: phase map resolves the analysis rule group to P3'
count = 1
literal = 'group analysis -> P3'

[[match]]
name = 'UNLACE-CONSOLE #5: phase map routes force goto to the P7 edge-virtualization sub-phase'
count = 1
literal = 'surface "force goto" -> P7 (Region Hierarchy) sub-phase edge-virtualization'

[[match]]
name = 'UNLACE-CONSOLE #6: phase map resolves the GH-558 sub-phase'
count = 1
literal = 'sub-phase comparison-canonicalization -> P3'

[[match]]
name = 'UNLACE-CONSOLE #7: phase status reports the active pipeline variant'
count = 1
literal = 'pipeline variant: decompile'

[[match]]
name = 'UNLACE-CONSOLE #8: phase status reports unlace sub-phase option defaults (DIV-2: original)'
count = 1
literal = 'compareform: original'
