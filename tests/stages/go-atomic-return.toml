# Pinned angr G18 atomic-add behavior, P2 instruction provenance and P9 Go output.
# These independent bytes are only decompiled. Exact signed direct returns should
# become one atomic.Add call. The branch, old value, flags, unlocked operation,
# intervening effect, retry, call, HLE, narrow update and exchange remain explicit.
# P0: asserted Go source and typed prototypes; C/Rust output and C source refuse
# goatomicreturn. With C source the image is no longer Go, so option atomics
# (default auto) folds the lock xadd into __sync_fetch_and_add instead.

[image]
arch = 'x86:LE:64:default:golang'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'add32_new' },
    { space = 'ram', offset = '0x100100', name = 'add64_new' },
    { space = 'ram', offset = '0x100200', name = 'dec32_branch' },
    { space = 'ram', offset = '0x100300', name = 'old32_live' },
