[[match]]
name = 'reentereddispatch #1: both passes keep the first store'
count = 16
literal = '*output = seed;'

[[match]]
name = 'reentereddispatch #2: only reentry keeps the second store'
count = 8
literal = 'output[1] = seed;'

[[match]]
name = 'reentereddispatch #3: reentry reaches the third and fourth stores'
count = 4
regex = 'output\[[23]\] = seed;'

[[match]]
name = 'reentereddispatch #4: the caller return is a defined default case'
count = 7
literal = 'default:'

[[match]]
name = 'reentereddispatch #5: no dispatch is left incomplete or undefined'
count = 0
regex = 'more targets|uninitialized|could not be normalized|overlaps decoded'
