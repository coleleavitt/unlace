# Mach-O __unwind_info function starts (`option unwindstarts on|off`).
#
# Issue: a Mach-O whose LC_FUNCTION_STARTS was stripped loses almost its whole
# function inventory. On a 249 MB arm64 third-party iOS app with no
# LC_FUNCTION_STARTS, unlace discovered 23 of the real __text functions; the
# rest of its 59,222 entries were __got slots and __stubs. arm64 has no
# default prologue sweep, so LC_MAIN, the exports, __mod_init_func and the
# symbol table are the only seeds and nothing starts a function between them.
# __TEXT,__unwind_info survives the strip and still records 204,800 starts.
#
# Stage / sub-stage: P1 code-data-partition, the Mach-O entry-discovery
# oracles (`unlace-analysis/src/analyzers/entry/unlace_unwindinfo.rs`), committed
# at `read symbols`.
#
# P0 assertion: `option unwindstarts on|off` (default off). It is set after
# `load file` and before the `read symbols` that commits the discovered
# entries. The default pass runs first with the option never set.
#
# The XML wrapper only supplies the harness architecture. Both passes clear
# it and load the real arm64 Mach-O fixture `macho_unwind_only_arm64` (built
# from `macho_unwind_only_arm64.c`): LC_FUNCTION_STARTS and the local symbols
# are stripped, and four `uw_*` functions with no caller and no symbol are
# recorded only in __unwind_info (each has its own stack size, so the linker
# does not fold their entries).
#
# Pass 1 (the default, the BUG): `functions` lists only `_main`; the four
# unwind-only bodies are absent from the inventory. Pass 2 (`option
# unwindstarts on`, the FIX): the four starts are listed, and one of them
# (uw_delta, a 320-byte buffer fill and sum) decompiles as a function.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_unwind_only_arm64',
    'option unwindstarts off',
    'read symbols',
    'functions',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_unwind_only_arm64',
    'option unwindstarts on',
    'read symbols',
    'functions',
    'load function sub_1000003bc',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'both passes discover the LC_MAIN entry'
count = 2
literal = '0x10000040c _main'

[[match]]
name = 'unwindstarts on: the first unwind-only start joins the inventory (default pass: absent)'
count = 1
literal = '0x1000002e0 sub_1000002e0'

[[match]]
name = 'unwindstarts on: the second unwind-only start joins the inventory (default pass: absent)'
count = 1
literal = '0x100000328 sub_100000328'

[[match]]
name = 'unwindstarts on: the third unwind-only start joins the inventory (default pass: absent)'
count = 1
literal = '0x100000370 sub_100000370'

[[match]]
name = 'unwindstarts on: the fourth unwind-only start joins the inventory (default pass: absent)'
count = 1
literal = '0x1000003bc sub_1000003bc'

[[match]]
name = 'unwindstarts on: a recovered start decompiles as a function'
count = 1
literal = 'int4 sub_1000003bc(char a0)'

[[match]]
name = 'unwindstarts on: the recovered body keeps its 320-byte buffer'
count = 1
literal = 'char v1 [320];'
