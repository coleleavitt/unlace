# - `ppc32picimports-abi.toml`, `ppc32picimports-abi-indirect.toml`, and
# `ppc32picimports-driver.toml` exercise explicit `ppc32picimports abi` recovery, including
# ordinary returning callers and compiler start files.

[image]
arch = 'PowerPC:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '4e800020'

[script]
commands = [
    'option ppc32picimports off',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-driver.so',
    'read symbols',
    'load function refs',
    'decompile',
    'print C',
    'load function check',
    'decompile',
    'print C',
    'option ppc32picimports abi',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-driver.so',
    'read symbols',
    'load function refs',
    'decompile',
    'print C',
    'load function check',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PIC off leaves every driver-linked stub unnamed'
count = 5
regex = '^  sub_5[89bd]0\(\);'

[[match]]
name = "PIC abi names every stub despite the start files' jump through CTR"
count = 5
regex = '^  (other|another|extra|__stack_chk_fail)\(\);'

[[match]]
name = 'the no-return import ends refs only with the option abi'
count = 1
literal = '__stack_chk_fail(); // no-return'

[[match]]
name = "both passes keep check's return"
count = 2
literal = 'return 7;'
