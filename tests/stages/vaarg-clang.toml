# unlace `vaarg` stage test (clang): the x86-64 SysV va_arg read through a va_list
# pointer. With vaarg off the gp_offset/fp_offset compare, the register save
# area read and the overflow read print as raw loads, stores and address
# arithmetic. With vaarg on each function reads one va_arg(a0,T).
#
# Source, compiled with clang -O2, linked at 0x100000 (flat .text):
#   #include <stdarg.h>
#   long pop_long(va_list *ap) { return va_arg(*ap, long); }
#   int pop_int(va_list *ap) { return va_arg(*ap, int); }
#   double pop_dbl(va_list *ap) { return va_arg(*ap, double); }

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'pop_long' },
    { space = 'ram', offset = '0x100030', name = 'pop_int' },
    { space = 'ram', offset = '0x100060', name = 'pop_dbl' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
hex = ''

[script]
commands = [
    'option vaarg off',
    'lo fu pop_long',
    'decompile',
    'print C',
    'lo fu pop_int',
    'decompile',
    'print C',
    'lo fu pop_dbl',
    'decompile',
    'print C',
    'option vaarg on',
    'lo fu pop_long',
    'decompile',
    'print C',
    'lo fu pop_int',
    'decompile',
    'print C',
    'lo fu pop_dbl',
    'decompile',
    'print C',
]

[[match]]
name = 'vaarg off: the register save area offset test prints in both pop_long and pop_int'
count = 2
literal = '0x28)'

[[match]]
name = 'vaarg off: the double offset test prints in pop_dbl'
count = 1
literal = '0xa0)'

[[match]]
name = 'vaarg on: one va_arg read per function'
count = 3
regex = 'va_arg\(a0,(long|int|double)\)'

[[match]]
name = 'vaarg on: no raw register save area read remains'
count = 0
regex = 'reg_save|field_0x10 \+'
