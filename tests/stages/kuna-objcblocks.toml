# Stack blocks: the invoke function named after its creator and typed, the
# captures typed, a `__block` cell typed, the creator's frame typed.
#
# Issue: a block built on a method's frame (`isa = _NSConcreteStackBlock`, the
# invoke and descriptor addresses stored after it) left its invoke function a
# `sub_` with an untyped first argument, so a captured variable read as an
# offset off an unknown pointer, and the creator read as a run of stores to
# numbered locals.
#
# Fix: `analyzers/objc/kuna_objcblocks.rs (stack_blocks)` scans each arm64
# function with a register state (`adrp`/`adr`/`add`/`sub`/`mov`/`movz`/`movk`,
# `ldr` immediate and literal, `str`/`stur`/`stp` of every width to `sp` or a
# frame address): the isa's GOT load stored to the frame, the invoke and
# descriptor 16 and 24 bytes after it, every capture after them, and a
# `__block` cell (`isa = 0, forwarding = &cell, flags|size, value`). The
# invoke is named `<creator>_block_invoke`, typed from the descriptor's
# signature, with `Block_layout_<invoke>` carrying one typed field per
# capture - the copy helper's `_Block_object_assign` flags (3 object, 7
# block, 8 byref) and `objc_retain` calls say which are objects, blocks and
# cells, the creator's store says the width of the rest - and
# `Block_byref_<size>_<width>` for a cell. The creator gets `block` and
# `cell_<k>` as typed locals.
#
# Pass 1 (`objc off`): `sub_100000930`. Pass 2 (`objc on`):
# `-[Runner tally:scale:]_block_invoke(Block_layout_100000930 *block,long arg1)`
# reading `block->capture_0` (self, objc_object *), `block->capture_1->forwarding->value`
# (the `__block long total`), `capture_2` (double s), `capture_3` (int step);
# the creator stores `block.block.invoke`, `block.capture_1 = &cell_1`,
# `cell_1.forwarding = block.capture_1`.

[image]
arch = 'AARCH64:LE:64:v8A:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_objc_blocks_arm64',
    'option objc off',
    'read symbols',
    'load addr 0x100000930',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_objc_blocks_arm64',
    'option objc on',
    'read symbols',
    'load addr 0x100000930',
    'decompile',
    'print C',
    'load addr 0x100000864',
    'decompile',
    'print C',
    'load addr 0x100000878',
    'decompile',
    'print C',
    'load addr 0x100000804',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'OBJCBLOCKS #1: objc off, the invoke is an anonymous function'
count = 1
literal = 'sub_100000930('

[[match]]
name = 'OBJCBLOCKS #2: the invoke is named after its creator and typed from the descriptor'
count = 1
literal = '-[Runner tally:scale:]_block_invoke(Block_layout_100000930 *block,int8 arg1)'

[[match]]
name = 'OBJCBLOCKS #3: the captured object is sent a message'
count = 1
literal = 'objc_msgSend(block->capture_0,sel_base)'

[[match]]
name = 'OBJCBLOCKS #4: the __block cell is read through its forwarding pointer'
count = 1
literal = 'return block->capture_1->forwarding->value;'

[[match]]
name = 'OBJCBLOCKS #5: the cell is typed Block_byref_32_8 in the invoke'
count = 1
literal = 'Block_byref_32_8 *v3; // x8'

[[match]]
name = 'OBJCBLOCKS #6: the double and int captures'
count = 1
literal = 'v4 = block->capture_2;'

[[match]]
name = 'OBJCBLOCKS #7: the plain capture of the first block is a word'
count = 1
literal = 'return block->capture_0 * arg1;'

[[match]]
name = "OBJCBLOCKS #8: the creator's literal is a typed local (two creators)"
count = 2
literal = 'block.block.invoke = -[Runner '

[[match]]
name = "OBJCBLOCKS #9: the creator stores the cell's address and the cell forwards to itself"
count = 1
literal = 'cell_1.forwarding = block.capture_1;'

[[match]]
name = "OBJCBLOCKS #10: the creator reads the cell's value after the send"
count = 1
literal = 'v2 = (cell_1.forwarding)->value;'
