[script]
commands = [
    'parse line extern int puts(char *s);',
    'lo fu caller',
    'decompile',
    'print C',
    'lo fu caller2',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'calleefilledarg-ctramp #1: the trampoline that fills rsi takes only the quotient'
count = 1
literal = 'tramp((a0 - a1) / 3);'

[[match]]
name = 'calleefilledarg-ctramp #2: the trampoline that fills rdi and rsi takes nothing'
count = 1
literal = 'tramp2();'

[[match]]
name = 'calleefilledarg-ctramp #3: no idiv remainder reaches a call'
count = 0
literal = '%'
