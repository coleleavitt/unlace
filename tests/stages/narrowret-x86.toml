[script]
commands = [
    'map function r0x1000 next_byte',
    'map function r0x1010 scaled',
    'map function r0x1020 above',
    'map function r0x1030 signed_byte',
    'map function r0x1040 whole',
    'map function r0x1050 mix',
    'map function r0x1060 larger_byte',
    'map function r0x10a0 halfword_pair',
    'map function r0x10e0 count_above',
    'map function r0x1120 keeps_sign',
    'map function r0x1160 keeps_width',
    'map function r0x11a0 returns_word',
    'lo fu next_byte',
    'decompile',
    'print C',
    'lo fu whole',
    'decompile',
    'print C',
    'lo fu larger_byte',
    'decompile',
    'print C',
    'lo fu returns_word',
    'decompile',
    'print C',
    'option narrowret off',
    'lo fu next_byte',
    'decompile',
    'print C',
    'lo fu whole',
    'decompile',
    'print C',
    'lo fu larger_byte',
    'decompile',
    'print C',
    'lo fu returns_word',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'NARROWRET-X86 #1: a callee whose word write clears rax returns int in both passes'
count = 2
literal = 'int4 whole(int4 a0)'

[[match]]
name = 'NARROWRET-X86 #2: with nothing stated the caller keeps rax whole'
count = 2
literal = 'uint8 v1; // rax'

[[match]]
name = 'NARROWRET-X86 #3: a byte the callee never extends is read as al'
count = 2
literal = 'uint1 v1; // al | bl'
