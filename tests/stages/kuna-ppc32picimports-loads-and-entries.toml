[image]
arch = 'PowerPC:BE:32:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '4e800020'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-literal-halfword.elf',
    'read symbols',
    'option ppc32picimports on',
    'load function check2',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-store-word-halfword.elf',
    'read symbols',
    'option ppc32picimports on',
    'load function check2',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-stub-interior.elf',
    'option voidtailreturn off',
    'read symbols',
    'option ppc32picimports on',
    'load function 0x1004',
    'decompile',
    'print C',
    'load function check2',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/ppc32-pic-unaligned-exec.elf',
    'read symbols',
    'option ppc32picimports on',
    'load function check2',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'narrow loads and bypassed or unaligned entries retain returns'
count = 4
literal = 'return 7;'

[[match]]
name = 'stub bypass retains returning tail caller'
count = 1
literal = 'return;'

[[match]]
name = 'partial pointer loads and stub bypasses acquire no terminal contract'
count = 0
regex = '__stack_chk_fail|no-return'
