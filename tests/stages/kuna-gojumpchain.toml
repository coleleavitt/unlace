[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'forwarded' },
    { space = 'ram', offset = '0x100040', name = 'write_forwarder' },
    { space = 'ram', offset = '0x100080', name = 'cycle' },
    { space = 'ram', offset = '0x101000', name = 'runtime.gcWriteBarrier2' },
    { space = 'ram', offset = '0x101001', name = 'runtime.helper' },
    { space = 'ram', offset = '0x300000', name = 'marker' },
]

