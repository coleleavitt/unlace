# GH-1034, P3 call guards, option persistcalls. churn reads, then
# writes, each of 256 writable globals, with a call after every write and
# one more inside a branch every eighth step: 288 calls. small touches two
# globals across three calls. Pass 1 is upstream placement (option off):
# every global is guarded at every call, and the guards survive dead-code
# removal, so churn's live IR holds 83690 ops. Pass 2 is the default:
# churn's pass guards 319 RAM ranges at 288 calls (91,872 guards), past the
# 65,536-guard threshold, so each global keeps only the guards next to its
# accesses (the call before its read, the call after its write, the last
# call before a return or before a join that needs the value after it),
# 1053 of its 73,728, and the live IR drops to 3110 ops; the skipped
# guards and joins keep their op numbers, so every pass creates 94726. small, far below the threshold,
# keeps every guard. Pass 3 is persistcalls on: small loses one guard that
# only hands a value to the next (16 ops to 15). Each function prints the
# same body in every pass. Two
# more passes count churn's ops only: at persistcalls 91873, one guard more
# than churn's pass, it keeps them; at 91872 it drops them. The fixture's
# source, provenance and native oracle are beside it. The second fixture
# holds two functions whose C the sparse guards once changed, decompiled
# with the option off and on: revisit reads u0.s[0] on both sides of a call
# before a later pass widens u0 to four bytes (it printed return 1), and
# loopstore stores a value computed before a loop of calls after the loop
# (the store moved in front of the loop). snip and snipsys join sg after
# two calls, then call f2 and f1 (with a system call between them in
# snipsys) on one branch: merging copies the joined value back to sg in
# front of that branch's first guard, so a guard reading the value from
# before an unguarded f2 printed the copy after f2, undoing it.

[image]
arch = 'x86:LE:64:default:gcc'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/persistcalls_x86_64',
    'read symbols',
    'option persistcalls off',
    'load function churn',
    'decompile',
    'print C',
    'count pcode',
    'load function small',
    'decompile',
    'print C',
    'count pcode',
    'option persistcalls 65536',
    'load function churn',
    'decompile',
    'print C',
    'count pcode',
    'load function small',
    'decompile',
    'print C',
    'count pcode',
    'option persistcalls on',
    'load function churn',
    'decompile',
    'print C',
    'count pcode',
    'load function small',
    'decompile',
    'print C',
    'count pcode',
    'option persistcalls 91873',
    'load function churn',
    'decompile',
    'count pcode',
    'option persistcalls 91872',
    'load function churn',
    'decompile',
    'count pcode',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/persistcalls_sem_x86_64',
    'option partialaccess off',
    'read symbols',
    'option x64syscall off',
    'option persistcalls off',
    'load function revisit',
    'decompile',
    'print C',
    'load function loopstore',
    'decompile',
    'print C',
    'load function snip',
    'decompile',
    'print C',
    'load function snipsys',
    'decompile',
    'print C',
    'option persistcalls on',
    'load function revisit',
    'decompile',
    'print C',
    'load function loopstore',
    'decompile',
    'print C',
    'load function snip',
    'decompile',
    'print C',
    'load function snipsys',
    'decompile',
    'print C',
]

[[match]]
name = 'persistcalls #1: all three passes print churn'
count = 3
regex = '^uint8 churn\(uint8 a0\)$'

[[match]]
name = "persistcalls #2: all three passes keep churn's 288 calls and small's 3"
count = 873
literal = 'sink('

[[match]]
name = "persistcalls #3: all three passes keep churn's 256 global writes"
count = 768
regex = '^  g[0-9]+ = g[0-9]+ \* 5 \+ '

[[match]]
name = 'persistcalls #4: all three passes read each global back after the calls before it'
count = 768
regex = '^  v[0-9]+ = g[0-9]+;$'

[[match]]
name = 'persistcalls #5: all three passes print small the same'
count = 3
regex = '^  return sink\(v1\) \+ h0;$'

[[match]]
name = "persistcalls #6: upstream placement keeps every guard in churn's live IR"
count = 2
literal = 'Count - pcode = 83690'

[[match]]
name = "persistcalls #7: every pass numbers churn's ops as upstream placement does"
count = 5
literal = 'Count - created = 94726'

[[match]]
name = 'persistcalls #8: past the threshold churn keeps the guards next to its accesses'
count = 3
literal = 'Count - pcode = 3110'

[[match]]
name = 'persistcalls #9: small keeps every guard below the threshold'
count = 2
literal = 'Count - pcode = 16'

[[match]]
name = "persistcalls #10: persistcalls on drops the guard of small's that only passes a value on"
count = 1
literal = 'Count - pcode = 15'

[[match]]
name = 'persistcalls #11: revisit reads u0 again after the call with the option off and on'
count = 2
regex = '^  v2 = \(int2\)u0;$'

[[match]]
name = 'persistcalls #12: revisit compares the two reads with the option off and on'
count = 2
regex = '^  return v1 == v2;$'

[[match]]
name = 'persistcalls #13: loopstore stores after the loop with the option off and on'
count = 2
regex = '^  arr\._8_4_ = v1;$'

[[match]]
name = "persistcalls #14: loopstore keeps the call's value in a variable"
count = 2
regex = '^  v1 = fi\(arr\._8_4_\);$'

[[match]]
name = "persistcalls #15: snip writes sg back in front of the branch's first call with the option off and on"
count = 2
regex = [
    '^    sg = v1;$',
    '^    f2\(\);$',
    '^    f1\(\); // tail-call$',
]

[[match]]
name = 'persistcalls #16: snipsys writes sg back in front of the call before the system call with the option off and on'
count = 2
regex = [
    '^    sg = v1;$',
    '^    f2\(\);$',
    '^    syscall\(\);$',
]

[[match]]
name = 'persistcalls #17: no pass writes sg back after a call that changed it'
count = 0
regex = [
    '^    f2\(\);$',
    '^    sg = v1;$',
]
