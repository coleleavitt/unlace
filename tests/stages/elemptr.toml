# Cast campaign, lever `elemptr`: a pointer the program uses only as an array
# of one element type is declared as a pointer to that element.
#
# A table lookup `t[i]` lowers to INT_ADD(t, i) feeding a LOAD, and
# TypeOpIntAdd votes an integer for both operands and will not carry the
# element's pointer back over the add (typeop.cc:1217), so a textbook base64
# decoder reads, with the option off,
#
#     void * w_decode(int8 a0,uint8 a1,uint8 *a2)
#     ((char *)dat_300053e0)[*(uint1 *)(v2 + 0x30005080L)] = (char)v2;
#
# its input `long`, its output buffer `void *`, the table it allocated and
# keeps in a global an integer behind a cast, and the constant alphabet in
# .data an address behind another.
#
# Stage / sub-stage: P5 "type-propagation". The P0 assertion
# `option elemptr on|off` decides whether a pointer-width value whose every
# access is one element width through an index the program computes gets a
# `T *` vote in the getLocalType fold.
#
# The fixture is crates/unlace-analysis/tests/fixtures/elemptr_x86_64.c
# built by gcc -O0 non-PIE at 0x30000000 with its data symbols dropped:
#
#     w_decode: the witness - input, output buffer and global table indexed
#     w_build:  fills the global table through an index read from the .data
#               alphabet, a constant indexed by a computed value
#     w_sidx:   a byte array whose signed elements index an int array
#     w_table:  a .data table of ints read with a computed index
#     w_record: a control - `p[2 * i] * p[2 * i + 1]` walks 16-byte records,
#               so no element width is claimed
#     w_mixed:  a control - `p[i] + *(int *)(p + 4)` reads one pointer at
#               two widths, a record and not an array
#     w_wu:     returns an element of an `unsigned short` .data table that
#               nothing else reads: the element is unsigned (its callers
#               widen it), never a signed default
#     w_put:    a control - copies into a buffer bounded by a length it
#               also compares a pointer difference against: `buf + len`
#               has the buffer as its base, so the length stays a number
#     w_ctr:    stores an `int` counter into an `unsigned` table: the
#               counter keeps its own sign, so its compares need no cast
#     w_hdr:    reads a 2-byte field at +4 through a pointer its callee
#               `w_sum4` (declared here `int8 w_sum4(uint4 *p, int8 n)`)
#               reads as `uint4 *`.  Upstream's RuleExpandLoad widened the
#               load to the 4-byte element and truncated it,
#               `(uint2)a0[1]`, reading two bytes the program never reads;
#               unlace never takes that form (narrowload.xml), so the
#               load is 2 bytes wide in both passes
#     w_gpbump: steps a global `int *` by 4 bytes (`gp++`), and
#     w_tfirst: reads the first element of a `.data` table by name: both
#               print that integer form in both passes.  A batch
#               (`decompile-all`, `decompile-project`) never lets another
#               function type the global or name the table an array, since
#               the one declaration would rescale this byte step or make
#               this scalar the array; one function at a time has no batch,
#               and the compiled round trip in decompile_all_cli.rs checks
#               the batch.  Several functions decompiled with no batch to
#               agree (a jobs-pool worker, a streamed export, a run that does
#               not take the callee-first order) type no global or table
#     w_nexttab: coreutils expand's get_next_tab_column - loads an element
#               of a global table through an address computed in the rax it
#               returns that element in; typed, the address and the
#               returned element merged into one variable and the function
#               was declared to return `uint8 *`.  It returns `uint8` in
#               both passes
#     w_pick:   merges its parameter with a 15-byte .rodata table that
#               holds a zero byte, then hashes `n` bytes through the merged
#               pointer: with the option on the parameter is `char *` and
#               the table stays its address, `&dat_30003020`, never the
#               string literal "0!0\t\x06..." that would end at that zero
#               byte while the reader takes all fifteen.  A caller passing
#               the table to a callee whose parameter the option typed is
#               the same shape across two functions, which only a batch
#               sees; tests/cli and the compiled round trip in
#               decompile_all_cli.rs cover it
#
# Pass 1 (`option elemptr off`) reproduces the casts and pass 2 (`on`) is the
# fix. The two controls are identical in both passes.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elemptr_gcc_O0_x86_64',
    'option elemptr off',
    'option iteexpr on',
    'option castternary on',
    'read symbols',
    'lo fu w_decode',
    'decompile',
    'print C',
    'lo fu w_build',
    'decompile',
    'print C',
    'lo fu w_sidx',
    'decompile',
    'print C',
    'lo fu w_table',
    'decompile',
    'print C',
    'lo fu w_record',
    'decompile',
    'print C',
    'lo fu w_mixed',
    'decompile',
    'print C',
    'lo fu w_wu',
    'decompile',
    'print C',
    'lo fu w_put',
    'decompile',
    'print C',
    'lo fu w_ctr',
    'decompile',
    'print C',
    'parse line extern int8 w_sum4(uint4 *p, int8 n);',
    'lo fu w_hdr',
    'decompile',
    'print C',
    'lo fu w_gpbump',
    'decompile',
    'print C',
    'lo fu w_tfirst',
    'decompile',
    'print C',
    'lo fu w_nexttab',
    'decompile',
    'print C',
    'lo fu w_pick',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/elemptr_gcc_O0_x86_64',
    'option libcnames off',
    'option elemptr on',
    'option iteexpr on',
    'option castternary on',
    'read symbols',
    'lo fu w_decode',
    'decompile',
    'print C',
    'lo fu w_build',
    'decompile',
    'print C',
    'lo fu w_sidx',
    'decompile',
    'print C',
    'lo fu w_table',
    'decompile',
    'print C',
    'lo fu w_record',
    'decompile',
    'print C',
    'lo fu w_mixed',
    'decompile',
    'print C',
    'lo fu w_wu',
    'decompile',
    'print C',
    'lo fu w_put',
    'decompile',
    'print C',
    'lo fu w_ctr',
    'decompile',
    'print C',
    'parse line extern int8 w_sum4(uint4 *p, int8 n);',
    'lo fu w_hdr',
    'decompile',
    'print C',
    'lo fu w_gpbump',
    'decompile',
    'print C',
    'lo fu w_tfirst',
    'decompile',
    'print C',
    'lo fu w_nexttab',
    'decompile',
    'print C',
    'lo fu w_pick',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "elemptr #1: with the option off the decoder's input is an integer and its buffer void * - the bug"
count = 1
literal = 'void * w_decode(int8 a0,uint8 a1,uint8 *a2)'

[[match]]
name = 'elemptr #2: with the option off the table build casts the global table and reads the .data alphabet through an integer sum'
count = 1
literal = '((char *)dat_300053e0)[*(uint1 *)(v2 + 0x30005080L)] = v2;'

[[match]]
name = 'elemptr #3: with the option on the input and the returned buffer are char *'
count = 1
literal = 'char * w_decode(char *a0,uint8 a1,uint8 *a2)'

[[match]]
name = 'elemptr #4: with the option on a store into the allocated buffer is a subscript'
count = 1
literal = 'v7[v9] = v6 >> 0x10;'

[[match]]
name = 'elemptr #5: with the option on the global table and the .data alphabet are arrays'
count = 1
literal = 'dat_300053e0[dat_30005080[v2]] = (char)v2;'

[[match]]
name = 'elemptr #6: with the option on a signed byte indexes an int array'
count = 1
literal = 'int8 w_sidx(char *a0,int4 a1,int4 *a2)'

[[match]]
name = 'elemptr #7: with the option on a .data table of ints is read by subscript'
count = 1
literal = 'v2 = dat_300050c0[v1] + v2 * 0xb;'

[[match]]
name = 'elemptr #8: a record walked by a stride keeps its integer form in both passes'
count = 2
literal = 'int8 w_record(int8 a0,int4 a1)'

[[match]]
name = 'elemptr #9: a pointer read at two widths is not an array in either pass'
count = 2
literal = 'int8 w_mixed(void *a0,int4 a1)'

[[match]]
name = 'elemptr #10: with the option on a returned word nothing shows the sign of is an unsigned element'
count = 1
literal = 'uint2 w_wu(uint4 a0)'

[[match]]
name = 'elemptr #11: the returned word is never declared signed in either pass'
count = 0
regex = '\bint2 w_wu\(|^short w_wu\('

[[match]]
name = 'elemptr #12: with the option on a lookup in the global table is a char the conditional widens itself'
count = 4
literal = '? dat_300053e0[(uint1)a0[v8]] : 0;'

[[match]]
name = "elemptr #13: a buffer's length compared against a pointer difference stays a number in both passes"
count = 2
literal = 'void w_put(char *a0,uint8 a1,char *a2)'

[[match]]
name = 'elemptr #14: with the option on the table a counter is stored into is unsigned and the counter stays int'
count = 1
literal = 'void w_ctr(uint4 *a0,int4 *a1,int4 a2)'

[[match]]
name = 'elemptr #15: the stored counter is compared and used as an index with no cast'
count = 1
literal = 'a0[v1] = v1;'

[[match]]
name = 'elemptr #16: the counter is never re-declared unsigned and cast back'
count = 0
literal = '(int4)v1'

[[match]]
name = 'elemptr #17: a 2-byte field through a pointer a callee reads as uint4 * is read 2 wide in both passes'
count = 2
literal = 'return (uint8)*(uint2 *)&a0[1] + v1;'

[[match]]
name = 'elemptr #18: the 2-byte field is never read 4 wide and truncated in either pass'
count = 0
literal = '(uint2)a0[1]'

[[match]]
name = 'elemptr #19: a global stepped by bytes prints the byte step in both passes'
count = 2
literal = 'dat_300053e8 += 4;'

[[match]]
name = "elemptr #20: a table's first element read by name is a scalar in both passes"
count = 2
literal = 'return dat_30005360 + 1;'

[[match]]
name = 'elemptr #21: an element loaded through an address in the returned register is returned as an integer in both passes'
count = 2
literal = 'uint8 w_nexttab(uint8 a0,uint8 *a1,char *a2)'

[[match]]
name = "elemptr #22: that function is never declared to return the element's address"
count = 0
literal = 'uint8 * w_nexttab('

[[match]]
name = 'elemptr #23: with the option off the table merged with the parameter is its address'
count = 1
literal = 'a0 = 0x30003020;'

[[match]]
name = 'elemptr #24: with the option on the parameter the table is merged with is a char pointer'
count = 1
literal = 'int8 w_pick(char *a0,int8 a1,int4 a2)'

[[match]]
name = 'elemptr #25: with the option on the table is still its address, the one the indexed reader takes'
count = 1
literal = 'a0 = &dat_30003020;'

[[match]]
name = 'elemptr #26: the table is never a string literal cut at its zero byte in either pass'
count = 0
literal = '"0!0'
