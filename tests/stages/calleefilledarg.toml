[script]
commands = [
    'parse line extern void prep(void *o);',
    'lo fu walk',
    'decompile',
    'print C',
    'lo fu walk_plain',
    'decompile',
    'print C',
    'option calleefilledarg off',
    'lo fu walk',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'calleefilledarg #1: the stub call keeps the receiver, the state address, the buffer and the count'
count = 2
literal = 'objc_msgSend$countByEnumeratingWithState:objects:count:(a0,&v1,v2,0x10);'

[[match]]
name = "calleefilledarg #2: the state's mutation pointer is read after the call, not folded"
count = 1
literal = 'v4 = *v7;'

[[match]]
name = 'calleefilledarg #3: the control stub does not fill x1, so the positional rule stands'
count = 1
literal = 'count_plain(a0);'

[[match]]
name = 'calleefilledarg #4: off restores the one-argument call and the folded state read'
count = 2
literal = 'objc_msgSend$countByEnumeratingWithState:objects:count:(a0);'

[[match]]
name = 'calleefilledarg #5: off folds the items pointer through the call'
count = 1
literal = '*(unsigned long *)(v3 * 8)'
