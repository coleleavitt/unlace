# GH-783: a label must be followed by a statement before C23.
#
# probe is an ARM switch whose last arm, case 2, is a branch-only table
# entry that leaves the switch.  The printer used to end the switch with
# the bare label `case 2:` before the closing brace, which C99/C11/C17
# reject as "label at end of compound statement".  The label now gets
# `break;`.  probe_control has the same dispatch with an assignment in
# case 2; its last arm stays unchanged, with no break added.
#
# Source shape: value = 0; switch (selector) { case 0: value = 7; break;
# case 1: value = 9; break; case 2: break; } *output = value;

[image]
arch = 'ARM:LE:32:v5t:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'probe' },
    { space = 'ram', offset = '0x1040', name = 'probe_control' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
hex = '0030a0e3020050e300f18f90060000ea010000ea020000ea030000ea0730a0e3010000ea0930a0e3ffffffea003081e51eff2fe10000000000000000000000000030a0e3020050e300f18f90070000ea010000ea020000ea030000ea0730a0e3020000ea0930a0e3000000ea0b30a0e3003081e51eff2fe1'

[script]
commands = [
    'parse line extern void probe(uint4 selector, uint4 *output);',
    'parse line extern void probe_control(uint4 selector, uint4 *output);',
    'load function probe',
    'decompile',
    'print C',
    'load function probe_control',
    'decompile',
    'print C',
]

[[match]]
name = 'Label statement arm #1: the empty last case gets break'
count = 1
regex = [
    'case 2:$',
    'break;$',
]

[[match]]
name = 'Label statement arm #2: no case label directly before a blank line'
count = 0
regex = [
    'case 2:$',
    '^\s*$',
]

[[match]]
name = "Label statement arm #3: the control's last case is unchanged"
count = 1
regex = [
    'case 2:$',
    '= 0xb;$',
    '^\s*$',
    '^\s*\}$',
]

[[match]]
name = 'Label statement arm #4: one break per non-last arm plus the empty last arm'
count = 5
regex = 'break;$'
