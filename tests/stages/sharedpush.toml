# sharedpush: one push above a branch is the argument of the call on each arm.
# pkgen2.exe 0x40621e
#   push 0x14; jz L; call [malloc]; jmp M; L: call _emalloc; M: pop ecx
# printed `malloc(0x14)` and `_emalloc()`, although both callees receive 0x14.
# The upstream double-use test refuses an input trial whose value another call
# reads unless that call's own trial is still open, and a call through a
# declared import slot has no trial, so the declared call always kept the push.
# Stage / sub-stage: P4 call-site input recovery (`check_call_double_use`,
# `p4_calls/unlace_sharedpush.rs`). A strict fix, always on.
# The fixture `sharedpush_pe_i386.exe` is assembled from
# `sharedpush_pe_i386.asm` (see the fixtures README).
# 0x401000 pushes 0x14 for malloc or the internal wrapper at 0x4010d0, then the
# result for free or the wrapper at 0x4010e0: every call takes its push
# (asserts 1-4). 0x401040 pushes i in a loop for toupper through the import
# table or tolower through a register; the arms rejoin and loop back through the
# push, and both take i (5-6). 0x401080 runs Note after malloc on one path, on
# the slot malloc took, so Note gains nothing (7-8). 0x4010a0 runs a
# control-flow guard check (target in ECX) before the guarded call on the slot
# that free takes on the other arm; two calls read it on that arm, so neither
# gains it and the guard check is never handed the argument (9-10). 0x401100
# pushes 3 above the shared 0x14 for Note, so 0x14 sits one slot deeper in
# Note's area than it does in malloc's and is not Note's argument (11).
# 0x401120 is `if (sel) free(p); else pair(guard_nop(), p);` with p pushed
# once for free and for pair's second argument: guard_nop runs on the slot
# pair then reads, so it is not the only reader on its arm and gains nothing
# (12).

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/sharedpush_pe_i386.exe',
    'read symbols',
    'load addr 0x401000',
    'decompile',
    'print C',
    'load addr 0x401040',
    'decompile',
    'print C',
    'load addr 0x401080',
    'decompile',
    'print C',
    'load addr 0x4010a0',
    'decompile',
    'print C',
    'load addr 0x401100',
    'decompile',
    'print C',
    'load addr 0x401120',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'SHAREDPUSH #1: malloc keeps its push'
count = 1
literal = '= malloc(0x14);'

[[match]]
name = 'SHAREDPUSH #2: the wrapper on the other arm takes it too'
count = 1
literal = 'sub_4010d0(0x14);'

[[match]]
name = 'SHAREDPUSH #3: free keeps the pushed result'
count = 1
regex = '^\s*free\(p\);'

[[match]]
name = 'SHAREDPUSH #4: the free wrapper takes it too'
count = 1
literal = 'sub_4010e0(p);'

[[match]]
name = 'SHAREDPUSH #5: toupper takes i in the loop'
count = 1
literal = 'toupper(c);'

[[match]]
name = 'SHAREDPUSH #6: tolower through the register takes i too'
count = 1
literal = 'tolower(c);'

[[match]]
name = 'SHAREDPUSH #7: malloc keeps its push where the arms rejoin, and beside the deeper push'
count = 2
regex = '^\s*malloc\(0x14\);'

[[match]]
name = 'SHAREDPUSH #8: the call after the rejoin gains nothing'
count = 1
literal = 'Note();'

[[match]]
name = 'SHAREDPUSH #9: free keeps its argument beside the guarded call'
count = 1
literal = 'free(a1);'

[[match]]
name = 'SHAREDPUSH #10: the guard check is never handed the argument'
count = 0
regex = '\(\*dat_[0-9a-f]+\)\([^)]'

[[match]]
name = 'SHAREDPUSH #11: a push one slot deeper on the other arm is not taken'
count = 1
literal = 'Note(3);'

[[match]]
name = 'SHAREDPUSH #12: a call that runs before a later reader of the slot gains nothing'
count = 1
literal = 'sub_4010f0()'
