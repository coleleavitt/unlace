[script]
commands = [
    'map prototype sink void sink(void *p, unsigned long n);',
    'map prototype plain void plain(void);',
    'map prototype escaped void escaped(void);',
    'map prototype unicode void unicode(void);',
    'option fatstr always',
    'option outlang c',
    'load function plain',
    'decompile',
    'print C',
    'load function escaped',
    'decompile',
    'print C',
    'load function unicode',
    'decompile',
    'print C',
    'option outlang go',
    'load function plain',
    'decompile',
    'print C',
    'load function escaped',
    'decompile',
    'print C',
    'load function unicode',
    'decompile',
    'print C',
]

[[match]]
name = 'C keeps ordinary byte string syntax'
count = 1
literal = 'sink("plain bytes",0xb);'

[[match]]
name = 'Go internal strings use data pointers'
count = 3
regex = 'unsafe.StringData\('

[[match]]
name = 'Go byte string pointers retain a terminating zero'
count = 3
literal = '\x00"'

[[match]]
name = 'Go keeps the pointer conversion to the formal type'
count = 3
regex = 'sink\(unsafe.Pointer\('

[[match]]
name = 'Go never converts a string directly to a pointer'
count = 0
regex = 'unsafe.Pointer\("'
