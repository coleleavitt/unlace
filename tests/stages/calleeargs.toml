[[match]]
name = "CALLEEARGS #1: off, the method takes the outer call's push"
count = 1
regex = '= \(float10\)sub_401030\((a1,)?a2\);'

[[match]]
name = 'CALLEEARGS #2: on, the method takes no stack argument'
count = 1
regex = '= \(float10\)sub_401030\((a1)?\);'

[[match]]
name = 'CALLEEARGS #3: on, the virtual call gets its fourth argument'
count = 1
regex = '\(7,0,\(float4\)v[0-9]+,v[0-9]+\);'

[[match]]
name = 'CALLEEARGS #4: the call before the by-value copy never loses its arguments'
count = 0
literal = 'sub_401050()'

[[match]]
name = 'CALLEEARGS #5: it keeps all three in both passes'
count = 2
literal = 'sub_401050(a0,a1,3)'

[[match]]
name = 'CALLEEARGS #6: off, strcpy of the program-name fallback has no arguments'
count = 2
literal = 'sub_402c30();'

[[match]]
name = 'CALLEEARGS #7: on, both strcpy calls get destination and source'
count = 1
literal = 'sub_402c30(Filename,"<program name unknown>");'

[[match]]
name = "CALLEEARGS #8: on, the Runtime Error banner is strcpy's source"
count = 1
regex = 'sub_402c30\(v[0-9]+,"Runtime Error!'

[[match]]
name = 'CALLEEARGS #9: on, strlen takes the message buffer'
count = 2
literal = 'sub_402de0(Filename)'

[[match]]
name = 'CALLEEARGS #10: strlen never takes two'
count = 0
regex = 'sub_402de0\([^()]*,'

[[match]]
name = 'CALLEEARGS #11: GetStdHandle takes nothing staged for WriteFile before strlen'
count = 0
regex = 'GetStdHandle\([^()]*,'

[[match]]
name = 'CALLEEARGS #12: WriteFile is not given one argument'
count = 0
regex = 'WriteFile\([^,()]+\)'

[[match]]
name = 'CALLEEARGS #13: the cdecl call never takes the local'
count = 0
literal = 'sub_401030(a0,'

[[match]]
name = 'CALLEEARGS #14: the cdecl call takes its one argument'
count = 2
literal = 'sub_401030(a0);'

[[match]]
name = 'CALLEEARGS #15: a byte read of the third argument keeps the whole slot'
count = 1
literal = 'sub_4027b1(a0,0,4)'

[[match]]
name = 'CALLEEARGS #16: the SEH-framed callee keeps both arguments'
count = 2
regex = 'sub_4010b0\("kuna.txt",0x80000000\);'

[[match]]
name = 'CALLEEARGS #17: the caller of the alloca helper keeps four'
count = 2
literal = 'sub_401110(0x409,0,0x402010,4);'

[[match]]
name = 'CALLEEARGS #18: the callee reading its third argument past a push keeps three'
count = 2
literal = 'sub_4011b0(1,2,3);'

[[match]]
name = "CALLEEARGS #19: the callee handing on va_start's address keeps every argument"
count = 2
literal = 'sub_4011d0("%d %d",1,2);'

[[match]]
name = 'CALLEEARGS #20: the callee reading through a copy of ESP keeps both'
count = 2
literal = 'sub_4011f0(1,2)'

[[match]]
name = 'CALLEEARGS #21: the callee reading through a stack address a call returns keeps both'
count = 2
literal = 'sub_401010(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #22: the callee reading through an address parked in xmm0 keeps both'
count = 2
literal = 'sub_401020(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #23: the callee reading through an address stored and loaded back keeps both'
count = 2
literal = 'sub_401040(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #24: a call whose callee states no extent does not take the local a bounded call frees'
count = 2
literal = 'sub_4010c0(7);'

[[match]]
name = "CALLEEARGS #25: the -12 push is GetStdHandle's argument in both passes"
count = 2
literal = 'WriteFile(GetStdHandle(0xfffffff4),'

[[match]]
name = 'CALLEEARGS #26: the callee reading through an address stored over its first argument keeps both'
count = 2
literal = 'sub_401120(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #27: the callee reading through an address copied by an 8-byte move keeps both'
count = 2
literal = 'sub_401140(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #28: the callee reading through a stack address a call leaves in ECX keeps both'
count = 2
literal = 'sub_401170(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #29: turning the option on after a walk with it off still keeps both'
count = 2
literal = 'sub_401180(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #30: the callee reading through a stack address it stored through a pointer keeps both'
count = 2
literal = 'sub_401210(0x11,0x22);'

[[match]]
name = 'CALLEEARGS #31: off, the call before a by-value copy too large to expand has no arguments'
count = 1
literal = 'paint3();'

[[match]]
name = 'CALLEEARGS #32: on, it keeps all three'
count = 1
literal = 'paint3(a0,a1,3);'

[[match]]
name = "CALLEEARGS #33: with a local frame, off, the method takes the outer call's push"
count = 1
regex = '= \(float10\)sub_401040\((a1,)?a2\);'

[[match]]
name = 'CALLEEARGS #34: with a local frame, on, the method takes no stack argument'
count = 1
regex = '= \(float10\)sub_401040\((a1)?\);'

[[match]]
name = 'CALLEEARGS #35: with a local frame, on, the virtual call gets its fourth argument'
count = 1
regex = '\(\*v[0-9]+\)\(9,0,\(float4\)v[0-9]+,v[0-9]+\);'

[[match]]
name = 'CALLEEARGS #36: both, a cleanup deferred past push 3; pop ebx keeps both arguments'
count = 2
literal = 'sub_401090(a1,a0);'

[[match]]
name = 'CALLEEARGS #37: both, the call after it takes exactly its four'
count = 2
regex = 'sub_4010a0\(1,3,v[0-9]+,v[0-9]+\);'
