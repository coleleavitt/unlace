# A stub named <prefix>__<runtime name> reads as returning, so flow runs past the
# call. P2 lift and flow, option noreturn_known (default on). The script
# loads two linked ELFs whose stub callee, a bare ret, is named
# <prefix>__<multi-word list entry> and whose caller ends at that call.
#
# Asserts #1-#2 are the off-pass bug: flow runs past probe's symbol into padding,
# which fails to decode on AArch64 and decodes then trips funcboundflow on x86-64.
# Assert #3 is the on-pass fix on both architectures. Assert #4 keeps the plain
# name no-return. Asserts #5-#6 keep names that merely contain or end in a runtime
# name returning. Assert #7 renames the x86-64 stub mystack_chk_fail_count to keep
# a stub named for a single-word list entry returning. Assert #8 keeps a
# proxy-spelled name whose body is not a stub returning: keeps_session calls
# session__pthread_exit in the bytechunks; in each ELF keeps_count is pointed at
# keeps_exit, which is given that name, first as it is, then with an entry jump
# into its own body; on x86-64 handle_exit, the last mapped byte, is also given
# that name and turned into a ret imm16 that runs past the mapping. Assert #9
# keeps a proxy stub returning where its call has live code after it inside the
# caller: each ELF's mystack_chk_fail_count stub is renamed obj__stack_chk_fail.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1010', name = 'keeps_session' },
    { space = 'ram', offset = '0x2010', name = 'session__pthread_exit' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1010'
readonly = true
hex = 'e8fb0f0000b809000000c3'

[[image.bytes]]
space = 'ram'
offset = '0x2010'
readonly = true
hex = '31c0c3'

[script]
commands = [
    'lo fu keeps_session',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/prefixed_noreturn_aarch64',
    'option noreturn_known off',
    'read symbols',
    'load function probe',
    'decompile',
    'print C',
    'option noreturn_known on',
    'load function probe',
    'decompile',
    'print C',
    'load function plain',
    'decompile',
    'print C',
    'load function keeps_count',
    'decompile',
    'print C',
    'load function keeps_exit',
    'decompile',
    'print C',
    'map function r0x10078 obj__stack_chk_fail',
    'load function keeps_count',
    'decompile',
    'print C',
    'override bytes r0x10048 04000094',
    'map function r0x10058 session__pthread_exit',
    'load function keeps_count',
    'decompile',
    'print C',
    'override bytes r0x10058 05000014',
    'load function keeps_count',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/prefixed_noreturn_x86_64',
    'option noreturn_known off',
    'read symbols',
    'load function probe',
    'decompile',
    'print C',
    'option noreturn_known on',
    'load function probe',
    'decompile',
    'print C',
    'load function plain',
    'decompile',
    'print C',
    'load function keeps_count',
    'decompile',
    'print C',
    'load function keeps_exit',
    'decompile',
    'print C',
    'map function r0x10052 machine__exit',
    'load function keeps_count',
    'decompile',
    'print C',
    'map function r0x10052 obj__stack_chk_fail',
    'load function keeps_count',
    'decompile',
    'print C',
    'override bytes r0x10035 07000000',
    'map function r0x10040 session__pthread_exit',
    'load function keeps_count',
    'decompile',
    'print C',
    'override bytes r0x10040 eb02',
    'load function keeps_count',
    'decompile',
    'print C',
    'override bytes r0x10053 c2',
    'map function r0x10053 session__pthread_exit',
    'load function keeps_exit',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'prefixed-noreturn #1: off pass decodes AArch64 padding past the call'
count = 1
literal = 'UndefinedInstructionException'

[[match]]
name = 'prefixed-noreturn #2: off pass runs x86-64 flow past the symbol end'
count = 1
literal = 'funcboundflow'

[[match]]
name = 'prefixed-noreturn #3: on pass ends flow at the proxy on both architectures'
count = 2
literal = 'stub___stack_chk_fail(); // no-return'

[[match]]
name = 'prefixed-noreturn #4: the plain runtime name stays no-return'
count = 2
regex = '^ *__stack_chk_fail\(\); // no-return'

[[match]]
name = 'prefixed-noreturn #5: a name containing the runtime name returns'
count = 2
literal = [
    'mystack_chk_fail_count();',
    'return 9;',
]

[[match]]
name = 'prefixed-noreturn #6: a name ending in a list word returns'
count = 2
literal = [
    'handle_exit();',
    'return 9;',
]

[[match]]
name = 'prefixed-noreturn #7: a stub named for a single-word entry returns'
count = 1
literal = [
    'machine__exit();',
    'return 9;',
]

[[match]]
name = 'prefixed-noreturn #8: a proxy-spelled name with a real body returns'
count = 6
literal = [
    'session__pthread_exit();',
    'return 9;',
]

[[match]]
name = 'prefixed-noreturn #9: a proxy stub called mid-function returns'
count = 2
literal = [
    'obj__stack_chk_fail();',
    'return 9;',
]
