[script]
commands = [
    'parse line extern void saved_output(int first, int second, int *output);',
    'parse line extern void short_induction(int unused, int **items, short count);',
    'parse line extern int provider(int *item);',
    'parse line extern void float_recurrence(float seed, float factor, float *output);',
    'parse line extern float transform(float value);',
    'parse line extern void retained_scale(float value, int choice, float *output);',
    'lo fu saved_output',
    'decompile',
    'print C',
    'lo fu short_induction',
    'decompile',
    'print C',
    'lo fu float_recurrence',
    'decompile',
    'print C',
    'lo fu retained_scale',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'saved pointer reaches store'
count = 1
literal = '*output = first;'

[[match]]
name = 'induction limit keeps count'
count = 1
literal = 'count * 0x10000 + v1 * -0x10000'

[[match]]
name = 'recurrence starts at seed'
count = 1
literal = 'value = seed;'

[[match]]
name = 'recurrence keeps its previous value'
count = 1
literal = 'value = transform(value) * factor + seed;'

[[match]]
name = 'scale survives the join'
count = 1
literal = '*output = value * dat_13054;'

[[match]]
name = 'no fabricated zero multiplication'
count = 0
literal = '* 0.0'
