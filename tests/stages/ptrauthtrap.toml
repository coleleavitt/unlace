[script]
commands = [
    'lo fu both',
    'decompile',
    'print C',
    'lo fu plain',
    'decompile',
    'print C',
    'lo fu x30check',
    'decompile',
    'print C',
    'lo fu x30forged',
    'decompile',
    'print C',
    'lo fu x30inverted',
    'decompile',
    'print C',
    'lo fu x30forgedearlier',
    'decompile',
    'print C',
    'lo fu x30loaded',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_arm64e_auth',
    'option ptrauthtrap off',
    'read symbols',
    'load function _tail_auth',
    'decompile',
    'print C',
    'load function _strip_check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_arm64e_auth',
    'read symbols',
    'load function _tail_auth',
    'decompile',
    'print C',
    'load function _strip_check',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/macho_arm64e_brk',
    'read symbols',
    'load function _check',
    'decompile',
    'print C',
    'load function _check_x0',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'PTRAUTHTRAP #1: off keeps the bit test on the incoming return address (and x30inverted keeps it in both)'
count = 2
literal = 'if ((v1 ^ v1 << 1) >> 0x3e & 1)'

[[match]]
name = 'PTRAUTHTRAP #2: off keeps the trap call'
count = 1
literal = 'SoftwareBreakpoint(0xc471,0x100000444)'

[[match]]
name = 'PTRAUTHTRAP #3: the tail call survives in both passes'
count = 2
literal = '_helper2(); // tail-call'

[[match]]
name = 'PTRAUTHTRAP #4: only off declares a variable for the incoming x30'
count = 1
literal = 'v1; // stack - 0x8 | x30'

[[match]]
name = 'PTRAUTHTRAP #5: the call to _helper survives in both passes'
count = 2
literal = '_helper();'

[[match]]
name = 'PTRAUTHTRAP #6: the xpacd compare folds in both passes'
count = 2
literal = 'return *(unsigned int *)*a0;'

[[match]]
name = 'PTRAUTHTRAP #7: a guard whose both arms trap is left whole'
count = 1
literal = 'SoftwareBreakpoint(0xc472,0x10000c'

[[match]]
name = 'PTRAUTHTRAP #8: a compare guarding brk #0xc470 keeps its check, plain AArch64 and arm64e'
count = 2
literal = 'if (a0 == 0x2a)'

[[match]]
name = 'PTRAUTHTRAP #9: both brk #0xc470 traps stay'
count = 2
literal = 'SoftwareBreakpoint(0xc470,'

[[match]]
name = 'PTRAUTHTRAP #10: an x0 bit test (arm64e image and the x30 forgery, which reads a0) is not the return-address check'
count = 2
literal = 'if ((a0 ^ a0 << 1) >> 0x3e & 1)'

[[match]]
name = 'PTRAUTHTRAP #11: the x0 bit test keeps its brk #0xc472 trap'
count = 1
literal = 'SoftwareBreakpoint(0xc472,0x1000002b0)'

[[match]]
name = 'PTRAUTHTRAP #12: the real check on plain AArch64 is cut'
count = 0
literal = 'SoftwareBreakpoint(0xc471,0x10005c)'

[[match]]
name = 'PTRAUTHTRAP #13: the bit test of a value moved into x30 keeps its trap'
count = 1
literal = 'SoftwareBreakpoint(0xc471,0x100090)'

[[match]]
name = 'PTRAUTHTRAP #14: a guard that traps when the bits agree keeps its trap'
count = 1
literal = 'SoftwareBreakpoint(0xc471,0x1000d8)'

[[match]]
name = 'PTRAUTHTRAP #15: a value moved into x30 in an earlier block keeps its trap'
count = 1
literal = 'SoftwareBreakpoint(0xc471,0x100118)'

[[match]]
name = 'PTRAUTHTRAP #16: x30 loaded from a non-frame address keeps its trap'
count = 1
literal = 'SoftwareBreakpoint(0xc471,0x100150)'
