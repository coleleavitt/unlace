[package]
name = "unlace-lumina"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "io-util"] }
sha2 = { workspace = true }
async-trait = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }

[features]
# Modules no production code path reaches yet (`cargo xtask status`).
unwired = []
