[[match]]
name = 'disabled anchor or pointer inference retains folded literal'
count = 2
literal = '*(unsigned short *)(slot * 2 + 0x400016) = 0;'

[[match]]
name = 'enabled retains declared array'
count = 1
regex = '^  flags\[slot \+ -1\] = 0;'

[[match]]
name = 'adjacent object does not steal array reference'
count = 1
literal = 'neighboring_flags[slot + -1] = 0;'

[[match]]
name = 'unbiased indexing stays unchanged'
count = 1
regex = '^  flags\[slot\] = 0;'

[[match]]
name = 'unmapped base is not guessed'
count = 1
literal = '*(unsigned short *)(slot * 2 + 0x600016) = 0;'

[[match]]
name = 'partial element bias stays a byte access'
count = 1
literal = '*(char *)(slot * 2 + 0x400017) = 0;'

[[match]]
name = 'ordinary arithmetic still folds'
count = 1
literal = 'return slot * 2 + 0x400016;'

[[match]]
name = 'load retains declared array'
count = 1
literal = 'return flags[slot + -1];'

[[match]]
name = 'positive displacement stays symbolic'
count = 1
literal = 'flags[slot + 1] = 0;'

[[match]]
name = 'a declared array admits a negative origin beyond its extent'
count = 1
literal = 'flags[slot + -3] = 0;'

[[match]]
name = 'unscaled short index is not anchored'
count = 1
literal = '(slot + 0x400016)'

[[match]]
name = 'two indices retain the array anchor'
count = 1
regex = 'flags\[.*first.*second.*\] = 0;'

[[match]]
name = 'low address outside pointer inference range still folds'
count = 1
literal = 'slot * 2 + 0x16'

[[match]]
name = 'byte arrays accept unscaled element indices'
count = 1
literal = "bytes[slot + -1] = '\\0';"

[[match]]
name = 'a split high part at a page-aligned declaration does not anchor'
count = 0
literal = 'page_flags'

[[match]]
name = 'a split high part yields to the object it addresses'
count = 1
literal = 'page_neighbor[slot * 2])[0]'

[[match]]
name = 'a split high part with no object below it does not anchor either'
count = 0
literal = 'page_alone'

[[match]]
name = 'a split high part with no object below it keeps the folded address'
count = 1
literal = 'slot * 2 + 0x42ff00)'
