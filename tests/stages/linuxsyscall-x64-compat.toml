# linuxsyscall on x86-64: INT 0x80 still enters Linux's i386 compatibility
# ABI. The number is therefore EAX=1 (i386 SYS_exit), not native x86-64
# syscall 1 (write), and the argument is the low 32 bits of RBX.
#
# Layout (x86:LE:64, flat at 0x100000):
#   compat_exit @ 0x100000: ENDBR64; mov eax,1; mov ebx,0; int 0x80; ret
#   native_call @ 0x100020: mov eax,60; xor edi,edi; syscall; ret
#
# The first pass leaves linuxsyscall off. The second enables it. Both passes
# decompile the native SYSCALL control with x64syscall still off: its output
# must stay byte-for-byte represented by the same `syscall()` statement, so
# broadening linuxsyscall cannot accidentally claim native entry sites.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'compat_exit' },
    { space = 'ram', offset = '0x100020', name = 'native_call' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'f30f1efab801000000bb00000000cd80c3'

[[image.bytes]]
space = 'ram'
offset = '0x100020'
readonly = true
hex = 'b83c00000031ff0f05c3'

[script]
commands = [
    'option x64syscall off',
    'option linuxsyscall off',
    'lo fu compat_exit',
    'decompile',
    'print C',
    'lo fu native_call',
    'decompile',
    'print C',
    'option linuxsyscall on',
    'lo fu compat_exit',
    'decompile',
    'print C',
    'lo fu native_call',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'LINUXSYSCALL-X64 #1: option off retains exactly the one compatibility interrupt as a raw swi call'
count = 1
literal = '*)swi(0x80))()'

[[match]]
name = 'LINUXSYSCALL-X64 #2: option on uses i386 numbering and the low RBX lane to emit standalone compat exit'
count = 1
literal = 'sys_exit(0);'

[[match]]
name = 'LINUXSYSCALL-X64 #3: compat syscall 1 must never be interpreted as native x86-64 write'
count = 0
literal = 'sys_write('

[[match]]
name = 'LINUXSYSCALL-X64 #4: i386 exit arity remains one'
count = 0
literal = 'sys_exit(0,'

[[match]]
name = 'LINUXSYSCALL-X64 #5: the native SYSCALL control is unchanged across both linuxsyscall passes'
count = 2
literal = 'syscall();'
