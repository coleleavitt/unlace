# Unlace #850: an asserted outer function contains a separately discovered
# interior entry.
# The first instruction falls through to that entry, then the body returns 7:
#
#   0x10000 outer:    mov r1,r1
#   0x10004 interior: mov r0,#7
#   0x10008            bx lr
#
# The outer extent is [0x10000,0x1000c), so funcboundflow must keep decoding
# at 0x10004 even though function discovery knows an entry there. P0 assertion:
# `option funcboundflow on|off`. The default-on pass reproduces the pre-fix
# truncation; the off pass is the control. Assertion #1 fails before the fix
# and requires both passes to return the same value. Stage: P2 flow
# classification.

[image]
arch = 'ARM:LE:32:v5t'

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '0110a0e10700a0e31eff2fe1'

[script]
commands = [
    'function bounds 0x10000 0x1000c as outer',
    'function bounds 0x10004 0x1000c as interior',
    'parse line extern int outer(int input);',
    'lo fu outer',
    'decompile',
    'print C',
    'option funcboundflow off',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'EXTENT-FALLTHROUGH #1: both passes decode the body inside the asserted outer extent'
count = 2
literal = 'return 7;'
