# Unlace (IDA 9.5 gooMBA design, MBA without SMT): P3 simplification
# quiescence, option mba (default off). The groups and polynomial half.
#
#   0x1000 mba4 (hand-assembled, subterms recomputed as an obfuscator emits
#          them): (x & y) + (z & w) - (x & y & z & w)  ==  (x & y) | (z & w)
#          one boolean function of four leaves (bi-decomposed)
#   0x1040 mba6 (gcc -O2): (a ^ b) + 2*(a & b) + (c & ~d) + d + (e | f) - (e & f)
#          ==  a + b + (c | d) + (e ^ f): six leaves in three groups
#   0x1080 mbapoly (gcc -O2): (x & y) * (x | y) + (x & ~y) * (~x & y)  ==  x * y
#          a polynomial MBA, normalized over the conjunction basis
#
# Asserts #1-#3 are the off pass: each prints as written.
# Asserts #4-#6 are the on pass: each folds.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'mba4' },
    { space = 'ram', offset = '0x1040', name = 'mba6' },
    { space = 'ram', offset = '0x1080', name = 'mbapoly' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '89f821f04189d04121c84401c04189f94121f14121d14121c94429c8c3'

[[image.bytes]]
space = 'ram'
offset = '0x1040'
readonly = true
hex = '4589c289c84509c8f7d14521ca21d189fa21f74429d031f24401c001c801d08d0478c3'

[[image.bytes]]
space = 'ram'
offset = '0x1080'
readonly = true
hex = '89f089faf7d0f7d221f821f20fafc289fa09f721f20fafd701d0c3'

[script]
commands = [
    'parse line extern uint4 mba4(uint4 x,uint4 y,uint4 z,uint4 w);',
    'parse line extern uint4 mba6(uint4 a,uint4 b,uint4 c,uint4 d,uint4 e,uint4 f);',
    'parse line extern uint4 mbapoly(uint4 x,uint4 y);',
    'option mba off',
    'lo fu mba4',
    'decompile',
    'print C',
    'lo fu mba6',
    'decompile',
    'print C',
    'lo fu mbapoly',
    'decompile',
    'print C',
    'option mba on',
    'lo fu mba4',
    'decompile',
    'print C',
    'lo fu mba6',
    'decompile',
    'print C',
    'lo fu mbapoly',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'mba groups #1: off keeps the four-leaf form'
count = 1
literal = '- (x & y & z & w);'

[[match]]
name = 'mba groups #2: off keeps the six-leaf form'
count = 1
literal = '(a ^ b) + (a & b) * 2;'

[[match]]
name = 'mba groups #3: off keeps the polynomial form'
count = 1
literal = '* (x | y)'

[[match]]
name = 'mba groups #4: on folds the four-leaf group to one boolean function'
count = 1
regex = 'return [xyzw] & [xyzw] \| [xyzw] & [xyzw];'

[[match]]
name = 'mba groups #5: on folds six leaves to a + b + (c | d) + (e ^ f)'
count = 1
regex = 'return \([ef] \^ [ef]\) \+ \([cd] \| [cd]\) \+ [ab] \+ [ab];'

[[match]]
name = 'mba groups #6: on normalizes the polynomial to x * y'
count = 1
regex = 'return [xy] \* [xy];'
