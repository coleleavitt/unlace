[package]
name = "unlace-idapython"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IDAPython compatibility shim — re-implements idc/idautils/idaapi APIs on top of unlace"

[lib]
crate-type = ["rlib"]

[dependencies]
unlace-ir.workspace = true
unlace-loader.workspace = true
unlace-session = { workspace = true }
unlace-struct = { workspace = true }
anyhow.workspace = true
tracing.workspace = true
pyo3 = { version = "0.29", features = ["auto-initialize"], optional = true }

[features]
# Modules no production code path reaches yet (`cargo xtask status`).
unwired = []
default = []
# Enable the pyo3-backed Python wrapper. Disabled by default so the crate
# can be built/tested without a Python interpreter installed.
python = ["dep:pyo3"]
