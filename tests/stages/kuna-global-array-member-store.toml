# Independent SPARC record copy with a shared publish block before the copy block.

[image]
arch = 'sparc:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x1000', name = 'update' },
    { space = 'ram', offset = '0x1200', name = 'fill' },
    { space = 'ram', offset = '0x1210', name = 'publish' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '9de3bf9021000004a014210080a6200012800006010000004000007e901000101080000c01000000400000769007bff080a220000280000701000000d41fbff0d43c0000d81fbff810bffff4d83c200881c7e00881e80000'

[script]
commands = [
    'parse line typedef struct Record { float first[2]; float second[2]; } Record;',
    'parse line extern void update(int enabled);',
    'parse line extern int fill(Record *value);',
    'parse line extern void publish(Record *value);',
    'map addr r0x1100 Record cache',
    'lo fu update',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'First array field is published'
count = 1
literal = 'cache.first[0] ='

[[match]]
name = 'Second array field is published'
count = 1
literal = 'cache.first[1] ='

[[match]]
name = 'Third array field is published'
count = 1
literal = 'cache.second[0] ='

[[match]]
name = 'Fourth array field is published'
count = 1
literal = 'cache.second[1] ='

[[match]]
name = 'Array fields never become locals'
count = 0
regex = 'float4 cache_[0-9]+ \[2\];'

[[match]]
name = 'Observer receives the complete array record'
count = 1
literal = 'publish(&cache);'
