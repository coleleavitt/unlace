# tailcallsaved: a run that raises the stack pointer without loading a single
# byte back through it is cdecl argument cleanup, not a frame teardown, so it
# is not evidence of a tail call.  `tailcallframe` (DIV-109, default on) reads
# a direct `jmp` as a tail call when the straight-line run ending at it raises
# the stack pointer by exactly what the run leaving the entry address lowered
# it by.  Both scans stop at the first control-flow op, so on a cdecl caller
# the backward one measures the `add esp,8` that discards the two arguments of
# the `call` above it and never sees the two pushes that put them there.
# Stage model: S2 flow classification (`xref_control_flow`, the CPUI_BRANCH
# arm), the `unlace_tailcallsaved` predicate inside `unlace_tailcallframe`.
#
# Layout (linked flat), 32-bit cdecl:
#   caller @ 0x100040 : push ebx; push esi          (frame = -8, saved = 8)
#                       test eax,eax; jz L2
#                       push 1; push 2; call helper
#                       add esp,8                   (teardown = +8, restored = 0)
#                       jmp JOIN                    // read as a tail call today
#                  L2 : mov eax,0x1234
#                JOIN : test eax,eax; jz R; or eax,7
#                   R : pop esi; pop ebx; ret
#   helper @ 0x100074 : return arg0 + 0x5a5a5a;
#
# JOIN at 0x100059 is an ordinary block of `caller`, reached by both sides of
# the branch at 0x100044; ebx and esi are still on the stack when the `jmp`
# executes.  The teardown restores neither.
#
# The deltas cancel, but the run ending at the branch gives nothing back, so
# the jump stays intraprocedural flow and the whole function is emitted,
# including `| 7` from JOIN.  Read on the deltas alone the jump became a CALL +
# RETURN to 0x100059, so `caller` ended at a call to its own join block and
# everything after it was emitted as a separate callee.
#
# Assert #1 pins the false call to zero occurrences and assert #2 the warning
# that would attribute it.  Assert #3 pins JOIN's own arithmetic inside the
# function.  Assert #4 pins the helper call whose arguments the `add esp,8`
# discards.

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100040', name = 'caller' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100040'
readonly = true
hex = '535685c0740e6a016a02e82500000083c408eb05b83412000085c0740483c807905e5bc3cccccccccccccccccccccccccccccccc8b442404055a5a5a00c3'

[script]
commands = [
    'lo fu caller',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "TAILCALLSAVED #1: the jump never becomes a call to the function's own join block"
count = 0
literal = 'sub_100059('

[[match]]
name = 'TAILCALLSAVED #2: no tail call is recovered from the argument cleanup'
count = 0
literal = 'tailcallframe: recovered tail call'

[[match]]
name = "TAILCALLSAVED #3: the join block's own arithmetic stays inside the function"
count = 1
literal = '| 7'

[[match]]
name = 'TAILCALLSAVED #4: the cdecl call whose arguments the add esp,8 discards is kept'
count = 1
literal = 'sub_100074(2,1)'
