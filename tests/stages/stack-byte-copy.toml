# Kuna #810 / P3 heritage guard. The stack store guard expands proven short byte copies in instruction order, so pushed scratch bytes never read as the saved seed and an earlier snapshot survives; stackviews remains optional. The CLI companion compiles each exact body at O2.

[image]
arch = 'ARM:LE:32:v5t:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'PushedByteSum' },
    { space = 'ram', offset = '0x10038', name = 'StackByteCopyViews' },
    { space = 'ram', offset = '0x10070', name = 'PushedByteBranches' },
    { space = 'ram', offset = '0x100cc', name = 'PushedByteSeed' },
    { space = 'ram', offset = '0x100f8', name = 'PushedByteSnapshot' },
    { space = 'ram', offset = '0x1012c', name = 'PushedByteOverlap' },
    { space = 'ram', offset = '0x10158', name = 'PushedByteBranchesSeed' },
    { space = 'ram', offset = '0x101b8', name = 'LargeStackByteCopy' },
    { space = 'ram', offset = '0x101f0', name = 'DynamicStackByteCopy' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
hex = ''

[script]
commands = [
    'parse line extern unsigned int PushedByteSum(const unsigned char *source);',
    'parse line extern unsigned int StackByteCopyViews(const unsigned char *source);',
    'parse line extern unsigned int PushedByteBranches(const unsigned char *source, unsigned int selector);',
    'parse line extern unsigned int PushedByteSeed(const unsigned char *source, unsigned int seed);',
    'parse line extern unsigned int PushedByteSnapshot(const unsigned char *source, unsigned int seed);',
    'parse line extern unsigned int PushedByteOverlap(unsigned int seed);',
    'parse line extern unsigned int PushedByteBranchesSeed(const unsigned char *source, unsigned int selector, unsigned int seed);',
    'parse line extern unsigned int LargeStackByteCopy(const unsigned char *source);',
    'parse line extern unsigned int DynamicStackByteCopy(const unsigned char *source, unsigned int count);',
    'option stackviews off',
    'lo fu PushedByteBranchesSeed',
    'decompile',
    'print C',
    'lo fu PushedByteSnapshot',
    'decompile',
    'print C',
    'option stackviews on',
    'lo fu PushedByteBranchesSeed',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'stack bytes: no legacy seed reads'
count = 0
literal = 'return (seed & 0xff)'

[[match]]
name = 'stack bytes: the snapshot is never lost'
count = 0
literal = 'return 0;'

[[match]]
name = 'stack bytes: the expanded copies leave no loop'
count = 0
literal = 'do {'

[[match]]
name = 'stack bytes: snapshot remains independent'
count = 1
literal = '^ seed'

[[match]]
name = 'stack bytes: scalar members absent'
count = 0
regex = '\._[012]_1_'
