[script]
commands = [
    'map function r0x401000 widen',
    'map function r0x401020 shift',
    'map function r0x401100 sel',
    'lo fu widen',
    'decompile',
    'print C',
    'lo fu shift',
    'decompile',
    'print C',
    'lo fu sel',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'UNSIGNEDREAD #1: the widened difference is unsigned'
count = 1
literal = '*a0 = (*a1 ^ 0x80) - 0x80U;'

[[match]]
name = 'UNSIGNEDREAD #2: no sign-extending widening of the int'
count = 0
literal = '(uint8)((*a1'

[[match]]
name = 'UNSIGNEDREAD #3: the shifted difference is unsigned'
count = 1
literal = 'return (*a0 ^ 0x80) - 0x80U >> 3;'

[[match]]
name = 'UNSIGNEDREAD #4: no arithmetic shift of the int'
count = 0
literal = 'return (*a0 ^ 0x80) - 0x80 >> 3;'

[[match]]
name = 'UNSIGNEDREAD #5: the byte-sum selector is cast to its byte type'
count = 1
literal = "switch((char)(a0 + '\\x01'))"

[[match]]
name = 'UNSIGNEDREAD #6: no int-wide selector'
count = 0
literal = 'switch(a0 +'
