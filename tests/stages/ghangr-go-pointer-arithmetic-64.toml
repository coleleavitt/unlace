# `ghangr-go-pointer-arithmetic-32.toml` and `ghangr-go-pointer-arithmetic-64.toml` check live
# pointer bases through constant, negative and signed dynamic byte offsets in Go loads, stores and
# returns. Integer-address reconstruction remains a control. The CLI companion builds both
# authored assembly fixtures and runs the complete emitted functions with Go pointer checks and
# full-array canaries.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'load_offset' },
    { space = 'ram', offset = '0x100005', name = 'store_offset' },
    { space = 'ram', offset = '0x10000a', name = 'return_offset' },
    { space = 'ram', offset = '0x10000f', name = 'load_dynamic' },
    { space = 'ram', offset = '0x100014', name = 'store_dynamic' },
    { space = 'ram', offset = '0x100019', name = 'return_dynamic' },
    { space = 'ram', offset = '0x10001e', name = 'return_negative' },
    { space = 'ram', offset = '0x100023', name = 'integer_address' },
]

[[image.bytes]]
space = 'ram'
