ffffff4883c40883c0015b5dc30f1f00f30f1efa5589fd534883ec08e85fffffff89ef89c3c1ef10e853ffffff6681fb
00800f47d889de0fb7fb66c1ee030fb7f6e87affffff4883c40883c0015b5dc3f30f1efa41544189f45589fd53e82eff
ffff89ee4489e789c3e822ffffff84db89ee0f44d80fb6fbe843ffffff5b5d83c001415cc366662e0f1f840000000000
f30f1efa5589fd534883ec08e8fffeffff89efc1ef0889c3e8f3feffff38c30f4cd831f680fbfd0fbefb400f9cc6e8fd
feffff4883c40883c0015b5dc30f1f00f30f1efa5589fd534883ec08e8cffeffff89efc1ef0389c3e8c3feffff39c30f
43c331f63d8000000089c7400f97c6e8bcfeffff4883c40883c0015b5dc36690f30f1efa4883ec08e893feffff3d8100
00008d14000f42c24883c408c3
