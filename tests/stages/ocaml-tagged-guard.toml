# OCaml tagged-int match: a range check of the tagged value bounds the table.
#
# OCaml native code matches on a tagged int r = 2n+1: it checks the range of r,
# then indexes the table with (r - C) >> 1 (coqtop camlStdlib__Bytes__get_utf_8_uchar,
# issue #923). Synthetic x86-64 copy of the shape:
#
#     1000  movzbl (%rdi),%eax ; lea 0x1(%rax,%rax,1),%r8
#           cmp $0x1c1,%r8 ; jl low ; cmp $0x1db,%r8 ; jl mid
#           cmp $0x1eb,%r8 ; jge default
#           mov %r8,%rax ; add $-0x1da,%rax ; sar $1,%rax
#           lea table(%rip),%rdx ; movslq (%rdx,%rax,4),%rax ; add %rax,%rdx ; jmp *%rdx
#     table: 8 rows (cases returning 10..17), then 8 words that are not rows
#
# The upper check, x + 1 < 0x1eb pulled back to the even x = 2b, is the range
# [-1, 0x1ea); intersecting it with x's stride-2 range wrapped its left end onto
# the new phase and CircleRange::intersect called it empty, so only the lower
# check bounded the table and its rows ran into the words after it. Stage: P2
# switch-model.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [ { space = 'ram', offset = '0x1000', name = 'tagged' } ]

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = ''

[script]
commands = [
    'lo fu tagged',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'OCAML-TAGGED #1: the table is bounded by both checks: its last row is case 0x1e8'
count = 1
regex = 'case 0x1e8:'

[[match]]
name = 'OCAML-TAGGED #2: no row past the upper check'
count = 0
regex = 'case 0x1e[a-f]:|case 0x1f'

[[match]]
name = 'OCAML-TAGGED #3: the dispatch is a switch, not a computed call'
count = 0
literal = 'jump-as-call'
