# Kuna GH-848, ARM MRS/MSR CPSR: P1 instruction semantics and P2 lifting.
# Strict architectural correctness fix, no P0 option. Before the fix the
# first two functions returned 0 with no status writes. The fixture checks
# IRQ-bit reads, register/immediate writes, and NZCVQ preservation/update.
# readCPSRControl/writeCPSRControl operate on architectural state supplied
# by an execution adapter; they do not alter host interrupts.

[image]
arch = 'ARM:LE:32:v5t'

[[image.bytes]]
space = 'ram'
offset = '0x1000'
readonly = true
hex = '00000fe1801080e301f021e1800000e21eff2fe100100fe18020c1e3002082e102f021e1800001e21eff2fe19ff021e300000fe1ff0000e21eff2fe10120a0e3000052e300f021e10700a0030300a0131eff2fe102f128e30700a0430300a0531eff2fe1'

[script]
commands = [
    'function bounds 0x1000 0x1014 as mask_irq',
    'parse line extern unsigned int mask_irq(void);',
    'function bounds 0x1014 0x102c as restore_irq',
    'parse line extern unsigned int restore_irq(unsigned int mask);',
    'function bounds 0x102c 0x103c as immediate_irq',
    'parse line extern unsigned int immediate_irq(void);',
    'function bounds 0x103c 0x1054 as control_flags',
    'parse line extern unsigned int control_flags(unsigned int mask);',
    'function bounds 0x1054 0x1064 as immediate_flags',
    'parse line extern unsigned int immediate_flags(void);',
    'load function mask_irq',
    'decompile',
    'print C',
    'load function restore_irq',
    'decompile',
    'print C',
    'load function immediate_irq',
    'decompile',
    'print C',
    'load function control_flags',
    'decompile',
    'print C',
    'load function immediate_flags',
    'decompile',
    'print C',
]

[[match]]
name = 'CPSR: reads retain architectural control state'
count = 3
literal = 'readCPSRControl()'

[[match]]
name = 'CPSR: writes retain architectural side effects'
count = 5
literal = 'writeCPSRControl('

[[match]]
name = 'CPSR: two helpers return the incoming IRQ bit'
count = 2
regex = 'return .* & 0x80;'

[[match]]
name = 'CPSR: immediate control write selects one byte'
count = 1
literal = 'writeCPSRControl(0x9f,0xff);'

[[match]]
name = 'CPSR: register control write keeps NZCVQ'
count = 1
literal = 'return 3;'

[[match]]
name = 'CPSR: immediate flag write updates NZCVQ'
count = 1
literal = 'return 7;'

[[match]]
name = 'CPSR: no constant-zero IRQ returns'
count = 0
literal = 'return 0;'
