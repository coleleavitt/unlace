[script]
commands = [
    'parse line extern int4 guarded(void);',
    'parse line extern int2 acquire(int4 *);',
    'parse line extern void mutate(int4 *);',
    'parse line extern void consume(int4);',
    'load function guarded',
    'decompile',
    'print C',
    'parse line extern int2 acquire(volatile int4 *);',
    'parse line extern void mutate(volatile int4 *);',
    'load function guarded',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'guarded stack read: capture stays inside success branch'
count = 2
regex = [
    'if \([^\n]*\) \{',
    'v[0-9]+ = v[0-9]+;',
    'v[0-9]+ = 0x17;',
]

[[match]]
name = 'guarded stack read: the capture never precedes the success branch'
count = 0
regex = [
    'acquire\([^;]*;',
    'v[0-9]+ = v[0-9]+;',
]

[[match]]
name = 'guarded stack read: saved value reaches consumer'
count = 2
regex = [
    'mutate\([^;]*;',
    'consume\(v[0-9]+\);',
]

[[match]]
name = 'guarded stack read: volatile reads retain observable qualifiers'
min = 2
max = 99
regex = '^  volatile (int|int4) v[0-9]+; // '
