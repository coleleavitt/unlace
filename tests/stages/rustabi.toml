# unlace: a rustc ScalarPair return (Result/Option) loses its payload twice - the
# producer's second return register is deleted, and at the call site the payload
# register is a local the function never assigns.
#
# Stage / sub-stage: P4 call and prototype model, output-prototype.
# P0 assertion:      option rustabi off|auto|always  (default off).
#
# Source (rustc 1.x, -C opt-level=2 -C panic=abort -C relocation-model=static,
# x86-64, bytes verbatim below; both functions are #[inline(never)]):
#
#     pub extern "Rust" fn prod(x: u32) -> Result<u32, u32> {
#         if x > 10 { Ok(x * 2) } else { Err(x + 7) }
#     }
#     pub extern "C" fn cons(x: u32) -> u32 {
#         match prod(x) { Ok(v) => v + 1, Err(e) => e + 100 }
#     }
#
#     prod:  lea (%rdi,%rdi,1),%ecx ; lea 0x7(%rdi),%edx ; xor %eax,%eax
#            cmp $0xb,%edi ; setb %al ; cmovae %ecx,%edx ; ret
#     cons:  push %rax ; call prod ; lea 0x1(%rdx),%esi ; lea 0x64(%rdx),%ecx
#            test $0x1,%al ; cmove %esi,%ecx ; mov %ecx,%eax ; pop %rcx ; ret
#
# rustc returns the Result in the EAX:EDX pair - EAX the variant discriminant,
# EDX the payload - which is the storage the x86-64 cspec's join_dual_class
# output rule already describes, and unlace already recovers.
#
# The bug (pass 1, the default): the discriminant is materialized as
# `xor %eax,%eax; setb %al`, so RAX is a ONE-BIT logical value. Subvariable flow
# truncates the RETURN to that width, deleting the other register with it, and
# `prod` recovers as `bool prod(uint4)` with no payload at all. The call site
# is whole in both passes: the two-register CALL output arm of
# buildOutputFromTrials is open on every image (unlace_callretpair.rs), so the
# call carries the join-space output and both halves are SUBPIECEs of it.
#
# The fix (pass 2, option rustabi always): the concatenation is recognized as a
# discriminant/payload pair from the observed writes and kept. `always` rather
# than `auto` because a bytechunk carries no `.comment` record for the
# source-language detection to read.
#
# The NEGATIVE half (scalar_callee / pair_shaped_reader, hand-written asm from
# tests fixture rust_clobber_pair_x86_64, verbatim below):
#
#     scalar_callee:       movq %rdi,%rax ; addq $7,%rax ; ret
#     pair_shaped_reader:  call scalar_callee ; lea 1(%rdx),%rcx
#                          lea 100(%rdx),%rsi ; testb $1,%al
#                          cmoveq %rsi,%rcx ; movq %rcx,%rax ; ret
#
# Byte for byte the caller-side shape of `cons` above - two used output trials,
# a byte-tested first register, a twice-read second one - but the callee
# PROVABLY never writes RDX. Nothing at the call site separates the two, so the
# call seam decodes the callee (`probe_callee_return_writes`) and refuses the
# pair. The reader must therefore render IDENTICALLY in both passes.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x201270', name = 'prod' },
    { space = 'ram', offset = '0x201290', name = 'cons' },
    { space = 'ram', offset = '0x201240', name = 'scalar_callee' },
    { space = 'ram', offset = '0x201250', name = 'pair_shaped_reader' },
]

[[image.bytes]]
space = 'ram'
offset = '0x201270'
readonly = true
hex = '''
8d0c3f8d570731c083ff0b0f92c00f43d1c3cccccccccccccccccccccccccccc
50e8daffffff8d72018d4a64a8010f44ce89c859c3
'''

[[image.bytes]]
space = 'ram'
offset = '0x201240'
readonly = true
hex = '''
4889f84883c007c30f1f840000000000
50e8eaffffff488d4a01488d7264a801
480f44ce4889c859c3
'''

[script]
commands = [
    'option partialaccess off',
    'option rustabi off',
    'lo fu prod',
    'decompile',
    'print C',
    'lo fu cons',
    'decompile',
    'print C',
    'lo fu pair_shaped_reader',
    'decompile',
    'print C',
    'option rustabi always',
    'lo fu prod',
    'decompile',
    'print C',
    'lo fu cons',
    'decompile',
    'print C',
    'lo fu pair_shaped_reader',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'RUSTABI #1: with rustabi off the producer collapses to the one-bit discriminant and the EDX payload is deleted'
count = 1
literal = 'bool prod(uint4 a0)'

[[match]]
name = 'RUSTABI #2: the consumer never reads the payload register as a local nothing assigns'
count = 0
literal = 'int4 v3; // edx'

[[match]]
name = 'RUSTABI #3: the call to prod never lacks an output'
count = 0
regex = '^  prod\(\);$'

[[match]]
name = 'RUSTABI #4: with the option on the producer returns the whole pair'
count = 1
literal = 'undefined16 prod(uint4 a0)'

# #5 pin re-recorded for the arraysubfield fix: the 4-byte EDX payload write
# into the `undefined1[16]` container renders as the sized sub-field `v2._8_4_`.  The
# one-byte discriminant write in the same function stays a subscript, a genuine
# in-element access, which is exactly the discrimination the fix makes (#11).
[[match]]
name = "RUSTABI #5: with the option on the payload half is written at the second register's offset"
count = 1
literal = 'v2._8_4_ = v1;'

[[match]]
name = 'RUSTABI #11: the one-byte discriminant write is a genuine element access and keeps its subscript'
count = 1
literal = 'v2[0] = a0 < 0xb;'

[[match]]
name = 'RUSTABI #6: in both passes the call has an output and the payload is connected to it'
count = 2
literal = 'v2 = prod();'

[[match]]
name = "RUSTABI #7: in both passes the consumer reads the payload out of the call's result, not out of thin air"
count = 4
literal = 'SUB124(v2,8)'

[[match]]
name = 'RUSTABI #8: in both passes the discriminant guard reads the same call result'
count = 2
literal = 'SUB128(v2,0) & 1'

[[match]]
name = 'RUSTABI #9: a callee proven never to write the second return register is not paired -- the reader is unchanged in BOTH passes'
count = 2
literal = 'int8 v3; // rdx'

[[match]]
name = 'RUSTABI #10: and its call keeps no output in either pass'
count = 2
regex = '^  scalar_callee\(\);$'
