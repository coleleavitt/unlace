# Darwin AArch64 stack probe (`option chkstkdarwin on|off`, default on).
#
# Apple clang calls ___chkstk_darwin, with the byte count in x9, before it
# allocates a frame larger than a page or a variable-length array. The probe
# writes no register but x9, x16/x17 and the flags, and the code after it
# reads the argument registers. The AArch64 prototype model kills x0, x1 and
# x8-x18 at every call, so those reads became the probe's return value or a
# register nothing assigns, and the functions lost their parameters.
#
# Stage / sub-stage: P2 flow classification. The action in
# p2_lift/unlace_chkstkdarwin.rs removes the probe call from the raw p-code
# before FuncLink and SSA.
#
# The XML wrapper only supplies the harness architecture. Both passes clear it
# and load chkstkdarwin_macho_arm64 (source chkstkdarwin.c, recipe in
# chkstkdarwin_macho_arm64.provenance) through the object bootstrap:
#   _big_frame   20,000-byte frame, probe called through the GOT
#                (adrp x16; ldr x16,[x16]; blr x16), k read from w0 after it
#   _vla_last    variable-length array, probe called through the GOT, the
#                index read from w0 and the size from x1 after it
#   _probe_stub  the probe called with bl through its __stubs entry, x0 and x1
#                read after it
#   0x100000520  that __stubs entry itself: its br x16 to the probe is a jump,
#                with no code after it, so it is left alone in both passes
#
#   chkstkdarwin_macho_arm64e (arm64e; source chkstkdarwin_arm64e.s, recipe
#   in the fixtures README): _big_e reaches the probe through its __auth_ptr
#   slot with adrp/ldr/blraaz x16, _vla_e with adrp x17/add/ldr x16,[x17]/
#   blraa x16,x17; authptrcall names the slot, so the same walk matches
#   chkstkdarwin_elf_aarch64 (AArch64 ELF; chkstkdarwin_elf_aarch64.s):
#   caller calls a defined function that is only named ___chkstk_darwin
#   and returns its result + 1; outside an Apple image the call stays
#
# Pass 1 (`option chkstkdarwin off`) reproduces the bug: each function takes
# no parameter and assigns the probe's "result".
# Pass 2 is the shipped default: the probe calls are gone and every function
# takes its parameters again.
#
# Assertions span the combined output of both passes.

[image]
arch = 'AARCH64:LE:64:v8A'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c0035fd6'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/chkstkdarwin_macho_arm64',
    'option alloca off',
    'option chkstkdarwin off',
    'read symbols',
    'load function _big_frame',
    'decompile',
    'print C',
    'load function _vla_last',
    'decompile',
    'print C',
    'load function _probe_stub',
    'decompile',
    'print C',
    'load function 0x100000520',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/chkstkdarwin_macho_arm64',
    'option alloca off',
    'read symbols',
    'load function _big_frame',
    'decompile',
    'print C',
    'load function _vla_last',
    'decompile',
    'print C',
    'load function _probe_stub',
    'decompile',
    'print C',
    'load function 0x100000520',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/chkstkdarwin_macho_arm64e',
    'option alloca off',
    'read symbols',
    'load function _big_e',
    'decompile',
    'print C',
    'load function _vla_e',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/chkstkdarwin_elf_aarch64',
    'option alloca off',
    'read symbols',
    'load function caller',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "CHKSTKDARWIN #1: off, all three functions assign the probe's result; on, none calls it"
count = 3
literal = '= __chkstk_darwin();'

[[match]]
name = 'CHKSTKDARWIN #2: off, big_frame loses its parameter'
count = 1
literal = 'int4 _big_frame(void)'

[[match]]
name = 'CHKSTKDARWIN #3: off, vla_last sizes its array from an x1 nothing assigns'
count = 1
literal = 'int8 v4; // x1'

[[match]]
name = 'CHKSTKDARWIN #4: on, big_frame takes k and indexes the frame with it'
count = 1
literal = 'int4 _big_frame(int4 a0)'

[[match]]
name = 'CHKSTKDARWIN #5: on, vla_last takes the index and the size'
count = 1
literal = '_vla_last(int4 a0,int8 a1)'

[[match]]
name = 'CHKSTKDARWIN #6: on, the array is sized from the size parameter'
count = 1
literal = '0xfffffffffffffff0 - (a1 + 0xfU & 0xfffffffffffffff0)'

[[match]]
name = 'CHKSTKDARWIN #7: on, the stub-called probe keeps x0 and x1'
count = 1
literal = 'int8 _probe_stub(int8 a0,int8 a1)'

[[match]]
name = 'CHKSTKDARWIN #8: off and on, the __stubs entry still jumps to the probe'
count = 2
literal = '__chkstk_darwin(); // jump-as-call'

[[match]]
name = 'CHKSTKDARWIN #9: arm64e, the probe called through its __auth_ptr slot (blraaz x16) is removed and big_e keeps k'
count = 1
literal = 'int4 _big_e(int4 a0)'

[[match]]
name = 'CHKSTKDARWIN #10: arm64e, the blraa x16,x17 form is removed too and vla_e keeps both arguments'
count = 1
literal = '_vla_e(int8 a0,int8 a1)'

[[match]]
name = 'CHKSTKDARWIN #11: an ELF function that is merely named ___chkstk_darwin keeps its call and its result'
count = 1
literal = 'return ___chkstk_darwin() + 1;'
