[package]
name = "unlace-cli"
version.workspace = true
edition.workspace = true

[dependencies]
unlace-ir = { workspace = true }
unlace-loader = { workspace = true }
unlace-lift = { workspace = true }
unlace-passes = { workspace = true }
unlace-struct = { workspace = true }
unlace-output = { workspace = true }
unlace-plugin = { workspace = true }
unlace-lumina = { path = "../unlace-lumina" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smallvec = { workspace = true }
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
memmap2 = "0.9"
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bin]]
name = "unlace"
path = "src/main.rs"

[[bench]]
name = "decompile_medium"
harness = false

[[bench]]
name = "spec_suite"
path = "../../benches/spec/suite.rs"
harness = false

[[bench]]
name = "hexrays_throughput"
path = "../../benches/hexrays_comparison/throughput.rs"
harness = false
