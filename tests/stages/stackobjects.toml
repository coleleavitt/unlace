[[match]]
name = 'one identity for unchanged contents'
count = 1
regex = '^object_40101d_1 stack=-0x18 size=8 state=defined$'

[[match]]
name = 'both uses of unchanged contents retained'
count = 1
regex = '^  use 0x401027:1 LifetimePair$'

[[match]]
name = 'two identities despite the same layout and address'
count = 2
regex = '^object_4010(4b|64)_1 stack=-0x18 size=8 state=defined$'

[[match]]
name = 'branch alternatives are defined'
count = 1
regex = '^  bytes 0..4 0x401079\|0x40108a$'

[[match]]
name = 'loop initial and backedge definitions share a family'
count = 1
regex = '^  bytes 0..4 0x4010b6\|0x4010cf$'

[[match]]
name = 'partial update retains the first byte'
count = 1
regex = '^  bytes 0..1 0x4010eb$'

[[match]]
name = 'partial update changes only the second byte'
count = 1
regex = '^  bytes 1..2 0x401104$'

[[match]]
name = 'partial update retains the other bytes'
count = 1
regex = '^  bytes 2..4 0x4010eb$'

[[match]]
name = 'partial update retains the second word across both uses'
count = 2
regex = '^  bytes 4..8 0x4010f2$'

[[match]]
name = 'all seven families are defined and option off adds none'
count = 7
regex = '^object_[0-9a-f]+_1 stack=-0x[0-9a-f]+ size=8 state=defined$'

[[match]]
name = 'known read-only calls do not add uncertain effects'
count = 0
regex = '^(object_4010[0-9a-f]+_1 .*state=uncertain|  bytes .*effect@)'

[[match]]
name = 'logical assertion selects the first initializer fields'
count = 1
literal = 'initial.left = 5;'

[[match]]
name = 'logical assertion selects the later initializer fields'
count = 2
literal = 'replacement.x = 9;'

[[match]]
name = 'logical retype keeps the first call at the named physical view'
count = 1
regex = 'read_pair\(\(LifetimePair \*\)&v[0-9]+\.initial\)'

[[match]]
name = 'later incarnation retains its independent named call view'
count = 2
regex = 'read_pair\(&v[0-9]+\.replacement\)'

[[match]]
name = 'rename after rebuilding updates initializer fields'
count = 1
literal = 'first_pair.left = 5;'

[[match]]
name = 'rename after rebuilding updates the call view'
count = 1
regex = 'read_pair\(\(LifetimePair \*\)&v[0-9]+\.first_pair\)'

[[match]]
name = 'late logical bindings never emit an undefined frame name'
count = 0
literal = '&Stackffffffffffffffe8'

[[match]]
name = 'locked layouts keep their declared physical object'
count = 1
literal = 'LifetimePair protected_pair;'

[[match]]
name = 'locked layouts expose one pointer per logical view'
count = 1
literal = 'LifetimePair *repeat_pair_view;'

[[match]]
name = 'logical pointers refer to the protected physical object'
count = 1
regex = 'repeat_pair_view = (\(LifetimePair \*\))?&protected_pair;'

[[match]]
name = 'unchanged contents reuse one logical pointer at both calls'
count = 2
literal = 'read_pair(repeat_pair_view)'

# Historical option-off labels below now forbid the old narrow parameter addresses.
[[match]]
name = 'option off still takes the incoming parameter address'
count = 0
literal = 'read_key((int4 *)&prepare_only)'

[[match]]
name = 'reused parameter bytes have complete native definitions'
count = 2
regex = '^object_4020(19|2d)_1 stack=0x8 size=4 state=defined$'

[[match]]
name = 'input condition survives local rename and logical naming'
count = 6
literal = 'if (!prepare_only)'

[[match]]
name = 'wider local rename keeps both native key stores'
count = 4
regex = 'key_storage = (10|0xb);'

[[match]]
name = 'first object name selects the wider parameter slot local'
count = 1
literal = 'first_key_view = (int4 *)&key_storage;'

[[match]]
name = 'second object name selects the same physical word'
count = 1
literal = 'second_key_view = (int4 *)&key_storage;'

[[match]]
name = 'option off aggregate still addresses the smaller parameter'
count = 1
literal = 'parameter_read_incoming_pair((LifetimeIncomingPair *)&prepare_only)'

[[match]]
name = 'fully overwritten aggregate parameter objects retain native definitions'
count = 2
regex = '^object_4030(20|38)_1 stack=0x8 size=8 state=defined$'

[[match]]
name = 'partial parameter object retains its incoming family'
count = 1
regex = '^object_40305d_1 stack=0x8 size=8 state=uncertain$'

[[match]]
name = 'synthetic initialization does not claim a native write'
count = 2
regex = '^  bytes 0..4 incoming$'

[[match]]
name = 'backing initialization reads the actual ABI parameter'
count = 12
regex = 'v[0-9]+\.view_bool = prepare_only;'

[[match]]
name = 'narrow writes target the physical backing'
count = 1
regex = 'v[0-9]+\.bytes\[0\] = 1;'

[[match]]
name = 'narrow writes do not name the formal parameter as a union'
count = 0
literal = 'prepare_only.bytes'

[[match]]
name = 'escaped addresses retain the shared backing'
count = 2
regex = 'dat_404008 = &v[0-9]+;'

[[match]]
name = 'named incoming families retain the same backing at their use'
count = 2
regex = 'parameter_read_incoming_pair\(&\(\(stack_views_40304b_p8_[0-9]+ \*\)&v[0-9]+\)->incoming_view\)'

[[match]]
name = 'named replacement retains its exact backing symbol'
count = 1
regex = 'parameter_read_handle\(&\(\(stack_views_40304b_p8_[0-9]+ \*\)&v[0-9]+\)->handle_view\)'

[[match]]
name = 'option off scalar escape names the incoming value'
count = 0
literal = 'dat_406000 = &prepare_only;'

[[match]]
name = 'option off equal-width reuse addresses the incoming float'
count = 1
literal = 'variant_read_float_handle((LifetimeHandle *)&prepared_value)'

[[match]]
name = 'escaped scalar storage keeps one physical backing'
count = 4
regex = 'dat_406000 = &v[0-9]+;'

[[match]]
name = 'equal-width float initializes from its formal input'
count = 1
regex = 'v[0-9]+\.view_float8 = prepared_value;'

[[match]]
name = 'equal-width input has no uninitialized shadow local'
count = 0
regex = 'float8 prepared_value_[0-9]+;'

[[match]]
name = 'both interior formals initialize the shared extent'
count = 3
regex = 'v[0-9]+\.view_int8_at8\.value = carried_value;'

[[match]]
name = 'partial input read receives the whole incoming word'
count = 1
regex = 'v[0-9]+\.view_int8 = incoming_word;'

[[match]]
name = 'larger objects preserve incoming rather than synthetic definitions'
count = 2
regex = '^object_4050(96|d2)_1 stack=0x8 size=16 state=uncertain$'

[[match]]
name = 'interior replacement retains its native definition'
count = 1
regex = '^object_4050ea_1 stack=0x10 size=8 state=defined$'

[[match]]
name = 'partial input read selects its offset view'
count = 1
regex = 'variant_read_word\(&v[0-9]+\.view_int4_at4\.value\)'

[[match]]
name = 'ordinary interior use selects its offset view'
count = 1
regex = 'variant_read_parameter_handle\(.*view_LifetimeHandle_at8\)\.value\)'

[[match]]
name = 'named interior use stays on its shared backing'
count = 1
regex = 'variant_read_parameter_handle\(.*interior_handle\)\.value\)'

[[match]]
name = 'named interior use never takes the formal address'
count = 0
regex = 'interior_handle_view = .*&carried_value;'

[[match]]
name = 'interior uses never emit undefined storage or partial tokens'
count = 0
regex = '(&Stack000000|Register00000020|\._8_8_)'

[[match]]
name = 'formal rename survives consecutive rebuilds in the signature'
count = 2
literal = 'bool source_flag)'

[[match]]
name = 'formal rename survives consecutive backing initializers'
count = 2
regex = 'v[0-9]+\.view_bool = source_flag;'

[[match]]
name = 'formal rename does not produce an uninitialized body shadow'
count = 0
literal = 'bool source_flag;'

[[match]]
name = 'dynamic first store survives before the first observer'
count = 2
regex = 'v[0-9]+\.view_uint4 = b;'

[[match]]
name = 'dynamic later store shares the backing'
count = 2
regex = 'v[0-9]+\.view_(u)?int4 = b \+ 7;'

[[match]]
name = 'dynamic observers never address the narrow input'
count = 0
literal = 'parameter_dynamic_observe(context,(uint4 *)&carried)'
