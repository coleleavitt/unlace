[package]
name = "unlace-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Whole-pipeline fuzz harness for unlace (load → lift → SSA → passes → c_printer)."
publish = false

# Library exposes `fuzz_iteration` for integration tests and external
# fuzz drivers; the binary is a tiny stdin reader so this harness can be
# plugged into AFL/honggfuzz/libFuzzer without taking on libfuzzer-sys's
# nightly + sanitizer build chain (per t467 scope).
[lib]
name = "unlace_fuzz"
path = "src/lib.rs"

[[bin]]
name = "unlace-fuzz"
path = "src/main.rs"

[dependencies]
unlace-ir = { workspace = true }
unlace-loader = { workspace = true }
unlace-lift = { workspace = true }
unlace-passes = { workspace = true }
unlace-output = { workspace = true }
unlace-cli = { workspace = true }
