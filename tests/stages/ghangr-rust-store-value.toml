[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/go_store_value_x86_64',
    'read symbols',
    'option outlang rust',
    'option ctypes off',
    'option realtypes off',
    'map prototype signed8 void signed8(struct Fields *p,uint1 a,uint1 b);',
    'map prototype unsigned16 void unsigned16(struct Fields *p,int2 a,int2 b);',
    'map prototype signed_xor32 void signed_xor32(struct Fields *p,int4 a);',
    'map prototype counted_destination struct Fields *counted_destination(struct Fields *p);',
    'map prototype counted_value uint8 counted_value(uint8 a,uint8 b);',
    'map prototype side_effect void side_effect(struct Fields *p,uint8 a,uint8 b);',
    'map prototype signed_plain64 void signed_plain64(int8 *p,uint8 a,uint8 b);',
    'load function signed8',
    'decompile',
    'print C',
    'load function unsigned16',
    'decompile',
    'print C',
    'load function signed_xor32',
    'decompile',
    'print C',
    'load function side_effect',
    'decompile',
    'print C',
    'load function signed_plain64',
    'decompile',
    'print C',
]

[[match]]
name = 'Rust signed byte store converts unsigned arithmetic'
count = 1
literal = '(*p).s8 = u8::wrapping_add(b,a) as i8'

[[match]]
name = 'Rust unsigned short store converts signed arithmetic'
count = 1
literal = '(*p).u16 = i16::wrapping_add(b,a) as u16'

[[match]]
name = 'Rust signed word store converts bitwise expression'
count = 1
literal = '(*p).s32 = (a as u32 ^ 1) as i32'

[[match]]
name = 'Rust side effect store converts returned value once'
count = 1
literal = '(*counted_destination(p)).s64 = v1 as i64'

[[match]]
name = 'Rust direct signed store converts unsigned arithmetic'
count = 1
literal = '*p = u64::wrapping_add(a,b) as i64'
