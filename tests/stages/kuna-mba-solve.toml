[script]
commands = [
    'parse line extern uint4 mba_addc(uint4 x);',
    'parse line extern uint4 mba_mulc(uint4 x);',
    'parse line extern uint4 mba_lin(uint4 x,uint4 y);',
    'parse line extern uint4 mba_and(uint4 x,uint4 y);',
    'parse line extern uint4 mba_neg(uint4 x,uint4 y);',
    'parse line extern uint4 mba_xor(uint4 x,uint4 y);',
    'parse line extern uint4 mba_orc(uint4 x);',
    'option mba off',
    'lo fu mba_addc',
    'decompile',
    'print C',
    'lo fu mba_mulc',
    'decompile',
    'print C',
    'lo fu mba_lin',
    'decompile',
    'print C',
    'lo fu mba_and',
    'decompile',
    'print C',
    'lo fu mba_neg',
    'decompile',
    'print C',
    'lo fu mba_xor',
    'decompile',
    'print C',
    'lo fu mba_orc',
    'decompile',
    'print C',
    'option mba on',
    'lo fu mba_addc',
    'decompile',
    'print C',
    'lo fu mba_mulc',
    'decompile',
    'print C',
    'lo fu mba_lin',
    'decompile',
    'print C',
    'lo fu mba_and',
    'decompile',
    'print C',
    'lo fu mba_neg',
    'decompile',
    'print C',
    'lo fu mba_xor',
    'decompile',
    'print C',
    'lo fu mba_orc',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'mba solve #1: off keeps (x ^ c) + 2*(x & c)'
count = 1
literal = 'return (x ^ 0x3039) + (x & 0x3039) * 2;'

[[match]]
name = 'mba solve #2: off keeps the product of constant masks'
count = 1
literal = '(~x & 0x4d) * (x & 0xffffffb2)'

[[match]]
name = 'mba solve #3: off keeps the or/xor/and sum'
count = 1
literal = '(x | y) * 2 - (x ^ y)'

[[match]]
name = 'mba solve #4: off keeps the shared complement'
count = 1
literal = '(x ^ 0xffffffff | y) - (x ^ 0xffffffff)'

[[match]]
name = 'mba solve #5: off keeps the complemented sum'
count = 1
regex = '\(x - 1U? \^ 0xffffffffU?\) \+ y'

[[match]]
name = 'mba solve #6: off keeps the and/or spelling of xor'
count = 1
literal = '(x ^ 0xffffffff) & y | x & (y ^ 0xffffffff)'

[[match]]
name = 'mba solve #7: off keeps the mask plus its complement'
count = 1
literal = 'return (x & 0xff00ff00) + 0xff00ff;'

[[match]]
name = 'mba solve #8: on folds a constant operand to x + c'
count = 1
literal = 'return x + 0x3039;'

[[match]]
name = 'mba solve #9: on folds the polynomial to x * c'
count = 1
literal = 'return x * 0x4d;'

[[match]]
name = 'mba solve #10: on solves a leaf plus one boolean term'
count = 1
regex = 'return \([xy] \^ [xy]\) \+ x;'

[[match]]
name = 'mba solve #11: on reads the shared complement as ~x'
count = 1
regex = 'return [xy] & [xy];'

[[match]]
name = 'mba solve #12: on reads ~ over a sum as -1 - sum'
count = 1
literal = 'return y - x;'

[[match]]
name = 'mba solve #13: on folds bit logic alone by its truth table'
count = 1
regex = 'return [xy] \^ [xy];'

[[match]]
name = 'mba solve #14: on folds a mask plus its complement to an or'
count = 1
literal = 'return x | 0xff00ff;'
