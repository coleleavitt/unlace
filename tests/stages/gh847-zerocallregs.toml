# GH-847 (unlace): gcc -fzero-call-used-regs ends every function by clearing
# the call-used registers that are not live at the return (xor %edx,%edx,
# xor %ecx,%ecx, .., pxor %xmm0,%xmm0 .. pxor %xmm15,%xmm15, then ret), so
# the register that carries the result is the one it leaves alone.  Return
# recovery scored the cleared registers as returned values: a function that
# returns its callee's eax printed `double put(..)` with `return 0.0;`, a
# double returner `return 0` from the cleared rax, a void function
# `return 0`, and a long an undefined16 whose upper half is the cleared rdx.
# Stage / sub-stage: P4 "output-prototype".  An output trial whose value
# at the RETURN is a zero the clearing run before the return wrote is
# retired before the output fill-in (unlace_zerocallregs.rs, always on).
# Chunk 0x100000: gcc 11.4 -O2 -fno-inline -fzero-call-used-regs=all
# -fcf-protection=none -c, all functions static noinline:
#   int check(int *p) { return *p > 10 ? -5 : 0; }
#   int put(int *p, int v) { int r = check(p); if (r) return r; *p = v; return 0; }
#   double scale(int x) { return x * 2.0; }
#   void setg(int *g, int x) { *g = x * 3; }
#   int zero(int *g) { *g += 1; return 0; }
#         (control: its xor %eax,%eax precedes the x87 fldz/fstp block)
#   zero_call_used_regs("all-gpr") long addg(long a, long b) { return a + b; }
#   zero_call_used_regs("all-gpr") double scaleg(int x) { return x * 2.0; }
#   zero_call_used_regs("skip") struct pr { long a, b; } zpair(void)
#         { struct pr p = {0, 0}; return p; }
#         (control: xor %eax,%eax; xor %edx,%edx; ret clears no register
#         outside the output entries, so it is no epilogue)
# Without the rule put returns the cleared xmm0, scale and scaleg the
# cleared rax, setg returns 0, and addg joins the cleared rdx above its
# long.  With it put returns nothing (its result is an unresolved call's, as
# without the epilogue), scale and scaleg return their double, setg is void
# and addg returns its long; zero and zpair are unchanged.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'check' },
    { space = 'ram', offset = '0x100090', name = 'put' },
    { space = 'ram', offset = '0x100130', name = 'scale' },
    { space = 'ram', offset = '0x1001c0', name = 'setg' },
    { space = 'ram', offset = '0x100250', name = 'zero' },
    { space = 'ram', offset = '0x1002e0', name = 'addg' },
    { space = 'ram', offset = '0x100300', name = 'scaleg' },
    { space = 'ram', offset = '0x100330', name = 'zpair' },
]

