# Processor-family smoke tests, run by `crates/unlace-cli/tests/processors.rs`.
#
# A [[family]] names a raw image (`fixture`, a path from the repository root, or `image`, a key
# of [images] holding hex bytes), its load `base` and its SLEIGH `language` id (a list runs
# every function once per language). Each [[family.function]] decompiles one address:
#   unlace decompile <image> <address> --raw-image --target <language> --base <base>
# A function passes when the run exits 0, its lowercased output contains neither "unimplemented"
# nor "bad instruction" nor any `forbid` entry (family and function lists add up), and its output
# contains every `expect` entry (case-sensitive). A function may override `language`; one with
# `xfail = "<why>"` is a known failure, reported until it passes (then the test fails: drop it).
# A new processor family adds a [[family]] here instead of a new *_raw.rs file
# (docs/processor-tests.md).

[images]
epiphany = """
