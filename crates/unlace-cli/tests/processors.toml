# The Epson S1C17 and S1C33 languages load little-endian raw images of two
# hand-assembled functions each (a compare-and-branch leaf whose constant needs
# the `ext` prefix, and a caller that loads through an `ext` displacement and
# fills a delayed call's slot) and decompile both.
[[family]]
name = "s1c17"
language = "S1C17:LE:24:default"
base = "0x0"
fixture = "crates/unlace-cli/tests/fixtures/s1c/s1c17_clamp_call.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "s1c17_ext_extended_compare_decompiles"
address = "0x0"
expect = [
    "a0 + a1 <= 100",
    "return 100;",
]

[[family.function]]
test = "s1c17_delayed_call_with_ext_displacement_decompiles"
address = "0x10"
expect = [
    "[1]",
    "sub_0(v1,5) ^ 3",
]

[[family]]
name = "s1c33"
language = "S1C33:LE:32:default"
base = "0x0"
fixture = "crates/unlace-cli/tests/fixtures/s1c/s1c33_max_call.bin"
forbid = ["halt_baddata"]

[[family.function]]
test = "s1c33_ext_extended_add_decompiles"
address = "0x0"
expect = [
    "if (a0 < a1)",
    "return a0 + 1000;",
]

[[family.function]]
test = "s1c33_delayed_call_with_ext_displacement_decompiles"
address = "0x10"
expect = [
    "[2]",
    "sub_0(v1,3) ^ 0x55",
]

