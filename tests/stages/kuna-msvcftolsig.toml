# MSVC __ftol-family helpers in a stripped PE (kuna_msvcftolsig).
#
# The kuna_msvcftol call-fixup is installed by name. In a stripped PE the
# statically linked helper has none, so `fld ...; call sub_XXXX` keeps the
# ST0 argument invisible and the feeding x87 expression is dead-code
# eliminated. The recognizer names the helpers from their VS2005 CRT bytes.
# The SSE2 entries return only EAX; __ftol and __ftol2 return EDX:EAX.
#
# Fixture: crates/unlace-analysis/tests/fixtures/ftolsig_pe_i386.exe
# (build notes in ftolsig_pe_i386.s). sub_401150 is VC8 /O2 output calling
# __ftol2_sse twice, sub_401033 calls __ftol, and sub_401042 calls a helper
# with the same contract that no signature knows: it stays argument-less
# until `function bounds ... as _ftol2` names it.

[image]
arch = 'x86:LE:32:default:windows'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/ftolsig_pe_i386.exe',
    'read symbols',
    'functions',
    'load function sub_401150',
    'decompile',
    'print C',
    'load function sub_401033',
    'decompile',
    'print C',
    'load function sub_401042',
    'decompile',
    'print C',
    'function bounds 0x401060 as _ftol2',
    'load function sub_401042',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'MSVCFTOLSIG #1: the stripped helpers are named from their bytes'
count = 5
regex = '^0x40(1070 __ftol2_sse|1079 __ftol2_pentium4|108c __ftol2_sse_excpt|10a6 __ftol2|1120 __ftol)$'

[[match]]
name = 'MSVCFTOLSIG #2: no recognized helper is called without its argument'
count = 0
regex = '(sub_401070|sub_401120|__ftol2_sse|__ftol)\(\)'

[[match]]
name = 'MSVCFTOLSIG #3: the first __ftol2_sse operand survives as a 32-bit conversion'
count = 1
literal = '*a3 = (int4)((float10)a0[2] * (float10)a1[1] + ((float10)a0[1] * (float10)*a1 + (float10)a2 * (float10)*a0));'

[[match]]
name = 'MSVCFTOLSIG #4: the second __ftol2_sse operand survives and EDX stays out of the return'
count = 1
regex = '^int4 sub_401150\(float4 \*a0,float4 \*a1,float4 a2,int4 \*a3\)'

[[match]]
name = 'MSVCFTOLSIG #5: the __ftol operand survives'
count = 1
literal = 'return (int8)((float10)*a0 * (float10)a0[1]);'

[[match]]
name = 'MSVCFTOLSIG #6: an unrecognized helper stays argument-less'
count = 1
regex = '^  sub_401060\(\);'

[[match]]
name = 'MSVCFTOLSIG #7: declaring its name installs the fixup'
count = 1
literal = 'return (int8)((float10)((float4 *)a0)[2] + (float10)((float4 *)a0)[3]);'
