# unlace re-bytecode-reader-return-discarded: a call whose cspec output rule
# asked for a register PAIR got no output at all, and both halves rendered
# as locals the function never assigns.
#
# FuncCallSpecs::buildOutputFromTrials (fspec.cc:5777) moves the single used
# output trial to the CALL; upstream also handles two, and unlace shipped that
# arm as a stub.  The x86-64 System V cspec returns any 16-byte aggregate in
# RAX:RDX and says so with its join_dual_class output rule, so a caller that
# reads both registers puts two active trials on the call.  With the arm
# stubbed the INDIRECT creations standing for "the callee wrote something
# here" survived and the returned value had no definition anywhere.
#
# The vector is sub_9d9c0 of a stripped gcc 9.4 QuickJS interpreter
# (challenge 673da52e9b533b4c22bd2eeb), whose JSValue-returning call to
# sub_875e0 at 0x9d9d8 rendered as a bare statement followed by a cast of an
# unassigned rdx local.  Reduced to one call and assembled from
# crates/unlace-analysis/tests/fixtures/callretpair_x86_64.s:
#
#     401020  push %rbx
#     40102b  call read_value            ; returns { void *u; long tag; }
#     401030  mov  %rax,%rbx             ; the payload half
#     401033  cmp  $0x6,%edx             ; the tag half, JS_TAG_EXCEPTION
#
# read_tag_clobber is the control: no_payload provably never writes rdx, so
# the bounded callee decode refuses the pair and the call returns RAX alone.
# The 7 the caller left in rdx before the call is still there after it
# (calleeiparead: the caller reads rdx before writing it), so the tag test
# folds and no unassigned rdx local is left.
#
# Phase: P4 output prototype (unlace_callretpair.rs, always on).  The join
# output and both halves are pinned; the control keeps its bare call.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401000', name = 'read_value' },
    { space = 'ram', offset = '0x401020', name = 'read_tag' },
    { space = 'ram', offset = '0x401050', name = 'no_payload' },
    { space = 'ram', offset = '0x401060', name = 'read_tag_clobber' },
    { space = 'ram', offset = '0x402000', name = 'buf' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = '''
488b06488b560885c97507ba0600000031c0c366662e0f1f840000000000669053b901000000ba10000000e8d0ffffff4889c383fa067408488b0348
01d05bc348c7c0ffffffff5bc30f1f8000000000488b074883c001c30f1f84000000000053ba07000000e8e5ffffff4889c383fa067408488b034801
d05bc348c7c0ffffffff5bc3488d35750f000031ffe88effffff4889c7e8c6ffffffb83c0000000f05
'''

[[image.bytes]]
space = 'ram'
offset = '0x402000'
hex = '00000000000000000300000000000000'

[script]
commands = [
    'lo fu read_tag',
    'decompile',
    'print C',
    'lo fu read_tag_clobber',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'CALLRETPAIR #1: the call is never a bare statement with its JSValue discarded'
count = 0
regex = '^  read_value\(a0,a1,0x10,1\);$'

[[match]]
name = 'CALLRETPAIR #2: the call gains the 16-byte join output the cspec output rule asked for'
count = 1
literal = 'v1 = read_value(a0,a1,0x10,1);'

[[match]]
name = 'CALLRETPAIR #3: both halves are SUBPIECEs of the call output instead of locals with no definition'
count = 1
literal = 'return *SUB168(v1,0) + SUB168(v1,8);'

[[match]]
name = 'CALLRETPAIR #4: no unassigned rdx local survives, in the pair or in the control'
count = 0
regex = '^  int8 v[0-9]+; // rdx$'

[[match]]
name = 'CALLRETPAIR #5: the control is not paired: its call returns RAX alone and the 7 left in rdx crosses it'
count = 1
regex = 'no_payload\([^)]*\) \+ 7;$'

[[match]]
name = 'CALLRETPAIR #6: the integer return stays separate from the pointer payload'
count = 1
literal = 'int8 read_tag(unsigned long a0,unsigned long a1)'
