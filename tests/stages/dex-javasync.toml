# Kuna DEX loader, synchronized and finally: P9 Java output, option
# javasync (default off; dex-javatry.xml covers the off form). The
# script loads the committed DEX fixture built from
# tests/stages/fixtures/dex/Tries.java and prints Java with the option on.
#
# Asserts #1-#2: sync's try, whose catch-all releases the monitor and
# rethrows, prints as synchronized (a0) { } with no monitor call left.
# Asserts #3-#5: withFinally's catch-all, which repeats the append the
# normal path runs after the try, prints as a finally clause; the rethrow
# and the normal path's copy go.

[image]
arch = 'Dalvik:LE:32:DEX_Android12'
symbols = [
    { space = 'ram', offset = '0x0', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x0'
readonly = true
hex = '0e00'

[script]
commands = [
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'option javasync on',
    'read symbols',
    'load function demo::Tries::sync',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/stages/fixtures/dex/tries.dex',
    'option setlanguage java-language',
    'option javasync on',
    'read symbols',
    'load function demo::Tries::withFinally',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'javasync #1: sync prints synchronized (a0)'
count = 1
literal = 'synchronized (a0) {'

[[match]]
name = 'javasync #2: no monitor call is left'
count = 0
regex = 'monitorEnter|monitorExit'

[[match]]
name = 'javasync #3: withFinally prints a finally clause'
count = 1
literal = [
    'finally {',
    'a0.append(v2);',
    '}',
]

[[match]]
name = 'javasync #4: the finally code prints once'
count = 1
literal = 'a0.append(v2);'

[[match]]
name = 'javasync #5: no catch-all or rethrow is left'
count = 0
regex = 'catch \(Throwable|throw v'
