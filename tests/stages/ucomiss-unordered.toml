[[match]]
name = 'UCOMISS unordered #1: seta is one < x'
count = 1
literal = 'return one < x;'

[[match]]
name = 'UCOMISS unordered #2: setae is one <= x'
count = 1
literal = 'return one <= x;'

[[match]]
name = 'UCOMISS unordered #3: setbe keeps the unordered case'
count = 1
literal = 'return !(one < x);'

[[match]]
name = 'UCOMISS unordered #4: setb keeps the unordered case'
count = 1
literal = 'return !(one <= x);'

[[match]]
name = 'UCOMISS unordered #5: sbb borrow keeps the unordered case'
count = 1
literal = '-(uint4)!(y <= x)'

[[match]]
name = 'UCOMISS unordered #6: jbe branch is one < x'
count = 1
literal = 'if (one < x)'

[[match]]
name = 'UCOMISS unordered #7: nanignore none keeps the guards'
count = 1
literal = '(NAN(x) || NAN(one)) || x <= one'

[[match]]
name = 'UCOMISS unordered #8: no ordered spelling of an unordered flag'
count = 0
regex = 'x != one|return x <= one;|return x < one;|!\(x <= one\)|!\(x < one\)|\(x < y\)'

[[match]]
name = 'UCOMISS unordered #9: an isnan test beside an exact jbe stays'
count = 1
literal = 'if ((!NAN(x)) && (!(huge < x)))'

[[match]]
name = 'UCOMISS unordered #10: setnp beside an exact setb stays'
count = 1
literal = '(!NAN(x) && !NAN(y)) && !(y <= x)'

# Compare the same NaN test across output languages at each width.
[[match]]
name = 'UCOMISS unordered #11: setp beside an exact seta stays'
count = 1
regex = [
    'return bound < x \|\| NAN\(x\);',
    '^\}$',
    '^$',
    '^func nan_or_above\(x float64\) int32 \{$',
    '^  return .*\(bound < x \|\| math\.IsNaN\(x\)\)$',
    '^\}$',
    '^$',
    '^$',
    '^#\[allow\(',
    '^unsafe fn nan_or_above\(mut x: f64\) -> i32$',
    '^\{$',
    '^  return \(bound < x \|\| NAN\(x\)\) as i32;$',
    '^\}$',
]

[[match]]
name = 'UCOMISS unordered #12: setnp beside an exact setb through a pointer stays'
count = 1
regex = [
    'return !\(limit <= x\) && !NAN\(x\);',
    '^\}$',
    '^$',
    '^func ordered_below\(x float32\) int32 \{$',
    '^  return .*\(!\(limit <= x\) && !math\.IsNaN\(float64\(x\)\)\)$',
    '^\}$',
    '^$',
    '^$',
    '^#\[allow\(',
    '^unsafe fn ordered_below\(mut x: f32\) -> i32$',
    '^\{$',
    '^  return \(!\(limit <= x\) && !NAN\(x\)\) as i32;$',
    '^\}$',
]

[[match]]
name = 'UCOMISS unordered #13: jp then jbe on one memory compare'
count = 1
literal = 'if ((!NAN(x) && !NAN(limit)) && (limit < x))'

[[match]]
name = 'UCOMISS unordered #14: no NaN test dropped beside an exact compare'
count = 0
regex = 'if \(x <= limit\)|return x < limit;|!\(x < bound\)|!\(x <= huge\)'

[[match]]
name = 'UCOMISS unordered #15: a guard hoisted out of the branch keeps its NaN test (gcc -O1/-Os)'
count = 4
literal = '!NAN(x) && !(y <= x)'

[[match]]
name = 'UCOMISS unordered #16: the hoisted guard never prints unguarded'
count = 0
regex = 'return x < y;|= x < y;'
