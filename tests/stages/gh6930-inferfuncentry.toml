# GH-6930: function pointer argument rendered as 0x100000 (image base) instead of
# the function symbol.  https://github.com/NationalSecurityAgency/ghidra/issues/6930
#
# evhttp_write_cb has its entry at the rebased image base 0x100000.  It is passed as
# the writecb argument to the (undeclared) external bufferevent_setcb.  The sibling
# callback evhttp_error_cb (entry 0x105790) renders as a name, but the function at the
# base renders as the bare literal 0x100000.
#
# Root cause: ActionConstantPtr::isPointer (coreaction.cc) rejects the constant via the
# "bit_transitions(off,sz) less-than 3" bit-flag/mask heuristic.  0x100000 (one set bit,
# 1 shifted left by 20) has a single bit transition, so the constant is never turned
# into a symbol reference and prints as the raw literal.  Stage model: S5 sub-stage
# const-pointer ("is this constant an address?"); unlace_inferfuncentry.rs (always on)
# skips the rejection for a constant that resolves exactly to a function entry.
#
# The script runs with option irverify on (GH-1561): rule subvar_compzero
# narrows a one-bit test into a COPY of a new BOOL_NEGATE, which a later rule
# of the same pool folds into a BOOL_OR; SubvariableFlow once inserted it
# after that COPY in the same block, and irverify named oppool1 (GH6930 #3).

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'evhttp_write_cb' },
    { space = 'ram', offset = '0x105790', name = 'evhttp_error_cb' },
    { space = 'ram', offset = '0x1029e0', name = 'evhttp_send_reply_chunk_with_cb' },
    { space = 'ram', offset = '0x110000', name = 'bufferevent_get_output' },
    { space = 'ram', offset = '0x110010', name = 'evbuffer_get_length' },
    { space = 'ram', offset = '0x110020', name = 'evbuffer_add_buffer' },
    { space = 'ram', offset = '0x110030', name = 'bufferevent_setcb' },
    { space = 'ram', offset = '0x110040', name = 'bufferevent_enable' },
    { space = 'ram', offset = '0x110050', name = 'evbuffer_add_printf' },
    { space = 'ram', offset = '0x110060', name = 'event_debugx_' },
    { space = 'ram', offset = '0x110070', name = 'evbuffer_add' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'f30f1efac3'

[[image.bytes]]
space = 'ram'
offset = '0x105790'
readonly = true
hex = 'f30f1efac3'

