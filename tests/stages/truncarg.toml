[[match]]
name = 'truncarg #1: a narrowed product keeps its 16-bit truncation'
count = 1
literal = 'sink((uint2)(a0 * 3));'

[[match]]
name = 'truncarg #2: a narrowed byte sum keeps its 8-bit truncation'
count = 1
literal = "sink((uint1)(a0 + '\\x01'));"

[[match]]
name = 'truncarg #3: a narrowed negation keeps its 16-bit truncation'
count = 1
literal = 'sink((uint2)-a0);'

[[match]]
name = 'truncarg #4: the promoted forms are never printed'
count = 0
regex = 'sink\((a0 \* 3|-a0|a0 \+ )'

[[match]]
name = 'truncarg #5: an input whose promotion zero-extends gets no cast'
count = 1
literal = 'sink(a0);'

[[match]]
name = 'truncarg #6: a sign extension is untouched'
count = 1
literal = 'sink((int4)a0);'

[[match]]
name = 'truncarg #7: a declared narrow parameter converts the argument itself'
count = 1
literal = 'sinkd(a0 * 3);'

[[match]]
name = 'truncarg #8: a trimmed byte load printed as char keeps its zero-extension'
count = 1
literal = 'sink((uint1)((char *)a0)[3]);'

[[match]]
name = 'truncarg #9: an AND of unsigned byte loads gets no cast'
count = 1
literal = 'sink(((uint1 *)a0)[1] & ((uint1 *)a0)[2]);'

[[match]]
name = 'truncarg #10: a sum that provably fits its byte gets no cast'
count = 1
literal = "sink((a0 != 2) + '\\x06');"

[[match]]
name = 'truncarg #11: a narrow parameter forwarded untouched keeps its promoted form'
count = 2
literal = 'sinkf(a0);'

[[match]]
name = 'truncarg #12: a byte nothing zero-extended gets no unsigned cast'
count = 0
literal = 'sinkf((uint1)'
