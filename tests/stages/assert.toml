# unlace infrastructure test: the typed assertion API (kassert).
#
# Proves the stage-model.md section-12 facade end to end:
#   - kassert validates <stage>/<substage> against the registry catalog and
#     routes to the EXISTING stores (option database, symbol DB + namelock);
#   - the applied assertions have exactly the effect of the legacy surfaces
#     they wrap (compareform option; rename+namelock);
#   - the renamed parameter is declared in the signature as well as read in
#     the body, including after the console rebuilds its prototype store;
#   - `kassert list` reports each assertion with its strength and its
#     COMPUTED MINIMAL REWIND SCOPE (P3 for the canonicalization config,
#     P9 for the cosmetic name) - the observable half of scoped re-run.
#
# Reuses the GH-558 bytes (int gh558(int x) { if (x <= 8) return 1; return 0; }).

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'gh558' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '83ff087f06b801000000c331c0c3'

[script]
commands = [
    'option boolreturn off',
    'parse line extern int4 gh558(int4 x);',
    'lo fu gh558',
    'decompile',
    'kassert P3 comparison-canonicalization original',
    'kassert P9 naming-policy x xvar hint',
    'decompile',
    'decompile',
    'print C',
    'kassert list',
    'quit',
]

[[match]]
name = 'UNLACE-ASSERT #1: routed assertions take effect (compareform original + namelock rename)'
count = 2
regex = '^int4 gh558\(int4 xvar\)$|^  if \(xvar <= 8\)$'

[[match]]
name = 'UNLACE-ASSERT #2: kassert list reports the P3 config assertion with rewind scope'
count = 1
literal = '[gh558] P3/comparison-canonicalization original  strength=HARD  rewind->P3'

[[match]]
name = 'UNLACE-ASSERT #3: kassert list reports the cosmetic P9 assertion as HINT via HARD mechanism'
count = 1
literal = '[gh558] P9/naming-policy x xvar  strength=HINT (applied via HARD mechanism)  rewind->P9'
