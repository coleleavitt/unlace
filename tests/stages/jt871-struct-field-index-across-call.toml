# #871: a switch index read from a stack struct whose address is passed to a
# call must not be folded to the value stored before the call.
#
# MSVC i386 shape (PEGRP32F.dll sub_102fcc20): an SEH registration record
# (`lea eax,[ebp-0xc]; mov fs:0,eax`), an 11-dword struct at [ebp-0x38]
# zeroed through `xor eax,eax`, `fill(a, b, &s, &obj)`, then
# `switch (s.f4 - 2)` through a byte index table and a jump table.
#
# Jump tables are recovered on a partial clone of the function. Two things let
# the clone fold the index: it never got its local window (#918), and its
# switch-path protection stopped at the `xor eax,eax` that zeroes the struct,
# so with the struct's address unseen there (the calls have no inputs yet)
# RuleIndirectCollapse dropped the INDIRECT the call puts on the field and the
# index folded to the pre-call 0: "Switch with 1 destination removed ... 5
# cases all go to same destination", and the cases vanished. Ghidra 12.1.4
# recovers the switch.
#
# Source of the bytes (gcc -m32 -c, ld -Ttext=0x10001000
# --section-start=.rodata=0x10002000 -Tdata=0x10003000):
#   sub: SEH prologue; if (p == 0 && q == 0) return 0x80070057;
#        s = {0}; init(&obj); r = fill(x, y, &s, &obj); if (r < 0) return r;
#        switch (s.f4 - 2) via idxtbl/jtbl: 0, 0x27 -> g0 = 1; 8, 0x34 -> g1 = 2;
#        9, 0x5b -> g2 = 3; 0x1a, 0x1b -> g3 = 4; default -> g4 = 5.

[image]
arch = 'x86:LE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x10001000', name = 'jt871' },
]

