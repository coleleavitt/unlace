# kuna option bejoin callers (the default), GH-904: MIPS PIC callers and
# unaligned loads.
#
# MIPS PIC code (gcc's and clang's default for a shared object) calls
# through the GOT, `lw $25,%call16(add64)($28); jalr $25`, so the caller
# evidence, which scanned only for jal/bal, saw no caller of add64 and its
# 64-bit sum stayed joined low word first:
#     return CONCAT44(a1 + a3,(uint4)(a1 + a3 < a1) + a0 + a2);   (bug)
# A jalr $25 is now a call to the function the GOT entry its load names
# holds, read at the GOT pointer the caller's prologue computes from $t9,
# when nothing between the load and the call branches or writes the
# registers it uses.  c_add stores both words of add64's pair.
#
# An unaligned load into $3 right after a call (lwl $3,1($16);
# lwr $3,4($16)) named $3 as an input, since each half merges memory into
# the register, and read as the call's low word: add_hi, the int over the
# high word of a sum, which leaves the carry in $3, was proven 64-bit by
# c_unal and c_unal joined its call v0:v1.  The pair overwrites $3 and
# reads nothing of it.
#
# Stage: P4 calls and prototypes (output-prototype), option bejoin.
# Pass 1 is the default (callers), pass 2 option bejoin evidence.
#
# Images: crates/unlace-analysis/tests/fixtures/bejoin_mipspic_O2.so
# (bejoin_mipspic.c) and bejoin_mipsunal (bejoin_mipsunal.S); see
# bejoin_mipspic.provenance.
#
# Assert #1: the default returns add64's sum high word first; evidence
#   keeps it low word first, and add_hi stays an int in both passes.
# Assert #2: c_unal reads add_hi's result as an int in both passes, since
#   the unaligned pair is one load and reads nothing of $3
#   (mipsunaligned.xml).

[image]
arch = 'MIPS:BE:32:default:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '03e0000800000000'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/bejoin_mipspic_O2.so',
    'option typevote off',
    'read symbols',
    'lo fu add64',
    'decompile',
    'print C',
    'lo fu add_hi',
    'decompile',
    'print C',
    'option bejoin evidence',
    'lo fu add64',
    'decompile',
    'print C',
    'lo fu add_hi',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/bejoin_mipsunal',
    'option typevote off',
    'read symbols',
    'option bejoin callers',
    'lo fu c_unal',
    'decompile',
    'print C',
    'option bejoin evidence',
    'lo fu c_unal',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "bejoin-mipspic #1: the default returns add64's sum high word first"
count = 1
literal = 'return CONCAT44((uint4)(a1 + a3 < a1) + a0 + a2,a1 + a3);'

[[match]]
name = 'bejoin-mipspic #1b: evidence keeps add64 low word first'
count = 1
literal = 'return CONCAT44(a1 + a3,(uint4)(a1 + a3 < a1) + a0 + a2);'

[[match]]
name = 'bejoin-mipspic #1c: add_hi stays an int in both passes'
count = 2
literal = 'int4 add_hi(int4 a0,uint4 a1,int4 a2,int4 a3)'

[[match]]
name = "bejoin-mipspic #2: c_unal reads add_hi's result as an int in both passes"
count = 2
literal = 'int4 v2; // v0'

[[match]]
name = 'bejoin-mipspic #2b: nothing joins it v0:v1'
count = 0
literal = '// v0:v1'
