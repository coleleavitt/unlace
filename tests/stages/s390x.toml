# Unlace #1635: IBM z/Architecture (s390x) processor support, first slice.
# Stage: P1 load (EM_S390 -> s390x:BE:64:default, PLT stub naming),
# P2 p-code lift (specs/Ghidra/Processors/s390x), P4 prototypes (s390x.cspec).
# No option: a processor module is inert on every other target.
#
# The script loads the committed ELF built from
# crates/unlace-cli/tests/fixtures/s390x/s390x_abi.c (clang -O2,
# -mcpu=z196). Before this change the load failed with "unsupported machine
# S390x", so every assert below is the fixed output.
#
# #1-#2  r2..r6 carry the arguments, r2 the result, and the PLT stub is named.
# #3     a load-on-condition (`locgr`) over a signed compare folds to one relation.
# #4     an unsigned compare-and-branch keeps its unsignedness.
# #5     the sixth and seventh arguments are read from 160(r15) and 168(r15).
# #6     DLGR's 128-bit dividend pair folds to one divide and one remainder.
# #7-#8  the jump table of `pick` is recovered, with calls through the PLT.
# #9     STMG/LMG save and restore named registers, so no register store
#        survives into the body of a function with a frame, and both calls
#        of the issue's `twice` reach the named import.
# #10    binary floating point: f0/f2 arguments, f0 result, MADBR.

[image]
arch = 's390x:BE:64:default:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '07fe'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/s390x/s390x_abi.elf',
    'read symbols',
    'load function twice',
    'decompile',
    'print C',
    'load function scaled',
    'decompile',
    'print C',
    'load function larger',
    'decompile',
    'print C',
    'load function below',
    'decompile',
    'print C',
    'load function seven',
    'decompile',
    'print C',
    'load function quotrem',
    'decompile',
    'print C',
    'load function pick',
    'decompile',
    'print C',
    'load function frame',
    'decompile',
    'print C',
    'load function blend',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 's390x #1: r2 and r3 arrive as parameters'
count = 1
regex = '^int8 scaled\(int8 a0,int8 a1\)'

[[match]]
name = 's390x #2: the PLT stub is named and its argument and result are kept'
count = 1
literal = 'return ext(a0 * 3 + a1) + 1;'

[[match]]
name = 's390x #3: locgr after a signed compare is one relation'
count = 1
literal = 'if (a0 <= a1)'

[[match]]
name = 's390x #4: the unsigned compare keeps unsigned operands'
count = 1
literal = 'below(uint4 a0,uint4 a1)'

[[match]]
name = 's390x #5: arguments six and seven come from the stack'
count = 1
literal = 'return a0 + a1 + a2 + a3 + a4 + a5 + a6;'

[[match]]
name = 's390x #6: the dividend pair folds to a divide and a remainder'
count = 1
literal = 'return a0 % a1 + a0 / a1;'

[[match]]
name = 's390x #7: the jump table is a switch'
count = 1
literal = 'switch(a0)'

[[match]]
name = 's390x #8: a case calls through the PLT'
count = 1
literal = 'ext2(1,0x16) + 1;'

[[match]]
name = 's390x #9: no saved register leaks out of a prologue and no call target is unnamed'
count = 0
regex = 'unaff_|in_r1[0-5]|halt_baddata|sub_[0-9a-f]+'

[[match]]
name = 's390x #10: a double multiply-add on f0 and f2'
count = 1
regex = '^float8 blend\(float8 a0,float8 a1\)'
