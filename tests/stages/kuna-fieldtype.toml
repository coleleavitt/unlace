# Cast campaign, lever `fieldtype`: a synthesized record's field that some
# access holds as a pointer is declared as that pointer.
#
# structsynth types a field from the widest access it measured, and among
# accesses of one width the first it meets decides. At -O0 a field is
# reloaded for every use, so the first load of a buffer field is the one an
# integer add reads, and the field is declared int8 although the next load
# hands it to memmove. Every pointer use then prints a cast back:
#
#     memmove((void *)a0->field_0x0,(void *)(a0->field_0x0 + (a0->field_0x8 - a0->field_0x10)),a0->field_0x10);
#
# Stage / sub-stage: P5 "aggregate-union". The P0 assertion
# `option fieldtype on|off` decides whether structsynth declares such a field
# as the most specific pointer its accesses prove: a value dereferenced,
# called, handed to a declared pointer parameter or returned by a function
# declared to return one. A type a value picks up by being merged with
# another value is not proof, and a field some access divides, shifts,
# multiplies or compares with sign stays a number.
#
# The fixture is crates/unlace-analysis/tests/fixtures/fieldtype_x86_64.c.
# Built by gcc -O0:
#
#     buf_shift:   sort's fillbuf - the buffer is added to, then handed to
#                  memmove; it becomes the void * memmove proves (the char *
#                  the loop walks reaches it only through the loop's phi)
#     ent_release: ls's free_ent - a context compared with a sentinel, then
#                  handed to strlen and free
#     ops_run:     a function-pointer field compared with zero, then called
#     range_walk:  sort's mergelines_node - two walking pointers and the two
#                  end pointers nothing but the loop test compares them with;
#                  the end pointers take the walking pointers' type. The
#                  pointer differences cast both sides back to an integer,
#                  the price of the right type
#     cell_val:    a control - a union member read as a double and as a
#                  pointer stays raw bytes in both passes
#     slot_post:   a control - an index read at a table, then handed to
#                  write as its buffer, stays a number in both passes
#
# Built by clang -O2, with `option operand_refs on` so the "NULL" constant is
# a string as the CLI's default mode makes it:
#
#     pctx_print:  a control, e2fsck's expand_percent_expression - the number
#                  is compared first, then every case sinks into one fprintf,
#                  so the number and the string reach it through one register
#                  typed char *. The number stays a number in both passes
#
# Pass 1 (`option fieldtype off`, the default) reproduces the casts and pass 2
# (`option fieldtype on`) is the fix.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/fieldtype_gcc_O0_x86_64',
    'option libcnames off',
    'option fieldtype off',
    'read symbols',
    'lo fu buf_shift',
    'decompile',
    'print C',
    'lo fu ent_release',
    'decompile',
    'print C',
    'lo fu ops_run',
    'decompile',
    'print C',
    'lo fu range_walk',
    'decompile',
    'print C',
    'lo fu cell_val',
    'decompile',
    'print C',
    'lo fu slot_post',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/fieldtype_gcc_O0_x86_64',
    'option libcnames off',
    'option fieldtype on',
    'read symbols',
    'lo fu buf_shift',
    'decompile',
    'print C',
    'lo fu ent_release',
    'decompile',
    'print C',
    'lo fu ops_run',
    'decompile',
    'print C',
    'lo fu range_walk',
    'decompile',
    'print C',
    'lo fu cell_val',
    'decompile',
    'print C',
    'lo fu slot_post',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/fieldtype_clang_O2_x86_64',
    'option operand_refs on',
    'option fieldtype off',
    'read symbols',
    'lo fu pctx_print',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/fieldtype_clang_O2_x86_64',
    'option operand_refs on',
    'option fieldtype on',
    'read symbols',
    'lo fu pctx_print',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'fieldtype #1: with the option off the buffer is an integer and memmove gets it through two casts - the bug'
count = 1
literal = 'memmove((void *)a0->field_0x0,(void *)(a0->field_0x0 + (a0->field_0x8 - a0->field_0x10)),a0->field_0x10);'

[[match]]
name = 'fieldtype #2: with the option on the buffer is the void * memmove proves and memmove takes it as it is'
count = 1
literal = 'memmove(a0->field_0x0,(void *)((int8)a0->field_0x0 + (a0->field_0x8 - a0->field_0x10)),a0->field_0x10);'

[[match]]
name = 'fieldtype #3: with the option on the loop takes the buffer as it is, and indexes it as the char * it walks'
count = 1
regex = 'for \(v1 = a0->field_0x0; v1 [<] &\(\(char \*\)a0->field_0x0\)\[a0->field_0x8\]; v1 = &v1\[1\]\)'

[[match]]
name = 'fieldtype #4: with the option off strlen gets the context through a cast'
count = 1
literal = 'v2 = strlen((char *)a0->field_0x10);'

[[match]]
name = 'fieldtype #5: with the option on the context is the char * strlen takes'
count = 1
literal = 'v2 = strlen(a0->field_0x10);'

[[match]]
name = 'fieldtype #6: with the option off the function pointer is called through a cast'
count = 1
literal = 'v1 = (*(code *)a0->field_0x8)(a0->field_0x10);'

[[match]]
name = 'fieldtype #7: with the option on the function pointer is called as it is'
count = 1
literal = 'v1 = (*a0->field_0x8)(a0->field_0x10);'

[[match]]
name = 'fieldtype #8: with the option off the walking pointers are dereferenced through casts'
count = 1
literal = 'v1 = v1 * 7 + (*(int8 *)a0->field_0x0 - *(int8 *)a0->field_0x8);'

[[match]]
name = 'fieldtype #9: with the option on they are dereferenced and stepped as pointers'
count = 1
literal = 'a0->field_0x8 = &a0->field_0x8[-1];'

[[match]]
name = "fieldtype #10: the end pointers take the walking pointers' type, so the loop test needs no cast in either pass"
count = 2
literal = 'while ((a0->field_0x0 != a0->field_0x10 && (a0->field_0x8 != a0->field_0x18)))'

[[match]]
name = 'fieldtype #11: a union member read as a double and as a pointer stays raw bytes in both passes'
count = 2
literal = 'v2 = *(float8 *)a0->field_0x8;'

[[match]]
name = 'fieldtype #12: an index read at a table and handed to write stays a number in both passes, so write gets it through a cast'
count = 2
literal = 'v3 = (void *)a1->field_0x8;'

[[match]]
name = 'fieldtype #13: a number merged with a string on its way to fprintf stays a number in both passes'
count = 4
literal = 'v1 = (char *)a3->field_0x0;'
