[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/go-arm64-dwarf-result/arm64.elf',
    'option godwarfsig off',
    'read symbols',
    'option outlang go',
    'load function main.Rise',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/go-arm64-dwarf-result/arm64.elf',
    'option godwarfsig on',
    'read symbols',
    'option outlang go',
    'load function main.Rise',
    'decompile',
    'print C',
    'load function main.Fall',
    'decompile',
    'print C',
    'load function main.RiseWide',
    'decompile',
    'print C',
    'load function main.FallWide',
    'decompile',
    'print C',
    'map prototype main.Rise int8 Rise(int4 *overrideP);',
    'load function main.Rise',
    'decompile',
    'print C',
]

[[match]]
name = 'Go ARM64 DWARF off retains inferred result width'
count = 1
literal = 'func Rise(a0 *int32) int64'

[[match]]
name = 'Go ARM64 narrow rising result retains int32 addition'
count = 1
regex = [
    '^func Rise\(p \*int32\) int32 \{$',
    '^  return \*p \+ 1$',
]

[[match]]
name = 'Go ARM64 narrow falling result retains int32 subtraction'
count = 1
regex = [
    '^func Fall\(p \*int32\) int32 \{$',
    '^  return \*p \+ -1$',
]

[[match]]
name = 'Go ARM64 wide rising twin retains int64 extension'
count = 1
regex = [
    '^func RiseWide\(p \*int32\) int64 \{$',
    '^  return int64\(\*p\) \+ 1$',
]

[[match]]
name = 'Go ARM64 wide falling twin retains int64 extension'
count = 1
regex = [
    '^func FallWide\(p \*int32\) int64 \{$',
    '^  return int64\(\*p\) \+ -1$',
]

[[match]]
name = 'Go ARM64 DWARF result respects explicit prototype'
count = 1
literal = 'func Rise(overrideP *int32) int64'
