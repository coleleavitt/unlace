[image]
arch = 'x86:LE:32:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'load_offset' },
    { space = 'ram', offset = '0x100008', name = 'store_offset' },
    { space = 'ram', offset = '0x100014', name = 'return_offset' },
    { space = 'ram', offset = '0x10001c', name = 'load_dynamic' },
    { space = 'ram', offset = '0x100028', name = 'store_dynamic' },
    { space = 'ram', offset = '0x100038', name = 'return_dynamic' },
    { space = 'ram', offset = '0x100041', name = 'return_negative' },
    { space = 'ram', offset = '0x100049', name = 'integer_address' },
]

