[package]
name = "unlace-cli"
version.workspace = true
edition.workspace = true

[dependencies]
unlace-ir = { workspace = true }
unlace-loader = { workspace = true, features = ["http-symfetch"] }
unlace-lift = { workspace = true }
unlace-passes = { workspace = true }
unlace-struct = { workspace = true }
unlace-output = { workspace = true }
unlace-plugin = { workspace = true }
unlace-lumina = { workspace = true }
unlace-session = { workspace = true }
unlace-emu = { workspace = true }
unlace-debugger = { workspace = true }
unlace-flirt = { workspace = true }
unlace-idapython = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "io-util"] }
clap = { workspace = true }
anyhow = { workspace = true }
smallvec = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = "0.4"
regex = "1"
memmap2 = "0.9"
sha2 = { workspace = true }
iced-x86 = { workspace = true }
indicatif = "0.17.11"
linkscope = { path = "../../../linkscope", features = ["json"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = { workspace = true }

[features]
# Modules no production code path reaches yet (`cargo xtask status`).
unwired = []
default = []
# Enable the Linux ptrace debugger backend behind `unlace dbg`. Linux-only.
dbg-ptrace = ["unlace-debugger/linux-ptrace"]
# Enable IDAPython script execution via pyo3.
python = ["unlace-idapython/python"]
# Experimental lifters outside the supported x86/ARM/Apple scope; see
# `unlace_ir::arch_support::product_tier`.
all-arches = ["unlace-lift/all-arches"]
arch-6502 = ["unlace-lift/arch-6502"]
arch-8051 = ["unlace-lift/arch-8051"]
arch-agx = ["unlace-lift/arch-agx"]
arch-amdgpu = ["unlace-lift/arch-amdgpu"]
arch-appleagx = ["unlace-lift/arch-appleagx"]
arch-arc = ["unlace-lift/arch-arc"]
arch-avr = ["unlace-lift/arch-avr"]
arch-ebpf = ["unlace-lift/arch-ebpf"]
arch-evm = ["unlace-lift/arch-evm"]
arch-hexagon = ["unlace-lift/arch-hexagon"]
arch-m68k = ["unlace-lift/arch-m68k"]
arch-mips = ["unlace-lift/arch-mips"]
arch-msp430 = ["unlace-lift/arch-msp430"]
arch-pic = ["unlace-lift/arch-pic"]
arch-ppc = ["unlace-lift/arch-ppc"]
arch-riscv = ["unlace-lift/arch-riscv"]
arch-rx = ["unlace-lift/arch-rx"]
arch-sass = ["unlace-lift/arch-sass"]
arch-sharc = ["unlace-lift/arch-sharc"]
arch-sparc = ["unlace-lift/arch-sparc"]
arch-spirv = ["unlace-lift/arch-spirv"]
arch-stm8 = ["unlace-lift/arch-stm8"]
arch-superh = ["unlace-lift/arch-superh"]
arch-ti = ["unlace-lift/arch-ti"]
arch-tricore = ["unlace-lift/arch-tricore"]
arch-v850 = ["unlace-lift/arch-v850"]
arch-wasm = ["unlace-lift/arch-wasm"]
arch-xtensa = ["unlace-lift/arch-xtensa"]
arch-z80 = ["unlace-lift/arch-z80"]

[[bin]]
name = "unlace"
path = "src/main.rs"

[[bench]]
name = "decompile_medium"
harness = false

[[bench]]
name = "spec_suite"
path = "../../benches/spec/suite.rs"
harness = false

[[bench]]
name = "hexrays_throughput"
path = "../../benches/hexrays_comparison/throughput.rs"
harness = false
