[[match]]
name = 'CALLTARGETTYPE #1: off calls a table entry through void **'
count = 2
literal = '(**(void **)(a0 * 8UL + 0x200000))();'

[[match]]
name = 'CALLTARGETTYPE #2: on loads the table entry through void (**)(void)'
count = 2
literal = '(**(void (**)(void))(a0 * 8UL + 0x200000))();'

[[match]]
name = 'CALLTARGETTYPE #3: off declares the called temporaries void *'
count = 4
regex = '\(\*\*\(void \*\*\)\(a0 \* 8UL \+ 0x200100\)\)\(a1,7\)|\(\*\(void \*\)\*a0\)\(a1\)'

[[match]]
name = 'CALLTARGETTYPE #4: on declares the local from its call'
count = 2
literal = '(**(int (**)(unsigned int,unsigned long))(a0 * 8UL + 0x200100))(a1,7)'

[[match]]
name = 'CALLTARGETTYPE #5: on loads the local through a pointer to its type'
count = 2
literal = '*(int (**)(unsigned int,unsigned long))(a0 * 8UL + 0x200100)'

[[match]]
name = 'CALLTARGETTYPE #6: on declares the field temporary from its call'
count = 2
literal = '(*(int (*)(unsigned int))*a0)(a1)'

[[match]]
name = 'CALLTARGETTYPE #7: on casts the field to the call type where off cast it to void *'
count = 2
literal = '(int (*)(unsigned int))*a0'

[[match]]
name = 'CALLTARGETTYPE #8: off casts the field to void *, as twice does in both ctypes passes'
count = 6
regex = 'v1 = \(void \*\)\*a0;|\(\*\(void \*\)\*a0\)\(a1\)'

[[match]]
name = 'CALLTARGETTYPE #9: off and ctypes off call the local of two arities bare'
count = 4
literal = 'v2 = (*v1)(a1);'

[[match]]
name = 'CALLTARGETTYPE #10: off and ctypes off make the second call bare too'
count = 4
literal = 'return (*v1)(a1,a1) + v2;'

[[match]]
name = 'CALLTARGETTYPE #11: a local holding a function address keeps void *'
count = 4
literal = 'void *v2; // rbp'

[[match]]
name = 'CALLTARGETTYPE #12: the address is still stored into it'
count = 6
regex = 'v2 = (c_)?r1;'

[[match]]
name = 'CALLTARGETTYPE #13: a local handed to a library callback slot keeps void *'
count = 4
regex = 'v1 = \*\(void \*\*\)\(.*0x200200\);'

[[match]]
name = 'CALLTARGETTYPE #14: a float held as an integer in xmm0 keeps the call untyped'
count = 4
literal = '*a1 = (**(void **)((a0 & 1) * 8UL + 0x200300))(v1);'

[[match]]
name = 'CALLTARGETTYPE #15: the float call prints as it did'
count = 6
regex = '\*a1 = \(\*\*\((void|code) \*\*\)\(\(a0 & 1\) \* 8UL \+ 0x200300\)\)\(v1\);'

[[match]]
name = 'CALLTARGETTYPE #16: no integer function type is built over xmm0'
count = 0
literal = 'unsigned int (*v2)(unsigned int)'

[[match]]
name = 'CALLTARGETTYPE #17: ctypes off keeps the upstream table call'
count = 2
literal = '(**(code **)(a0 * 8UL + 0x200000))();'

[[match]]
name = 'CALLTARGETTYPE #18: ctypes off keeps code * temporaries'
count = 4
regex = '\(\*\*\(code \*\*\)\(a0 \* 8UL \+ 0x200100\)\)\(a1,7\)|\(\*\(code \*\)\*a0\)\(a1\)'

[[match]]
name = 'CALLTARGETTYPE #19: ctypes off builds no function type'
count = 0
literal = 'int4 (*'

[[match]]
name = "CALLTARGETTYPE #20: on casts the local of two arities to each call's own type"
count = 2
literal = 'v2 = (*(long (*)(unsigned long))v1)(a1);'

[[match]]
name = 'CALLTARGETTYPE #21: on casts the second call to its two-argument type'
count = 2
literal = 'return (*(long (*)(unsigned long,unsigned long))v1)(a1,a1) + v2;'

[[match]]
name = 'CALLTARGETTYPE #22: on casts the local holding a function address at each call'
count = 4
regex = '\(\*\(int \(\*\)\(unsigned int,unsigned long\)\)v2\)\(a1,[12]\)'

[[match]]
name = 'CALLTARGETTYPE #23: on casts the local handed to qsort at its call'
count = 2
literal = '(int)(*(int (*)(unsigned int *,void *))v1)(a0,&a0[1])'
