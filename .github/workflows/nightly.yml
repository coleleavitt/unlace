name: Nightly

# Once a night on main:
#   slow-tests -- the seven workspace tests the Tests workflow's `ci` profile leaves out
#                 (the `nightly` nextest profile, .config/nextest.toml).
#   semantic  -- the T4 compile-and-run corpus (tools/semantic) against its baseline: a row that
#                passed and no longer does fails the job.
#   decbench  -- a fixed sample of the published decbench dataset (the `optimized`
#                config) decompiled by tonight's build and by last night's build on
#                the same runner, one binary at a time (the speed A/B), then scored
#                with decbench (GED + type_match) and compared with last night's
#                scores per function.
#   report    -- one verdict for the night.
# The Tests workflow's gates run on every push and pull request, so the nightly does not repeat
# them. The tier table: notes/test-tiers.md. The design, the statistics, and how to read the report:
# docs/nightly.md.
#
# A pull request that edits the harness runs the decbench job (not the tests) so a
# change to it is proven on a real runner before it merges; only main's runs ever
# become the next night's baseline.

# Scheduled at 07:17 UTC. The decbench arm compares against last night's build; until a scheduled
# run has left one, scripts/nightly/previous.sh falls back to the latest release.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      binaries:
        description: Sample size, in binaries of the optimized config
        default: "96"
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - scripts/nightly/**

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Every input that can move a score is pinned, so a night-to-night change is
  # unlace's. Bumping one resets the score comparison for a night (the report says so).
  DATASET_REVISION: 815eb96f130b6d2ef7fa600e04669bf20139bf27
  DECBENCH_REVISION: 14e14b87429043aa06f64e067847ac0a925e41a6
  RUST_JOERN_REVISION: 9fd97f50885202596b125ebd2504e64910874bcb
  SAMPLE_BINARIES: ${{ inputs.binaries || '96' }}
  SAMPLE_SEED: unlace-nightly-v1

jobs:
  slow-tests:
    name: slow tests (nextest profile nightly)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    # The same test environment as the Tests workflow's workspace suite (tests.yml, rust-test):
    # the binaries find the repository and the specs through these variables.
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      UNLACE_SLA_CACHE: ${{ github.workspace }}/.sla-cache
      UNLACE_ROOT: ${{ github.workspace }}
      UNLACE_SPECS: ${{ github.workspace }}/specs
      SLEIGHHOME: ${{ github.workspace }}/specs
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-slow-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: taiki-e/install-action@cargo-nextest

      # Restore only: the Tests workflow's gates job saves this cache on main under the same key.
      - name: Restore the .sla cache
        uses: actions/cache/restore@v4
        with:
          path: .sla-cache
          key: sla-v2-${{ runner.os }}-${{ hashFiles('specs/**/*.slaspec', 'specs/**/*.sinc', 'Cargo.lock', 'crates/unlace-slacomp/**', 'crates/unlace-sleigh/**', 'crates/unlace-base/**', 'crates/unlace-num/**') }}

      # The `nightly` profile (.config/nextest.toml) selects exactly the seven tests that the
      # `ci` profile leaves out; scripts/check_test_tiers.py keeps the two lists equal.
      - name: Build and run the slow tests
        run: |
          cargo nextest run --workspace --profile nightly \
            ${{ vars.UNLACE_WEB == 'true' && ' ' || '--exclude unlace-wasm' }}

      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-nightly
          path: target/nextest/nightly/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  # The T4 corpus (tools/semantic/README.md): every function of the construct cases is decompiled,
  # its emitted C compiled in place of the original and run. Fails only when a row that passes in
  # tools/semantic/baseline.toml no longer passes (run.py --baseline); newly passing rows are listed.
  semantic:
    name: semantic compile-and-run
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      UNLACE_SLA_CACHE: ${{ github.workspace }}/.sla-cache
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # gcc and clang build the x86_64 rows; qemu-user runs the aarch64 rows; binutils supplies
      # nm and objcopy (run.py falls back from llvm-nm and llvm-objcopy to them).
      - name: Install gcc, clang, qemu-user and binutils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc clang qemu-user binutils

      # The aarch64 rows link with zig's cc. Pinned to the release the baseline was recorded with
      # (notes/semantic-results.md).
      - name: Install zig 0.15.2
        run: |
          curl -sSfL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Record the compilers
        run: |
          gcc --version | head -1
          clang --version | head -1
          zig version
          qemu-aarch64 --version | head -1

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-semantic
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Restore the .sla cache
        uses: actions/cache/restore@v4
        with:
          path: .sla-cache
          key: sla-v2-${{ runner.os }}-${{ hashFiles('specs/**/*.slaspec', 'specs/**/*.sinc', 'Cargo.lock', 'crates/unlace-slacomp/**', 'crates/unlace-sleigh/**', 'crates/unlace-base/**', 'crates/unlace-num/**') }}

      - name: Build unlace
        run: cargo build --release -p unlace-console -p unlace-harness -p unlace-slacomp -p unlace-cli

      - name: Run the semantic suite against its baseline
        run: |
          mkdir -p out
          python3 tools/semantic/run.py --unlace target/release/unlace --sleighpath specs \
            --config x86_64-gcc,x86_64-clang,aarch64-zig --opt O0,O2 --jobs "$(nproc)" \
            --baseline tools/semantic/baseline.toml --json out/semantic.json --markdown out/semantic.md

      - name: Table for the run summary
        if: always()
        run: |
          if [ -f out/semantic.md ]; then
            { echo "## Semantic suite (T4)"; echo; cat out/semantic.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/semantic.json') != ''
        with:
          name: semantic-nightly
          path: out/semantic.*
          retention-days: 30

  decbench:
    name: decbench sample
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      DECBENCH_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/version.sh reads the release tags

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # decbench strips every binary before a decompiler sees it; the runner's
      # x86-only strip cannot read the ARM firmware in the sample.
      - name: Install multi-architecture binutils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils-multiarch

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly

      - name: Build unlace
        run: cargo build --release -p unlace-console -p unlace-harness -p unlace-slacomp -p unlace-cli

      # Tomorrow's speed baseline: the binary and spec tree exactly as built here.
      - name: Package tonight's build
        run: |
          mkdir -p build
          cp target/release/unlace build/
          tar -czf build/specs.tgz specs
          echo "$(bash scripts/version.sh) (${GITHUB_SHA::10})" | tee build/LABEL

      - uses: actions/upload-artifact@v4
        with:
          name: unlace-nightly-build
          path: build/
          retention-days: 14

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/nightly.yml

      - name: Restore the Rust Joern library
        id: joern
        uses: actions/cache@v4
        with:
          path: rust-joern-lib
          key: rust-joern-${{ env.RUST_JOERN_REVISION }}-${{ runner.os }}

      - name: Build Rust Joern
        if: steps.joern.outputs.cache-hit != 'true'
        run: |
          git clone --quiet https://github.com/Noelo-Lab/rust-joern "$RUNNER_TEMP/rust-joern"
          git -C "$RUNNER_TEMP/rust-joern" checkout --quiet "$RUST_JOERN_REVISION"
          (cd "$RUNNER_TEMP/rust-joern" && cargo build --release --lib)
          mkdir -p rust-joern-lib
          cp "$RUNNER_TEMP/rust-joern/target/release/librust_joern.so" rust-joern-lib/

      - name: Install decbench
        run: |
          git clone --quiet https://github.com/Noelo-Lab/decbench "$RUNNER_TEMP/decbench"
          git -C "$RUNNER_TEMP/decbench" checkout --quiet "$DECBENCH_REVISION"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "$RUNNER_TEMP/decbench" \
            "git+https://github.com/Noelo-Lab/rust-joern@$RUST_JOERN_REVISION"
          echo "RUST_JOERN_LIBRARY=$PWD/rust-joern-lib/librust_joern.so" >> "$GITHUB_ENV"
          echo "RUST_JOERN_REV=$RUST_JOERN_REVISION" >> "$GITHUB_ENV"

      - name: Fetch last night's results and build
        run: bash scripts/nightly/previous.sh prev base

      - name: Restore the dataset sample
        uses: actions/cache@v4
        with:
          path: nightly-data
          key: decbench-data-${{ env.DATASET_REVISION }}-${{ env.SAMPLE_SEED }}-${{ env.SAMPLE_BINARIES }}

      - name: Sample the dataset
        run: |
          python3 -m scripts.nightly.dataset --revision "$DATASET_REVISION" \
            --binaries "$SAMPLE_BINARIES" --seed "$SAMPLE_SEED" \
            --data nightly-data --sample-out out/sample.json

      - name: Decompile (tonight vs last night) and score
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m scripts.nightly.bench \
            --sample out/sample.json --data nightly-data \
            --unlace build/unlace --specs specs --label "$(cat build/LABEL)" \
            --baseline-unlace base/unlace --baseline-specs base/specs \
            --baseline-label "$(cat base/LABEL)" \
            --decbench-root "$RUNNER_TEMP/decbench" --out out --jobs "$(nproc)"

      - name: Compare with last night
        run: |
          set +e
          python3 -m scripts.nightly.compare --current out/results.json \
            --previous prev/results.json --history prev/history.jsonl \
            --history-out out/history.jsonl --report out/report.md \
            --summary-json out/summary.json --fail-on-regression \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > /dev/null
          rc=$?
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/results.json') != ''
        with:
          name: decbench-nightly
          path: |
            out/results.json
            out/history.jsonl
            out/report.md
            out/summary.json
            out/sample.json
          retention-days: 90

      - name: Runner disk and timing
        if: always()
        run: |
          df -h .
          python3 -c "import json; m = json.load(open('out/results.json'))['meta']; print({k: m[k] for k in ('timing_seconds', 'scoring_seconds', 'cpu_model')})" || true

  report:
    name: nightly verdict
    needs: [slow-tests, semantic, decbench]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: decbench-nightly
          path: nightly

      - name: Summarize
        env:
          SLOW: ${{ needs.slow-tests.result }}
          SEMANTIC: ${{ needs.semantic.result }}
          DECBENCH: ${{ needs.decbench.result }}
        run: |
          regressions=$(python3 -c "import json; print('; '.join(json.load(open('nightly/summary.json'))['regressions']) or 'none')" 2>/dev/null || echo "no decbench result")
          {
            echo "## Nightly verdict"
            echo
            echo "| check | result |"
            echo "|---|---|"
            echo "| slow tests (nextest nightly) | $SLOW |"
            echo "| semantic suite (T4) | $SEMANTIC |"
            echo "| decbench sample | $DECBENCH |"
            echo "| decbench regressions | $regressions |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$SLOW" = success ] && [ "$SEMANTIC" = success ] && [ "$DECBENCH" = success ]
