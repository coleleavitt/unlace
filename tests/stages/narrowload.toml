[script]
commands = [
    'parse line struct rec { char *name; uint4 flags; uint2 tag; uint2 pad; int8 id; };',
    'parse line extern void sink(int8 x);',
    'parse line extern uint8 t_low(rec *r);',
    'parse line extern void t_bit(rec *r);',
    'parse line extern uint8 p_low(uint4 *p);',
    'parse line extern void p_bit(uint4 *p);',
    'parse line extern void q_bit(uint8 *q);',
    'parse line extern void s_set(uint8 *q, int4 all, uint1 b);',
    'parse line extern rec *get_rec(void);',
    'parse line extern void c_bit(void);',
    'parse line extern void l_bit(rec *r, int8 n);',
    'lo fu t_low',
    'decompile',
    'print C',
    'lo fu t_bit',
    'decompile',
    'print C',
    'lo fu p_low',
    'decompile',
    'print C',
    'lo fu p_bit',
    'decompile',
    'print C',
    'lo fu q_bit',
    'decompile',
    'print C',
    'lo fu s_set',
    'decompile',
    'print C',
    'lo fu c_bit',
    'decompile',
    'print C',
    'lo fu l_bit',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = "narrowload #1: a 2-byte read of a declared record's 4-byte field is 2 bytes wide"
count = 1
literal = 'return *(uint2 *)&r->flags;'

[[match]]
name = 'narrowload #2: a 2-byte read through a uint4 pointer is 2 bytes wide'
count = 1
literal = 'return *(uint2 *)&p[1];'

[[match]]
name = 'narrowload #3: no narrow read is printed as a wider read truncated'
count = 0
regex = '\(uint[12]\)[rpq](->flags|\[1\])'

[[match]]
name = 'narrowload #4: a masked 2-byte compare through a uint4 pointer reads 2 bytes'
count = 1
literal = 'if ((*(uint2 *)&p[1] & 0x300) != 0x100)'

[[match]]
name = 'narrowload #5: a masked byte compare through a uint8 pointer reads 1 byte'
count = 1
literal = 'if ((*(uint1 *)&q[1] & 0x30) != 0x10)'

[[match]]
name = 'narrowload #6: no masked compare reads a whole element the program reads part of'
count = 0
regex = '\([pq]\[1\] &'

[[match]]
name = "narrowload #7: a declared record's flag word keeps the whole-field compare"
count = 1
literal = 'if ((r->flags & 0x3000) != 0x1000)'

[[match]]
name = 'narrowload #8: a byte store into an 8-byte element stays one byte wide'
count = 1
literal = '((uint1 *)q)[9] = b;'

[[match]]
name = 'narrowload #9: a masked byte compare of a declared field through a call result reads 1 byte'
count = 1
regex = '\(\(uint1 \*\)&get_rec\(\)->flags\)\[1\] & 0x30\) .= 0x10'

[[match]]
name = 'narrowload #10: a masked byte compare of a declared field through a loop phi reads 1 byte'
count = 1
regex = '\(\(uint1 \*\)&[A-Za-z0-9_]+->flags\)\[1\] & 0x30\) .= 0x10'

[[match]]
name = 'narrowload #11: only the declared parameter reads the whole flag word'
count = 1
literal = '->flags & 0x3000'
