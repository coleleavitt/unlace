# kuna: a signed read of an expression that prints as unsigned.
#
# The constant of `a0 - 1` is marked `1U` (markExplicitUnsigned) when its
# type is unsigned and a0 is not, which makes the C expression unsigned while
# the value keeps the signed type a sign extension, an arithmetic right
# shift, a signed compare or a signed divide reads it as.  Those readers
# added no cast, so the printed C read the value as unsigned: bitmask
# printed `(unsigned long)(long)(a0 - 1U) >> 6`, a zero extension, and
# bitmask(0) returned 0x8000000003ffffff where the binary returns
# 0x83ffffffffffffff.  A signed reader of such an expression now casts it to
# the signed integer of its size.
#
# Source (gcc 11 -O2 x86-64, .text bytes verbatim):
#     UL bitmask(int s) { int t = s - 1; return ((UL)(L)t >> 6) | (1UL << (t & 63)); }
#     int sigmember(const UL *set, int sig)          (control: no `U`)
#     L sshift(int s) { int i = s - 1; return (L)(i >> 3) + (L)(U)(i & 63); }
#     L sless(int s) { int i = s - 1; return (L)(i < 5) + (L)(U)(i & 63); }
#     L sdiv(int s) { int i = s - 7; return (L)(i / 3) + (L)(U)(i & 63); }
#     L ucmp(U a) { U t = a + 2; return (4 < t) + (L)(int)t; }
# ucmp is the control for the unsigned reader: its compare keeps `a0 + 2U`.
#
# Stage: P9 cast placement (ActionSetCasts; p9_emit/kuna_signedread.rs).
# Correctness fix, no option: #1-#5 fail on the unpatched engine, #6 holds
# before and after.

[image]
arch = 'x86:LE:64:default:gcc'

[[image.bytes]]
space = 'ram'
offset = '0x401000'
readonly = true
hex = '''
f30f1efa83ef014863c748c1e806480fabf8c366662e0f1f8400000000006690
f30f1efa8d4eff4863c148c1e806488b04c748d3e883e001c30f1f8000000000
f30f1efa83ef0189f883e73fc1f80348984801f8c366662e0f1f840000000000
f30f1efa83ef0131c083ff040f9ec083e73f4801f8c3662e0f1f840000000000
f30f1efa83ef074863c789fa83e73f4869c056555555c1fa1f48c1e82029d048
984801f8c366662e0f1f840000000000f30f1efa83c70231c083ff044863ff0f
97c04801f8c3
'''

[script]
commands = [
    'map function r0x401000 bitmask',
    'map function r0x401020 sigmember',
    'map function r0x401040 sshift',
    'map function r0x401060 sless',
    'map function r0x401080 sdiv',
    'map function r0x4010b0 ucmp',
    'lo fu bitmask',
    'decompile',
    'print C',
    'lo fu sigmember',
    'decompile',
    'print C',
    'lo fu sshift',
    'decompile',
    'print C',
    'lo fu sless',
    'decompile',
    'print C',
    'lo fu sdiv',
    'decompile',
    'print C',
    'lo fu ucmp',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'SIGNEDREAD #1: a sign extension of a0 - 1U goes through int'
count = 1
literal = 'return (uint8)(int4)(a0 - 1U) >> 6'

[[match]]
name = 'SIGNEDREAD #2: an arithmetic shift of a0 - 1U shifts the int'
count = 1
literal = '(int4)(a0 - 1U) >> 3'

[[match]]
name = 'SIGNEDREAD #3: a signed compare of a0 - 1U compares the int'
count = 1
literal = '(int4)(a0 - 1U) <= 4'

[[match]]
name = 'SIGNEDREAD #4: a signed divide of a0 - 7U divides the int'
count = 1
literal = '(int4)(a0 - 7U) / 3'

[[match]]
name = 'SIGNEDREAD #5: no unsigned expression is widened or shifted as if signed'
count = 0
regex = '\(int8\)\(a0 - 1U\)|\(int8\)\(a0 - 1U >> 3\)|\(a0 - 1U <= 4\)|\(int8\)\(\(a0 - 7U\) / 3\)'

[[match]]
name = 'SIGNEDREAD #6: the unsigned compare keeps its unsigned operand'
count = 1
literal = '4 < a0 + 2U'
