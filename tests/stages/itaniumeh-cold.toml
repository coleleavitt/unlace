# Unlace (IDA 9.5 eh34 design): P2 flow classification, option itaniumeh
# (default off), with GCC's hot/cold split. The script loads the committed
# itaniumeh/eh_x86_64_cold.elf (g++ -O2, the default partitioning, from the
# same eh.cc): catcher()'s landing pad is a two-instruction stub that jumps
# into catcher.cold, a separate FDE that is also a function entry.
#
# Assert #1 is the off pass: only the normal path. Asserts #2-#4 are the on
# pass: the jump out of the pad stub is followed into the cold code instead
# of being read as a tail call, so the catch bodies print in catcher().

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/itaniumeh/eh_x86_64_cold.elf',
    'option itaniumeh off',
    'read symbols',
    'load addr 0x4013e0',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-cli/tests/fixtures/itaniumeh/eh_x86_64_cold.elf',
    'option itaniumeh on',
    'read symbols',
    'load addr 0x4013e0',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'itaniumeh cold #1: off shows catcher as the normal path only'
count = 1
literal = 'void catcher('

[[match]]
name = 'itaniumeh cold #2: on follows the pad stub into the cold code'
count = 2
literal = '__cxa_begin_catch(eh_exception())'

[[match]]
name = 'itaniumeh cold #3: on tests the selector'
count = 1
literal = 'if (eh_selector() == 1)'

[[match]]
name = 'itaniumeh cold #4: the jump into catcher.cold is not a tail call'
count = 0
literal = 'tail-call'
