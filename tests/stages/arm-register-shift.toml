# Unlace #849: a register-controlled ARM LSL uses the low eight count bits.
# The authored 12-byte function is `mov r1,#1; mov r0,r1,lsl r0; bx lr`.
# The ARM result is zero for low8 counts 32 through 255, but plain C `<<`
# has undefined behavior there. Counts 256 and 288 distinguish the ARM
# low-eight-bit rule from an incorrect `count & 31` rewrite.
#
# P9 C emission, correctness fix without an option. The printer keeps the
# lifted low-eight-bit expression, guards it against the shifted value's
# width, and casts the shifted value to unsigned so count 31 is defined too.
# The rewrite is limited to variable ARM LSLs whose input expressions are
# repeatable. It does not inline an implied load, call, indirect value, or phi
# twice, nor duplicate volatile direct reads; an explicit value is reused by
# name after its defining statement has been emitted.
# ShiftAndStore also catches the in-place compound-assignment shortcut: it
# must leave the shift as an assignment with the guarded expression on its RHS.

[image]
arch = 'ARM:LE:32:v5t:default'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'ShiftOne' },
    { space = 'ram', offset = '0x10020', name = 'ShiftValue' },
    { space = 'ram', offset = '0x10040', name = 'ShiftAndStore' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
hex = '0110a0e31100a0e11eff2fe1'

[[image.bytes]]
space = 'ram'
offset = '0x10020'
hex = '1001a0e11eff2fe1'

[[image.bytes]]
space = 'ram'
offset = '0x10040'
hex = '1001a0e1000082e51eff2fe1'

[script]
commands = [
    'parse line extern uint4 ShiftOne(uint4 count);',
    'parse line extern uint4 ShiftValue(uint4 value, uint4 count);',
    'parse line extern uint4 ShiftAndStore(uint4 value, uint4 count, uint4 *output);',
    'load function ShiftOne',
    'decompile',
    'print C',
    'load function ShiftValue',
    'decompile',
    'print C',
    'load function ShiftAndStore',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ARM LSL #1: all register-controlled shifts range check the low-eight-bit count at 32'
count = 3
literal = '< 32u ?'

[[match]]
name = 'ARM LSL #2: all low-eight-bit expressions remain in guard and shift'
count = 3
regex = 'count & 0xff.*count & 0xff'

[[match]]
name = 'ARM LSL #3: the shifted value is unsigned, including count 31'
count = 1
regex = '\(uint4\)1\s*<<'

[[match]]
name = 'ARM LSL #4: both variable shiftees are converted to unsigned before shifting'
count = 2
regex = '\(uint4\)value\s*<<'

[[match]]
name = 'ARM LSL #5: all overshift arms return zero of the conditional result type'
count = 3
regex = ':\s*0u?;'

[[match]]
name = 'ARM LSL #6: the count is not reduced modulo the operand width'
count = 0
literal = '& 0x1f'

[[match]]
name = 'ARM LSL #7: guarded shifts do not use compound assignment'
count = 0
regex = '<<\s*='
