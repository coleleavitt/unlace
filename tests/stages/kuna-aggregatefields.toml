# Original GCC 7.3 N32 hard-float bytes: tests/fixtures/octeon-elf-abi
# (fields.c nested_first/double_float, abi.c quad_struct). Each record is
# returned or read whole: the whole-aggregate predicates in
# kuna_aggregatefields.rs (always on) keep upstream's field-first
# resolution and concatenation rewrite from splitting or misnaming it.

[image]
arch = 'MIPS:BE:64:octeon3-32addr:hard'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'nested_first' },
    { space = 'ram', offset = '0x100048', name = 'double_float' },
    { space = 'ram', offset = '0x1000c0', name = 'quad_struct' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '03e0000844a4000003e000080080102503e0000844a4000003e000080080102527bdffd0f7ad0018ffa40000c7a00000dfa20018ffa20008d7a2000803e0000827bd00300000000027bdffd0f7ac0010ffa50008c7a20008dfa20010ffa20000d7a0000003e0000827bd0030'

[[image.bytes]]
space = 'ram'
offset = '0x1000c0'
readonly = true
hex = '44a5080003e0000844a40000'

[script]
commands = [
    'option ctypes on',
    'parse line struct Inner { double d; };',
    'parse line struct Nested { struct Inner a; };',
    'parse line struct DoubleFloat { double a; float b; };',
    'parse line struct Quad { long double a; };',
    'parse line extern double nested_first(struct Nested x);',
    'parse line extern struct DoubleFloat double_float(struct DoubleFloat x);',
    'parse line extern struct Quad quad_struct(struct Quad x);',
    'lo fu nested_first',
    'decompile',
    'print C',
    'lo fu double_float',
    'decompile',
    'print C',
    'lo fu quad_struct',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'AGGREGATEFIELDS: the nested member walk never appends the inner field twice'
count = 0
literal = 'return x.a.d.d;'

[[match]]
name = 'AGGREGATEFIELDS: a padded float-field record is never rebuilt as a shifted integer'
count = 0
literal = 'return (DoubleFloat)(v1._0_16_ << 0x20);'

[[match]]
name = 'AGGREGATEFIELDS: an unchanged single-field record never returns its field'
count = 0
literal = 'return (Quad)x.a.a;'

[[match]]
name = 'AGGREGATEFIELDS: the nested member names each field once'
count = 1
literal = 'return x.a.d;'

[[match]]
name = 'AGGREGATEFIELDS: a padded float-field record keeps both fields'
count = 1
literal = 'v1.b = x.b;'

[[match]]
name = 'AGGREGATEFIELDS: an unchanged single-field record returns whole'
count = 1
literal = 'return x;'
