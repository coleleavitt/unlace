# Static TLS variables at their thread-pointer offsets (`option tlsnames
# on|off`), ida95-60.
#
# Stage P5 type-propagation. The fixture is tlsnames_x86_64.c built with
# gcc -O1 as a PIE: `bump` reaches three __thread variables local-exec,
# through fs:[-0x10], fs:[-0x60] and fs:[-0x50] (PT_TLS memsz 0x54, align 16).
#
# Pass 1 (`tlsnames off`, the bug): offsets off an untyped fs_offset.
# Pass 2 (default, the fix): the thread pointer is a `__tls_block *` one past
# the block, and every access is a field of `tls[-1]`.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/tlsnames_gcc_O1_x86_64',
    'option tlsnames off',
    'read symbols',
    'load function bump',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/tlsnames_gcc_O1_x86_64',
    'read symbols',
    'load function bump',
    'decompile',
    'print C',
]

[[match]]
name = 'TLSNAMES #1: off, a __thread store is an offset off the segment base'
count = 1
literal = '*(int4 *)(v1 + -0x10) = a0;'

[[match]]
name = 'TLSNAMES #2: on, the thread pointer is typed one past the TLS block'
count = 1
literal = '__tls_block *tls; // fs_offset'

[[match]]
name = 'TLSNAMES #3: on, the store names its variable'
count = 1
literal = 'tls[-1].counter = a0;'

[[match]]
name = 'TLSNAMES #4: on, the static variable and the array are named too'
count = 1
literal = 'tls[-1].hits = tls[-1].hits + 1;'
