# Swift's calling convention on methods and witnesses (`option swiftcall
# on|off`, the calling-convention arm of `swiftmetadata`).
#
# Issue: Swift passes a method's `self` in the swiftself register (r13 on
# x86-64, x20 on arm64) and a throwing function's error in the swifterror
# register (r12 / x21), which the C model neither reads as a parameter nor
# hands back from a call. A method's `self` is an unnamed register read
# (`int8 *v3; // r13`), a call drops the `self` it passes, and a caller's
# test of the error register after a throwing call reads the zero it
# stored before it, so `try?`'s error path folds away. Only a getter,
# whose arity is known, had its `self` typed (8,560 on a large
# third-party iOS app).
#
# Stage / sub-stage: P1 external-refinement, the Swift metadata pass
# (`unlace-analysis/src/analyzers/swift/unlace_swiftcall.rs`), with the model
# binding read in P4 (`ActionDefaultParams`, the decompile drive) and the
# `self` hint in P5 type inference.
#
# P0 assertion: `option swiftcall on|off` (default on; inert unless
# `swiftmetadata` is on).
#
# The fixtures are one swiftc 6.3 build of `swift_call_elf.swift`:
# `swift_call_elf` stripped, `swift_call_syms_elf` with its symbols. Pass 1
# (`option swiftcall off`, stripped) reproduces the BUG: the class method
# `vtable#7.method` (`deposit(_:fee:)`) takes two parameters and reads its
# `self` from an unnamed `r13`, the struct witness reads `v1 + 8`, and
# `run` passes no `self` to its virtual calls and returns the throwing
# call's result unchecked. Pass 2 (the default, stripped) is the FIX: the
# method takes `callfix.Account *self` first and passes it on to the
# virtual calls it makes on itself, the struct witness writes
# `self->step`, the class witness takes `callfix.Account **self` (a
# witness gets the address of the value), and `run` keeps the error path
# (`if (v5) { swift_release(v5); v3 = -1; }`) and passes the `self` it
# sets to both virtual calls. Pass 3 (the default, with symbols) types the
# mutating struct method by its name
# (`callfix.Counter.advance(by:times:)(callfix.Counter *self,...)`) and
# `run`'s call passes it `self`, while the non-mutating `peek`, whose
# `self` is exploded into its trailing arguments, gains none; the final
# method `settle` hands its own, untouched `self` to `fee(for:)` before
# and after a call. Pass 4 (`swiftcall off`, with symbols) shows `settle`
# calling `fee(for:)` without it.
#
# `swift_call_helper_elf` calls the mutating `Counter.bump()` after
# `swift_beginAccess`, a C runtime helper that runs between the caller
# setting r13 and the call and preserves the register. Pass 5 (`swiftcall
# off`) passes no `self`; pass 6 (the default) passes `a0` to both calls,
# straight-line and in a loop.
#
# `swift_call_leaf_elf` calls the mutating `Counter.bump(_:)`, which has no
# declared signature (its argument is an enum), after the Swift leaf
# `tick(_:)`, which runs between the caller setting r13 and the call and
# never reads the register. Pass 7 (the default) passes `a0`; before the
# callee bodies were read, any earlier Swift call made the value stale and
# the call passed `(v1,0)`.
#
# `swift_call_free_elf` makes the same call after `spin(_:)`, a function of
# the module whose body branches, so its body is not read as leaving r13
# alone; its symbol names it a function of the module, not a member, which
# takes no `self`. Pass 8 (the default) passes `a0`; before, `(v1,0)`.
#
# `swift_call_spill_elf`'s `spill_test` zeroes r12, calls a throwing Swift
# function, spills r12 to the stack, reuses the register and tests the
# value it reloads. Pass 9 (the default) keeps its error path (`return
# 0xffffffffffffffff;`); before the spill was followed it folded away and
# the function was `return sub_2800();`. `spill_moved` moves rsp between the
# spill and the reload, which then reads another slot.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

