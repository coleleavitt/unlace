# unlace switchtrim: a switch with an unreachable default has no range check.
#
# gcc -O2 -fno-pic -no-pie of
#     int f(unsigned x, int y) { int r = y * 3; sink = r;
#       switch (x) { case 0: sink = 11; return 3 + r; ... case 5: sink = 66; return 17;
#                    default: __builtin_unreachable(); } }
# dispatches with `mov edi,edi; notrack jmp [0x402000 + rdi*8]`: no guard, so
# the index range is the full 32 bits, JumpBasic declines, and the jump is
# truncated to a computed call.  With the option on the single-LOAD table is
# opened to [0, jumptablemax) and the rows end at the first one that fails
# the layout rules (here the zero after the six entries).
#
# Stage: P2 switch model, option switchtrim off|on.  Pass 1 (off) pins the bug,
# pass 2 (on, the default) pins the fix.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x401010', name = 'f' },
]

[[image.bytes]]
space = 'ram'
offset = '0x401000'
hex = ''

[[image.bytes]]
space = 'ram'
offset = '0x402000'
hex = '601040000000000070104000000000008010400000000000901040000000000030104000000000004810400000000000'

[script]
commands = [
    'option switchtrim off',
    'lo fu f',
    'decompile',
    'print C',
    'option switchtrim on',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'SWITCHTRIM #1: off, the table dispatch is a computed jump-as-call'
count = 1
literal = '(**(code **)(a0 * 8UL + 0x402000))(); // jump-as-call'

[[match]]
name = 'SWITCHTRIM #2: on, the dispatch is a switch on the index'
count = 1
regex = '^  switch\(a0\) \{'

[[match]]
name = 'SWITCHTRIM #3: on, all six cases and no more'
count = 6
regex = '^    case [0-5]:$'

[[match]]
name = 'SWITCHTRIM #4: on, case 4 returns 13 - r'
count = 1
literal = 'return a1 * -3 + 0xd;'
