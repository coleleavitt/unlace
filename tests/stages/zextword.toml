# unlace: a 64-bit return whose high half the function zeroes keeps its whole
# register on RISC-V (GH-865).  The procedure-call standard sign-extends
# every 32-bit return value to the register, unsigned ones too, so a
# function that zero-extends a word it may set the sign bit of returns a
# 64-bit value.  Sub-variable flow used to trim the RETURN to the word, and
# the function printed as returning int: a caller widening the result
# sign-extended what the binary zero-extends.
#
# Stage / sub-stage: P3 sub-variable flow, the RETURN pull
# (p3_dataflow/subflow.rs try_return_pull, p5_types/unlace_zextreturn.rs
# zero_extended_word), under the rule p4_calls/unlace_narrowext.rs states.
# Two passes: option narrowext off is the compiler spec's zero extension
# (the bug), the default abi is the fix.
#
# Source (clang -target riscv64-linux-gnu -march=rv64gc -O2, bytes verbatim):
#
#     unsigned long z32m(unsigned long x) { return (x * 3) & 0xffffffffUL; }
#     unsigned long zu(unsigned int x) { return x; }
#     unsigned long zc(unsigned long x, unsigned y) {
#       if (x > 5) return y * 7;
#       return 0xfffffff0UL;
#     }
#     unsigned ru(unsigned x) { return x * 3; }
#     unsigned short rus(unsigned long x) { return x * 3; }
#
# z32m and zu end slli a0,a0,32; srli a0,a0,32, and zc returns either
# that or the constant 0xfffffff0.  ru ends addw, which sign-extends, and
# rus zero-extends a halfword, which the rule extends by its type's sign:
# both keep their narrow return either way.

[image]
arch = 'RISCV:LE:64:RV64GC:gcc'
symbols = [
    { space = 'ram', offset = '0x10000', name = 'z32m' },
    { space = 'ram', offset = '0x1000c', name = 'zu' },
    { space = 'ram', offset = '0x10012', name = 'zc' },
    { space = 'ram', offset = '0x1002c', name = 'ru' },
    { space = 'ram', offset = '0x10034', name = 'rus' },
]

[[image.bytes]]
space = 'ram'
offset = '0x10000'
readonly = true
hex = '''
9b1515002d9d02150191828002150191828015466366a60005450215411582801b
9535000d9d0215019182809b1515002d9d82809b1515002d9d421541918280
'''

[script]
commands = [
    'option narrowext off',
    'lo fu z32m',
    'decompile',
    'print C',
    'lo fu zu',
    'decompile',
    'print C',
    'lo fu zc',
    'decompile',
    'print C',
    'lo fu ru',
    'decompile',
    'print C',
    'lo fu rus',
    'decompile',
    'print C',
    'option narrowext abi',
    'lo fu z32m',
    'decompile',
    'print C',
    'lo fu zu',
    'decompile',
    'print C',
    'lo fu zc',
    'decompile',
    'print C',
    'lo fu ru',
    'decompile',
    'print C',
    'lo fu rus',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'ZEXTWORD #1: off, a zero-extended word returns int'
count = 1
literal = 'int4 z32m(int4 a0)'

[[match]]
name = 'ZEXTWORD #2: abi, a zero-extended word returns the register'
count = 1
literal = 'uint8 z32m(int4 a0)'

[[match]]
name = 'ZEXTWORD #3: abi, the zero-extension is printed'
count = 1
literal = 'return (uint4)(a0 * 3);'

[[match]]
name = 'ZEXTWORD #4: off, a zero-extended argument returns unsigned int'
count = 1
literal = 'unsigned int zu(unsigned int a0)'

[[match]]
name = 'ZEXTWORD #5: abi, a zero-extended argument returns the register'
count = 1
literal = 'uint8 zu(uint4 a0)'

[[match]]
name = 'ZEXTWORD #6: off, the zero-extended constant reads as -16'
count = 1
literal = 'return -0x10;'

[[match]]
name = 'ZEXTWORD #7: abi, the zero-extended constant is returned whole'
count = 1
literal = 'return 0xfffffff0;'

[[match]]
name = 'ZEXTWORD #8: abi, both returns of zc return the register'
count = 1
literal = 'uint8 zc(uint8 a0,int4 a1)'

[[match]]
name = 'ZEXTWORD #9: a sign-extended word is unchanged either way'
count = 2
literal = 'int8 ru(int4 a0)'

[[match]]
name = 'ZEXTWORD #10: a zero-extended halfword stays narrow either way'
count = 2
regex = 'u?int2 rus\('
