[image]
arch = 'MIPS:BE:64:default'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = '03e0000800000000'

# unlace armconstshift all: a fixed 64-bit left shift of a signed operand is
# undefined C for negative values and for bits shifted into or past the sign,
# although every machine computes it modulo 2^64. P9 emission / cast-policy;
# P0 assertion `option armconstshift`. Two passes over LLVM objects for x86-64,
# AArch64, PowerPC64 and MIPS64 (tests/fixtures/wide-integer-emission/shift.c):
# `off` (the default) keeps upstream's `value << 0x1f`; `all` shifts the
# unsigned conversion, keeps a sign extension inside it and restores the signed
# result, while the shared store to *echo stays. The CLI companion
# wide_shift_emission.rs executes the `all` output under UBSan at O0/O2.

[script]
commands = [
    'clear architecture',
    'load file tests/fixtures/wide-integer-emission/x86-64.elf',
    'read symbols',
    'map prototype shift31 long long shift31(long long value, long long *echo);',
    'lo fu shift31',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/wide-integer-emission/x86-64.elf',
    'read symbols',
    'map prototype shift63 long long shift63(long long value);',
    'lo fu shift63',
    'decompile',
    'print C',
    'clear architecture',
    'load file tests/fixtures/wide-integer-emission/x86-64.elf',
    'read symbols',
    'map prototype widened_shift31 long long widened_shift31(int value);',
