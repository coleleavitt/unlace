# swiftself read after a call, and the self of an imported Swift method
# (`option swiftcall on|off`).
#
# Issue: a function the metadata did not bind took swiftself (r13 / x20)
# only when its body read the register before its first call, so a closure
# that calls a function first read its context as an uninitialised local
# (`int8 v3; // r13`). A call to an imported Swift method such as
# `String.append(_:)` kept the C model, so the address of the string it
# appends to, passed in swiftself, was dropped.
#
# Stage / sub-stage: P4 prototype recovery. `p4_calls/kuna_swiftinfer.rs
# (probe_reads)` walks past calls, which preserve the register; the
# `swiftcall` arm (`unlace-analysis analyzers/swift/kuna_swiftcall.rs (bind)`)
# binds the Swift model to the stub of every import whose symbol demangles
# to a method.
#
# The fixture `swift_self_elf` is a stripped swiftc 6.4.2 build of
# `swift_self_elf.swift` (recipe in the fixtures README): 0x2250 is the
# partial-apply forwarder of `makeReader`'s closure, 0x24b0 is `label`.
# Pass 1 (`option swiftcall off`) is the BUG, pass 2 (the default) the FIX.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x100000', name = 'harness_stub' },
]

[[image.bytes]]
space = 'ram'
offset = '0x100000'
readonly = true
hex = 'c3'

[script]
commands = [
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/swift_self_elf',
    'option swiftmetadata on',
    'option swiftcall off',
    'read symbols',
    'load addr 0x2250',
    'decompile',
    'print C',
    'load addr 0x24b0',
    'decompile',
    'print C',
    'clear architecture',
    'load file crates/unlace-analysis/tests/fixtures/swift_self_elf',
    'option swiftmetadata on',
    'read symbols',
    'load addr 0x2250',
    'decompile',
    'print C',
    'load addr 0x24b0',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'swiftcall off: the closure reads r13 after a call as an uninitialised local'
count = 1
literal = 'int8 v3; // r13'

[[match]]
name = 'swiftcall off: String.append loses the string it appends to'
count = 1
literal = 'Swift.String.append(_:)(0x7320," s");'

[[match]]
name = 'swiftcall on: a closure that calls first takes its context as swiftself'
count = 1
literal = 'int8 sub_2250(void *swiftself)'

[[match]]
name = 'swiftcall on: the context is read after the call'
count = 1
literal = 'return v1 + ((int8 *)swiftself)[2];'

[[match]]
name = "swiftcall on: String.append is passed the string's address"
count = 1
literal = 'Swift.String.append(_:)(&v2,0x7320," s");'
