[script]
commands = [
    'set context TMode 1 [ram,0x1800] [ram,0x1844]',
    'set context TMode 1 [ram,0x1900] [ram,0x190a]',
    'lo fu keepc',
    'decompile',
    'print C',
    'lo fu comp',
    'decompile',
    'print C',
    'lo fu compm',
    'decompile',
    'print C',
    'lo fu callhi',
    'decompile',
    'print C',
    'lo fu mcrr_ret',
    'decompile',
    'print C',
    'lo fu keepc_t',
    'decompile',
    'print C',
    'lo fu raise_bp',
    'decompile',
    'print C',
    'lo fu lock_prim',
    'decompile',
    'print C',
    'lo fu pk',
    'decompile',
    'print C',
    'lo fu pk_t',
    'decompile',
    'print C',
    'lo fu cln',
    'decompile',
    'print C',
    'lo fu inv',
    'decompile',
    'print C',
    'lo fu pli',
    'decompile',
    'print C',
    'lo fu ctlk',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'RETSYSREG #1: a system register operand is never a returned high word'
count = 0
regex = 'CONCAT44\((0x3000000|0x13|0x50|1),'

[[match]]
name = 'RETSYSREG #7: comp and raise_bp never return the pair'
count = 0
regex = 'return CONCAT44\((0x3000000,a0 \* 3|0x50,v1)\);'

[[match]]
name = 'RETSYSREG #2: a value computed in r0 is returned alone'
count = 2
regex = '(int4|int) (comp|compm)\((int4|int) a0\)'

[[match]]
name = 'RETSYSREG #3: the old BASEPRI and PRIMASK are returned alone'
count = 2
regex = '(uint4|unsigned int) (raise_bp|lock_prim)\(void\)'

[[match]]
name = "RETSYSREG #4: a call's untouched result beside an fpscr write is not returned"
count = 2
regex = 'void (keepc|keepc_t)\(void\)'

[[match]]
name = "RETSYSREG #5: the high word of a call's own result keeps the pair"
count = 1
literal = 'return g64() | 0xff00000000;'

[[match]]
name = 'RETSYSREG #6: both words written to one 64-bit register keep the pair'
count = 1
regex = '(uint8|unsigned long long) mcrr_ret\('

[[match]]
name = 'RETSYSREG #8: a preload or cache op on the high word keeps the pair'
count = 5
regex = '(uint8|unsigned long long) (pk|pk_t|cln|inv|pli)\('

[[match]]
name = 'RETSYSREG #9: an SCTLR write through r1 beside a computed r0 is not returned'
count = 1
regex = '(int4|int) ctlk\((int4|int) a0\)'
