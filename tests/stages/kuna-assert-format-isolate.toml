# kuna issue #1642 (P9 emission, literal-format; P6 variables,
# merge-aggressiveness).  The assertion directives `format` and `isolate`
# lower to the console commands `force constant <addr> <format> [<value>]`
# and `isolate <name>`.  `force constant` names a constant by the address
# of the instruction that reads it, where `force varnode` needs its p-code
# sequence number and `map convert` its dataflow hash.  `isolate` keeps a
# local from being merged with others.
#
# clang -O1 -fno-stack-protector -fcf-protection=none:
#
#   int is_rwx(unsigned m) { return (m & 0777) == 0755; }
#   int reuse(int a) {
#       int t = g(a); h(t); k(t);
#       int u = t * 3 + 1; h(u); k(u); return 0; }
#   int triple(int a) {
#       int t = a; p(&t); h(t); a = a * 3; h(a); h(a + t); return a; }
#
# Each function is decompiled first without the command (the output the
# directive corrects) and again after it. `reuse` needs the upstream type
# merge (`option typemerge on`): the default `storage` mode already keeps the
# reused local's two values apart, which leaves `isolate` nothing to do.

[image]
arch = 'x86:LE:64:default:gcc'
symbols = [
    { space = 'ram', offset = '0x1460', name = 'is_rwx' },
    { space = 'ram', offset = '0x1490', name = 'reuse' },
    { space = 'ram', offset = '0x14c0', name = 'triple' },
    { space = 'ram', offset = '0x1510', name = 'g' },
    { space = 'ram', offset = '0x1520', name = 'h' },
    { space = 'ram', offset = '0x1530', name = 'k' },
    { space = 'ram', offset = '0x1540', name = 'p' },
]

[[image.bytes]]
space = 'ram'
offset = '0x1460'
readonly = true
hex = '81e7ff01000031c081ffed0100000f94c0c3'

[[image.bytes]]
space = 'ram'
offset = '0x1490'
readonly = true
hex = '53e87a00000089c389c7e88100000089dfe88a0000008d1c5bffc389dfe86e00000089dfe87700000031c05bc3'

[[image.bytes]]
space = 'ram'
offset = '0x14c0'
readonly = true
hex = '534883ec1089fb897c240c488d7c240ce86b0000008b7c240ce8420000008d1c5b89dfe8380000008b7c240c01dfe82d00000089d84883c4105bc3'

[script]
commands = [
    'load function is_rwx',
    'decompile',
    'print C',
    'force constant 0x1460 oct',
    'force constant 0x1468 oct 0x1ed',
    'decompile',
    'print C',
    'option typemerge on',
    'load function reuse',
    'decompile',
    'print C',
    'isolate v1',
    'decompile',
    'print C',
    'load function triple',
    'decompile',
    'print C',
    'isolate a0',
    'decompile',
    'print C',
    'rename v2 tripled',
    'decompile',
    'print C',
    'quit',
]

[[match]]
name = 'format: the constants print in hex before the command'
count = 1
literal = 'return (a0 & 0x1ff) == 0x1ed;'

[[match]]
name = 'format: both constants print in octal after it'
count = 1
literal = 'return (a0 & 0777) == 0755;'

[[match]]
name = 'isolate: the local is reused for the second value before the command'
count = 1
literal = 'v1 = v1 * 3 + 1;'

[[match]]
name = 'isolate: the second value is its own local after it'
count = 1
literal = 'v2 = v1 * 3 + 1;'

[[match]]
name = 'isolate: the parameter is reused before the command'
count = 1
literal = 'a0 *= 3;'

[[match]]
name = 'isolate: the parameter keeps its value after it'
count = 1
literal = 'v2 = a0 * 3;'

[[match]]
name = 'isolate: the parameter stays isolated through a later rename'
count = 1
literal = 'tripled = a0 * 3;'
